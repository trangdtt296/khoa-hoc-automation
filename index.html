# Bài 21 — Kiểm thử hiệu năng và cài đặt JMeter

**Mục tiêu:** hiểu load test khác functional test ở đâu, nắm 5 chỉ số phải đọc được, và cài JMeter chạy được trên máy.

## Load test khác gì functional test

Functional test hỏi "chức năng có đúng không". Load test hỏi "hệ thống chịu được bao nhiêu người cùng lúc, và chậm đi bao nhiêu". Playwright trả lời câu đầu, JMeter trả lời câu sau.

JMeter không mở trình duyệt. Nó gửi thẳng HTTP request tới server, nên một máy tính có thể giả lập hàng trăm người dùng. Vì vậy JMeter không kiểm tra được giao diện hay JavaScript — nó chỉ đo phía server.

## 5 loại kiểm thử hiệu năng

| Loại | Câu hỏi trả lời | Cách chạy |
| --- | --- | --- |
| Load test | Hệ thống xử lý được tải dự kiến không? | Tăng dần đến số user mục tiêu, giữ ổn định |
| Stress test | Điểm gãy ở đâu? | Tăng user đến khi lỗi |
| Spike test | Tải tăng vọt đột ngột thì sao? | Nhảy từ 10 lên 500 user trong vài giây |
| Soak test | Chạy lâu có rò rỉ bộ nhớ không? | Giữ tải trung bình 2–8 giờ |
| Volume test | Dữ liệu lớn có làm chậm không? | Chạy với database nhiều bản ghi |

## 5 chỉ số phải đọc được

| Chỉ số | Nghĩa | Lưu ý khi đọc |
| --- | --- | --- |
| Response time | Thời gian server trả lời (ms) | Đọc **percentile**, đừng đọc Average |
| Throughput | Số request/giây server xử lý | Càng cao càng tốt; chững lại là dấu hiệu đã tới giới hạn |
| Error % | Tỷ lệ request lỗi | Vượt 1% thường là không đạt |
| Concurrent users | Số user ảo đang chạy cùng lúc | Phải khớp với kịch bản nghiệp vụ |
| Latency | Thời gian tới byte đầu tiên | Chênh nhiều so với response time = tải dữ liệu nặng |

**Average là chỉ số gây hiểu sai nhiều nhất.** Nếu 90 request trả về trong 200 ms và 10 request mất 8 giây, Average chỉ khoảng 980 ms — nghe ổn, nhưng 10% người dùng đã chờ 8 giây. Luôn báo cáo theo **90th percentile (p90)** và **95th percentile (p95)**: p95 = 1,2 giây nghĩa là 95% request nhanh hơn 1,2 giây.

## Cài JMeter

JMeter viết bằng Java, nên cần Java trước.

**1. Cài Java (JDK 17 trở lên)**

Tải Temurin JDK tại `adoptium.net`, cài xong kiểm tra:

```bash
java -version
```

**2. Tải JMeter**

Vào `jmeter.apache.org/download_jmeter.cgi`, tải bản Binary (`apache-jmeter-5.6.x.zip`), giải nén vào thư mục không có dấu cách, ví dụ `D:\jmeter`.

**3. Mở JMeter**

```bash
cd D:\jmeter\bin
jmeter.bat        # Windows
./jmeter          # macOS / Linux
```

Cửa sổ GUI mở ra kèm một cảnh báo trong Terminal: đừng dùng GUI để chạy test thật. Cảnh báo đó đúng — GUI chỉ dùng để **soạn** kịch bản, còn chạy thật thì dùng dòng lệnh (Bài 24).

macOS báo "cannot be opened because the developer cannot be verified": chạy `xattr -dr com.apple.quarantine ~/jmeter` hoặc mở qua System Settings → Privacy & Security.

## Làm quen cửa sổ JMeter

| Thành phần | Vai trò |
| --- | --- |
| Test Plan | Gốc của kịch bản, chứa mọi thứ khác |
| Thread Group | Định nghĩa số user ảo và thời gian chạy |
| Sampler | Request gửi đi (HTTP Request là loại hay dùng nhất) |
| Config Element | Cấu hình dùng chung: header, cookie, dữ liệu CSV |
| Assertion | Kiểm tra nội dung phản hồi |
| Timer | Thời gian nghỉ giữa các request, giả lập người dùng thật |
| Listener | Thu và hiển thị kết quả |

File kịch bản lưu dạng `.jmx` (thực chất là XML), commit được vào Git như code.

## Bài tập

1. Cài Java và JMeter, mở được cửa sổ GUI.
2. Viết ra bằng lời: với một trang web bán hàng nội địa 5.000 người dùng/ngày, bạn sẽ chọn load test hay stress test trước, và vì sao.
3. Cho dữ liệu: Average 980 ms, p90 400 ms, p95 6.200 ms, Error 0,4%. Viết một câu nhận xét bạn sẽ báo cáo cho leader.
</script>

<script type="text/markdown" data-id="bai-22" data-nav="Bài 22 · JMeter — test plan đầu tiên">
# Bài 22 — Test plan đầu tiên trong JMeter

**Mục tiêu:** tự tay dựng một kịch bản 10 user gọi vào một API và đọc được kết quả.

## Các bước dựng kịch bản

Mọi kịch bản JMeter đều theo đúng 4 bước này: Thread Group → HTTP Request → Assertion → Listener.

## 1. Thread Group — định nghĩa số user

Chuột phải **Test Plan** → Add → Threads (Users) → **Thread Group**.

| Trường | Nghĩa | Ví dụ |
| --- | --- | --- |
| Number of Threads | Số user ảo | 10 |
| Ramp-up period | Số giây để mở hết số user đó | 10 |
| Loop Count | Mỗi user lặp kịch bản bao nhiêu lần | 5 |

Ví dụ trên: 10 user vào dần trong 10 giây (1 user/giây), mỗi user chạy 5 vòng → tổng 50 request.

Ramp-up bằng 0 nghĩa là 10 user vào cùng một lúc — đó là spike test, không phải load test. Quy tắc dễ nhớ: ramp-up tính bằng giây thường bằng số thread, hoặc lớn hơn.

## 2. HTTP Request — request gửi đi

Chuột phải **Thread Group** → Add → Sampler → **HTTP Request**.

Dùng API công khai để luyện:

| Trường | Giá trị |
| --- | --- |
| Protocol | `https` |
| Server Name or IP | `jsonplaceholder.typicode.com` |
| Method | `GET` |
| Path | `/posts/1` |

Chỉ điền tên miền vào Server Name, **không** điền cả `https://`. Đây là lỗi hay gặp nhất khi mới dùng.

## 3. Assertion — kiểm tra phản hồi

Chuột phải **HTTP Request** → Add → Assertions → **Response Assertion**.

- Field to Test: `Response Code`
- Pattern Matching Rules: `Equals`
- Patterns to Test: `200`

Không có assertion, JMeter chỉ báo "request đã gửi được". Server trả về trang lỗi 500 kèm nội dung HTML vẫn tính là thành công nếu bạn không kiểm tra. Mọi sampler nên có ít nhất một assertion.

Thêm một assertion nữa kiểm tra nội dung: Field to Test `Text Response`, Patterns to Test `userId`.

## 4. Listener — xem kết quả

Chuột phải **Thread Group** → Add → Listener → **View Results Tree** và **Summary Report**.

Bấm nút ▶ xanh để chạy. Trong **View Results Tree**, mỗi dòng xanh là một request thành công; bấm vào xem được Request và Response Data đầy đủ. **Summary Report** cho bảng tổng hợp:

| Cột | Nghĩa |
| --- | --- |
| # Samples | Số request đã gửi |
| Average | Thời gian phản hồi trung bình (ms) |
| Min / Max | Nhanh nhất / chậm nhất |
| Error % | Tỷ lệ lỗi |
| Throughput | Request/giây |

Nhớ: Listener tốn rất nhiều bộ nhớ. Dùng khi soạn kịch bản, và **tắt hết trước khi chạy test thật**.

## 5. Timer — giả lập người dùng thật

Không có timer, mỗi user bắn request liên tục không nghỉ — không giống hành vi thật và làm kết quả bị lệch.

Chuột phải **Thread Group** → Add → Timer → **Uniform Random Timer**:

- Constant Delay Offset: `1000` (nghỉ tối thiểu 1 giây)
- Random Delay Maximum: `2000` (cộng thêm 0–2 giây ngẫu nhiên)

Mỗi user sẽ nghỉ 1–3 giây giữa các request.

## Kịch bản nhiều bước

Một luồng nghiệp vụ thật gồm nhiều request nối tiếp. Thêm nhiều HTTP Request trong cùng một Thread Group, chúng chạy theo thứ tự từ trên xuống:

```text
Thread Group (10 user)
├── HTTP Request — GET /posts        (xem danh sách)
├── HTTP Request — GET /posts/1      (xem chi tiết)
├── HTTP Request — POST /posts       (tạo mới)
└── Uniform Random Timer
```

Đặt tên từng sampler theo nghiệp vụ (`01 - Xem danh sach bai viet`), không để tên mặc định. Báo cáo sau này đọc theo tên đó.

## Lưu và chạy lại

File → Save Test Plan as → `kich-ban-dau-tien.jmx`. File `.jmx` nên commit vào Git cùng project.

## Bài tập

1. Dựng kịch bản 10 user, ramp-up 10 giây, loop 5, gọi `GET /posts/1` và kiểm tra response code 200.
2. Thêm Uniform Random Timer, chạy lại và so sánh Throughput trước và sau.
3. Thêm 2 request nữa thành kịch bản 3 bước, đặt tên theo nghiệp vụ.
4. Tăng lên 50 user, ramp-up 25 giây. Ghi lại Average, Error % và Throughput.
5. Cố tình đổi Path thành `/posts/999999`, chạy và xem assertion báo fail thế nào.
</script>

<script type="text/markdown" data-id="bai-23" data-nav="Bài 23 · JMeter — CSV, biến, correlation">
# Bài 23 — Dữ liệu động, biến và correlation

**Mục tiêu:** chạy kịch bản với nhiều tài khoản khác nhau, và xử lý trường hợp request sau cần dữ liệu từ request trước (token, ID). Đây là phần phân biệt người biết dùng JMeter với người chỉ bấm được nút Run.

## Vì sao cần dữ liệu động

Nếu 100 user ảo đều đăng nhập bằng một tài khoản, server sẽ cache kết quả và con số bạn đo được là sai — nhẹ hơn thực tế rất nhiều. Mỗi user ảo cần một tài khoản riêng.

## CSV Data Set Config — mỗi user một bộ dữ liệu

Tạo file `taikhoan.csv` trong cùng thư mục với file `.jmx`:

```csv
username,password
user01,Pass@123
user02,Pass@123
user03,Pass@123
```

Chuột phải **Test Plan** → Add → Config Element → **CSV Data Set Config**:

| Trường | Giá trị |
| --- | --- |
| Filename | `taikhoan.csv` |
| Variable Names | để trống nếu CSV có dòng tiêu đề |
| Ignore first line | `True` (khi có dòng tiêu đề) |
| Recycle on EOF | `True` (hết dòng thì quay lại đầu) |
| Sharing mode | `All threads` |

Dùng trong request bằng cú pháp `${tên_biến}`:

```text
Body Data của HTTP Request:
{"username": "${username}", "password": "${password}"}
```

## HTTP Request Defaults — khai báo server một lần

Thay vì gõ `jsonplaceholder.typicode.com` vào từng request, khai báo một lần: Add → Config Element → **HTTP Request Defaults**, điền Protocol và Server Name. Các HTTP Request để trống hai trường đó sẽ tự lấy giá trị này.

Lợi ích thật: đổi từ môi trường staging sang production chỉ sửa một chỗ.

## HTTP Header Manager — header dùng chung

API thường yêu cầu header. Add → Config Element → **HTTP Header Manager**:

| Name | Value |
| --- | --- |
| Content-Type | `application/json` |
| Accept | `application/json` |

## HTTP Cookie Manager — bắt buộc khi test web có đăng nhập

Add → Config Element → **HTTP Cookie Manager**. Không có nó, mỗi request là một phiên mới và user ảo sẽ bị đăng xuất ngay sau khi đăng nhập.

## User Defined Variables — biến cấu hình

Add → Config Element → **User Defined Variables**:

| Name | Value |
| --- | --- |
| BASE_PATH | `/api/v1` |
| SO_USER | `50` |

Dùng ở mọi nơi bằng `${BASE_PATH}`. Thread Group cũng nhận biến: điền `${SO_USER}` vào Number of Threads, rồi đổi số user từ dòng lệnh mà không sửa file `.jmx`:

```bash
jmeter -n -t kich-ban.jmx -JSO_USER=200 -l ketqua.jtl
```

Khi truyền từ dòng lệnh, viết giá trị trong User Defined Variables là `${__P(SO_USER,50)}` — lấy tham số `SO_USER`, mặc định 50.

## Correlation — lấy dữ liệu từ response trước

Đây là tình huống thực tế nhất: đăng nhập trả về token, các request sau phải gửi token đó. Token đổi mỗi lần chạy nên không thể gõ cứng.

**Với response JSON — JSON Extractor**

Chuột phải request đăng nhập → Add → Post Processors → **JSON Extractor**:

| Trường | Giá trị |
| --- | --- |
| Names of created variables | `TOKEN` |
| JSON Path expressions | `$.data.accessToken` |
| Default Values | `KHONG_TIM_THAY` |

Request sau dùng trong Header Manager:

```text
Authorization: Bearer ${TOKEN}
```

Đặt Default Value là một chuỗi dễ nhận ra như `KHONG_TIM_THAY`. Khi trích xuất thất bại, bạn thấy ngay chuỗi đó trong log thay vì phải đoán.

**Với response HTML — Regular Expression Extractor**

| Trường | Giá trị |
| --- | --- |
| Name of created variable | `CSRF_TOKEN` |
| Regular Expression | `name="csrf_token" value="(.+?)"` |
| Template | `$1$` |
| Match No. | `1` |

`(.+?)` là phần cần lấy, `$1$` nghĩa là lấy nhóm ngoặc thứ nhất.

## Logic Controller — điều kiện và vòng lặp

| Controller | Dùng để |
| --- | --- |
| Loop Controller | Lặp một nhóm request n lần |
| If Controller | Chỉ chạy khi điều kiện đúng, ví dụ `${TOKEN}` khác rỗng |
| Once Only Controller | Chỉ chạy một lần cho mỗi user — đúng cho bước đăng nhập |
| Transaction Controller | Gộp nhiều request thành một bước nghiệp vụ để đo tổng thời gian |

Đặt request đăng nhập trong **Once Only Controller** là mẫu chuẩn: mỗi user ảo đăng nhập một lần rồi thực hiện nhiều hành động, giống người dùng thật.

## Cấu trúc một kịch bản thực tế

```text
Test Plan
├── HTTP Request Defaults        (server, protocol)
├── HTTP Header Manager          (Content-Type, Accept)
├── HTTP Cookie Manager
├── CSV Data Set Config          (taikhoan.csv)
├── User Defined Variables       (SO_USER, BASE_PATH)
└── Thread Group  ${SO_USER} user
    ├── Once Only Controller
    │   └── 01 - Dang nhap       → JSON Extractor lấy TOKEN
    ├── Transaction Controller — Xem san pham
    │   ├── 02 - Danh sach san pham
    │   └── 03 - Chi tiet san pham
    ├── 04 - Them vao gio
    └── Uniform Random Timer
```

## Bài tập

1. Tạo CSV 5 tài khoản và cho kịch bản đọc từ đó, kiểm tra trong View Results Tree thấy mỗi request dùng username khác nhau.
2. Thêm HTTP Request Defaults và bỏ trống Server Name ở các sampler, chạy lại để xác nhận vẫn hoạt động.
3. Gọi `POST https://jsonplaceholder.typicode.com/posts` với body JSON, dùng JSON Extractor lấy `$.id` và in ra ở request sau.
4. Đặt bước đăng nhập vào Once Only Controller, chạy 5 user loop 3 và đếm số lần request đăng nhập xuất hiện (phải là 5, không phải 15).
5. Dùng `${__P(SO_USER,10)}` và chạy dòng lệnh với `-JSO_USER=30`.
</script>

<script type="text/markdown" data-id="bai-24" data-nav="Bài 24 · JMeter — chạy thật và đọc report">
# Bài 24 — Chạy test thật, xuất report và đọc kết quả

**Mục tiêu:** chạy kịch bản bằng dòng lệnh, xuất dashboard HTML, và kết luận được hệ thống đạt hay không đạt.

## Vì sao không chạy test thật bằng GUI

GUI của JMeter tốn phần lớn CPU và RAM để vẽ biểu đồ. Chạy 200 user trong GUI thì chính JMeter trở thành điểm nghẽn, và con số bạn đo được là của JMeter chứ không phải của server. Quy tắc: **GUI để soạn, dòng lệnh để chạy**.

## Chạy bằng dòng lệnh

```bash
jmeter -n -t kich-ban.jmx -l ketqua.jtl -e -o bao-cao-html
```

| Tham số | Nghĩa |
| --- | --- |
| `-n` | Chế độ non-GUI |
| `-t` | File kịch bản `.jmx` đầu vào |
| `-l` | File kết quả thô `.jtl` |
| `-e` | Sinh dashboard HTML sau khi chạy xong |
| `-o` | Thư mục chứa dashboard (phải là thư mục trống hoặc chưa tồn tại) |

Thư mục `-o` đã có dữ liệu thì JMeter báo lỗi và không chạy. Mỗi lần chạy nên dùng thư mục mới, ví dụ `bao-cao-20261110`.

Trước khi chạy, tắt hết Listener trong file `.jmx` và chạy thử 1 user loop 1 để chắc kịch bản không lỗi.

## Tăng bộ nhớ cho JMeter

Mặc định JMeter chỉ dùng 1 GB RAM. Chạy nhiều user cần nhiều hơn:

```bash
set JVM_ARGS=-Xms1g -Xmx4g        # Windows
export JVM_ARGS="-Xms1g -Xmx4g"   # macOS / Linux
```

## Dashboard HTML

Mở file `bao-cao-html/index.html`. Các phần đáng đọc:

| Mục | Đọc gì ở đó |
| --- | --- |
| APDEX | Điểm hài lòng 0–1 theo ngưỡng bạn đặt; dưới 0,8 là có vấn đề |
| Statistics | Bảng chính: samples, error %, average, p90, p95, p99, throughput theo từng request |
| Response Times Over Time | Thời gian phản hồi tăng dần theo thời gian = hệ thống đang suy giảm |
| Active Threads Over Time | Xác nhận số user ảo đúng như kịch bản |
| Response Time Percentiles | Hình dạng đường cong; dốc đứng ở cuối = có nhóm request rất chậm |

Đặt ngưỡng APDEX trong file `bin/user.properties`:

```text
jmeter.reportgenerator.apdex_satisfied_threshold=1000
jmeter.reportgenerator.apdex_tolerated_threshold=3000
```

## Cách đọc kết quả

Luôn đọc theo đúng thứ tự này:

1. **Error % trước tiên.** Trên 1% thì mọi con số thời gian phía sau đều không đáng tin — request lỗi thường trả về rất nhanh và làm đẹp số liệu giả tạo.
2. **p95, không phải Average.** Báo cáo "p95 = 1,8 giây" mới là thông tin dùng được.
3. **Throughput có chững lại không.** Tăng user mà throughput đứng yên nghĩa là đã tới giới hạn hệ thống.
4. **Response time theo thời gian.** Đường đi lên trong khi số user giữ nguyên là dấu hiệu rò rỉ bộ nhớ hoặc connection pool cạn.
5. **Request nào chậm nhất.** Nhìn bảng Statistics theo từng API, không nhìn số tổng.

## Mẫu kết luận trong báo cáo

> Kịch bản 100 user đồng thời, 15 phút, 42.800 request. Error 0,3%. p95 toàn hệ thống 1.850 ms, đạt ngưỡng yêu cầu 2.000 ms. Throughput ổn định ở 47 request/giây.
> Điểm cần xử lý: API `GET /api/v1/products/search` có p95 = 6.400 ms, chiếm 71% tổng thời gian chờ, trong khi các API còn lại đều dưới 900 ms. Đề nghị dev kiểm tra index của bảng sản phẩm trước khi tăng tải lên 200 user.

Phần giá trị nhất của một báo cáo load test không phải con số tổng, mà là chỉ ra đúng API gây nghẽn.

## Chạy JMeter trên CI

```yaml
- name: Chay load test
  run: |
    jmeter -n -t kich-ban.jmx -l ketqua.jtl -e -o bao-cao-html

- name: Luu bao cao
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: jmeter-report
    path: bao-cao-html/
```

Load test trên CI nên chạy theo lịch (hằng đêm) chứ không chạy mỗi lần push — nó tốn thời gian và cần môi trường riêng để kết quả có ý nghĩa.

## Bài tập

1. Chạy kịch bản Bài 23 bằng dòng lệnh, xuất dashboard HTML và mở xem.
2. Ghi lại p90, p95, Error % và Throughput vào một bảng.
3. Chạy lại với số user gấp 3, so sánh hai bộ số và nhận xét throughput có tăng tương ứng hay không.
4. Viết một đoạn kết luận 4–5 dòng theo mẫu ở trên cho kịch bản của bạn.
</script>

<script type="text/markdown" data-id="bai-25" data-nav="Bài 25 · JMeter — dự án load test">
# Bài 25 — Dự án load test hoàn chỉnh

**Mục tiêu:** có một kịch bản load test và một báo cáo đủ chuẩn để nộp, cộng với hiểu biết để trả lời phỏng vấn về performance testing.

## Đề bài

Chọn một API công khai (`jsonplaceholder.typicode.com`, `reqres.in`, hoặc API của chính project bạn đang test) và thực hiện đầy đủ một chu trình kiểm thử hiệu năng.

## Các bước phải làm

**1. Viết mục tiêu kiểm thử trước khi dựng kịch bản**

Không có mục tiêu thì không có cơ sở để nói đạt hay không đạt:

| Hạng mục | Giá trị mục tiêu |
| --- | --- |
| Số user đồng thời | 100 |
| p95 response time | dưới 2.000 ms |
| Error rate | dưới 1% |
| Thời gian chạy | 15 phút |

**2. Dựng kịch bản `.jmx`**

Gồm đủ: HTTP Request Defaults, Header Manager, Cookie Manager, CSV Data Set Config, Once Only Controller cho đăng nhập, Transaction Controller cho từng bước nghiệp vụ, Uniform Random Timer, và assertion ở mọi sampler.

**3. Chạy theo 3 mức tăng dần**

| Lần chạy | User | Mục đích |
| --- | --- | --- |
| 1 | 1 user, 1 loop | Xác nhận kịch bản không lỗi |
| 2 | 20 user, 5 phút | Lấy baseline |
| 3 | 100 user, 15 phút | Load test chính thức |

Có baseline mới so sánh được. Chạy thẳng 100 user thì không biết chậm là do tải hay do kịch bản sai.

**4. Stress test tìm điểm gãy**

Tăng dần 100 → 200 → 400 user, ghi lại mốc mà error % vượt 5% hoặc p95 vượt gấp đôi mục tiêu. Đó là giới hạn hệ thống, và là con số leader quan tâm nhất.

**5. Viết báo cáo**

Cấu trúc báo cáo load test:

```text
1. Mục tiêu và phạm vi
   - Chức năng được test, số user mục tiêu, ngưỡng chấp nhận
2. Môi trường test
   - URL, cấu hình server, máy chạy JMeter, thời điểm chạy
3. Kịch bản
   - Các bước nghiệp vụ, số user, ramp-up, thời gian chạy
4. Kết quả
   - Bảng p90/p95/p99, error %, throughput theo từng API
   - Ảnh 2 biểu đồ: Response Times Over Time, Active Threads Over Time
5. Kết luận
   - Đạt / không đạt so với mục tiêu ở mục 1
6. Điểm nghẽn và đề xuất
   - API chậm nhất, số liệu chứng minh, đề nghị cụ thể cho dev
```

## Checklist nộp bài

- [ ] File `.jmx` commit được vào Git, không chứa mật khẩu thật
- [ ] File CSV dữ liệu test riêng, không gõ cứng tài khoản trong `.jmx`
- [ ] Mọi sampler có ít nhất một assertion
- [ ] Tất cả Listener đã tắt trước khi chạy thật
- [ ] Đặt tên sampler theo nghiệp vụ, không để tên mặc định
- [ ] Đã chạy baseline trước khi chạy tải chính
- [ ] Dashboard HTML xuất đầy đủ
- [ ] Báo cáo có kết luận đạt/không đạt kèm số liệu
- [ ] Báo cáo chỉ ra được API nghẽn cụ thể

## Sai sót thường gặp khi mới làm load test

| Sai sót | Hệ quả |
| --- | --- |
| Chạy test bằng GUI | JMeter thành điểm nghẽn, số liệu sai |
| Không có timer | Tải không giống thực tế, p95 bị thổi phồng |
| Dùng một tài khoản cho mọi user | Server cache, kết quả tốt giả tạo |
| Báo cáo Average | Che mất nhóm người dùng bị chậm |
| Không có assertion | Request lỗi vẫn tính là thành công |
| Test trên môi trường chung với người khác | Số liệu nhiễu, không lặp lại được |
| Không có baseline | Không biết chậm là do tải hay do kịch bản |

## Câu hỏi phỏng vấn về performance testing

1. Load test, stress test và spike test khác nhau thế nào?
2. Vì sao phải đọc p95 thay vì Average?
3. Correlation trong JMeter là gì, khi nào cần dùng?
4. Throughput chững lại trong khi số user vẫn tăng nghĩa là gì?
5. Vì sao không nên chạy test hiệu năng bằng chế độ GUI?
6. Làm sao biết điểm nghẽn nằm ở ứng dụng hay ở database?

Câu 6 trả lời được bằng cách nhìn thời gian phản hồi theo từng API kết hợp với số liệu CPU/RAM/disk của server — đó là lý do báo cáo load test cần kèm thông tin môi trường.
</script>

<script type="text/markdown" data-id="bai-26" data-nav="Bài 26 · AI — làm được gì cho tester">
# Bài 26 — AI làm được gì và không làm được gì cho tester

**Mục tiêu:** biết chỗ nào AI giúp thật, chỗ nào AI gây hại, và các nguyên tắc an toàn phải giữ. Đọc bài này trước khi dùng AI vào công việc thật.

## Chỗ AI giúp được nhiều nhất

| Việc | AI làm tốt vì |
| --- | --- |
| Sinh nháp test case từ user story | Nghĩ ra nhiều trường hợp biên nhanh, ít bỏ sót loại hiển nhiên |
| Sinh dữ liệu test | Tạo 50 email, số điện thoại, địa chỉ hợp lệ và không hợp lệ trong vài giây |
| Chuyển test case tay thành script | Việc máy móc, có khuôn mẫu rõ ràng |
| Giải thích lỗi | Đọc stack trace và chỉ ra nguyên nhân khả dĩ |
| Review code test của bạn | Phát hiện locator yếu, thiếu assertion, `sleep()` thừa |
| Viết bug report rõ ràng | Sắp xếp lại thông tin bạn cung cấp thành cấu trúc chuẩn |
| Tóm tắt báo cáo | Gom số liệu thành vài dòng cho leader đọc |

## Chỗ AI làm không được

| Việc | Vì sao |
| --- | --- |
| Quyết định phạm vi test | Cần hiểu rủi ro nghiệp vụ, deadline, lịch sử lỗi của hệ thống |
| Biết đâu là lỗi quan trọng | Mức độ nghiêm trọng phụ thuộc người dùng và hợp đồng, AI không biết |
| Khẳng định test đã pass | AI không chạy được hệ thống của bạn; chỉ kết quả chạy thật mới đáng tin |
| Viết locator đúng khi chưa thấy HTML | Nó sẽ đoán, và locator đoán gần như luôn sai |
| Thay bạn khám phá hệ thống | Exploratory testing là quan sát và trực giác của con người |

Nguyên tắc nền: **AI sinh bản nháp, bạn chịu trách nhiệm bản cuối.** Mọi test case, mọi dòng code AI viết ra đều phải chạy thử và đọc lại trước khi commit.

## 5 nguyên tắc an toàn khi dùng AI ở công ty

1. **Không dán dữ liệu thật của khách hàng.** Email, số điện thoại, CMND, số thẻ, dữ liệu y tế của người thật đều không được đưa vào công cụ AI. Thay bằng dữ liệu giả có cùng định dạng.
2. **Không dán mã nguồn hoặc tài liệu nội bộ nếu công ty chưa cho phép.** Kiểm tra chính sách trước. Nhiều công ty có công cụ AI riêng được duyệt cho việc này.
3. **Không dán thông tin đăng nhập.** Token, mật khẩu, connection string phải để trong file `.env` và không bao giờ xuất hiện trong câu hỏi gửi AI.
4. **Luôn chạy thử code AI viết.** Code trông đúng vẫn có thể sai locator, sai điều kiện, hoặc dùng API không tồn tại.
5. **Không copy test case AI sinh ra vào tài liệu chính thức khi chưa đọc lại từng dòng.** AI hay sinh test case trùng nhau, hoặc test case không khả thi với hệ thống thực tế.

## Dấu hiệu AI đang trả lời sai

- Gọi phương thức không có trong thư viện (ví dụ một hàm Playwright nghe hợp lý nhưng không tồn tại) — kiểm tra lại trong tài liệu chính thức.
- Đưa locator rất cụ thể khi bạn chưa cung cấp HTML.
- Khẳng định chắc chắn về hành vi của hệ thống mà bạn chưa kể cho nó.
- Code dùng `time.sleep()` để xử lý chờ đợi — dấu hiệu dùng mẫu code cũ.

Cách phản ứng đúng: hỏi lại "hàm này có trong tài liệu nào", hoặc tự tra tài liệu chính thức. Đừng tranh luận, hãy kiểm chứng.

## Cách hỏi để nhận câu trả lời dùng được

Một câu hỏi tốt có 4 phần: **vai trò + ngữ cảnh + yêu cầu + định dạng đầu ra**.

Hỏi kém:

```text
Viết test case đăng nhập
```

Hỏi tốt:

```text
Bạn là QA engineer. Hệ thống: web thương mại điện tử, form đăng nhập gồm
email và mật khẩu, mật khẩu yêu cầu tối thiểu 8 ký tự có cả chữ và số,
sai 5 lần thì khóa tài khoản 15 phút.

Hãy viết test case cho chức năng đăng nhập, bao gồm cả trường hợp biên
và trường hợp âm.

Định dạng: bảng Markdown với các cột Mã TC | Tiêu đề | Điều kiện tiên quyết |
Bước thực hiện | Kết quả mong đợi | Mức độ ưu tiên.
```

Khác biệt nằm ở ngữ cảnh. AI không biết hệ thống của bạn; bạn càng mô tả rõ quy tắc nghiệp vụ, kết quả càng dùng được.

## Bài tập

1. Lấy một chức năng trong project bạn đang test, viết một câu hỏi đủ 4 phần như trên.
2. Hỏi AI sinh test case cho chức năng đó, rồi tự đánh dấu: test case nào dùng được ngay, nào phải sửa, nào sai hẳn. Tính tỷ lệ.
3. Viết ra 3 loại dữ liệu trong project của bạn tuyệt đối không được dán vào công cụ AI.

# Bài 27 — Workflow dùng AI trong công việc tester

**Mục tiêu:** có quy trình cụ thể cho 6 việc hằng ngày, kèm câu lệnh mẫu copy được dùng ngay.

Nguyên tắc chung cho cả 6 workflow: AI làm bước nháp, bạn làm bước kiểm. Mỗi workflow dưới đây đều có bước "bạn phải làm gì" — đừng bỏ bước đó.

## Workflow 1 — Phân tích yêu cầu, tìm chỗ còn thiếu

Việc này nên làm **trước** khi viết test case. Đưa user story cho AI và nhờ chỉ ra chỗ mơ hồ, rồi mang câu hỏi đó đi hỏi BA.

```text
Đây là user story: [dán user story]

Bạn là QA. Hãy chỉ ra:
1. Những quy tắc nghiệp vụ còn mơ hồ hoặc chưa được mô tả
2. Những trường hợp biên mà tài liệu không nói rõ
3. Danh sách câu hỏi tôi nên hỏi BA trước khi viết test case

Không viết test case ở bước này.
```

**Bạn phải làm:** đọc danh sách, bỏ câu hỏi nào đã có câu trả lời trong tài liệu khác, rồi gửi phần còn lại cho BA.

## Workflow 2 — Sinh test case

```text
Bạn là QA engineer có 5 năm kinh nghiệm.

Chức năng: [mô tả chức năng]
Quy tắc nghiệp vụ: [liệt kê từng quy tắc]
Phạm vi: [web / mobile / API], môi trường [staging]

Viết test case theo kỹ thuật phân vùng tương đương và phân tích giá trị biên.
Bao gồm: trường hợp đúng, trường hợp âm, trường hợp biên, trường hợp bỏ trống.

Định dạng: bảng Markdown với cột
Mã TC | Tiêu đề | Tiền điều kiện | Bước thực hiện | Dữ liệu test | Kết quả mong đợi | Ưu tiên
```

**Bạn phải làm:** xóa test case trùng, bổ sung test case dựa trên lỗi đã từng xảy ra ở hệ thống này (AI không biết lịch sử đó), và điều chỉnh mức độ ưu tiên theo rủi ro thật.

## Workflow 3 — Sinh dữ liệu test

```text
Sinh 20 bộ dữ liệu test cho form đăng ký gồm: họ tên, email, số điện thoại
Việt Nam, mật khẩu, ngày sinh.

Trong đó 10 bộ hợp lệ và 10 bộ không hợp lệ. Với mỗi bộ không hợp lệ,
ghi rõ vi phạm quy tắc nào.

Dữ liệu phải là giả, không được giống người thật.
Định dạng: CSV, dòng đầu là tiêu đề cột.
```

Kết quả lưu thẳng thành file CSV dùng cho `parametrize` ở Bài 18 hoặc CSV Data Set Config ở Bài 23.

## Workflow 4 — Chuyển test case thành script Playwright

Đây là chỗ AI tiết kiệm nhiều thời gian nhất, nhưng phải cung cấp đủ hai thứ: test case và **HTML thật** của trang.

```text
Chuyển test case sau thành test Playwright + pytest bằng Python.

Test case: [dán test case]

HTML của form: [dán đoạn HTML thật, lấy bằng F12 → Inspect]

Yêu cầu:
- Dùng Page Object Model, tách thành pages/login_page.py và tests/test_login.py
- Locator ưu tiên get_by_role, get_by_label, get_by_placeholder
- Dùng expect() của Playwright, không dùng assert cho giao diện
- Không dùng time.sleep()
- Đặt tên hàm và biến bằng tiếng Việt không dấu
```

**Bạn phải làm:** chạy thử. Không có HTML thật thì locator sẽ là phỏng đoán. Dán HTML là bước quan trọng nhất của workflow này.

## Workflow 5 — Review code test của mình

```text
Review đoạn code test Playwright sau với vai trò senior automation engineer.

[dán code]

Chỉ ra theo thứ tự ưu tiên:
1. Lỗi khiến test flaky
2. Locator dễ hỏng khi dev sửa giao diện
3. Assertion thiếu hoặc quá yếu
4. Code lặp nên tách thành hàm hoặc page object

Với mỗi vấn đề, nêu dòng nào và sửa thế nào. Không viết lại toàn bộ file.
```

Yêu cầu "không viết lại toàn bộ file" rất quan trọng — nếu không, AI sẽ trả về một phiên bản mới mà bạn không kiểm soát được những gì đã thay đổi.

## Workflow 6 — Viết bug report và tóm tắt báo cáo

```text
Viết bug report từ thông tin sau:

Tôi làm: [các bước]
Kết quả mong đợi: [...]
Kết quả thực tế: [...]
Môi trường: [browser, OS, URL, thời điểm]
Log lỗi: [dán log nếu có]

Định dạng: Tiêu đề (một dòng, nêu rõ triệu chứng), Mức độ nghiêm trọng,
Môi trường, Các bước tái hiện (đánh số), Kết quả mong đợi, Kết quả thực tế,
Ghi chú.

Chỉ dùng thông tin tôi cung cấp, không suy đoán nguyên nhân.
```

Câu cuối giữ cho bug report không chứa phỏng đoán sai — dev đọc bug report có suy đoán sai sẽ mất thời gian đi lệch hướng.

## Bảng tổng hợp workflow

| Workflow | Khi nào dùng | Bước kiểm bắt buộc |
| --- | --- | --- |
| Phân tích yêu cầu | Nhận user story mới | Mang câu hỏi đi hỏi BA |
| Sinh test case | Sau khi yêu cầu đã rõ | Xóa trùng, thêm theo lịch sử lỗi |
| Sinh dữ liệu test | Trước khi viết script | Kiểm tra định dạng đúng với hệ thống |
| Viết script | Đã có test case + HTML | Chạy thử thật |
| Review code | Trước khi tạo pull request | Tự đánh giá từng đề xuất |
| Bug report | Khi phát hiện lỗi | Đọc lại các bước tái hiện |

## Bài tập

1. Chạy đủ workflow 1 → 2 → 3 → 4 cho một chức năng trong project của bạn, giữ lại kết quả từng bước.
2. Dùng workflow 5 review một file test bạn đã viết ở Bài 17. Ghi lại những đề xuất bạn đồng ý và những đề xuất bạn bỏ, kèm lý do.
3. Viết bug report cho một lỗi bạn từng gặp theo workflow 6, so sánh với bug report bạn tự viết trước đây.
</script>

# Bài 28 — Skill: đóng gói quy trình lặp lại để dùng lại

**Mục tiêu:** biến những câu lệnh bạn phải gõ lại mỗi tuần thành một "skill" dùng lại được, để kết quả luôn đúng chuẩn của bạn hoặc của công ty.

## Skill là gì

Skill là một bộ hướng dẫn viết sẵn, lưu thành file, mô tả **cách làm một loại việc cụ thể**. Mỗi lần cần làm việc đó, bạn gọi skill thay vì gõ lại câu lệnh dài.

Lợi ích thật: kết quả ổn định. Nếu cả nhóm dùng cùng một skill sinh test case, test case của 5 người sẽ cùng định dạng, cùng mức chi tiết, và leader đọc được ngay.

| Prompt gõ tay | Skill |
| --- | --- |
| Mỗi lần gõ lại, mỗi lần một kiểu | Viết một lần, dùng mãi |
| Người khác không dùng được | Commit vào Git, cả nhóm dùng chung |
| Khó cải thiện | Sửa file là lần sau tốt hơn |

Cách gọi skill tùy công cụ AI bạn dùng — nhiều công cụ hỗ trợ file hướng dẫn kiểu này, tên gọi và vị trí file có thể khác nhau, nên kiểm tra tài liệu của công cụ. Phần dưới đây là nội dung skill, áp dụng được cho bất kỳ công cụ nào.

## Cấu trúc một skill

```text
1. Tên và mô tả  — khi nào dùng skill này
2. Đầu vào       — bạn cần cung cấp những gì
3. Các bước      — quy trình thực hiện
4. Định dạng ra  — mẫu đầu ra chính xác
5. Quy tắc       — những điều không được làm
6. Ví dụ         — một ví dụ đầy đủ
```

Phần 4 và 6 quyết định chất lượng skill. Mô tả định dạng bằng lời thì kết quả vẫn trôi; đưa một ví dụ hoàn chỉnh thì kết quả khớp ngay.

## Skill mẫu 1 — Sinh test case theo chuẩn của nhóm

```markdown
# Skill: Sinh test case từ user story

## Khi nào dùng
Khi có user story hoặc mô tả chức năng cần viết test case.

## Đầu vào cần có
- User story hoặc mô tả chức năng
- Danh sách quy tắc nghiệp vụ (bắt buộc)
- Loại hệ thống: web / mobile / API

Thiếu quy tắc nghiệp vụ thì hỏi lại, không được tự suy đoán.

## Các bước
1. Liệt kê các quy tắc nghiệp vụ rút ra được từ đầu vào
2. Với mỗi trường nhập liệu, áp dụng phân vùng tương đương
3. Với mỗi trường có giới hạn, áp dụng phân tích giá trị biên
4. Thêm test case cho luồng âm: bỏ trống, sai định dạng, vượt giới hạn, không có quyền
5. Gán mức ưu tiên theo ảnh hưởng nghiệp vụ

## Định dạng đầu ra
Bảng Markdown, đúng các cột sau, không thêm không bớt:

| Mã TC | Tiêu đề | Tiền điều kiện | Bước thực hiện | Dữ liệu test | Kết quả mong đợi | Ưu tiên |

- Mã TC: TC_<chức năng>_<số 3 chữ số>, ví dụ TC_LOGIN_001
- Bước thực hiện: đánh số 1. 2. 3., mỗi bước một hành động
- Kết quả mong đợi: cụ thể, kiểm chứng được; không viết "hoạt động đúng"
- Ưu tiên: High / Medium / Low

## Quy tắc
- Không gộp nhiều kiểm tra vào một test case
- Không viết test case mà bước thực hiện phải xem code mới hiểu
- Kết thúc bằng mục "Câu hỏi cần xác nhận với BA" nếu có chỗ mơ hồ

## Ví dụ
Đầu vào: form đăng nhập, mật khẩu tối thiểu 8 ký tự có cả chữ và số.

| Mã TC | Tiêu đề | Tiền điều kiện | Bước thực hiện | Dữ liệu test | Kết quả mong đợi | Ưu tiên |
| --- | --- | --- | --- | --- | --- | --- |
| TC_LOGIN_001 | Đăng nhập với tài khoản hợp lệ | Tài khoản đã kích hoạt | 1. Mở trang đăng nhập<br>2. Nhập email<br>3. Nhập mật khẩu<br>4. Bấm Đăng nhập | user01@test.com / Pass@123 | Chuyển sang trang chủ, hiển thị tên người dùng ở góc phải | High |
| TC_LOGIN_002 | Mật khẩu 7 ký tự bị từ chối | Không | 1. Mở trang đăng nhập<br>2. Nhập email<br>3. Nhập mật khẩu 7 ký tự<br>4. Bấm Đăng nhập | user01@test.com / Pass@12 | Hiển thị lỗi "Mật khẩu tối thiểu 8 ký tự", không chuyển trang | High |
```

## Skill mẫu 2 — Chuyển test case thành script Playwright

```markdown
# Skill: Viết test Playwright từ test case

## Khi nào dùng
Khi đã có test case và HTML của trang, cần sinh code test.

## Đầu vào cần có
- Test case (bảng hoặc mô tả bước)
- HTML thật của phần giao diện liên quan

Không có HTML thì không được đoán locator — phải hỏi lại.

## Các bước
1. Xác định các trang liên quan, mỗi trang một page object
2. Trích locator từ HTML được cung cấp, theo thứ tự ưu tiên:
   get_by_role → get_by_label → get_by_placeholder → get_by_text
   → get_by_test_id → CSS. Không dùng XPath.
3. Viết page class trong pages/, locator đặt trong __init__
4. Viết hàm test trong tests/, mỗi test case một hàm
5. Nhiều bộ dữ liệu thì dùng @pytest.mark.parametrize

## Định dạng đầu ra
Hai khối code riêng, có đường dẫn file ở đầu mỗi khối:
- pages/<ten>_page.py
- tests/test_<ten>.py

## Quy tắc
- Không dùng time.sleep() trong bất kỳ trường hợp nào
- Mọi kiểm tra giao diện dùng expect(), không dùng assert
- Mọi test phải có ít nhất một expect()
- Tên hàm và biến bằng tiếng Việt không dấu, dùng dấu gạch dưới
- Không có locator nào xuất hiện trong file tests/
- Cuối câu trả lời ghi lệnh pytest để chạy test vừa viết
```

## Skill mẫu 3 — Review test case trước khi nộp cho cô/leader

```markdown
# Skill: Review test case

## Khi nào dùng
Trước khi nộp bộ test case cho leader hoặc khách hàng.

## Các bước kiểm tra
1. Mỗi test case kiểm tra đúng một điều?
2. Bước thực hiện có đủ để người chưa biết hệ thống làm theo được?
3. Kết quả mong đợi có kiểm chứng được, hay chỉ là "hiển thị đúng"?
4. Có đủ luồng âm: bỏ trống, sai định dạng, vượt giới hạn, sai quyền?
5. Có test case nào trùng nhau?
6. Mức ưu tiên có hợp lý với rủi ro nghiệp vụ?
7. Dữ liệu test có đúng định dạng của hệ thống?

## Định dạng đầu ra
| Mã TC | Vấn đề | Mức độ | Đề xuất sửa |

Sau bảng, ghi 3 phần:
- Test case còn thiếu: liệt kê trường hợp chưa được phủ
- Điểm làm tốt: nêu ngắn
- Kết luận: đã nộp được / cần sửa trước khi nộp

## Quy tắc
- Không viết lại test case hộ, chỉ chỉ ra vấn đề và đề xuất
- Mỗi vấn đề phải gắn với một mã TC cụ thể
```

## Cách xây skill cho riêng mình

1. Làm việc đó bằng tay 2–3 lần trước. Chưa làm bằng tay thì không biết cần quy định gì.
2. Mỗi lần phải sửa kết quả AI, ghi lại chỗ sửa. Danh sách đó chính là phần "Quy tắc" của skill.
3. Dán một kết quả bạn hài lòng vào phần "Ví dụ".
4. Dùng 5 lần, mỗi lần phải sửa thì bổ sung vào skill. Sau khoảng 5 vòng là skill ổn định.
5. Commit skill vào repo cùng project để cả nhóm dùng và cùng cải thiện.

Dấu hiệu skill tốt: bạn gọi nó và dùng được kết quả gần như không sửa gì.

## Bài tập

1. Viết skill "Sinh test case" của riêng bạn theo đúng chuẩn template test case mà cô hoặc công ty bạn yêu cầu.
2. Dùng skill đó cho 3 chức năng khác nhau, ghi lại mỗi lần phải sửa gì.
3. Cập nhật skill dựa trên 3 lần đó và chạy lại lần thứ tư để thấy khác biệt.
4. Viết thêm skill "Viết bug report" theo đúng mẫu bug report nhóm bạn đang dùng.
</script>

# Bài 29 — Rule: đặt ràng buộc cho AI trong project automation

**Mục tiêu:** viết file quy tắc để mỗi lần AI sinh code trong project của bạn, nó tự tuân theo chuẩn — không phải nhắc lại mỗi lần.

## Rule khác skill thế nào

| | Skill | Rule |
| --- | --- | --- |
| Trả lời câu hỏi | "Làm việc này như thế nào" | "Trong project này luôn phải thế nào" |
| Khi nào áp dụng | Khi bạn gọi nó | Luôn luôn, cho mọi yêu cầu |
| Ví dụ | Skill sinh test case | Luôn dùng POM, không dùng `sleep()` |
| Lưu ở đâu | File skill riêng | File quy tắc ở gốc project |

Hầu hết công cụ AI dùng cho lập trình đều đọc một file quy tắc đặt ở gốc project. Tên file khác nhau tùy công cụ, nên kiểm tra tài liệu của công cụ bạn dùng. Nội dung thì giống nhau, và đó là phần quan trọng.

## File rule mẫu cho project automation test

```markdown
# Quy tắc project — Saucedemo Automation Test

## Ngữ cảnh project
Bộ automation test cho saucedemo.com.
Python 3.12 + Playwright (sync API) + pytest. Chạy CI trên GitHub Actions.

## Cấu trúc thư mục
- pages/   — Page Object Model, mỗi trang một file
- tests/   — test case, mỗi nhóm chức năng một file
- data/    — dữ liệu test dạng CSV
- conftest.py — fixture dùng chung

## Quy tắc viết code test

### Locator
- Thứ tự ưu tiên: get_by_role → get_by_label → get_by_placeholder
  → get_by_text → get_by_test_id → CSS
- Không dùng XPath
- Không dùng CSS selector phụ thuộc cấu trúc DOM (div > div > span)
- Mọi locator khai báo trong __init__ của page class
- Tuyệt đối không có locator trong file thuộc tests/

### Chờ đợi
- Không dùng time.sleep() trong bất kỳ trường hợp nào
- Dựa vào auto-wait của Playwright
- Cần chờ có điều kiện thì dùng expect() hoặc wait_for_url()

### Assertion
- Kiểm tra giao diện: dùng expect() của Playwright
- Kiểm tra giá trị Python thuần: dùng assert
- Mỗi hàm test phải có ít nhất một expect()

### Đặt tên
- File test: test_<chuc_nang>.py
- Hàm test: test_<hanh_dong>_<ket_qua_mong_doi>
- Page class: <Ten>Page, ví dụ LoginPage
- Phương thức page object đặt theo hành động nghiệp vụ (dang_nhap),
  không đặt theo thao tác kỹ thuật (click_button)
- Biến và hàm viết tiếng Việt không dấu, dùng dấu gạch dưới

### Dữ liệu test
- Không gõ cứng dữ liệu test trong file test
- Nhiều bộ dữ liệu thì dùng @pytest.mark.parametrize
- Dữ liệu dài đặt trong data/*.csv
- Tài khoản và secret đọc từ biến môi trường, không commit

## Quy tắc khi hỗ trợ tôi

- Chưa có HTML thật thì không đoán locator — hãy hỏi tôi
- Không viết lại cả file khi tôi chỉ nhờ sửa một chỗ
- Mỗi thay đổi nêu rõ sửa file nào, dòng nào
- Không thêm thư viện mới mà không hỏi trước
- Không khẳng định test pass; chỉ tôi lệnh để tự chạy kiểm chứng
- Code sinh ra phải chạy được trên cả Windows và Ubuntu (CI)
```

## Vì sao từng quy tắc có mặt ở đó

Mỗi dòng trong file rule nên bắt nguồn từ một lần bạn đã phải sửa. Ví dụ:

| Quy tắc | Bắt nguồn từ |
| --- | --- |
| Không dùng XPath | Dev đổi một thẻ div, 8 test fail cùng lúc |
| Không `time.sleep()` | Test chạy 4 phút trong khi chỉ cần 40 giây |
| Không đoán locator | Mất 2 giờ debug locator AI tự nghĩ ra |
| Không viết lại cả file | Mất phần code đã sửa tay vì bị ghi đè |
| Không khẳng định test pass | Báo cáo đã pass nhưng thực tế chưa chạy |

Viết rule theo cách này thì file không phình to vô ích, và mỗi quy tắc đều có lý do bạn giải thích được.

## Dùng AI trong quy trình review và CI

AI dùng được ở bước review, nhưng không thay được bước chạy test:

| Bước | AI làm | Người làm |
| --- | --- | --- |
| Trước khi commit | Review code tìm locator yếu, thiếu assertion | Quyết định sửa gì |
| Pull request | Tóm tắt thay đổi, chỉ ra rủi ro | Phê duyệt |
| Test fail trên CI | Đọc log, trace, đề xuất nguyên nhân | Kiểm chứng và sửa |
| Báo cáo | Tóm tắt số liệu thành vài dòng | Kết luận đạt/không đạt |

Ranh giới cần giữ: AI không được là thứ quyết định "bộ test này đã đủ chưa" hay "lỗi này có chặn release không". Hai câu đó thuộc trách nhiệm của tester.

## Checklist chất lượng khi dùng AI

Trước khi commit code có AI tham gia, kiểm đủ 7 mục:

- [ ] Đã chạy thử toàn bộ test, không chỉ test mới
- [ ] Mọi locator đã kiểm chứng trên trang thật
- [ ] Không còn `time.sleep()` nào
- [ ] Mọi test có assertion thật, không phải assertion luôn đúng
- [ ] Không có dữ liệu thật hoặc secret lọt vào code
- [ ] Đọc hiểu được từng dòng code mình commit
- [ ] Test fail đúng khi hệ thống sai — thử đổi giá trị mong đợi để xác nhận

Mục cuối là mục quan trọng nhất và hay bị bỏ. Một test luôn pass dù hệ thống đúng hay sai thì tệ hơn không có test, vì nó tạo cảm giác an toàn giả.

## Bài tập

1. Viết file rule cho project automation của bạn ở Bài 20, tối thiểu 10 quy tắc.
2. Với mỗi quy tắc, viết một câu lý do vì sao nó ở đó.
3. Nhờ AI sinh một test mới trong project đã có file rule, kiểm xem nó có tuân thủ không. Quy tắc nào bị bỏ qua thì viết lại cho rõ hơn.
4. Chạy checklist 7 mục cho một file test bạn đã viết, đặc biệt mục cuối.
</script>
