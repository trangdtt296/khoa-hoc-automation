# Bài 3 — Chương 3: Static Testing

**Khoảng 4 câu trong đề thi.** Chương ngắn, dễ lấy điểm.

## 3.1 Cơ bản về kiểm thử tĩnh

**Định nghĩa:** kiểm thử tĩnh là kiểm thử work product **mà không thực thi** phần mềm.

Hai hình thức:

| Hình thức | Cách làm |
| --- | --- |
| **Review thủ công** | Con người đọc và đánh giá work product |
| **Phân tích tĩnh** | Công cụ tự động phân tích mã nguồn hoặc tài liệu |

### Work product nào kiểm thử tĩnh được

Gần như mọi thứ đọc được và hiểu được:

- Đặc tả yêu cầu, user story và acceptance criteria
- Tài liệu thiết kế, kiến trúc
- Mã nguồn
- Testware: test plan, test case, test script
- Hướng dẫn sử dụng
- Hợp đồng, kế hoạch dự án
- Cấu hình, mô hình, trang web

Work product **không** kiểm thử tĩnh được: thứ không đọc hiểu được bằng người hoặc công cụ, ví dụ mã máy.

### Giá trị của kiểm thử tĩnh

| Lợi ích |
| --- |
| Phát hiện defect **sớm**, trước khi chạy được phần mềm |
| Tìm được loại defect mà kiểm thử động khó tìm: yêu cầu mâu thuẫn, thiếu sót, mơ hồ |
| Ngăn defect lan sang giai đoạn sau |
| Giảm chi phí và thời gian |
| Cải thiện giao tiếp giữa các bên |
| Tăng chất lượng tài liệu |

Một số defect chỉ tìm được bằng kiểm thử tĩnh: code không bao giờ chạy tới (unreachable code), biến khai báo mà không dùng, lệch chuẩn code, yêu cầu mâu thuẫn.

### Static testing và dynamic testing khác nhau

| | Static testing | Dynamic testing |
| --- | --- | --- |
| Thực thi phần mềm | Không | Có |
| Tìm ra | **Defect** trực tiếp | **Failure**, từ đó suy ra defect |
| Thời điểm | Rất sớm | Khi đã có phần chạy được |
| Loại defect | Yêu cầu mơ hồ, mâu thuẫn, code không chuẩn | Lỗi hành vi, hiệu năng, tích hợp |

Điểm thi hay hỏi: kiểm thử tĩnh tìm thấy **defect trực tiếp**, không cần qua failure. Đây là khác biệt cốt lõi.

Hai loại bổ sung cho nhau, không thay thế nhau.

## 3.2 Phản hồi và quy trình review

### Giá trị của phản hồi sớm và thường xuyên

Phản hồi sớm giúp phát hiện sớm hiểu nhầm về yêu cầu, giúp nhóm phát triển hiểu đúng nhu cầu khách hàng, và tránh lãng phí công sức làm sai hướng.

### Các hoạt động trong quy trình review

| Hoạt động | Nội dung |
| --- | --- |
| **Planning** | Xác định phạm vi, mục tiêu, loại review, người tham gia, tiêu chí vào ra |
| **Review initiation** | Phát tài liệu, giải thích mục tiêu, đảm bảo mọi người sẵn sàng |
| **Individual review** | Từng người tự đọc, ghi nhận defect, câu hỏi, nhận xét |
| **Issue communication and analysis** | Trao đổi các phát hiện, đánh giá, quyết định xử lý |
| **Fixing and reporting** | Sửa defect, báo cáo trạng thái, kiểm tra tiêu chí ra |

### Vai trò trong review

| Vai trò | Trách nhiệm |
| --- | --- |
| **Manager** | Quyết định thực hiện review, phân bổ nguồn lực |
| **Author** | Tạo ra work product, sửa defect |
| **Moderator / Facilitator** | Điều phối cuộc họp, giữ không khí xây dựng |
| **Scribe** | Ghi chép các phát hiện |
| **Reviewer** | Tìm và nêu defect |
| **Review leader** | Chịu trách nhiệm chung về review, chọn người tham gia |

### Bốn loại review

| Loại | Mức trang trọng | Đặc điểm chính |
| --- | --- | --- |
| **Informal review** | Thấp nhất | Không có quy trình chính thức, không bắt buộc tài liệu kết quả |
| **Walkthrough** | Trung bình | **Tác giả dẫn dắt**, mục đích học hỏi và thu thập ý kiến |
| **Technical review** | Cao | Người tham gia là **chuyên gia kỹ thuật ngang hàng**, đạt đồng thuận kỹ thuật |
| **Inspection** | Cao nhất | Tuân thủ quy trình chặt, **tác giả không dẫn dắt**, có thu thập số liệu, mục đích tìm defect tối đa |

Bảng này rất hay được hỏi. Hai điểm nhớ kỹ: **walkthrough do tác giả dẫn dắt**, **inspection là trang trọng nhất và tác giả không dẫn dắt**.

### Yếu tố thành công của review

| Yếu tố |
| --- |
| Xác định rõ mục tiêu và tiêu chí đo được |
| Chọn đúng loại review phù hợp mục tiêu, work product và người tham gia |
| Chia nhỏ work product để review không quá dài |
| Phản hồi mang tính xây dựng, tập trung vào sản phẩm không vào con người |
| Người tham gia có đủ thời gian chuẩn bị |
| Quản lý ủng hộ |
| Review là một phần của văn hoá tổ chức |
| Đào tạo đầy đủ, nhất là với các loại review trang trọng |

## Điểm dễ sai trong bài thi

| Bẫy | Đúng là |
| --- | --- |
| "Static testing tìm ra failure" | Tìm ra **defect** trực tiếp |
| "Static testing cần chạy phần mềm" | Không thực thi phần mềm |
| "Inspection do tác giả dẫn dắt" | Walkthrough mới do tác giả dẫn dắt |
| "Review chỉ áp dụng cho mã nguồn" | Áp dụng cho mọi work product đọc hiểu được |
| "Informal review phải có báo cáo" | Không bắt buộc tài liệu kết quả |

## Bài tập

1. Lập bảng so sánh 4 loại review theo 4 tiêu chí: mức trang trọng, ai dẫn dắt, mục đích, tài liệu.
2. Liệt kê 6 vai trò trong review và trách nhiệm từng vai trò.
3. Nêu 5 lợi ích của kiểm thử tĩnh.
4. Nêu 3 loại defect chỉ tìm được bằng kiểm thử tĩnh.
5. Làm các câu hỏi Chương 3 trong đề mẫu.

<script type="text/markdown" data-id="is-4" data-nav="Bài 4 · Chương 4 — Thiết kế test">
# Bài 4 — Chương 4: Test Analysis and Design

**Khoảng 11 câu trong đề thi — chương nặng nhất.** Đây là chương duy nhất có nhiều câu **K3**, tức là phải tính toán thật chứ không chỉ nhớ.

## 4.1 Tổng quan các kỹ thuật

| Nhóm | Dựa trên | Gồm |
| --- | --- | --- |
| **Black-box** | Đặc tả, hành vi bên ngoài | EP, BVA, Decision table, State transition |
| **White-box** | Cấu trúc bên trong | Statement testing, Branch testing |
| **Experience-based** | Kinh nghiệm của tester | Error guessing, Exploratory, Checklist-based |

Trong v4.0 còn có nhóm thứ tư: **collaboration-based** (mục 4.5).

## 4.2 Kỹ thuật black-box

### Equivalence Partitioning — Phân vùng tương đương

Chia dữ liệu thành các phân vùng mà hệ thống xử lý giống nhau. Mỗi phân vùng chỉ cần một giá trị đại diện.

**Độ phủ** = số phân vùng đã kiểm / tổng số phân vùng × 100%

Ví dụ thi: ô nhập điểm từ 0–100, phân vùng là: < 0 (không hợp lệ), 0–100 (hợp lệ), > 100 (không hợp lệ). Ba phân vùng → tối thiểu **3 test case** để đạt 100% độ phủ.

Chú ý: phân vùng gồm **cả hợp lệ và không hợp lệ**. Câu hỏi thi hay bẫy bằng cách chỉ đếm phân vùng hợp lệ.

### Boundary Value Analysis — Phân tích giá trị biên

Chỉ áp dụng khi phân vùng **có thứ tự** (số, ngày tháng). Không áp dụng cho phân vùng kiểu danh mục.

| Cách | Giá trị kiểm mỗi biên | Với khoảng 1–100 |
| --- | --- | --- |
| **2-value BVA** | Giá trị biên và giá trị liền kề bên ngoài | 0, 1, 100, 101 |
| **3-value BVA** | Thêm giá trị liền kề bên trong | 0, 1, 2, 99, 100, 101 |

**Độ phủ** = số giá trị biên đã kiểm / tổng số giá trị biên × 100%

Dạng câu hỏi thi điển hình: "Cho ô nhập 1–100, áp dụng 2-value BVA cần bao nhiêu test case?" → đáp án **4**.

Hoặc: "Giá trị nào sau đây là giá trị biên của khoảng 18–65?" → 17, 18, 65, 66 (với 2-value).

### Decision Table Testing — Bảng quyết định

Dùng khi kết quả phụ thuộc nhiều điều kiện kết hợp.

| Thành phần | Nghĩa |
| --- | --- |
| **Conditions** | Các điều kiện đầu vào |
| **Actions** | Kết quả tương ứng |
| **Column / Rule** | Một tổ hợp điều kiện và kết quả |

Số cột của bảng đầy đủ = **2 mũ số điều kiện** (khi mỗi điều kiện có 2 giá trị đúng/sai).

| Số điều kiện | Số cột |
| --- | --- |
| 2 | 4 |
| 3 | 8 |
| 4 | 16 |

**Độ phủ** = số cột đã kiểm / tổng số cột × 100%

Bảng rút gọn (collapsed decision table) dùng dấu `–` cho điều kiện không ảnh hưởng kết quả, giúp giảm số test case.

### State Transition Testing — Kiểm thử chuyển trạng thái

Dùng khi hệ thống phản ứng khác nhau tuỳ trạng thái hiện tại.

| Thành phần | Nghĩa |
| --- | --- |
| **State** | Trạng thái hệ thống đang ở |
| **Event** | Sự kiện kích hoạt chuyển trạng thái |
| **Transition** | Việc chuyển từ trạng thái này sang trạng thái khác |
| **Action** | Hành động xảy ra kèm theo chuyển trạng thái |

Hai dạng biểu diễn: **state transition diagram** (sơ đồ) và **state table** (bảng, thể hiện được cả chuyển trạng thái không hợp lệ).

Các mức độ phủ:

| Mức | Nghĩa |
| --- | --- |
| **All states coverage** | Mọi trạng thái đều được ghé qua ít nhất một lần |
| **Valid transitions coverage** (0-switch) | Mọi chuyển trạng thái hợp lệ đều được thực hiện |
| **All transitions coverage** | Mọi chuyển trạng thái, kể cả không hợp lệ, đều được thử |

Nhớ thứ tự mạnh dần: all states < valid transitions < all transitions.

## 4.3 Kỹ thuật white-box

### Statement Testing — Kiểm thử câu lệnh

Mục tiêu: thực thi mọi câu lệnh trong code ít nhất một lần.

**Statement coverage** = số câu lệnh đã chạy / tổng số câu lệnh × 100%

### Branch Testing — Kiểm thử nhánh

Mục tiêu: thực thi mọi nhánh quyết định (cả nhánh đúng và nhánh sai).

**Branch coverage** = số nhánh đã chạy / tổng số nhánh × 100%

Quan hệ quan trọng cho bài thi: **đạt 100% branch coverage thì chắc chắn đạt 100% statement coverage, nhưng ngược lại thì không.** Branch coverage mạnh hơn.

Ví dụ minh hoạ:

```text
IF (a > 0) THEN
    print("duong")
END IF
```

Một test case với `a = 5` chạy hết mọi câu lệnh → **100% statement coverage**. Nhưng nhánh `a > 0` sai chưa được thử → chỉ **50% branch coverage**. Cần thêm test case `a = -1`.

### Giá trị của white-box testing

- Tính được độ phủ một cách khách quan, đo đếm được
- Phát hiện phần code không được kiểm thử
- Tìm được defect mà black-box bỏ sót: code không bao giờ chạy tới, nhánh thiếu

Lưu ý: 100% code coverage **không** đồng nghĩa đã test đủ. Nó không phát hiện được chức năng bị thiếu hoàn toàn.

## 4.4 Kỹ thuật dựa trên kinh nghiệm

| Kỹ thuật | Cách làm |
| --- | --- |
| **Error guessing** | Dựa trên kinh nghiệm đoán chỗ dễ có lỗi. Có thể dùng fault attack — danh sách lỗi thường gặp |
| **Exploratory testing** | Thiết kế, thực thi và đánh giá test đồng thời. Thường dùng **test charter** và **session-based testing** |
| **Checklist-based** | Thiết kế và thực thi test theo một danh sách kiểm tra đã chuẩn bị |

Kỹ thuật dựa trên kinh nghiệm **bổ sung** cho kỹ thuật có hệ thống, không thay thế. Hiệu quả phụ thuộc nhiều vào kinh nghiệm của người thực hiện, và khó đo độ phủ.

## 4.5 Kỹ thuật dựa trên cộng tác

### Collaborative user story writing

User story viết theo mẫu: **As a [role], I want [goal], so that [benefit]**

Tiêu chí chất lượng của user story — **INVEST**:

| Chữ | Nghĩa |
| --- | --- |
| **I**ndependent | Độc lập với story khác |
| **N**egotiable | Có thể thương lượng, điều chỉnh |
| **V**aluable | Mang lại giá trị cho người dùng |
| **E**stimable | Ước lượng được công sức |
| **S**mall | Đủ nhỏ để làm trong một vòng lặp |
| **T**estable | Kiểm thử được |

Kỹ thuật **3C**: **Card** (thẻ mô tả), **Conversation** (trao đổi), **Confirmation** (tiêu chí xác nhận).

### Acceptance criteria

Điều kiện để story được chấp nhận. Hai cách viết phổ biến:

| Cách | Mô tả |
| --- | --- |
| **Scenario-oriented** | Dạng Given / When / Then |
| **Rule-oriented** | Danh sách quy tắc dạng bullet, hoặc bảng input-output |

### ATDD — Acceptance Test-Driven Development

Viết acceptance test **trước khi** hiện thực chức năng, dựa trên acceptance criteria. Các bên cùng tham gia: khách hàng, dev, tester.

Lợi ích: hiểu thống nhất yêu cầu ngay từ đầu, phát hiện mâu thuẫn trước khi code, test có sẵn khi code xong.

## Điểm dễ sai trong bài thi

| Bẫy | Đúng là |
| --- | --- |
| "100% statement coverage nghĩa là đã test đủ" | Không — còn nhánh chưa thử và chức năng thiếu |
| "Statement coverage mạnh hơn branch coverage" | Ngược lại, branch mạnh hơn |
| "BVA áp dụng cho mọi phân vùng" | Chỉ cho phân vùng có thứ tự |
| "EP chỉ tính phân vùng hợp lệ" | Tính cả không hợp lệ |
| "Exploratory testing là test ngẫu nhiên" | Có cấu trúc, dùng charter và session |

## Bài tập K3 — dạng hay thi nhất

1. Ô nhập tuổi 18–65. Liệt kê các phân vùng và tính số test case cho 100% EP coverage.
2. Cùng ô đó, áp dụng 2-value BVA và 3-value BVA — mỗi cách cần bao nhiêu test case và là những giá trị nào?
3. Hệ thống có 3 điều kiện đầu vào. Bảng quyết định đầy đủ có bao nhiêu cột?
4. Cho đoạn mã có 2 lệnh IF lồng nhau, tính số test case tối thiểu cho 100% statement coverage và 100% branch coverage.
5. Vẽ state diagram cho máy ATM (chờ thẻ → nhập PIN → chọn giao dịch → trả thẻ) và liệt kê test case cho valid transitions coverage.
6. Áp dụng INVEST đánh giá 3 user story bất kỳ.

# Bài 5 — Chương 5: Managing the Test Activities

**Khoảng 9 câu trong đề thi.** Chương nặng thứ hai.

## 5.1 Lập kế hoạch kiểm thử

### Mục đích và nội dung test plan

Test plan mô tả mục tiêu, nguồn lực, quy trình kiểm thử của một dự án. Nội dung thường gồm: bối cảnh, giả định, các bên liên quan, hoạt động kiểm thử, nguồn lực, lịch trình, rủi ro, tiêu chí vào ra.

### Đóng góp của tester vào lập kế hoạch lặp và phát hành

| Mức | Tester đóng góp gì |
| --- | --- |
| **Release planning** | Góc nhìn kiểm thử cho product backlog, ước lượng công sức test, phân tích rủi ro chất lượng |
| **Iteration planning** | Phân tích chi tiết story, xác định rủi ro, ước lượng công sức test cho từng story |

### Tiêu chí vào và tiêu chí ra

| Loại | Nghĩa | Ví dụ |
| --- | --- | --- |
| **Entry criteria** (definition of ready) | Điều kiện để bắt đầu hoạt động kiểm thử | Môi trường sẵn sàng, test case đã review |
| **Exit criteria** (definition of done) | Điều kiện để kết thúc | Đạt độ phủ yêu cầu, không còn defect mức cao |

Lưu ý: **hết thời gian hoặc hết ngân sách không phải là exit criteria hợp lệ** nếu đã thoả thuận trước trong kế hoạch — nhưng trong thực tế vẫn thường là lý do dừng test.

### Kỹ thuật ước lượng

| Kỹ thuật | Cách làm |
| --- | --- |
| **Ratio-based (metrics-based)** | Dựa trên số liệu dự án tương tự trước đây |
| **Extrapolation** | Đo công sức ở vài vòng lặp đầu rồi ngoại suy |
| **Wideband Delphi** | Nhiều chuyên gia ước lượng độc lập rồi thảo luận tới đồng thuận |
| **Three-point estimation** | Tính từ 3 giá trị: lạc quan (a), khả dĩ nhất (m), bi quan (b) |

Công thức three-point:

```text
E = (a + 4m + b) / 6
SD = (b - a) / 6
```

Dạng câu hỏi thi: cho a = 6, m = 9, b = 18, tính E.

```text
E = (6 + 4×9 + 18) / 6 = (6 + 36 + 18) / 6 = 60 / 6 = 10
```

Học thuộc công thức này, đề hay hỏi.

### Ưu tiên test case

| Cách ưu tiên | Dựa trên |
| --- | --- |
| **Risk-based** | Mức rủi ro — rủi ro cao test trước |
| **Coverage-based** | Đạt độ phủ nhanh nhất |
| **Requirements-based** | Mức ưu tiên của yêu cầu tương ứng |

### Test pyramid

Mô hình phân tầng tự động hoá:

```text
        /\       UI / E2E test     - it nhat, cham nhat, dat nhat
       /  \
      /    \     Integration test  - vua
     /      \
    /________\   Unit test         - nhieu nhat, nhanh nhat, re nhat
```

Càng lên cao: test càng ít, càng chậm, càng tốn chi phí bảo trì. Càng xuống thấp: càng nhiều, càng nhanh, càng rẻ.

### Testing quadrants

Mô hình của Brian Marick, chia test theo hai trục: hỗ trợ nhóm hay đánh giá sản phẩm, và hướng nghiệp vụ hay hướng công nghệ.

| Quadrant | Nội dung |
| --- | --- |
| **Q1** | Hướng công nghệ, hỗ trợ nhóm — unit test, component test |
| **Q2** | Hướng nghiệp vụ, hỗ trợ nhóm — functional test, ví dụ, user story test |
| **Q3** | Hướng nghiệp vụ, đánh giá sản phẩm — exploratory, UAT |
| **Q4** | Hướng công nghệ, đánh giá sản phẩm — performance, security, load |

## 5.2 Quản lý rủi ro

### Định nghĩa rủi ro

**Risk = Likelihood × Impact** — khả năng xảy ra nhân với mức độ ảnh hưởng.

### Hai loại rủi ro

| Loại | Nghĩa | Ví dụ |
| --- | --- | --- |
| **Project risk** | Ảnh hưởng tới việc quản lý dự án | Trễ tiến độ, thiếu nhân sự, môi trường test hỏng |
| **Product risk** | Ảnh hưởng tới chất lượng sản phẩm | Tính sai tiền, lỗ hổng bảo mật, hiệu năng kém |

Phân biệt hai loại này là câu hỏi thi rất phổ biến.

### Risk-based testing

Dùng phân tích rủi ro để quyết định:

- Phạm vi kiểm thử
- Mức độ kiểm thử cho từng phần
- Thứ tự ưu tiên thực hiện
- Kỹ thuật áp dụng

Rủi ro cao → test sớm hơn, kỹ hơn, dùng kỹ thuật chặt chẽ hơn.

Các hoạt động quản lý rủi ro: **risk analysis** (identification + assessment) và **risk control** (mitigation + monitoring).

## 5.3 Giám sát, điều khiển và hoàn tất

### Các số liệu dùng trong kiểm thử

| Nhóm | Ví dụ |
| --- | --- |
| Tiến độ | Số test case đã chuẩn bị, đã chạy, pass/fail |
| Độ phủ | Phần trăm yêu cầu, code, rủi ro đã được phủ |
| Khuyết tật | Số defect tìm được, đã sửa, còn mở, theo mức độ |
| Rủi ro | Số rủi ro còn lại, đã xử lý |
| Chi phí | Công sức đã dùng so với kế hoạch |

### Hai loại báo cáo

| Báo cáo | Khi nào | Nội dung |
| --- | --- | --- |
| **Test progress report** | Định kỳ trong quá trình test | Trạng thái hiện tại, vấn đề gặp phải, kế hoạch tiếp |
| **Test completion report** | Khi kết thúc một giai đoạn test | Tổng kết, đánh giá so với tiêu chí ra, bài học |

### Truyền đạt trạng thái kiểm thử

Tuỳ người nghe mà chọn cách: trao đổi miệng, bảng thông tin, báo cáo điện tử, bảng điều khiển trực quan. Mục đích chung là giúp các bên ra quyết định.

## 5.4 Quản lý cấu hình

Configuration management đảm bảo mọi hạng mục của testware được **định danh, kiểm soát phiên bản, theo dõi thay đổi và liên hệ với nhau**.

Với kiểm thử, nó đảm bảo: mọi testware được định danh rõ, có kiểm soát phiên bản, truy vết được tới nhau và tới test basis, và mọi tài liệu được tham chiếu duy nhất.

Không có configuration management thì không biết test case nào áp dụng cho phiên bản nào của sản phẩm.

## 5.5 Quản lý khuyết tật

### Nội dung một defect report

Mục đích: cung cấp thông tin để sửa lỗi, theo dõi chất lượng, và cải tiến quy trình.

Nội dung điển hình gồm: mã định danh, tiêu đề và tóm tắt, ngày phát hiện, người phát hiện, phiên bản và môi trường, bước tái hiện, kết quả mong đợi và thực tế, mức độ nghiêm trọng, mức ưu tiên, trạng thái, tham chiếu tới test case và yêu cầu liên quan.

### Defect có thể được báo cáo từ đâu

Không chỉ từ kiểm thử động: còn từ **kiểm thử tĩnh**, từ review, từ phân tích tĩnh, và từ người dùng trong vận hành.

## Điểm dễ sai trong bài thi

| Bẫy | Đúng là |
| --- | --- |
| "Risk = Likelihood + Impact" | Là phép **nhân** |
| "Trễ tiến độ là product risk" | Là **project risk** |
| "Test pyramid: UI test nhiều nhất" | Unit test nhiều nhất, UI ít nhất |
| "Test completion report viết định kỳ" | Viết khi kết thúc; progress report mới định kỳ |
| "Defect chỉ phát hiện qua dynamic testing" | Cả static testing cũng phát hiện defect |

## Bài tập

1. Học thuộc công thức three-point estimation và tính với a=4, m=7, b=16.
2. Lập bảng phân biệt project risk và product risk, mỗi loại 4 ví dụ.
3. Vẽ test pyramid và giải thích vì sao unit test nên nhiều nhất.
4. Lập bảng 4 testing quadrants kèm ví dụ cho mỗi ô.
5. Liệt kê nội dung đầy đủ của một defect report theo syllabus.
6. Làm các câu hỏi Chương 5 trong đề mẫu.

# Bài 6 — Chương 6: Test Tools

Syllabus v4.0 rút gọn chương này rất nhiều so với bản cũ. Không còn danh sách dài phân loại công cụ; chỉ còn các nhóm chính theo hoạt động chúng hỗ trợ.

## 6.2 Lợi ích và rủi ro của tự động hoá kiểm thử

Đây là phần hay ra câu hỏi nhất của chương.

### Lợi ích

### Rủi ro

| Rủi ro |

| Kỳ vọng không thực tế về những gì công cụ làm được |
| Đánh giá thấp thời gian, chi phí và công sức để **đưa công cụ vào sử dụng lần đầu** |
| Đánh giá thấp công sức để **duy trì** testware tự động |
| Phụ thuộc quá nhiều vào công cụ, bỏ qua tư duy kiểm thử của con người |
| Phụ thuộc vào nhà cung cấp công cụ — họ ngừng hỗ trợ, bị mua lại, hoặc đóng mã nguồn |
| Quản lý phiên bản testware kém |
| Quan hệ giữa các công cụ phức tạp, khó tích hợp |

Điểm quan trọng mà đề thi hay nhấn: **tự động hoá không thay thế được tư duy kiểm thử**. Công cụ chỉ chạy những gì bạn bảo nó chạy; nó không nghĩ ra test case mới.

Và: công sức **bảo trì** test tự động thường bị đánh giá thấp nhất. Một bộ test tự động không được bảo trì sẽ nhanh chóng trở nên vô dụng.

## Liên hệ với các khoá khác trong trang này

Kiến thức chương này được áp dụng thực tế ở:

| Khoá | Công cụ |
| --- | --- |
| Web Automation | Playwright, pytest, GitHub Actions |
| Mobile Automation | Appium, Maestro |
| Kiểm thử hiệu năng | Apache JMeter |
| Manual Testing | Jira, Postman, DevTools |

Học xong lý thuyết chương này, làm một trong các khoá đó sẽ giúp bạn hiểu sâu hơn hẳn so với chỉ đọc syllabus.

## Điểm dễ sai trong bài thi

| Bẫy | Đúng là |
| --- | --- |
| "Tự động hoá luôn tiết kiệm chi phí" | Chi phí ban đầu và bảo trì có thể rất lớn |
| "Tự động hoá thay thế được tester" | Không — nó thay thế việc chạy lặp lại, không thay tư duy |
| "Test tự động không cần bảo trì" | Bảo trì là chi phí lớn nhất và hay bị đánh giá thấp |
| "Công cụ tự tìm ra defect mới" | Chỉ phát hiện những gì được lập trình để kiểm tra |

## Bài tập

1. Liệt kê 6 lợi ích và 7 rủi ro của tự động hoá theo syllabus.
2. Với một dự án bạn biết, nêu 3 rủi ro cụ thể nếu áp dụng tự động hoá.
3. Lập bảng các nhóm công cụ và điền tên công cụ bạn đã dùng hoặc biết.
4. Giải thích vì sao bảo trì testware tự động tốn công.
5. Làm các câu hỏi Chương 6 trong đề mẫu.
</script>

<script type="text/markdown" data-id="is-7" data-nav="Bài 7 · Thuật ngữ bắt buộc nhớ">
# Bài 7 — Thuật ngữ bắt buộc nhớ

**Mục tiêu:** đề thi bằng tiếng Anh và dùng đúng từ trong glossary. Nhớ sai một từ là mất một câu.

## Vì sao phần này quan trọng

Nhiều người học bằng tài liệu tiếng Việt, đến khi thi gặp từ tiếng Anh thì lúng túng. Tệ hơn, một số bản dịch tiếng Việt dùng từ không thống nhất — "defect" có nơi dịch "lỗi", có nơi "khuyết tật", có nơi "bug".

Cách an toàn: **nhớ từ tiếng Anh gốc**, hiểu nghĩa bằng tiếng Việt.

## Nhóm 1 — Khái niệm cốt lõi

| Tiếng Anh | Tiếng Việt | Ghi nhớ |
| --- | --- | --- |
| Error / Mistake | Sai sót | Do **con người** |
| Defect / Fault / Bug | Khuyết tật | Nằm **trong sản phẩm** |
| Failure | Thất bại | Xảy ra **khi chạy** |
| Root cause | Nguyên nhân gốc | Nguồn gốc sâu xa |
| Quality | Chất lượng | Mức đáp ứng yêu cầu |
| Quality assurance | Đảm bảo chất lượng | Tập trung **quy trình** |
| Test object | Đối tượng kiểm thử | Thứ đang được test |
| Test basis | Cơ sở kiểm thử | Tài liệu dùng để tạo test case |
| Test condition | Điều kiện kiểm thử | Khía cạnh cần kiểm |
| Test case | Ca kiểm thử | Tập input, điều kiện, kết quả mong đợi |
| Testware | Sản phẩm kiểm thử | Mọi thứ tạo ra trong quá trình test |
| Coverage | Độ phủ | Phần trăm đã được kiểm |
| Traceability | Khả năng truy vết | Liên kết test với yêu cầu |

## Nhóm 2 — Mức và loại kiểm thử

| Tiếng Anh | Tiếng Việt |
| --- | --- |
| Component testing | Kiểm thử thành phần |
| Component integration testing | Kiểm thử tích hợp thành phần |
| System testing | Kiểm thử hệ thống |
| System integration testing | Kiểm thử tích hợp hệ thống |
| Acceptance testing | Kiểm thử chấp nhận |
| Functional testing | Kiểm thử chức năng |
| Non-functional testing | Kiểm thử phi chức năng |
| Black-box testing | Kiểm thử hộp đen |
| White-box testing | Kiểm thử hộp trắng |
| Confirmation testing | Kiểm thử xác nhận |
| Regression testing | Kiểm thử hồi quy |
| Maintenance testing | Kiểm thử bảo trì |
| Impact analysis | Phân tích ảnh hưởng |

## Nhóm 3 — Kiểm thử tĩnh

| Tiếng Anh | Tiếng Việt | Nhớ kỹ |
| --- | --- | --- |
| Static testing | Kiểm thử tĩnh | Không chạy phần mềm |
| Dynamic testing | Kiểm thử động | Có chạy phần mềm |
| Review | Rà soát | — |
| Informal review | Rà soát không chính thức | Ít trang trọng nhất |
| Walkthrough | Duyệt qua | **Tác giả dẫn dắt** |
| Technical review | Rà soát kỹ thuật | Chuyên gia ngang hàng |
| Inspection | Thanh tra | **Trang trọng nhất** |
| Moderator / Facilitator | Người điều phối | — |
| Scribe | Người ghi chép | — |

## Nhóm 4 — Kỹ thuật thiết kế

| Tiếng Anh | Tiếng Việt |
| --- | --- |
| Equivalence partitioning | Phân vùng tương đương |
| Boundary value analysis | Phân tích giá trị biên |
| Decision table testing | Kiểm thử bảng quyết định |
| State transition testing | Kiểm thử chuyển trạng thái |
| Statement coverage | Độ phủ câu lệnh |
| Branch coverage | Độ phủ nhánh |
| Error guessing | Đoán lỗi |
| Exploratory testing | Kiểm thử thăm dò |
| Checklist-based testing | Kiểm thử theo danh sách kiểm |
| Test charter | Bản giao việc thăm dò |
| Acceptance criteria | Tiêu chí chấp nhận |

## Nhóm 5 — Quản lý

| Tiếng Anh | Tiếng Việt |
| --- | --- |
| Test plan | Kế hoạch kiểm thử |
| Entry criteria | Tiêu chí vào |
| Exit criteria | Tiêu chí ra |
| Definition of ready | Định nghĩa sẵn sàng |
| Definition of done | Định nghĩa hoàn thành |
| Project risk | Rủi ro dự án |
| Product risk | Rủi ro sản phẩm |
| Risk-based testing | Kiểm thử dựa trên rủi ro |
| Test monitoring | Giám sát kiểm thử |
| Test control | Điều khiển kiểm thử |
| Test progress report | Báo cáo tiến độ kiểm thử |
| Test completion report | Báo cáo hoàn tất kiểm thử |
| Configuration management | Quản lý cấu hình |
| Severity | Mức độ nghiêm trọng |
| Priority | Mức độ ưu tiên |

## Các cặp từ hay bị nhầm

| Cặp | Phân biệt |
| --- | --- |
| Error / Defect / Failure | Con người / Trong sản phẩm / Khi chạy |
| Verification / Validation | Xây đúng cách / Xây đúng thứ cần |
| QA / Testing | Quy trình / Sản phẩm |
| Severity / Priority | Nghiêm trọng kỹ thuật / Gấp về nghiệp vụ |
| Confirmation / Regression | Kiểm lỗi đã sửa / Kiểm chỗ khác không hỏng |
| Project risk / Product risk | Ảnh hưởng dự án / Ảnh hưởng chất lượng |
| Walkthrough / Inspection | Tác giả dẫn dắt / Trang trọng nhất |
| Static / Dynamic | Không chạy / Có chạy |
| Statement / Branch coverage | Câu lệnh / Nhánh, branch mạnh hơn |
| Test condition / Test case | Khía cạnh cần kiểm / Ca kiểm thử cụ thể |
| Entry / Exit criteria | Điều kiện bắt đầu / Điều kiện kết thúc |
| Alpha / Beta testing | Tại nơi phát triển / Tại nơi người dùng |

Bảng này nên học thuộc hoàn toàn. Mỗi cặp là một câu hỏi tiềm năng trong đề.

## Từ hay gây hiểu nhầm khi dịch

| Từ tiếng Anh | Hiểu nhầm phổ biến | Nghĩa đúng |
| --- | --- | --- |
| **Test case** | "Trường hợp test" chung chung | Có input, điều kiện thực thi, kết quả mong đợi cụ thể |
| **Test condition** | Nhầm với test case | Khía cạnh cần kiểm, chưa phải ca test cụ thể |
| **Testware** | Nhầm với công cụ test | Mọi sản phẩm sinh ra trong quá trình test |
| **Coverage** | Nhầm với "đã test xong" | Chỉ là tỷ lệ phần trăm đã kiểm |
| **Quality assurance** | Nhầm là "kiểm thử" | Là hoạt động về quy trình |
| **Review** | Nhầm là "đọc qua" | Hoạt động có quy trình, vai trò rõ ràng |

## Cách học thuộc

| Cách | Làm thế nào |
| --- | --- |
| Flashcard | Mặt trước tiếng Anh, mặt sau tiếng Việt kèm một câu ví dụ |
| Học theo cặp | Học các cặp dễ nhầm cùng lúc, so sánh trực tiếp |
| Tự giải thích | Nói to định nghĩa bằng lời của bạn, không đọc lại sách |
| Đọc glossary gốc | Mỗi ngày 20 từ, tra trên glossary chính thức của ISTQB |

Nguyên tắc: hiểu rồi mới thuộc. Học thuộc mà không hiểu thì gặp câu hỏi tình huống sẽ chọn sai.

## Bài tập

1. Làm 60 flashcard cho các thuật ngữ ở 5 nhóm trên.
2. Với 12 cặp dễ nhầm, viết ra một ví dụ phân biệt cho mỗi cặp.
3. Tự kiểm tra: che cột tiếng Việt, đọc từ tiếng Anh và nói nghĩa.
4. Tải glossary chính thức của ISTQB, tra 20 từ bạn chưa chắc.
5. Giải thích bằng lời của bạn: test condition khác test case thế nào.
</script>

<script type="text/markdown" data-id="is-8" data-nav="Bài 8 · Chiến thuật làm bài">
# Bài 8 — Chiến thuật làm bài thi

**Mục tiêu:** không mất điểm oan ở những câu mình thực ra biết.

## Quản lý thời gian

60 phút cho 40 câu, trung bình **90 giây một câu**. Nhưng không phải câu nào cũng tốn như nhau:

| Loại câu | Thời gian nên dùng |
| --- | --- |
| K1 — nhớ định nghĩa | 30–45 giây |
| K2 — hiểu, so sánh | 60–90 giây |
| K3 — tính toán | 2–3 phút |

Chiến thuật chia ba lượt:

| Lượt | Làm gì | Thời gian |
| --- | --- | --- |
| **1** | Làm hết câu dễ, câu khó đánh dấu bỏ qua | 25 phút |
| **2** | Quay lại làm câu đã đánh dấu | 25 phút |
| **3** | Rà lại toàn bộ, kiểm câu bỏ trống | 10 phút |

Nguyên tắc: **không ngồi quá 2 phút cho một câu ở lượt 1**. Câu K3 tính toán để dành lượt 2, khi đã biết mình còn bao nhiêu thời gian.

## Đọc câu hỏi đúng cách

**1. Đọc hết câu hỏi trước khi nhìn đáp án**

Nhìn đáp án sớm dễ bị dẫn dắt.

**2. Chú ý từ phủ định và từ giới hạn**

| Từ cần chú ý | Ý nghĩa |
| --- | --- |
| **NOT**, **EXCEPT** | Tìm đáp án **sai** |
| **BEST**, **MOST** | Có thể nhiều đáp án đúng, chọn cái đúng nhất |
| **ALWAYS**, **NEVER**, **ALL** | Thường là dấu hiệu đáp án sai — rất ít điều tuyệt đối trong kiểm thử |
| **CAN**, **MAY**, **TYPICALLY** | Thường là dấu hiệu đáp án đúng |

Đề thi ISTQB in hoa các từ phủ định. Đọc lướt bỏ sót chữ NOT là mất điểm dù biết kiến thức.

**3. Xác định câu hỏi thuộc chương nào**

Biết nó hỏi về chương nào giúp thu hẹp vùng kiến thức cần nhớ.

## Phương pháp loại trừ

Với câu không chắc, loại dần:

| Bước | Làm gì |
| --- | --- |
| 1 | Loại đáp án chứa từ tuyệt đối: always, never, all, every |
| 2 | Loại đáp án sai rõ ràng về kiến thức cơ bản |
| 3 | Loại đáp án không liên quan tới câu hỏi |
| 4 | So sánh 2 đáp án còn lại, chọn cái sát syllabus hơn |

Loại được 2 trong 4 đáp án là xác suất đúng đã lên 50%.

## Các dạng câu hỏi thường gặp

**Dạng 1 — Hỏi định nghĩa**

```text
Which of the following BEST describes a test condition?
```

Chọn đáp án dùng đúng từ ngữ của syllabus, không chọn đáp án nghe hợp lý nhưng diễn đạt khác.

**Dạng 2 — Tình huống minh hoạ nguyên lý**

```text
A team runs the same regression suite for 12 months and finds no new
defects. Which testing principle does this illustrate?
```

Đọc tình huống, xác định nguyên lý. Ở đây là nguyên lý 5 — tests wear out.

**Dạng 3 — Tính toán (K3)**

```text
An input field accepts values from 10 to 99. Using 2-value boundary
value analysis, how many test cases are needed?
```

Làm từng bước ra giấy nháp: biên dưới 10 → kiểm 9 và 10; biên trên 99 → kiểm 99 và 100. Tổng **4 test case**.

**Dạng 4 — Chọn nhiều đáp án**

```text
Which TWO of the following are product risks?
```

Đọc kỹ số lượng cần chọn. Chọn thiếu hoặc thừa đều không được điểm.

**Dạng 5 — Sắp xếp thứ tự**

```text
Which is the correct order of test activities?
```

Nhớ thứ tự chuẩn: planning → monitoring and control → analysis → design → implementation → execution → completion.

## Những lỗi hay mất điểm oan

| Lỗi | Cách tránh |
| --- | --- |
| Bỏ sót chữ NOT trong câu hỏi | Gạch chân từ phủ định khi đọc |
| Chọn đáp án "nghe hợp lý" thay vì đúng syllabus | Nhớ định nghĩa gốc, không suy diễn theo kinh nghiệm cá nhân |
| Đổi đáp án vào phút chót | Chỉ đổi khi tìm ra lý do rõ ràng; linh cảm đầu tiên thường đúng |
| Bỏ trống câu khó | **Luôn chọn một đáp án** — không bị trừ điểm khi sai |
| Tính nhầm K3 vì vội | Viết ra nháp, không tính nhẩm |
| Hết giờ còn 5 câu chưa đọc | Kiểm thời gian ở câu 20, phải còn ít nhất 30 phút |

Mục "bỏ trống" đáng nhấn mạnh: ISTQB **không trừ điểm cho câu sai**. Không biết thì đoán, xác suất 25% vẫn hơn 0%.

## Kinh nghiệm va chạm giữa lý thuyết và thực tế

Bạn đã đi làm sẽ gặp tình huống: đáp án theo syllabus khác với cách công ty bạn làm.

**Luôn chọn theo syllabus.** Đề thi kiểm tra bạn có nắm chuẩn ISTQB không, không kiểm tra thực tế công ty bạn.

Ví dụ: thực tế nhiều nơi tester làm cả component testing, nhưng syllabus ghi component testing thường do developer thực hiện. Trong bài thi, chọn theo syllabus.

## Trước ngày thi

| Việc | Khi nào |
| --- | --- |
| Làm đề mẫu lần cuối | 2 ngày trước, không phải tối hôm trước |
| Ôn lại bảng cặp dễ nhầm ở Bài 7 | Tối hôm trước, 30 phút |
| Kiểm tra kỹ thuật nếu thi online | Tối hôm trước: webcam, mạng, phòng yên tĩnh |
| Ngủ đủ | Quan trọng hơn ôn thêm 2 tiếng |
| Chuẩn bị giấy tờ tuỳ thân | Theo yêu cầu đơn vị tổ chức |

Thi online có giám sát thường yêu cầu: phòng một mình, bàn trống, webcam bật suốt, không được rời khỏi khung hình. Đọc kỹ quy định của đơn vị tổ chức trước.

## Bài tập

1. Làm một đề mẫu 40 câu trong đúng 60 phút, bấm giờ nghiêm túc.
2. Ghi lại các câu sai, phân loại theo chương để biết chỗ yếu.
3. Với mỗi câu sai, viết ra vì sao chọn sai và đáp án đúng dựa trên phần nào của syllabus.
4. Luyện riêng 10 câu K3 về EP, BVA, decision table, coverage.
5. Làm đề lần hai sau 3 ngày, so sánh điểm.
</script>

<script type="text/markdown" data-id="is-9" data-nav="Bài 9 · Kế hoạch ôn 4 tuần">
# Bài 9 — Kế hoạch ôn 4 tuần và tự kiểm tra

**Mục tiêu:** có lịch cụ thể để đi từ bắt đầu đến sẵn sàng thi.

## Giả định

Kế hoạch này dành cho người **đã có nền tảng manual testing** (đã học khoá Manual Testing trong trang này hoặc đã đi làm), dành được **1–1,5 giờ mỗi ngày**.

Chưa có nền tảng thì học khoá Manual Testing trước, rồi quay lại đây.

## Tuần 1 — Nền tảng

| Ngày | Nội dung | Thời gian |
| --- | --- | --- |
| 1 | Bài 0 — tổng quan kỳ thi, tải syllabus, làm đề mẫu lần 1 để biết điểm xuất phát | 1,5 giờ |
| 2 | Chương 1 phần 1.1–1.3 | 1 giờ |
| 3 | Chương 1 phần 1.4–1.5, học thuộc 7 nguyên lý | 1 giờ |
| 4 | Chương 2 phần 2.1 | 1 giờ |
| 5 | Chương 2 phần 2.2–2.3 | 1 giờ |
| 6 | Chương 3 trọn vẹn | 1 giờ |
| 7 | Ôn lại Chương 1–3, làm 30 câu luyện tập | 1,5 giờ |

Đề mẫu lần 1 ở ngày đầu rất quan trọng: nó cho bạn con số xuất phát để so sánh, và cho biết dạng câu hỏi thực tế trông thế nào.

## Checklist sẵn sàng thi

Trả lời được hết thì đăng ký thi:

**Chương 1**
- [ ] Nêu được 7 nguyên lý và một ví dụ cho mỗi cái
- [ ] Phân biệt error, defect, failure, root cause
- [ ] Liệt kê 7 hoạt động kiểm thử theo đúng thứ tự
- [ ] Giải thích traceability và lợi ích

**Chương 2**
- [ ] Nêu 5 mức kiểm thử và test basis của từng mức
- [ ] Phân biệt 4 hình thức acceptance testing
- [ ] Phân biệt confirmation và regression testing
- [ ] Giải thích shift-left và cho 3 ví dụ

**Chương 3**
- [ ] Phân biệt static và dynamic testing
- [ ] Nêu 4 loại review và đặc điểm từng loại
- [ ] Liệt kê 6 vai trò trong review
- [ ] Nêu 5 yếu tố thành công của review

**Chương 4**
- [ ] Tính được số test case cho EP và BVA (2-value và 3-value)
- [ ] Lập được bảng quyết định và tính số cột
- [ ] Vẽ được state diagram và liệt kê các mức độ phủ
- [ ] Tính được statement coverage và branch coverage
- [ ] Giải thích vì sao branch coverage mạnh hơn statement coverage
- [ ] Nêu INVEST và 3C

**Chương 5**
- [ ] Thuộc công thức three-point estimation
- [ ] Phân biệt project risk và product risk
- [ ] Vẽ và giải thích test pyramid
- [ ] Nêu 4 testing quadrants
- [ ] Phân biệt test progress report và test completion report

**Chương 6**
- [ ] Nêu 6 lợi ích và 7 rủi ro của tự động hoá
- [ ] Giải thích vì sao bảo trì testware là chi phí lớn

**Chung**
- [ ] Làm đề mẫu đạt trên 80% ít nhất 2 lần
- [ ] Thuộc 12 cặp thuật ngữ dễ nhầm
- [ ] Làm đủ 40 câu trong 60 phút không bị thiếu thời gian

    });
    if (current) {
      var isDone = done.indexOf(current) > -1;
      doneBtn.textContent = isDone ? "Đã học ✓" : "Đánh dấu đã học";
      doneBtn.classList.toggle("is-done", isDone);
    }
  }

  function closeNav() {
    document.body.classList.remove("nav-open");
    document.getElementById("navToggle").setAttribute("aria-expanded", "false");
  }

  function go(id, fromClick) {
    if (!blocks[id] || !courseOf[id]) { showHub(); return; }
    setCourse(courseOf[id]);
    hub.hidden = true;
    document.getElementById("articleWrap").hidden = false;
    doneBtn.hidden = false;
    document.getElementById("backBtn").hidden = false;
    current = id;
    content.innerHTML = marked.parse(blocks[id]);
    // chuyển bảng vào khung cuộn riêng để trang không bị tràn ngang
    Array.prototype.forEach.call(content.querySelectorAll("table"), function (t) {
      if (t.parentNode.classList && t.parentNode.classList.contains("table-scroll")) return;
      var w = document.createElement("div");
      w.className = "table-scroll";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
    Array.prototype.forEach.call(content.querySelectorAll("pre code"), function (c) {
      try { window.hljs && hljs.highlightElement(c); } catch (e) {}
    });
    var g = groupOf[id];
    crumb.textContent = g ? course.ten + " · " + g.t : course.ten;
    if (g && g._el && !g._el.classList.contains("open")) {
      g._el.classList.add("open");
      g._el._btn.setAttribute("aria-expanded", "true");
    }
    order.forEach(function (x) { if (itemEls[x]) itemEls[x].classList.toggle("active", x === id); });
    var i = order.indexOf(id);
    pager.innerHTML = "";
    if (i > 0) pager.appendChild(pagerLink(order[i - 1], "prev", "Bài trước"));
    if (i < order.length - 1) pager.appendChild(pagerLink(order[i + 1], "next", "Bài tiếp"));
    try { localStorage.setItem(LS_LAST, id); } catch (e) {}
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    paintProgress();
    closeNav();
    if (fromClick) {
      document.getElementById("main").scrollTop = 0;
      itemEls[id].scrollIntoView({ block: "nearest" });
    }
  }

  function pagerLink(id, cls, dir) {
    var a = document.createElement("a");
    a.href = "#" + id;
    a.className = cls;
    a.innerHTML = '<span class="dir">' + dir + '</span><span class="nm">' + titles[id] + "</span>";
    a.addEventListener("click", function (e) { e.preventDefault(); go(id, true); });
    return a;
  }

  doneBtn.addEventListener("click", function () {
    if (!current) return;
    var i = done.indexOf(current);
    if (i > -1) done.splice(i, 1); else done.push(current);
    writeDone(done);
    paintProgress();
  });

  document.getElementById("navToggle").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("scrim").addEventListener("click", closeNav);
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNav(); });
  document.getElementById("backBtn").addEventListener("click", showHub);

  function dieuHuong(key, fromClick) {
    if (!key || key === "tat-ca-khoa-hoc") { showHub(); return; }
    if (blocks[key]) { go(key, fromClick); return; }
    if (courseById[key] && courseById[key].order.length) { go(courseById[key].order[0], fromClick); return; }
    showHub();
  }

  window.addEventListener("hashchange", function () {
    var key = location.hash.slice(1);
    if (key !== current) dieuHuong(key, true);
  });

  var start = location.hash.slice(1);
  if (!start) {
    start = "tat-ca-khoa-hoc";
  }
  dieuHuong(start, false);
})();
</script>

</body>
</html>
