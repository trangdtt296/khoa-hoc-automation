# Bài 0 — Cài đặt môi trường và chạy file Python đầu tiên

**Mục tiêu:** máy có Python, có VS Code, và bạn chạy được một file `.py` in ra dòng chữ đầu tiên.

Trước khi bắt đầu, tạo một thư mục học tập, ví dụ `D:\hoc-automation`, và lưu mọi bài trong đó. Mỗi bài khoảng 1–2 giờ: đọc lý thuyết, gõ lại code mẫu bằng tay (không copy), rồi làm bài tập.

## 1. Cài Python

Vào `python.org/downloads`, tải bản mới nhất (3.12 trở lên).

- **Windows:** khi chạy bộ cài, **nhất định tick ô "Add python.exe to PATH"** ở đáy cửa sổ rồi mới bấm Install Now. Bỏ bước này là lỗi hay gặp nhất của người mới.
- **macOS:** tải file `.pkg` và cài bình thường.

## 2. Kiểm tra Python đã cài đúng

Mở **Terminal** (macOS) hoặc **Command Prompt / PowerShell** (Windows), gõ:

```bash
python --version
```

Nếu thấy `Python 3.12.x` là thành công. Trên macOS thường phải gõ `python3 --version`. Windows báo `'python' is not recognized` nghĩa là chưa tick PATH — cài lại và tick ô đó.

## 3. Cài VS Code

Tải tại `code.visualstudio.com`, cài xong mở lên, vào biểu tượng **Extensions** (4 ô vuông bên trái), tìm và cài extension **Python** của Microsoft.

## 4. Chạy chương trình đầu tiên

Mở thư mục học tập bằng VS Code (File → Open Folder), tạo file `bai0.py` và gõ:

```python
print("Xin chào, tôi bắt đầu học automation test!")
print("1 + 1 =", 1 + 1)
```

Lưu file (Ctrl+S / Cmd+S), rồi bấm nút **Run** hình tam giác ▶ góc trên phải. Kết quả hiện ở khung Terminal phía dưới:

```text
Xin chào, tôi bắt đầu học automation test!
1 + 1 = 2
```

Cách thứ hai, chạy bằng lệnh trong Terminal (quan trọng, về sau chạy test đều dùng cách này):

```bash
python bai0.py
```

## 5. Hai khái niệm cần phân biệt

| Thứ | Là gì | Dùng khi nào |
| --- | --- | --- |
| File `.py` | File chứa code bạn viết | Luôn luôn |
| Terminal | Nơi gõ lệnh để chạy code, cài thư viện | Khi cài đặt, khi chạy test |

## Bài tập

1. In ra 3 dòng: tên bạn, vị trí muốn ứng tuyển, và câu "Ngày 1/30".
2. Sửa `1 + 1` thành `2 * 7` và chạy lại để thấy kết quả đổi.
3. Cố tình gõ sai `print("hello"` (thiếu dấu đóng ngoặc), chạy và đọc thông báo lỗi `SyntaxError`. Đọc lỗi là kỹ năng quan trọng nhất khi học code.

<script type="text/markdown" data-id="bai-1" data-nav="Bài 1 · Biến, kiểu dữ liệu, input">
# Bài 1 — Biến, kiểu dữ liệu, print và input

**Mục tiêu:** lưu được dữ liệu vào biến, biết 4 kiểu dữ liệu cơ bản, nhận dữ liệu từ người dùng.

## Biến là gì

Biến là cái hộp có tên, dùng để lưu một giá trị. Dấu `=` nghĩa là "gán vào", không phải "bằng" như toán học.

```python
test_case_id = "TC_001"
so_buoc = 5
diem = 9.5
da_pass = True

print(test_case_id)
print(so_buoc)
```

Quy tắc đặt tên biến: chỉ dùng chữ không dấu, số và dấu `_`; không bắt đầu bằng số; viết chữ thường, nối bằng `_` (`ten_dang_nhap`, không phải `TenDangNhap`).

## 4 kiểu dữ liệu phải nắm

| Kiểu | Tên | Ví dụ | Dùng cho |
| --- | --- | --- | --- |
| `str` | Chuỗi | `"TC_001"` | Tên, mô tả, URL, username |
| `int` | Số nguyên | `5` | Số lượng, số bước |
| `float` | Số thực | `9.5` | Giá tiền, thời gian chạy |
| `bool` | Đúng/sai | `True`, `False` | Test pass hay fail |

Muốn biết một biến thuộc kiểu gì, dùng `type()`:

```python
print(type(so_buoc))     # <class 'int'>
print(type(da_pass))     # <class 'bool'>
```

`#` là chú thích — Python bỏ qua, chỉ để người đọc hiểu.

## Chuyển kiểu

Số và chuỗi không cộng với nhau được. Phải chuyển kiểu trước:

```python
so = "10"            # đây là chuỗi, không phải số
print(int(so) + 5)   # 15
print(str(5) + " bước")  # "5 bước"
```

## input() — nhận dữ liệu từ người dùng

`input()` **luôn trả về chuỗi**, dù người dùng gõ số.

```python
ten = input("Tên bạn: ")
tuoi = int(input("Tuổi bạn: "))   # phải bọc int() ở ngoài

print("Chào", ten)
print("Sang năm bạn", tuoi + 1, "tuổi")
```

## Lỗi hay gặp ở bài này

| Thông báo lỗi | Nghĩa là | Cách sửa |
| --- | --- | --- |
| `NameError: name 'ten' is not defined` | Dùng biến chưa tạo, hoặc gõ sai tên biến | Kiểm tra chính tả và chữ hoa chữ thường: `Ten` khác `ten` |
| `TypeError: can only concatenate str (not "int") to str` | Cộng chuỗi với số | Bọc `str()` quanh số, hoặc dùng dấu phẩy trong `print` |
| `ValueError: invalid literal for int()` | `int()` nhận chuỗi không phải số | Người dùng gõ chữ vào ô số; Bài 9 sẽ học cách bắt lỗi này |
| `SyntaxError: unterminated string literal` | Thiếu dấu nháy đóng | Đếm lại số dấu `"` trên dòng đó |
| In ra `<function ...>` thay vì giá trị | Quên cặp ngoặc khi gọi hàm | `type(x)` chứ không phải `type` |

Cách đọc lỗi Python: luôn đọc **dòng cuối cùng** trước — đó là tên lỗi và mô tả. Dòng ngay trên nó cho biết lỗi ở file nào, dòng số bao nhiêu.

## Bài tập

1. Tạo 4 biến lưu thông tin một test case: mã, tên, số bước, đã pass hay chưa. In tất cả ra.
2. Viết chương trình hỏi số test case pass và số test case fail, rồi in ra tổng số test case.
3. Thử `print("5" + 5)` và đọc lỗi `TypeError`. Sau đó sửa cho đúng.
</script>

<script type="text/markdown" data-id="bai-2" data-nav="Bài 2 · Chuỗi và f-string">
# Bài 2 — Chuỗi (string) và f-string

**Mục tiêu:** ghép, cắt, so sánh chuỗi. Đây là kiểu dữ liệu bạn dùng nhiều nhất khi viết automation test, vì mọi thứ hiển thị trên web đều là chuỗi.

## f-string — cách ghép chuỗi duy nhất bạn cần

Thêm `f` trước dấu ngoặc kép, rồi đặt tên biến trong `{}`:

```python
ma_tc = "TC_001"
ket_qua = "Pass"

print(f"Test case {ma_tc} có kết quả: {ket_qua}")
# Test case TC_001 có kết quả: Pass
```

Tính toán ngay trong `{}` cũng được:

```python
pass_count = 18
total = 20
print(f"Tỷ lệ pass: {pass_count / total * 100}%")      # 90.0%
print(f"Tỷ lệ pass: {pass_count / total * 100:.1f}%")  # 90.0% (làm tròn 1 chữ số)
```

## Các hàm xử lý chuỗi hay dùng khi test

```python
s = "  Đăng nhập Thành Công  "

print(s.strip())        # "Đăng nhập Thành Công" — cắt khoảng trắng 2 đầu
print(s.lower())        # chữ thường hết
print(s.upper())        # CHỮ IN HẾT
print(len(s.strip()))   # 21 — đếm số ký tự
print(s.replace("Thành Công", "Thất Bại"))
```

`strip()` cực kỳ quan trọng: text lấy từ web rất hay có khoảng trắng thừa, làm test fail oan.

## Kiểm tra nội dung chuỗi

```python
thong_bao = "Đăng nhập thành công"

print("thành công" in thong_bao)              # True
print(thong_bao.startswith("Đăng nhập"))      # True
print(thong_bao == "Đăng nhập thành công")    # True — so sánh chính xác
```

Sau này khi viết assertion, bạn chỉ dùng đúng 2 kiểu này: `in` (chứa một đoạn) và `==` (giống hoàn toàn).

## Cắt chuỗi theo vị trí

Ký tự đầu tiên có số thứ tự là **0**, không phải 1.

```python
ma = "TC_001_Login"
print(ma[0])        # T
print(ma[0:2])      # TC — từ 0 đến trước 2
print(ma[-5:])      # Login — 5 ký tự cuối
print(ma.split("_"))  # ['TC', '001', 'Login']
```

`split()` biến chuỗi thành list — rất hay dùng để đọc dữ liệu test từ file CSV.

## Bài tập

1. Có `url = "https://demo.playwright.dev/todomvc"`. In ra URL ở dạng chữ thường và kiểm tra nó có chứa `"playwright"` hay không.
2. Nhập tên và email, in ra: `Họ tên: ... | Email: ...` bằng f-string.
3. Có `text = "  Pass  "`. So sánh `text == "Pass"` và `text.strip() == "Pass"`, giải thích vì sao kết quả khác nhau.
4. Từ `"TC_015_Checkout"`, tách ra riêng số `015` và tên `Checkout`.
</script>

<script type="text/markdown" data-id="bai-3" data-nav="Bài 3 · Toán tử và if/else">
# Bài 3 — Toán tử và câu điều kiện if / elif / else

**Mục tiêu:** cho chương trình tự ra quyết định. Đây chính là nền tảng của việc "test pass hay fail".

## Toán tử so sánh

| Toán tử | Ý nghĩa | Ví dụ trả về True |
| --- | --- | --- |
| `==` | Bằng nhau | `5 == 5` |
| `!=` | Khác nhau | `5 != 3` |
| `>` `<` | Lớn hơn, nhỏ hơn | `7 > 3` |
| `>=` `<=` | Lớn/nhỏ hơn hoặc bằng | `5 >= 5` |
| `in` | Có chứa | `"ab" in "abc"` |

Lưu ý: `=` là gán giá trị, `==` mới là so sánh. Lẫn hai cái này là lỗi phổ biến nhất của người mới.

## if / elif / else

Python dùng **dấu thụt lề** (4 khoảng trắng) để biết câu lệnh nào thuộc `if`. Thiếu thụt lề là lỗi `IndentationError`.

```python
so_fail = 3

if so_fail == 0:
    print("Tất cả test đều pass, có thể release")
elif so_fail <= 5:
    print("Có lỗi nhỏ, báo dev sửa")
else:
    print("Quá nhiều lỗi, dừng test")
```

Cách đọc: kiểm tra `if` trước; sai thì xuống `elif`; sai hết thì chạy `else`. Chỉ **một** nhánh được chạy.

## Kết hợp nhiều điều kiện: and, or, not

```python
da_dang_nhap = True
co_quyen_admin = False

if da_dang_nhap and co_quyen_admin:
    print("Vào được trang quản trị")

if da_dang_nhap or co_quyen_admin:
    print("Vào được trang chủ")

if not da_dang_nhap:
    print("Yêu cầu đăng nhập")
```

- `and`: cả hai đều đúng.
- `or`: chỉ cần một cái đúng.
- `not`: đảo ngược.

## Ví dụ gần với công việc test

```python
thong_bao_thuc_te = "Đăng nhập thành công"
thong_bao_mong_doi = "Đăng nhập thành công"

if thong_bao_thuc_te == thong_bao_mong_doi:
    print("TC_001: PASS")
else:
    print("TC_001: FAIL")
    print(f"  Mong đợi: {thong_bao_mong_doi}")
    print(f"  Thực tế:  {thong_bao_thuc_te}")
```

Đây chính là ý tưởng của mọi công cụ assertion, bao gồm `expect()` của Playwright ở Bài 14.

## Lỗi hay gặp ở bài này

| Thông báo lỗi | Nghĩa là | Cách sửa |
| --- | --- | --- |
| `IndentationError: expected an indented block` | Sau `if ...:` không thụt lề dòng tiếp theo | Thụt vào 4 khoảng trắng (bấm Tab một lần trong VS Code) |
| `IndentationError: unindent does not match` | Trộn Tab và dấu cách trong cùng một khối | Xóa hết thụt lề dòng đó rồi gõ lại |
| `SyntaxError: expected ':'` | Thiếu dấu hai chấm cuối dòng `if` / `elif` / `else` | Thêm `:` vào cuối dòng |
| `SyntaxError: invalid syntax` tại dòng `if a = 5:` | Dùng `=` thay vì `==` | `=` là gán, `==` mới là so sánh |
| Chương trình chạy nhưng nhánh sai luôn được chọn | So sánh chuỗi có khoảng trắng thừa | Dùng `.strip()` trước khi so sánh (Bài 2) |

Mẹo: VS Code tự thụt lề sau khi bạn gõ `:` và bấm Enter. Nếu nó không tự thụt, rất có thể bạn quên dấu hai chấm.

## Bài tập

1. Nhập điểm từ 0–10, in ra: dưới 5 "Không đạt", từ 5 đến dưới 8 "Đạt", từ 8 trở lên "Tốt".
2. Nhập username và password. Nếu đúng `admin` / `admin123` thì in "Đăng nhập thành công", sai thì in "Sai tài khoản hoặc mật khẩu".
3. Nhập mật khẩu. Báo lỗi nếu ngắn hơn 8 ký tự; báo lỗi nếu không chứa số; còn lại thì hợp lệ. (Gợi ý: `any(c.isdigit() for c in mk)` kiểm tra có chữ số — chưa hiểu thì tạm copy, Bài 6 sẽ rõ.)
</script>

<script type="text/markdown" data-id="bai-4" data-nav="Bài 4 · List và tuple">
# Bài 4 — List và tuple

**Mục tiêu:** lưu nhiều giá trị trong một biến. Trong automation test, list dùng để lưu danh sách tài khoản test, danh sách sản phẩm lấy từ trang web, danh sách lỗi.

## List — danh sách có thể sửa

```python
test_cases = ["TC_001", "TC_002", "TC_003"]

print(test_cases[0])      # TC_001 — phần tử đầu tiên, đếm từ 0
print(test_cases[-1])     # TC_003 — phần tử cuối
print(len(test_cases))    # 3 — số phần tử
```

Thêm, sửa, xóa:

```python
test_cases.append("TC_004")        # thêm vào cuối
test_cases.insert(0, "TC_000")     # chèn vào vị trí 0
test_cases.remove("TC_002")        # xóa theo giá trị
test_cases[1] = "TC_001_updated"   # sửa theo vị trí

print(test_cases)
```

Kiểm tra và sắp xếp:

```python
print("TC_001" in test_cases)   # True / False
diem = [7, 9, 5, 10]
print(sorted(diem))             # [5, 7, 9, 10]
print(max(diem), min(diem), sum(diem))   # 10 5 31
```

List có thể chứa nhiều list — đây chính là cách lưu bộ dữ liệu test ở Bài 18:

```python
du_lieu_login = [
    ["admin", "admin123", "thành công"],
    ["admin", "sai_pass", "thất bại"],
    ["", "", "thất bại"],
]
print(du_lieu_login[1][0])   # admin — dòng 1, cột 0
```

## Tuple — danh sách không sửa được

Dùng dấu ngoặc tròn. Sửa tuple sẽ báo lỗi `TypeError`. Dùng cho dữ liệu cố định như toạ độ, kích thước màn hình.

```python
kich_thuoc = (1920, 1080)
rong, cao = kich_thuoc      # tách ra 2 biến cùng lúc
print(rong, cao)            # 1920 1080
```

## So sánh nhanh

| | List | Tuple |
| --- | --- | --- |
| Viết | `[1, 2, 3]` | `(1, 2, 3)` |
| Sửa được | Có | Không |
| Dùng khi | Dữ liệu thay đổi | Dữ liệu cố định |

## Bài tập

1. Tạo list 5 mã test case. In phần tử đầu, phần tử cuối và tổng số phần tử.
2. Thêm 1 test case mới, xóa 1 cái, rồi in list sau khi sửa.
3. Có `thoi_gian = [12, 8, 20, 15, 9]` (giây chạy mỗi test). In test chạy lâu nhất, nhanh nhất và tổng thời gian.
4. Tạo list lồng gồm 3 bộ dữ liệu đăng ký (email, mật khẩu, kết quả mong đợi) và in ra bộ thứ hai.
</script>

<script type="text/markdown" data-id="bai-5" data-nav="Bài 5 · Dict và set">
# Bài 5 — Dict và set

**Mục tiêu:** lưu dữ liệu theo cặp **khoá — giá trị**. Dict là cách biểu diễn một test case hoàn chỉnh, và cũng là định dạng dữ liệu JSON mà API trả về.

## Dict — từ điển dữ liệu

```python
test_case = {
    "ma": "TC_001",
    "ten": "Đăng nhập thành công",
    "muc_do": "High",
    "ket_qua": "Pass",
}

print(test_case["ten"])        # Đăng nhập thành công
print(test_case["muc_do"])     # High
```

Khi so với list: list truy cập bằng số thứ tự (`[0]`), dict truy cập bằng tên khoá (`["ma"]`) — dễ đọc hơn nhiều.

Thêm, sửa, xóa:

```python
test_case["nguoi_test"] = "Trang"   # thêm khoá mới
test_case["ket_qua"] = "Fail"        # sửa giá trị cũ
del test_case["muc_do"]              # xóa một khoá
```

Truy cập an toàn bằng `get()` — khoá không tồn tại thì trả về giá trị mặc định thay vì báo lỗi `KeyError`:

```python
print(test_case.get("ghi_chu"))              # None
print(test_case.get("ghi_chu", "không có"))  # không có
```

Xem tất cả khoá và giá trị:

```python
print(test_case.keys())     # dict_keys(['ma', 'ten', ...])
print(test_case.values())
print(test_case.items())    # từng cặp khoá–giá trị
```

## List của dict — cấu trúc dùng nhiều nhất trong thực tế

```python
bao_cao = [
    {"ma": "TC_001", "ket_qua": "Pass", "giay": 12},
    {"ma": "TC_002", "ket_qua": "Fail", "giay": 8},
    {"ma": "TC_003", "ket_qua": "Pass", "giay": 20},
]

print(bao_cao[1]["ket_qua"])   # Fail
```

Đây chính là hình dạng của một file JSON. Bài 10 sẽ dùng cấu trúc này để làm báo cáo test.

## Set — tập hợp không trùng lặp

Set tự loại bỏ giá trị trùng. Dùng khi cần lọc trùng, ví dụ lọc danh sách lỗi bị lặp.

```python
loi = ["Lỗi A", "Lỗi B", "Lỗi A", "Lỗi C", "Lỗi B"]
print(set(loi))         # {'Lỗi A', 'Lỗi B', 'Lỗi C'}
print(len(set(loi)))    # 3 lỗi khác nhau
```

## Tổng kết 4 kiểu chứa dữ liệu

| Kiểu | Viết | Đặc điểm |
| --- | --- | --- |
| List | `["a", "b"]` | Có thứ tự, sửa được, cho trùng |
| Tuple | `("a", "b")` | Có thứ tự, không sửa được |
| Dict | `{"k": "v"}` | Truy cập bằng khoá |
| Set | `{"a", "b"}` | Không trùng, không thứ tự |

## Bài tập

1. Tạo dict mô tả một bug: mã, tiêu đề, mức độ, trạng thái, người phát hiện. In từng thông tin.
2. Đổi trạng thái bug thành `"Closed"` và thêm khoá `"ngay_dong"`.
3. Dùng `get()` lấy khoá `"mo_ta"` chưa tồn tại, hiển thị `"Chưa có mô tả"`.
4. Tạo list gồm 3 dict test case. In mã của test case thứ ba và kết quả của test case đầu tiên.
</script>

<script type="text/markdown" data-id="bai-6" data-nav="Bài 6 · Vòng lặp for và while">
# Bài 6 — Vòng lặp for và while

**Mục tiêu:** lặp lại một việc nhiều lần. Trong automation, vòng lặp dùng để chạy một test với nhiều bộ dữ liệu, hoặc kiểm tra tất cả sản phẩm trên một trang.

## for — lặp qua từng phần tử

```python
test_cases = ["TC_001", "TC_002", "TC_003"]

for tc in test_cases:
    print(f"Đang chạy {tc}...")
```

`tc` là tên bạn tự đặt, mỗi vòng nó nhận một giá trị trong list. Nhớ thụt lề 4 khoảng trắng cho phần thân vòng lặp.

Cần cả số thứ tự thì dùng `enumerate()`:

```python
for i, tc in enumerate(test_cases, start=1):
    print(f"{i}. {tc}")
# 1. TC_001
# 2. TC_002
# 3. TC_003
```

## Lặp một số lần nhất định: range()

```python
for lan in range(3):        # 0, 1, 2 — ba lần
    print(f"Thử lại lần {lan + 1}")

for so in range(1, 6):      # 1, 2, 3, 4, 5
    print(so)
```

`range(3)` cho 0, 1, 2 — **không có số 3**. Luôn dừng trước số cuối.

## Lặp qua dict

```python
test_case = {"ma": "TC_001", "ket_qua": "Pass"}

for khoa, gia_tri in test_case.items():
    print(f"{khoa}: {gia_tri}")
```

## Lặp qua list của dict — ví dụ thực tế

```python
bao_cao = [
    {"ma": "TC_001", "ket_qua": "Pass"},
    {"ma": "TC_002", "ket_qua": "Fail"},
    {"ma": "TC_003", "ket_qua": "Pass"},
]

so_pass = 0
for tc in bao_cao:
    if tc["ket_qua"] == "Pass":
        so_pass = so_pass + 1
    else:
        print(f"Cần xem lại: {tc['ma']}")

print(f"Pass {so_pass}/{len(bao_cao)}")
```

Lưu ý dấu nháy: trong f-string dùng ngoặc kép `"` thì bên trong `{}` phải dùng ngoặc đơn `'`.

## while — lặp đến khi điều kiện sai

```python
so_lan_thu = 0
da_thanh_cong = False

while so_lan_thu < 3 and not da_thanh_cong:
    so_lan_thu += 1              # += nghĩa là cộng thêm vào chính nó
    print(f"Thử lần {so_lan_thu}")
    if so_lan_thu == 2:
        da_thanh_cong = True

print("Kết thúc")
```

Cảnh báo: nếu điều kiện không bao giờ sai, chương trình chạy mãi không dừng. Bấm `Ctrl + C` trong Terminal để ngừa lại.

## break và continue

```python
for tc in ["TC_001", "TC_002", "TC_003", "TC_004"]:
    if tc == "TC_002":
        continue          # bỏ qua vòng này, chạy tiếp vòng sau
    if tc == "TC_004":
        break             # thoát hẳn vòng lặp
    print(tc)
# TC_001
# TC_003
```

## Lỗi hay gặp ở bài này

| Hiện tượng | Nghĩa là | Cách sửa |
| --- | --- | --- |
| Chương trình chạy mãi không dừng | Điều kiện `while` không bao giờ sai | Bấm `Ctrl + C` để dừng; kiểm tra biến đếm có tăng trong vòng lặp không |
| `IndexError: list index out of range` | Lấy phần tử vượt quá số phần tử có | List 3 phần tử thì chỉ số lớn nhất là 2, không phải 3 |
| Vòng lặp chỉ chạy 1 lần | Câu lệnh nằm ngoài vòng lặp do thiếu thụt lề | Kiểm tra dòng đó có thụt vào dưới `for` không |
| `SyntaxError` tại f-string | Dùng cùng loại dấu nháy trong và ngoài `{}` | Ngoài dùng `"`, trong `{}` dùng `'` |
| `range(1, 5)` thiếu mất số 5 | `range` luôn dừng trước số cuối | Muốn đến 5 thì viết `range(1, 6)` |

# Bài 8 — Class và OOP cơ bản

**Mục tiêu:** hiểu class đủ để viết được Page Object Model ở Bài 17. Đây là bài quan trọng nhất của phần Python — đừng bỏ qua.

## Ý tưởng

Hàm đóng gói **một việc**. Class đóng gói **dữ liệu + nhiều việc liên quan đến nhau**. Ví dụ: một trang đăng nhập có dữ liệu (ô username, ô password, nút đăng nhập) và các việc (nhập tên, nhập mật khẩu, bấm đăng nhập). Gộp cả hai vào một class `LoginPage`.

## Class đầu tiên

```python
class TestCase:
    def __init__(self, ma, ten):
        self.ma = ma
        self.ten = ten
        self.ket_qua = "Chưa chạy"

    def chay(self):
        print(f"Đang chạy {self.ma}: {self.ten}")
        self.ket_qua = "Pass"

    def in_ket_qua(self):
        print(f"{self.ma} → {self.ket_qua}")


tc1 = TestCase("TC_001", "Đăng nhập thành công")
tc1.chay()
tc1.in_ket_qua()        # TC_001 → Pass

tc2 = TestCase("TC_002", "Đăng nhập sai mật khẩu")
tc2.in_ket_qua()        # TC_002 → Chưa chạy
```

## Giải thích từng từ khoá

| Từ khoá | Nghĩa là gì |
| --- | --- |
| `class TestCase:` | Định nghĩa một khuôn mẫu tên TestCase. Tên class viết hoa chữ đầu mỗi từ |
| `__init__` | Hàm tự chạy khi bạn tạo đối tượng mới; dùng để gán dữ liệu ban đầu |
| `self` | Chính đối tượng đó. Tham số đầu tiên của mọi hàm trong class |
| `self.ma` | Thuộc tính — dữ liệu riêng của đối tượng |
| `def chay(self)` | Phương thức — hàm thuộc class |
| `tc1 = TestCase(...)` | Tạo một đối tượng từ khuôn mẫu |

`tc1` và `tc2` là hai đối tượng độc lập: sửa `tc1` không ảnh hưởng `tc2`.

## Ví dụ giống Page Object Model thật

Chưa dùng Playwright, chỉ để thấy cấu trúc:

```python
class LoginPage:
    def __init__(self, url):
        self.url = url
        self.o_username = "#username"
        self.o_password = "#password"
        self.nut_dang_nhap = "#login-btn"

    def mo_trang(self):
        print(f"Mở {self.url}")

        print(f"Nhập '{mat_khau}' vào {self.o_password}")
        print(f"Bấm {self.nut_dang_nhap}")


login = LoginPage("https://example.com/login")
login.mo_trang()
login.dang_nhap("admin", "admin123")
```

Ở Bài 17 bạn sẽ thay các câu `print` này bằng lệnh Playwright thật. Cấu trúc vẫn giống y nguyên.

Mỗi project nên có thư viện riêng để không đụng nhau. Làm một lần cho mỗi project:

Không có `try`, gặp lỗi là chương trình dừng ngay, các test sau không chạy.

Một vài tên lỗi hay gặp: `ValueError` (sai kiểu giá trị), `KeyError` (khoá dict không tồn tại), `IndexError` (vượt qua số phần tử list), `FileNotFoundError` (không tìm thấy file).

# Bài 10 — Ôn tập Python: mini project quản lý test case

**Mục tiêu:** dùng mọi thứ từ Bài 1–9 trong một chương trình thật. Làm được bài này là bạn đủ Python để học Playwright.

## Yêu cầu

Viết chương trình `quan_ly_test.py`:

1. Lưu danh sách test case (mã, tên, mức độ, kết quả).
2. Thêm test case mới.
3. Cập nhật kết quả Pass/Fail cho một mã test case.
4. In báo cáo: tổng số, số pass, số fail, tỷ lệ pass.
5. Lưu báo cáo ra file `bao_cao.txt`.

## Code tham khảo

Đọc hiểu rồi tự gõ lại, đừng copy.

```python
from datetime import datetime


class TestCase:
    def __init__(self, ma, ten, muc_do="Medium"):
        self.ma = ma
        self.ten = ten
        self.muc_do = muc_do
        self.ket_qua = "Chưa chạy"


class TestSuite:
    def __init__(self, ten_suite):
        self.ten_suite = ten_suite
        self.danh_sach = []

    def them(self, test_case):
        self.danh_sach.append(test_case)
        print(f"Đã thêm {test_case.ma}")

    def cap_nhat_ket_qua(self, ma, ket_qua):
        for tc in self.danh_sach:
            if tc.ma == ma:
                tc.ket_qua = ket_qua
                return True
        print(f"Không tìm thấy {ma}")
        return False

    def thong_ke(self):
        tong = len(self.danh_sach)
        so_pass = 0
        so_fail = 0
        for tc in self.danh_sach:
            if tc.ket_qua == "Pass":
                so_pass += 1
            elif tc.ket_qua == "Fail":
                so_fail += 1
        ty_le = round(so_pass / tong * 100, 1) if tong > 0 else 0
        return {"tong": tong, "pass": so_pass, "fail": so_fail, "ty_le": ty_le}

    def in_bao_cao(self):
        tk = self.thong_ke()
        print(f"\n=== {self.ten_suite} ===")
        for tc in self.danh_sach:
            print(f"{tc.ma:10} | {tc.muc_do:8} | {tc.ket_qua:10} | {tc.ten}")
        print(f"Tổng: {tk['tong']} | Pass: {tk['pass']} | Fail: {tk['fail']} | Tỷ lệ: {tk['ty_le']}%")

    def luu_file(self, ten_file="bao_cao.txt"):
        tk = self.thong_ke()
        with open(ten_file, "w", encoding="utf-8") as f:
            f.write(f"Báo cáo: {self.ten_suite}\n")
            f.write(f"Ngày: {datetime.now().strftime('%d/%m/%Y %H:%M')}\n\n")
            for tc in self.danh_sach:
                f.write(f"{tc.ma} | {tc.muc_do} | {tc.ket_qua} | {tc.ten}\n")
            f.write(f"\nTổng {tk['tong']} | Pass {tk['pass']} | Fail {tk['fail']} | {tk['ty_le']}%\n")
        print(f"Đã lưu vào {ten_file}")


# ===== Chạy thử =====
suite = TestSuite("Kiểm thử chức năng đăng nhập")

suite.them(TestCase("TC_001", "Đăng nhập đúng tài khoản", "High"))
suite.them(TestCase("TC_002", "Đăng nhập sai mật khẩu", "High"))
suite.them(TestCase("TC_003", "Để trống ô username"))

suite.cap_nhat_ket_qua("TC_001", "Pass")
suite.cap_nhat_ket_qua("TC_002", "Fail")
suite.cap_nhat_ket_qua("TC_003", "Pass")

suite.in_bao_cao()
suite.luu_file()
```

## Kiến thức bài này dùng lại

| Kiến thức | Bài | Xuất hiện ở đâu |
| --- | --- | --- |
| Biến, f-string | 1, 2 | `f"Đã thêm {test_case.ma}"` |
| if / elif | 3 | `thong_ke()` |
| List, append | 4 | `self.danh_sach` |
| Dict | 5 | giá trị `thong_ke()` trả về |
| Vòng lặp for | 6 | duyệt `danh_sach` |
| Hàm, return | 7 | mọi phương thức |
| Class, self | 8 | `TestCase`, `TestSuite` |
| Import, ghi file | 9 | `datetime`, `luu_file()` |

## Tự mở rộng

2. Thêm `xoa(ma)` xóa một test case khỏi suite.

4. Thêm menu bằng `while True` cho người dùng chọn: 1 thêm, 2 cập nhật, 3 xem báo cáo, 0 thoát.

<script type="text/markdown" data-id="bai-11" data-nav="Bài 11 · Cài Playwright, script đầu tiên">
# Bài 11 — Cài Playwright và script tự động đầu tiên

**Mục tiêu:** máy có Playwright, và bạn thấy browser tự mở, tự gõ, tự bấm bằng code của mình.

## Playwright là gì

Playwright là thư viện điều khiển trình duyệt bằng code, do Microsoft phát triển. Nó làm được mọi thứ bạn đang làm tay khi test: mở trang, nhập form, bấm nút, kiểm tra kết quả. So với Selenium, nó tự chờ element xuất hiện (auto-wait) nên test ít flaky hơn nhiều.

## Cài đặt

Tạo thư mục project, tạo venv và kích hoạt (Bài 9), rồi:

```bash
pip install pytest-playwright
playwright install
```

| Lệnh | Cài cái gì | Để làm gì |
| --- | --- | --- |
| `pip install pytest-playwright` | Thư viện `playwright` + `pytest` + cầu nối giữa hai cái | `playwright` điều khiển trình duyệt bằng code; `pytest` chạy và báo cáo kết quả test (dùng từ Bài 16); cầu nối cho bạn fixture `page` tự mở/đóng browser |
| `playwright install` | 3 trình duyệt Chromium, Firefox, WebKit | Playwright dùng bản trình duyệt riêng của nó, không dùng Chrome bạn đang cài — nhờ vậy test chạy giống nhau trên mọi máy và trên CI |

Lệnh thứ hai tải khoảng 1–2 GB, mất vài phút, và **chỉ cần chạy một lần cho mỗi máy** — project sau không phải tải lại.

Kiểm tra:

```bash
playwright --version
```

## Script đầu tiên

Tạo file `bai11.py`:

```python
from playwright.sync_api import sync_playwright

with sync_playwright() as p:
    browser = p.chromium.launch(headless=False, slow_mo=1000)
    page = browser.new_page()

    page.goto("https://demo.playwright.dev/todomvc")
    print("Tiêu đề trang:", page.title())

    page.get_by_placeholder("What needs to be done?").fill("Học Playwright")
    page.keyboard.press("Enter")

    page.get_by_placeholder("What needs to be done?").fill("Viết test case")
    page.keyboard.press("Enter")

    page.screenshot(path="ket_qua.png")
    browser.close()
```

Chạy:

```bash
python bai11.py
```

Bạn sẽ thấy browser tự mở, tự thêm 2 việc vào danh sách, rồi đóng lại. File `ket_qua.png` xuất hiện trong thư mục.

## Giải thích từng dòng

| Dòng | Ý nghĩa |
| --- | --- |
| `from playwright.sync_api import sync_playwright` | Import Playwright (Bài 9) |
| `with sync_playwright() as p:` | Mở Playwright, tự dọn dẹp khi xong |
| `p.chromium.launch(...)` | Mở trình duyệt Chromium |
| `headless=False` | Cho thấy browser. Để `True` thì chạy ẩn, nhanh hơn |
| `slow_mo=1000` | Chậm lại 1000 ms mỗi hành động để bạn kịp xem |
| `browser.new_page()` | Mở một tab mới |
| `page.goto(url)` | Đi đến địa chỉ |
| `page.get_by_placeholder(...)` | Tìm ô input theo chữ mờ trong ô |
| `.fill("...")` | Nhập nội dung vào ô |
| `page.screenshot(path=...)` | Chụp ảnh màn hình |
| `browser.close()` | Đóng trình duyệt |

## Hai chế độ viết code Playwright

| | Sync | Async |
| --- | --- | --- |
| Cú pháp | `sync_playwright()` | `async_playwright()`, cần `await` |
| Phù hợp | Học và viết test | Chạy hiệu năng cao |

Khoá này dùng **sync** từ đầu đến cuối. Hầu hết project automation thật cũng dùng sync.

## Đổi trình duyệt

```python
browser = p.firefox.launch(headless=False)   # Firefox
browser = p.webkit.launch(headless=False)    # Safari engine
```

## Bài tập

1. Sửa script trên để thêm 4 việc vào danh sách todo.
2. Đổi `headless=False` thành `True`, chạy lại. So sánh thời gian chạy.
3. Viết script mở `https://www.saucedemo.com`, in tiêu đề trang và chụp ảnh.
4. Chạy script bằng Firefox thay vì Chromium.
</script>

<script type="text/markdown" data-id="bai-12" data-nav="Bài 12 · Locator — tìm element">
# Bài 12 — Locator: tìm đúng element

**Mục tiêu:** chỉ đúng cho Playwright biết bạn muốn tác động vào ô nào, nút nào. Đây là kỹ năng quyết định test của bạn có bền hay không.

## Thứ tự ưu tiên khi chọn locator

Playwright khuyến nghị dùng theo thứ tự từ trên xuống. Càng ở trên càng ít bị hỏng khi dev sửa giao diện.

| Ưu tiên | Locator | Dùng khi |
| --- | --- | --- |
| 1 | `get_by_role` | Nút, link, ô input, checkbox — dùng được hầu hết trường hợp |
| 2 | `get_by_label` | Ô input có nhãn bên cạnh |
| 3 | `get_by_placeholder` | Ô input có chữ mờ bên trong |
| 4 | `get_by_text` | Text hiển thị trên trang |
| 5 | `get_by_test_id` | Khi dev thêm `data-testid` riêng cho test |
| 6 | CSS / XPath | Khi không còn cách nào khác |

## get_by_role — dùng nhiều nhất

```python
page.get_by_role("button", name="Đăng nhập").click()
page.get_by_role("link", name="Trang chủ").click()
page.get_by_role("textbox", name="Email").fill("a@b.com")
page.get_by_role("checkbox", name="Ghi nhớ tôi").check()
page.get_by_role("heading", name="Giỏ hàng")
```

Các role hay gặp: `button`, `link`, `textbox`, `checkbox`, `radio`, `heading`, `listitem`, `combobox`, `alert`.

Khớp gần đúng (chứa một phần tên, không phân biệt hoa thường) là mặc định. Muốn khớp chính xác:

```python
page.get_by_role("button", name="Đăng nhập", exact=True).click()
```

## Các locator khác

```python
page.get_by_label("Mật khẩu").fill("123456")
page.get_by_placeholder("Nhập email").fill("a@b.com")
page.get_by_text("Đăng nhập thành công")
page.get_by_test_id("submit-btn").click()      # <button data-testid="submit-btn">
```

## CSS selector — khi bắt buộc

```python
page.locator("#username").fill("admin")          # theo id
page.locator(".error-message")                   # theo class
page.locator("input[name='email']")              # theo thuộc tính
page.locator("div.card > button")                # con trực tiếp
```

Tránh XPath dài như `/html/body/div[2]/div[3]/button` — dev sửa một thẻ là test fail hàng loạt.

## Khi locator tìm ra nhiều element

Lỗi `strict mode violation` nghĩa là locator khớp nhiều hơn 1 element. Cách thu hẹp:

```python
sp = page.get_by_role("listitem")

sp.first.click()          # cái đầu tiên
sp.last.click()           # cái cuối
sp.nth(2).click()         # cái thứ 3 (đếm từ 0)
print(sp.count())         # đếm có bao nhiêu cái
```

Lọc theo nội dung bên trong:

```python
page.get_by_role("listitem").filter(has_text="Áo thun").get_by_role("button", name="Xóa").click()
```

Tìm trong phạm vị một khối (chạy được nối tiếp nhau):

```python
form = page.locator("#login-form")
form.get_by_label("Username").fill("admin")
form.get_by_role("button").click()
```

## Lấy thông tin từ element

```python
el = page.get_by_role("heading", name="Sản phẩm")

print(el.text_content())                  # lấy text
print(el.is_visible())                    # True / False
print(page.locator("#email").input_value())  # giá trị trong ô input
print(page.locator("a").get_attribute("href"))
```

Lấy text của nhiều element cùng lúc:

```python
ten_sp = page.get_by_role("listitem").all_text_contents()
for ten in ten_sp:
    print(ten.strip())
```

## Bài tập

Dùng `https://www.saucedemo.com` (username `standard_user`, password `secret_sauce`):

1. Tìm ô username bằng `get_by_placeholder`, ô password bằng `get_by_placeholder`, nút Login bằng `get_by_role`. Đăng nhập thành công.
2. Sau khi đăng nhập, đếm xem trang có bao nhiêu sản phẩm (`page.locator(".inventory_item").count()`).
3. In ra tên tất cả sản phẩm bằng `all_text_contents()`.
4. Dùng `filter(has_text=...)` để bấm nút "Add to cart" của đúng sản phẩm "Sauce Labs Backpack".
</script>

<script type="text/markdown" data-id="bai-13" data-nav="Bài 13 · Tương tác với trang">
# Bài 13 — Tương tác với trang

**Mục tiêu:** làm được mọi hành động bạn vẫn làm tay: bấm, nhập, chọn, upload, cuộn, xử lý popup.

## Nhập liệu

```python
page.get_by_label("Email").fill("test@example.com")   # xóa cũ, nhập mới
page.get_by_label("Email").clear()                    # xóa trống
page.get_by_label("Tìm kiếm").press_sequentially("áo thun", delay=100)  # gõ từng ký tự
```

`fill()` nhanh và dùng cho hầu hết trường hợp. `press_sequentially()` dùng khi trang có gợi ý tự động cần kích hoạt theo từng ký tự.

## Bấm chuột

```python
page.get_by_role("button", name="Lưu").click()
page.get_by_role("button", name="Lưu").dblclick()
page.get_by_text("Sản phẩm").click(button="right")   # click chuột phải
page.get_by_role("link", name="Chi tiết").hover()    # đưa chuột vào, không bấm
```

## Checkbox và radio

```python
page.get_by_label("Tôi đồng ý").check()
page.get_by_label("Tôi đồng ý").uncheck()
print(page.get_by_label("Tôi đồng ý").is_checked())
```

Dùng `check()` thay vì `click()` cho checkbox: `check()` tự kiểm tra trạng thái trước, nên không bị tick rồi bỏ tick.

## Dropdown

```python
page.get_by_label("Tỉnh").select_option("Quảng Bình")        # theo giá trị value
page.get_by_label("Tỉnh").select_option(label="Quảng Bình")  # theo chữ hiển thị
page.get_by_label("Tỉnh").select_option(index=2)              # theo vị trí
page.get_by_label("Thẻ").select_option(["a", "b"])            # chọn nhiều
```

Lưu ý: `select_option` chỉ dùng được cho thẻ `<select>` chuẩn. Dropdown tự vẽ bằng div thì phải `click()` mở rồi `click()` vào dòng muốn chọn.

## Bàn phím

```python
page.keyboard.press("Enter")
page.keyboard.press("Tab")
page.keyboard.press("Escape")
page.keyboard.press("Control+A")
page.get_by_label("Tìm").press("Enter")   # bấm phím khi đang ở ô đó
```

## Upload file

```python
page.get_by_label("Ảnh đại diện").set_input_files("anh.png")
page.get_by_label("Tài liệu").set_input_files(["a.pdf", "b.pdf"])
page.get_by_label("Ảnh").set_input_files([])    # hủy chọn file
```

## Popup và hộp thoại trình duyệt

Hộp thoại `alert`, `confirm`, `prompt` phải xử lý **trước** khi nó xuất hiện:

```python
page.on("dialog", lambda dialog: dialog.accept())   # luôn bấm OK
page.get_by_role("button", name="Xóa").click()
```

Muốn bấm Cancel thì đổi thành `dialog.dismiss()`.

## Cuộn trang và điều hướng

```python
page.get_by_text("Chân trang").scroll_into_view_if_needed()
page.mouse.wheel(0, 500)      # cuộn xuống 500 px

page.go_back()
page.go_forward()
page.reload()
```

## Ví dụ hoàn chỉnh: đăng nhập và mua hàng

```python
from playwright.sync_api import sync_playwright

with sync_playwright() as p:
    browser = p.chromium.launch(headless=False, slow_mo=500)
    page = browser.new_page()

    page.goto("https://www.saucedemo.com")
    page.get_by_placeholder("Username").fill("standard_user")
    page.get_by_placeholder("Password").fill("secret_sauce")
    page.get_by_role("button", name="Login").click()

    page.get_by_role("button", name="Add to cart").first.click()
    page.locator(".shopping_cart_link").click()
    print("Sản phẩm trong giỏ:", page.locator(".cart_item").count())

    page.screenshot(path="gio_hang.png")
    browser.close()
```

## Bài tập

1. Trên saucedemo, đăng nhập rồi thêm 3 sản phẩm vào giỏ, in số lượng trong giỏ.
2. Dùng dropdown sắp xếp sản phẩm theo giá từ cao đến thấp, in tên sản phẩm đầu tiên.
3. Hoàn tất luồng checkout: điền họ, tên, mã bưu chính, bấm Continue, bấm Finish và chụp ảnh trang "Thank you".
4. Trên `https://demoqa.com/automation-practice-form`, điền tên, chọn giới tính, tick hộp sở thích và upload một ảnh.
</script>

<script type="text/markdown" data-id="bai-14" data-nav="Bài 14 · Assertion với expect">
# Bài 14 — Assertion với expect

**Mục tiêu:** biến script "tự bấm" thành **test case thật** có kết luận pass/fail. Một script không có assertion thì không phải test.

## expect là gì

`expect()` kiểm tra kết quả thực tế có đúng như mong đợi không. Nếu sai, test fail và báo rõ mong đợi gì — nhận được gì.

Quan trọng: `expect()` có **auto-retry** — nó tự thử lại trong 5 giây cho đến khi điều kiện đúng. Nhờ vậy bạn không cần viết `sleep()` chạy đợi.

```python
from playwright.sync_api import sync_playwright, expect

with sync_playwright() as p:
    browser = p.chromium.launch(headless=False)
    page = browser.new_page()

    page.goto("https://www.saucedemo.com")
    page.get_by_placeholder("Username").fill("standard_user")
    page.get_by_placeholder("Password").fill("secret_sauce")
    page.get_by_role("button", name="Login").click()

    expect(page).to_have_url("https://www.saucedemo.com/inventory.html")
    expect(page.locator(".title")).to_have_text("Products")

    browser.close()
```

## Assertion cho element

```python
el = page.locator(".error-message")

expect(el).to_be_visible()            # đang hiển thị
expect(el).to_be_hidden()             # đang ẩn
expect(el).to_have_text("Thành công") # text giống hoàn toàn
expect(el).to_contain_text("công")    # text chứa một đoạn
expect(el).to_be_enabled()            # bấm được
expect(el).to_be_disabled()           # bị khóa
expect(el).to_be_checked()            # checkbox đã tick
expect(el).to_have_value("admin")     # giá trị trong ô input
expect(el).to_have_count(6)           # đúng 6 element
expect(el).to_have_attribute("href", "/home")
```

## Assertion cho cả trang

```python
expect(page).to_have_title("Swag Labs")
expect(page).to_have_url("https://www.saucedemo.com/inventory.html")
```

## Đảo ngược: not

```python
expect(page.locator(".error")).not_to_be_visible()
expect(page.locator(".title")).not_to_have_text("Lỗi")
```

## Đổi thời gian chờ

Mặc định 5 giây. Trang chạy chậm thì nâng lên (đơn vị ms):

```python
expect(page.locator(".bao-cao")).to_be_visible(timeout=15000)
```

## Đọc thông báo khi test fail

```text
AssertionError: Locator expected to have text 'Products'
Actual value: Product
Call log:
  - locator resolved to <span class="title">Product</span>
```

Từ trên xuống: mong đợi `Products`, thực tế nhận `Product`. Đây là bug thật, không phải lỗi code test. Luôn đọc dòng `Actual value` trước khi sửa script.

## expect của Playwright vs assert của Python

| | `expect()` | `assert` |
| --- | --- | --- |
| Tự chờ lại | Có, 5 giây | Không, kiểm tra ngay |
| Dùng cho | Element, trang | Giá trị Python thường |
| Ví dụ | `expect(el).to_be_visible()` | `assert so_sp == 6` |

Quy tắc: mọi thứ liên quan đến giao diện dùng `expect()`. Dùng `assert` cho tính toán thuần Python.

## Bài tập

1. Viết test đăng nhập **thành công** trên saucedemo: kiểm tra URL chuyển sang trang inventory và tiêu đề là "Products".
2. Viết test đăng nhập **thất bại** với mật khẩu sai: kiểm tra thông báo lỗi hiển thị và chứa chữ "Username and password do not match".
3. Kiểm tra trang inventory có đúng 6 sản phẩm bằng `to_have_count(6)`.
4. Kiểm tra `locked_out_user` / `secret_sauce` bị báo lỗi "Sorry, this user has been locked out".
5. Cố tình để sai giá trị mong đợi, chạy test và đọc kỹ thông báo lỗi.
</script>

<script type="text/markdown" data-id="bai-15" data-nav="Bài 15 · Auto-wait, debug, trace">
# Bài 15 — Auto-wait, codegen, debug và Trace Viewer

**Mục tiêu:** tự tìm ra nguyên nhân khi test fail, không phải đoán. Đây là bài giúp bạn tiết kiệm nhiều giờ nhất về sau.

## Auto-wait — vì sao không cần sleep

Trước mỗi hành động, Playwright tự chờ element: có trong DOM, hiển thị, ổn định (không đang di chuyển), nhận được sự kiện, đang bật. Tối đa 30 giây rồi mới báo lỗi.

```python
# ĐÚNG — không cần chờ thủ công
page.get_by_role("button", name="Lưu").click()

# SAI — đừng viết như này
import time
time.sleep(5)
page.get_by_role("button", name="Lưu").click()
```

`time.sleep()` làm test chậm và vẫn flaky. Chỉ dùng các cách chờ có điều kiện:

```python
page.wait_for_url("**/inventory.html")
page.wait_for_load_state("networkidle")       # chờ mạng rảnh
page.locator(".bao-cao").wait_for(state="visible", timeout=10000)
expect(page.locator(".bao-cao")).to_be_visible()   # cách tốt nhất
```

## Codegen — Playwright tự viết code cho bạn

```bash
playwright codegen https://www.saucedemo.com
```

Hai cửa sổ mở ra: một browser và một cửa sổ Inspector. Bạn bấm, nhập như bình thường trên browser, code Python hiện ra ngay trong Inspector để copy về.

```bash
playwright codegen --target python -o test_moi.py https://www.saucedemo.com
```

Dùng codegen để **hỏi locator** là rất tốt. Nhưng đừng nộp code codegen nguyên xi làm test: nó không có assertion và thường sinh locator dài. Hãy dọn lại.

## Pick locator — chỉ chuột vào đâu, lấy locator ở đó

Trong cửa sổ Inspector có nút **Pick locator**. Bấm vào, rồi trỏ chuột lên element trên trang — locator đề xuất hiện ra ngay. Đây là cách nhanh nhất khi bạn bị bí locator.

## Chạy từng bước bằng Inspector

```bash
PWDEBUG=1 python test_login.py          # macOS
set PWDEBUG=1 && python test_login.py   # Windows CMD
$env:PWDEBUG=1; python test_login.py    # Windows PowerShell
```

Test dừng ở dòng đầu, bạn bấm **Step over** để chạy từng dòng và xem browser phản ứng thế nào.

## Trace Viewer — xem lại toàn bộ diễn biến

Trace ghi lại từng bước kèm ảnh màn hình, DOM và request mạng. Khi test fail trên máy khác hoặc trên CI, đây là công cụ duy nhất bạn cần.

```python
from playwright.sync_api import sync_playwright

with sync_playwright() as p:
    browser = p.chromium.launch()
    context = browser.new_context()
    context.tracing.start(screenshots=True, snapshots=True, sources=True)

    page = context.new_page()
    page.goto("https://www.saucedemo.com")
    page.get_by_placeholder("Username").fill("standard_user")
    page.get_by_placeholder("Password").fill("secret_sauce")
    page.get_by_role("button", name="Login").click()

    context.tracing.stop(path="trace.zip")
    browser.close()
```

Mở trace:

```bash
playwright show-trace trace.zip
```

Giao diện hiện dòng thời gian; bấm vào một bước để xem ảnh trước và sau, DOM lúc đó, console log và request mạng.

## Bảng tra lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `Timeout 30000ms exceeded` | Locator không tìm thấy element | Kiểm tra lại locator bằng Pick locator |
| `strict mode violation` | Locator khớp nhiều element | Thêm `.first`, `.nth()` hoặc `.filter()` |
| `Element is not visible` | Element bị ẩn hoặc chưa load | Dùng `expect(...).to_be_visible()` trước |
| `Element is outside of the viewport` | Cần cuộn tới | `scroll_into_view_if_needed()` |
| `Target closed` | Browser đóng trước khi xong | Kiểm tra `browser.close()` đặt đúng chỗ |

## Bài tập

1. Dùng `playwright codegen` ghi luồng đăng nhập và thêm sản phẩm vào giỏ trên saucedemo. Copy code ra file và dọn lại cho gọn.

<script type="text/markdown" data-id="bai-16" data-nav="Bài 16 · pytest + pytest-playwright">
# Bài 16 — pytest và pytest-playwright

**Mục tiêu:** tổ chức nhiều test case thành một bộ, chạy tất cả bằng một lệnh, có báo cáo pass/fail. Từ bài này trở đi, bạn viết test đúng cách làm của dân automation thật.

## pytest là gì

pytest là công cụ chạy test. Bạn không cần tự viết `with sync_playwright()` nữa — pytest-playwright tự mở và đóng browser cho từng test.

## Quy ước đặt tên bắt buộc

| Thứ | Quy tắc |
| --- | --- |
| File | Bắt đầu bằng `test_` hoặc kết thúc `_test.py` |
| Hàm test | Bắt đầu bằng `test_` |
| Class (nếu dùng) | Bắt đầu bằng `Test` |

Đặt sai tên là pytest không tìm thấy test, báo `no tests ran`.

## Test đầu tiên bằng pytest

File `test_login.py`:

```python
from playwright.sync_api import Page, expect


def test_dang_nhap_thanh_cong(page: Page):
    page.goto("https://www.saucedemo.com")
    page.get_by_placeholder("Username").fill("standard_user")
    page.get_by_placeholder("Password").fill("secret_sauce")
    page.get_by_role("button", name="Login").click()

    expect(page).to_have_url("https://www.saucedemo.com/inventory.html")
    expect(page.locator(".title")).to_have_text("Products")


def test_dang_nhap_sai_mat_khau(page: Page):
    page.goto("https://www.saucedemo.com")
    page.get_by_placeholder("Username").fill("standard_user")
    page.get_by_placeholder("Password").fill("sai_mat_khau")
    page.get_by_role("button", name="Login").click()

    expect(page.locator("[data-test='error']")).to_contain_text(
        "Username and password do not match"
    )
```

`page: Page` là **fixture** — pytest-playwright tự tạo một trang mới sạch cho mỗi hàm test. Hai test trên không ảnh hưởng nhau.

## Chạy test

```bash
pytest                                  # chạy tất cả
pytest test_login.py                    # chạy một file
pytest test_login.py::test_dang_nhap_thanh_cong   # chạy một test
pytest -v                               # hiện tên từng test
pytest -s                               # hiện cả print()
pytest --headed                         # hiện browser
pytest --headed --slowmo 500            # hiện browser và chạy chậm
pytest -k "dang_nhap"                   # chỉ chạy test có tên chứa dang_nhap
pytest --browser firefox                # đổi trình duyệt
```

Kết quả:

```text
test_login.py::test_dang_nhap_thanh_cong PASSED   [ 50%]
test_login.py::test_dang_nhap_sai_mat_khau PASSED [100%]

===== 2 passed in 6.21s =====
```

## Đánh dấu test bằng marker

```python
import pytest


@pytest.mark.smoke
def test_mo_trang_chu(page):
    page.goto("https://www.saucedemo.com")
    expect(page).to_have_title("Swag Labs")


@pytest.mark.skip(reason="Chức năng chưa làm xong")
def test_chua_lam(page):
    pass
```

Chạy riêng nhóm smoke:

```bash
pytest -m smoke
```

Khai báo marker trong file `pytest.ini` để không bị cảnh báo:

```text
[pytest]
markers =
    smoke: test nhanh kiểm tra chức năng chính
    regression: test đầy đủ
```

## Nhóm test bằng class

```python
class TestGioHang:
    def test_them_san_pham(self, page: Page):
        ...

    def test_xoa_san_pham(self, page: Page):
        ...
```

Trong class, mọi hàm test phải có `self` là tham số đầu tiên (Bài 8).

```text
hoc-automation/
├── venv/
├── tests/
│   ├── test_login.py
│   └── test_gio_hang.py
├── pytest.ini
└── requirements.txt
```

4. Tạo file `test_gio_hang.py` với class `TestGioHang` gồm 2 test, chạy cả hai file cùng lúc.

# Bài 17 — Page Object Model

**Mục tiêu:** tách locator ra khỏi test để khi dev đổi giao diện bạn chỉ sửa một chỗ. Đây là cách mọi project automation thực tế đều làm, và là câu hỏi phỏng vấn gần như chắc chắn được hỏi.

## Vấn đề cần giải quyết

Nếu locator `get_by_placeholder("Username")` xuất hiện trong 20 test, dev đổi placeholder một lần là bạn phải sửa 20 chỗ. POM giải quyết đúng điều này: mỗi trang web thành một class, locator nằm trong class, test chỉ gọi phương thức.

## Cấu trúc project

```text
hoc-automation/
├── pages/
│   ├── __init__.py          # file rỗng, để Python nhận đây là package
│   ├── login_page.py
│   └── inventory_page.py
├── tests/
│   └── test_login.py
├── conftest.py
├── pytest.ini
└── requirements.txt
```

### Tạo khung thư mục bằng lệnh

Đứng trong thư mục project (chỗ đang có `venv`), chạy một lần:

**Windows — PowerShell**

```powershell
mkdir pages, tests, data, anh
New-Item pages\__init__.py, tests\__init__.py -ItemType File
New-Item pages\base_page.py, pages\login_page.py, pages\inventory_page.py -ItemType File
New-Item tests\test_login.py, conftest.py, pytest.ini -ItemType File
```

**macOS / Linux**

```bash
mkdir -p pages tests data anh
touch pages/__init__.py tests/__init__.py
touch pages/base_page.py pages/login_page.py pages/inventory_page.py
touch tests/test_login.py conftest.py pytest.ini
```

Ba điều cần nhớ về cấu trúc này:

- `pages/__init__.py` để **rỗng**. Nó chỉ để Python hiểu `pages` là một package, nhờ vậy `from pages.login_page import LoginPage` mới chạy.
- Luôn chạy `pytest` từ thư mục gốc project, không `cd` vào `tests/` rồi chạy.
- Thư mục `anh/` để chứa ảnh chụp màn hình, `data/` chứa file CSV dữ liệu test (dùng ở Bài 18).

Bài này chưa cần cài thêm thư viện nào — `pytest-playwright` đã cài từ Bài 11 là đủ.

## pages/login_page.py

```python
from playwright.sync_api import Page, expect


class LoginPage:
    URL = "https://www.saucedemo.com"

    def __init__(self, page: Page):
        self.page = page
        # Locator — tất cả nằm ở đây, không nằm trong test
        self.o_username = page.get_by_placeholder("Username")
        self.o_password = page.get_by_placeholder("Password")
        self.nut_login = page.get_by_role("button", name="Login")
        self.thong_bao_loi = page.locator("[data-test='error']")

    def mo_trang(self):
        self.page.goto(self.URL)

    def dang_nhap(self, username, password):
        self.o_username.fill(username)
        self.o_password.fill(password)
        self.nut_login.click()

    def kiem_tra_loi(self, noi_dung):
        expect(self.thong_bao_loi).to_contain_text(noi_dung)
```

## pages/inventory_page.py

```python
from playwright.sync_api import Page, expect


class InventoryPage:
    def __init__(self, page: Page):
        self.page = page
        self.tieu_de = page.locator(".title")
        self.danh_sach_sp = page.locator(".inventory_item")
        self.gio_hang = page.locator(".shopping_cart_link")
        self.so_luong_gio = page.locator(".shopping_cart_badge")

    def kiem_tra_da_vao_trang(self):
        expect(self.tieu_de).to_have_text("Products")

    def dem_san_pham(self):
        return self.danh_sach_sp.count()

    def them_vao_gio(self, ten_san_pham):
        self.danh_sach_sp.filter(has_text=ten_san_pham).get_by_role(
            "button", name="Add to cart"
        ).click()

    def mo_gio_hang(self):
        self.gio_hang.click()
```

## tests/test_login.py

```python

from pages.login_page import LoginPage
from pages.inventory_page import InventoryPage


def test_dang_nhap_thanh_cong(page: Page):
    login = LoginPage(page)
    inventory = InventoryPage(page)

    login.dang_nhap("standard_user", "secret_sauce")

    inventory.kiem_tra_da_vao_trang()
    assert inventory.dem_san_pham() == 6


def test_dang_nhap_sai_mat_khau(page: Page):
    login = LoginPage(page)

    login.mo_trang()
    login.dang_nhap("standard_user", "sai_mat_khau")
    login.kiem_tra_loi("Username and password do not match")


def test_them_san_pham_vao_gio(page: Page):
    login = LoginPage(page)
    inventory = InventoryPage(page)

    login.mo_trang()
    login.dang_nhap("standard_user", "secret_sauce")
    inventory.them_vao_gio("Sauce Labs Backpack")

    expect(inventory.so_luong_gio).to_have_text("1")

Test giờ đọc như mô tả test case trong Excel: mở trang, đăng nhập, kiểm tra. Không có locator nào lọt vào test.

## Chạy test có POM

Đứng ở thư mục gốc project (chứa cả `pages/` và `tests/`) rồi gõ:

```bash
pytest tests/ -v
```

Lỗi `ModuleNotFoundError: No module named 'pages'` nghĩa là bạn đứng sai thư mục, hoặc thiếu file `__init__.py` trong `pages/`.

## Nguyên tắc viết POM đúng

| Nên | Không nên |
| --- | --- |
| Locator đặt trong `__init__` của page class | Locator viết trực tiếp trong test |
| Phương thức đặt tên theo hành động nghiệp vụ (`dang_nhap`) | Phương thức tên kỹ thuật (`click_button_1`) |
| Một class cho một trang hoặc một khối lớn | Một class cho cả website |
| Assertion chính đặt trong test | Toàn bộ assertion nhét trong page class |

Assertion đặt ở đâu là chuyện có nhiều quan điểm. Cách cân bằng thường dùng: assertion kiểm tra nghiệp vụ đặt trong test; những kiểm tra phụ lặp lại nhiều lần (như "đã vào đúng trang chưa") gói thành phương thức trong page class.

<script type="text/markdown" data-id="bai-18" data-nav="Bài 18 · Data-driven và fixtures">
# Bài 18 — Data-driven test, fixtures và conftest.py

**Mục tiêu:** chạy một test với nhiều bộ dữ liệu, và gộp các bước chuẩn bị lặp lại vào một chỗ.

## parametrize — một test, nhiều bộ dữ liệu

Thay vì viết 4 hàm test giống nhau chỉ khác dữ liệu, viết một hàm và liệt kê dữ liệu:

```python
import pytest
from playwright.sync_api import Page

from pages.login_page import LoginPage


@pytest.mark.parametrize("username,password,thong_bao", [
    ("standard_user", "sai_pass", "Username and password do not match"),
    ("sai_user", "secret_sauce", "Username and password do not match"),
    ("", "secret_sauce", "Username is required"),
    ("standard_user", "", "Password is required"),
    ("locked_out_user", "secret_sauce", "Sorry, this user has been locked out"),
])
def test_dang_nhap_that_bai(page: Page, username, password, thong_bao):
    login = LoginPage(page)
    login.mo_trang()
    login.dang_nhap(username, password)
    login.kiem_tra_loi(thong_bao)
```

Chạy `pytest -v` sẽ thấy 5 test riêng biệt, mỗi bộ dữ liệu một dòng kết quả. Một bộ fail không ảnh hưởng các bộ còn lại.

## Đặt tên dễ đọc cho từng bộ

```python
@pytest.mark.parametrize("username,password", [
    pytest.param("standard_user", "sai_pass", id="sai_mat_khau"),
    pytest.param("", "secret_sauce", id="thieu_username"),
])
def test_login_fail(page, username, password):
    ...
```

## Đọc dữ liệu từ file CSV

File `data/taikhoan.csv`:

```csv

,secret_sauce,Username is required

```

def doc_du_lieu(duong_dan):

        return [
            (d["username"], d["password"], d["thong_bao"])
            for d in csv.DictReader(f)
        ]


@pytest.mark.parametrize(
    "username,password,thong_bao", doc_du_lieu("data/taikhoan.csv")

def test_login_tu_csv(page, username, password, thong_bao):
    ...
```

Cách này cho phép tạo thêm test case chỉ bằng việc thêm dòng vào file CSV, không sửa code.

## Fixture — gộp các bước chuẩn bị

Nếu 10 test đều phải đăng nhập trước, đừng viết 10 lần. Tạo fixture trong `conftest.py` — file này pytest tự đọc, không cần import.

`conftest.py` ở thư mục gốc:

```python
import pytest

from pages.login_page import LoginPage
from pages.inventory_page import InventoryPage


@pytest.fixture
def da_dang_nhap(page):
    """Đăng nhập sẵn, trả về trang inventory."""
    login = LoginPage(page)
    login.mo_trang()
    login.dang_nhap("standard_user", "secret_sauce")
    return InventoryPage(page)
```

Dùng trong test — chỉ cần khai tên fixture làm tham số:

```python
from playwright.sync_api import expect


def test_dem_san_pham(da_dang_nhap):
    assert da_dang_nhap.dem_san_pham() == 6


def test_them_vao_gio(da_dang_nhap, page):
    da_dang_nhap.them_vao_gio("Sauce Labs Backpack")
    expect(page.locator(".shopping_cart_badge")).to_have_text("1")
```

## Fixture có bước dọn dẹp sau test

Dùng `yield`: code trước `yield` chạy trước test, code sau `yield` chạy sau test.

```python
@pytest.fixture
def du_lieu_test():
    print("Chuẩn bị dữ liệu")
    du_lieu = {"ten": "Test User"}
    yield du_lieu
    print("Dọn dẹp sau test")
```

## Phạm vi fixture

```python
@pytest.fixture(scope="function")   # mặc định: mỗi test một lần
@pytest.fixture(scope="class")      # mỗi class một lần
@pytest.fixture(scope="session")    # cả phiên chỉ một lần
```

Dùng `scope="session"` cho việc tốn thời gian và không đổi giữa các test, ví dụ đọc file cấu hình. Không dùng cho trạng thái đăng nhập nếu test có thể làm thay đổi dữ liệu.

## Fixture sẵn của pytest-playwright

| Fixture | Cho gì |
| --- | --- |
| `page` | Một trang mới sạch cho mỗi test |
| `context` | Phiên trình duyệt (cookie, storage) |
| `browser` | Trình duyệt |
| `browser_name` | Tên trình duyệt đang chạy |

## Bài tập

1. Viết `test_login_that_bai` dùng `parametrize` với 5 bộ dữ liệu, chạy `pytest -v` và đếm số dòng kết quả.
2. Tạo file CSV 6 dòng dữ liệu đăng nhập và cho test đọc từ đó.
3. Tạo fixture `da_dang_nhap` trong `conftest.py` và viết 3 test dùng nó.
4. Tạo fixture có `yield` in "Bắt đầu test" và "Kết thúc test", chạy `pytest -s` để thấy thứ tự.

<script type="text/markdown" data-id="bai-19" data-nav="Bài 19 · Report, đa browser, CI">
# Bài 19 — Screenshot, video, trace, report, đa trình duyệt và CI

**Mục tiêu:** xuất báo cáo cho người khác đọc, và cho test tự chạy mỗi lần code được push lên GitHub.

## Chụp ảnh và ghi video tự động

pytest-playwright có sẵn các tuỳ chọn này, không cần viết code:

```bash
pytest --screenshot only-on-failure
pytest --video retain-on-failure
pytest --tracing retain-on-failure
```

Kết quả nằm trong thư mục `test-results/`. Giá trị có thể dùng: `on`, `off`, `only-on-failure` (với video và trace là `retain-on-failure`).

Cấu hình một lần trong `pytest.ini` để không phải gõ lại:

```text
[pytest]
addopts = --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure
markers =
    smoke: test nhanh kiểm tra chức năng chính
    regression: test đầy đủ
```

Chụp ảnh bằng code khi cần:

```python
page.screenshot(path="anh.png")
page.screenshot(path="ca_trang.png", full_page=True)
page.locator(".gio-hang").screenshot(path="gio.png")   # chỉ một khối
```

## Báo cáo HTML

Kết quả `pytest` chỉ hiện trong Terminal, không gửi đi được. `pytest-html` gói kết quả đó thành một file HTML mở bằng trình duyệt — thứ bạn đính vào email báo cáo hoặc gửi cho leader.

```bash
pip install pytest-html
pytest --html=report.html --self-contained-html
```

Mở `report.html` bằng trình duyệt: có danh sách test, kết quả, thời gian chạy và thông báo lỗi. Đây là file bạn gửi cho leader hoặc đính vào email báo cáo.

Muốn báo cáo đẹp hơn, có biểu đồ và lịch sử chạy, dùng Allure:

```bash
pip install allure-pytest
pytest --alluredir=allure-results
allure serve allure-results
```

Allure cần cài thêm phần mềm Allure commandline, nên để học sau khi đã thành thạo pytest-html.

## Chạy trên nhiều trình duyệt

```bash
pytest --browser chromium --browser firefox --browser webkit
```

Một test sẽ chạy 3 lần, mỗi trình duyệt một lần. Giới hạn cho một test cụ thể:

```python
import pytest


@pytest.mark.only_browser("chromium")
def test_chi_chromium(page):
    ...


@pytest.mark.skip_browser("webkit")
def test_khong_chay_webkit(page):
    ...
```

Giả lập điện thoại:

```bash
pytest --device "iPhone 13"
```

## Chạy song song cho nhanh

```bash
pip install pytest-xdist
pytest -n 4         # chạy 4 test cùng lúc
pytest -n auto      # theo số CPU của máy
```

Chạy song song chỉ an toàn khi các test độc lập với nhau. Test nào phụ thuộc dữ liệu do test khác tạo ra sẽ fail thất thường.

## Thử lại test fail

```bash
pip install pytest-rerunfailures
pytest --reruns 2 --reruns-delay 1
```

Dùng có chừng mực. Rerun che lấp test flaky chứ không sửa được nguyên nhân.

## Chạy tự động trên GitHub Actions

Tạo file `.github/workflows/test.yml`:

```yaml
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai dat thu vien
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Chay test
        run: pytest --html=report.html --self-contained-html

      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.html
            test-results/
```

Push lên GitHub, vào tab **Actions** là thấy test tự chạy. `if: always()` đảm bảo báo cáo vẫn được lưu khi test fail — đó chính là lúc bạn cần nó nhất.

Trên CI luôn chạy headless, đừng đặt `headless=False` trong code.

## Bài tập

1. Thêm `addopts` vào `pytest.ini`, cố tình để một test fail và kiểm tra thư mục `test-results/` có ảnh, video, trace.
2. Cài `pytest-html`, xuất `report.html` và mở xem.
3. Chạy cả bộ test trên 3 trình duyệt, ghi lại thời gian chạy.
4. Tạo repo GitHub cho project, thêm file workflow trên và push để xem test chạy trên Actions.
</script>
