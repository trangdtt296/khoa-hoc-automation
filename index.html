# Bài 0 — Cài Flutter và chạy app đầu tiên

**Mục tiêu:** máy cài được Flutter, `flutter doctor` không còn lỗi đỏ, và bạn thấy app chạy trên máy ảo.

## Flutter là gì

Flutter là bộ công cụ của Google để viết app. Điểm mạnh: **viết một lần, chạy cả Android và iOS** (và cả web, desktop), giao diện đẹp sẵn, sửa code thấy kết quả ngay nhờ hot reload.

Flutter dùng ngôn ngữ **Dart**. Đây là lý do Phần 1 của khoá học Dart trước — không biết Dart thì không viết được Flutter.

| Thứ | Vai trò |
| --- | --- |
| Dart | Ngôn ngữ lập trình |
| Flutter | Bộ công cụ và thư viện giao diện |
| Flutter SDK | Trình biên dịch, lệnh `flutter`, thư viện chuẩn |
| Widget | Mọi thứ hiển thị trên màn hình đều là widget |

## 1. Cài Flutter SDK

Vào `docs.flutter.dev/install`, chọn hệ điều hành, tải bản **stable** mới nhất (hiện là 3.44).

**Windows:** giải nén vào `C:\src\flutter` — **không** đặt trong `Program Files` hay thư mục có dấu cách, sẽ lỗi. Rồi thêm `C:\src\flutter\bin` vào biến môi trường Path:

```powershell
[Environment]::SetEnvironmentVariable("Path", $env:Path + ";C:\src\flutter\bin", "User")
```

**macOS:** cách gọn nhất là dùng Homebrew:

```bash
brew install --cask flutter
```

Đóng Terminal, mở lại, kiểm tra:

```bash
flutter --version
```

## 2. Cài Android Studio và máy ảo

Tải tại `developer.android.com/studio`. Cài xong mở lên, để Setup Wizard tải Android SDK.

Tạo máy ảo: **More Actions** → **Virtual Device Manager** → **Create Device** → Pixel 6 → System Image API 34 (bản x86_64) → Finish.

Nếu bạn đã làm khoá Appium hoặc Maestro thì máy ảo có sẵn rồi, dùng lại luôn.

## 3. Cài editor

Chọn một trong hai, cả hai đều tốt:

| Editor | Cài thêm gì |
| --- | --- |
| **VS Code** (nhẹ, nhanh) | Extension **Flutter** (tự kèm Dart) |
| **Android Studio** (nặng, đủ đồ) | Plugin **Flutter** trong Settings → Plugins |

Khoá này viết theo VS Code, nhưng mọi thứ làm được trên Android Studio.

## 4. flutter doctor — bước quan trọng nhất

```bash
flutter doctor
```

Lệnh này kiểm tra mọi thứ và báo thiếu gì:

```text
[✓] Flutter (Channel stable, 3.44.0)
[✓] Android toolchain - develop for Android devices
[!] Android Studio (version 2026.1)
    ✗ Android license status unknown.
[✓] VS Code (version 1.9x)
[✓] Connected device (1 available)
```

Thấy dòng `Android license status unknown` thì chạy:

```bash
flutter doctor --android-licenses
```

Rồi gõ `y` cho từng câu hỏi. Chỉ cần quan tâm tới dấu ✗; dấu `!` liên quan tới iOS hay Chrome thì bỏ qua nếu bạn chỉ làm Android.

## 5. Tạo và chạy app đầu tiên

```bash
flutter create my_app
cd my_app
flutter run
```

Tên project phải viết thường, nối bằng `_`, không dấu cách. Khởi động máy ảo trước khi chạy `flutter run`.

Lần đầu build mất 2–5 phút. App mẫu hiện ra với một nút dấu cộng và bộ đếm.

## 6. Hot reload — thứ khiến Flutter dễ học

App đang chạy, mở `lib/main.dart`, tìm dòng:

```dart
'You have pushed the button this many times:'
```

Sửa thành `'Bạn đã bấm nút bao nhiêu lần:'`, lưu file. Màn hình app đổi **ngay lập tức**, không phải build lại, và bộ đếm vẫn giữ nguyên số.

| Phím trong terminal đang chạy | Tác dụng |
| --- | --- |
| `r` | Hot reload — giữ trạng thái |
| `R` | Hot restart — chạy lại từ đầu |
| `q` | Thoát |

Trong VS Code chỉ cần Ctrl+S là tự hot reload.

## Cấu trúc project

```text
my_app/
├── lib/
│   └── main.dart        ← code của bạn nằm ở đây
├── android/             ← cấu hình riêng cho Android
├── ios/                 ← cấu hình riêng cho iOS
├── test/                ← test (Bài 21)
├── assets/              ← ảnh, font (bạn tự tạo, Bài 19)
└── pubspec.yaml         ← khai báo thư viện và asset
```

99% thời gian bạn làm việc trong `lib/` và `pubspec.yaml`.

## Lỗi hay gặp

| Lỗi | Cách sửa |
| --- | --- |
| `flutter: command not found` | Chưa thêm `bin` vào PATH, mở Terminal mới |
| `Unable to locate Android SDK` | Cài Android Studio và mở nó ít nhất một lần |
| `No devices found` | Máy ảo chưa bật, kiểm tra bằng `flutter devices` |
| Build đứng rất lâu lần đầu | Bình thường, Gradle đang tải; đừng ngắt |
| `cmdline-tools component is missing` | Android Studio → SDK Manager → SDK Tools → tick **Android SDK Command-line Tools** |

## Bài tập

1. Chạy `flutter doctor` cho đến khi không còn dấu ✗ nào liên quan Android.
2. Tạo project `my_app` và chạy được trên máy ảo.
3. Sửa dòng chữ trên màn hình, lưu và xem hot reload hoạt động.
4. Đổi `primarySwatch` hoặc `seedColor` trong `main.dart` sang màu khác, xem app đổi màu.
5. Bấm `R` trong terminal, quan sát khác biệt với hot reload.
</script>

<script type="text/markdown" data-id="fl-1" data-nav="Bài 1 · Dart: biến và kiểu dữ liệu">
# Bài 1 — Dart: biến và kiểu dữ liệu

**Mục tiêu:** viết được chương trình Dart đầu tiên, nắm biến và 5 kiểu dữ liệu.

## Nơi luyện Dart

Không cần tạo project Flutter để học Dart. Vào **dartpad.dev** — viết và chạy Dart ngay trên trình duyệt. Dùng nó cho hết Phần 1.

## Chương trình đầu tiên

```dart
void main() {
  print('Xin chào Flutter!');
  print('1 + 1 = ${1 + 1}');
}
```

`main()` là nơi chương trình bắt đầu chạy. Mỗi câu lệnh kết thúc bằng dấu `;`.

## Khai báo biến

```dart
void main() {
  String ten = 'Trang';
  int tuoi = 30;
  double diem = 9.5;
  bool dangHoc = true;

  var thanhPho = 'Huế';        // Dart tự hiểu là String
  final ngaySinh = 1996;        // gán một lần, không đổi được
  const PI = 3.14;              // hằng số biết trước lúc biên dịch

  print('$ten, $tuoi tuổi, ở $thanhPho');
}
```

| Cách khai báo | Khi nào dùng |
| --- | --- |
| `String ten = ...` | Ghi rõ kiểu — rõ ràng nhất cho người mới |
| `var` | Dart tự đoán kiểu từ giá trị |
| `final` | Giá trị gán một lần rồi không đổi |
| `const` | Hằng số cố định từ lúc viết code |

Khác biệt `final` và `const`: `final ngayHomNay = DateTime.now();` chạy được vì giá trị chỉ biết lúc chạy. `const ngayHomNay = DateTime.now();` báo lỗi.

Trong Flutter bạn sẽ thấy `const` rất nhiều trước các widget — nó giúp app chạy nhanh hơn, Bài 7 sẽ nói rõ.

## 5 kiểu dữ liệu cơ bản

| Kiểu | Lưu gì | Ví dụ |
| --- | --- | --- |
| `String` | Chữ | `'Trang'` |
| `int` | Số nguyên | `30` |
| `double` | Số thực | `9.5` |
| `bool` | Đúng/sai | `true` |
| `dynamic` | Kiểu gì cũng được | Hạn chế dùng |

Dart dùng nháy đơn `'...'` là chính, nháy kép `"..."` cũng được.

## Chèn biến vào chuỗi

```dart
String ten = 'Trang';
int tuoi = 30;

print('Tên: $ten');                      // bien don gian: dau $
print('Sang năm: ${tuoi + 1}');          // co tinh toan: ${...}
print('Tên viết hoa: ${ten.toUpperCase()}');
```

Cách này gọi là *string interpolation*, dùng suốt khi viết Flutter.

## Null safety — điểm quan trọng của Dart

Mặc định biến **không được phép null**:

```dart
String ten = 'Trang';
ten = null;        // LỖI
```

Muốn cho phép null thì thêm dấu `?`:

```dart
String? ten;              // duoc phep null, mac dinh la null
print(ten);               // null

ten = 'Trang';
print(ten.length);        // LOI: Dart khong chac ten co null khong
print(ten?.length);       // an toan: null thi tra ve null
print(ten!.length);       // ! nghia la "toi chac chan khong null"
```

| Ký hiệu | Nghĩa |
| --- | --- |
| `String?` | Biến này có thể null |
| `?.` | Gọi nếu không null, ngược lại trả về null |
| `??` | Giá trị thay thế khi null: `ten ?? 'Chưa có tên'` |
| `!` | Khẳng định không null — sai là app crash |

Dùng `!` ít thôi. Nó tắt phần bảo vệ mà Dart dựng ra cho bạn.

## Chuyển kiểu

```dart
String soChu = '25';
int so = int.parse(soChu);
double thuc = double.parse('9.5');

int tuoi = 30;
String chu = tuoi.toString();

print(9.7.round());      // 10
print(9.7.toInt());      // 9 - cat phan thap phan
```

## Lỗi hay gặp

| Lỗi | Nghĩa | Cách sửa |
| --- | --- | --- |
| `Expected to find ';'` | Thiếu dấu chấm phẩy | Thêm `;` |
| `The non-nullable variable must be assigned` | Khai báo mà chưa gán | Gán giá trị, hoặc thêm `?` |
| `can't be unconditionally invoked because the receiver can be null` | Gọi method trên biến có thể null | Dùng `?.` hoặc kiểm tra null trước |
| `A value of type 'String' can't be assigned to 'int'` | Gán sai kiểu | Dùng `int.parse()` |

## Bài tập

1. Mở dartpad.dev, in ra tên, tuổi và nơi ở của bạn bằng string interpolation.
2. Khai báo một biến `final` rồi thử gán lại, đọc lỗi.
3. Khai báo `String? ghiChu;` và in ra `ghiChu ?? 'Không có ghi chú'`.
4. Nhập chuỗi `'42'`, chuyển sang số rồi cộng thêm 8.
5. Thử gọi `.length` trên một biến `String?` chưa gán, đọc lỗi và sửa bằng `?.`.
</script>

<script type="text/markdown" data-id="fl-2" data-nav="Bài 2 · Dart: điều kiện và vòng lặp">
# Bài 2 — Dart: toán tử, điều kiện và vòng lặp

**Mục tiêu:** cho chương trình ra quyết định và lặp công việc.

## Toán tử

```dart
int a = 10, b = 3;

print(a + b);     // 13
print(a - b);     // 7
print(a * b);     // 30
print(a / b);     // 3.3333... (luon ra double)
print(a ~/ b);    // 3  - chia lay phan nguyen
print(a % b);     // 1  - chia lay du
```

`~/` là toán tử riêng của Dart, nhiều ngôn ngữ khác không có.

So sánh và logic:

| Toán tử | Nghĩa |
| --- | --- |
| `==` `!=` | Bằng, khác (dùng được cho cả chuỗi) |
| `>` `<` `>=` `<=` | So sánh số |
| `&&` | Và |
| `\|\|` | Hoặc |
| `!` | Phủ định |

Khác Java: trong Dart so sánh chuỗi dùng `==` bình thường, không cần `.equals()`.

## if / else

```dart
int diem = 8;

if (diem >= 8) {
  print('Giỏi');
} else if (diem >= 5) {
  print('Đạt');
} else {
  print('Chưa đạt');
}
```

Viết gọn bằng toán tử ba ngôi — dùng rất nhiều trong Flutter:

```dart
String ketQua = diem >= 5 ? 'Đạt' : 'Chưa đạt';
```

Đọc là: nếu `diem >= 5` thì lấy `'Đạt'`, ngược lại lấy `'Chưa đạt'`.

## switch

```dart
String vaiTro = 'admin';

switch (vaiTro) {
  case 'admin':
    print('Toàn quyền');
  case 'user':
    print('Quyền thường');
  default:
    print('Khách');
}
```

Dart 3 không cần `break` nữa. Viết gọn hơn:

```dart
String mo = switch (vaiTro) {
  'admin' => 'Toàn quyền',
  'user' => 'Quyền thường',
  _ => 'Khách',
};
```

Dấu `_` nghĩa là "các trường hợp còn lại".

## Vòng lặp for

```dart
for (int i = 1; i <= 5; i++) {
  print('Lần $i');
}

// for-in: duyet danh sach
List<String> mon = ['Toán', 'Lý', 'Hoá'];
for (String m in mon) {
  print(m);
}

// forEach
mon.forEach((m) => print(m));
```

Dạng `for-in` là dạng bạn dùng nhiều nhất.

## while và do-while

```dart
int dem = 0;
while (dem < 3) {
  print('Đếm $dem');
  dem++;
}

do {
  print('Chạy ít nhất một lần');
  dem++;
} while (dem < 3);
```

Khác biệt: `do-while` luôn chạy ít nhất một lần, vì nó kiểm tra điều kiện sau khi chạy.

## break và continue

```dart
for (int i = 1; i <= 10; i++) {
  if (i == 3) continue;     // bo qua vong nay
  if (i == 6) break;        // thoat han
  print(i);                 // 1 2 4 5
}
```

## Ví dụ gộp

```dart
void main() {
  List<int> diem = [8, 5, 9, 3, 7];
  int tongDiem = 0;
  int soDat = 0;

  for (int d in diem) {
    tongDiem += d;
    if (d >= 5) soDat++;
  }

  double trungBinh = tongDiem / diem.length;

  print('Trung bình: ${trungBinh.toStringAsFixed(1)}');
  print('Số môn đạt: $soDat/${diem.length}');
  print(trungBinh >= 5 ? 'Qua môn' : 'Học lại');
}
```

`toStringAsFixed(1)` làm tròn còn 1 chữ số thập phân — hay dùng khi hiển thị giá tiền hoặc điểm số trong app.

## Bài tập

1. In các số từ 1 đến 20, số chia hết cho 3 thì in `Fizz` thay cho số.
2. Có `List<int> gia = [25000, 40000, 15000];`, tính tổng và in ra giá cao nhất.
3. Viết chương trình phân loại điểm bằng `switch` kiểu mới của Dart 3.
4. Dùng toán tử ba ngôi in ra `'Còn hàng'` hoặc `'Hết hàng'` dựa trên biến `int soLuong`.
5. Viết vòng `while` cộng dồn 1+2+3... cho đến khi tổng vượt 100, in ra số dừng lại.
</script>

<script type="text/markdown" data-id="fl-3" data-nav="Bài 3 · Dart: List, Map, Set">
# Bài 3 — Dart: List, Map và Set

**Mục tiêu:** chứa nhiều dữ liệu. Trong Flutter, mọi danh sách sản phẩm, danh sách tin nhắn, dữ liệu từ API đều là `List` và `Map`.

## List — danh sách

```dart
List<String> monHoc = ['Toán', 'Lý', 'Hoá'];

print(monHoc[0]);            // Toán - dem tu 0
print(monHoc.length);        // 3
print(monHoc.first);         // Toán
print(monHoc.last);          // Hoá
print(monHoc.isEmpty);       // false

monHoc.add('Sinh');
monHoc.insert(0, 'Văn');
monHoc.remove('Lý');
monHoc.removeAt(0);

print(monHoc.contains('Hoá'));   // true
print(monHoc.indexOf('Hoá'));    // vi tri
```

`List<String>` nghĩa là danh sách chứa chuỗi. Phần trong `< >` cho Dart biết kiểu phần tử, nhờ vậy editor bắt lỗi khi bạn thêm nhầm kiểu.

## Các method biến đổi danh sách

Đây là phần dùng nhiều nhất khi làm app:

```dart
List<int> gia = [25000, 40000, 15000, 60000];

// map: bien doi tung phan tu
List<String> hienThi = gia.map((g) => '$g đ').toList();

// where: loc
List<int> giaRe = gia.where((g) => g < 30000).toList();

// reduce / fold: gop lai thanh mot gia tri
int tong = gia.reduce((a, b) => a + b);

// sort: sap xep
gia.sort();                            // tang dan
gia.sort((a, b) => b.compareTo(a));    // giam dan

// any / every
print(gia.any((g) => g > 50000));      // co cai nao > 50k khong
print(gia.every((g) => g > 10000));    // tat ca deu > 10k chu
```

Nhớ `.toList()` ở cuối `map` và `where` — thiếu nó bạn nhận về một `Iterable`, không phải `List`, và Flutter sẽ báo lỗi kiểu.

## Map — cặp khoá và giá trị

```dart
Map<String, dynamic> sanPham = {
  'ten': 'Áo thun',
  'gia': 150000,
  'conHang': true,
};

print(sanPham['ten']);                       // Áo thun
print(sanPham['mauSac'] ?? 'Chưa có');       // Chưa có

sanPham['mauSac'] = 'Xanh';
sanPham.remove('conHang');

print(sanPham.keys);      // tat ca khoa
print(sanPham.values);    // tat ca gia tri
print(sanPham.containsKey('gia'));

sanPham.forEach((khoa, giaTri) {
  print('$khoa: $giaTri');
});
```

`Map<String, dynamic>` là kiểu bạn gặp liên tục ở Bài 15, vì dữ liệu JSON từ API trả về đúng dạng này.

## List của Map — cấu trúc hay gặp nhất

```dart
List<Map<String, dynamic>> danhSach = [
  {'ten': 'Áo thun', 'gia': 150000},
  {'ten': 'Quần jean', 'gia': 350000},
  {'ten': 'Mũ lưỡi trai', 'gia': 90000},
];

for (var sp in danhSach) {
  print('${sp['ten']}: ${sp['gia']} đ');
}

// loc san pham duoi 200k
var giaRe = danhSach.where((sp) => sp['gia'] < 200000).toList();
print(giaRe.length);
```

## Set — không trùng lặp

```dart
Set<String> the = {'mới', 'giảm giá', 'mới'};
print(the);          // {mới, giảm giá} - tu loai trung
print(the.length);   // 2

List<String> coTrung = ['a', 'b', 'a', 'c'];
print(coTrung.toSet().toList());   // [a, b, c]
```

## Collection if và for — đặc sản của Dart

Viết điều kiện và vòng lặp **ngay trong danh sách**. Flutter dùng cái này rất nhiều để dựng giao diện có điều kiện:

```dart
bool laAdmin = true;

List<String> menu = [
  'Trang chủ',
  'Sản phẩm',
  if (laAdmin) 'Quản trị',          // chi them khi laAdmin = true
  ...['Liên hệ', 'Giới thiệu'],      // ... rai phan tu cua list khac vao
];

print(menu);

// collection for
List<int> so = [1, 2, 3];
List<String> nhan = [for (int s in so) 'Mục $s'];
print(nhan);     // [Mục 1, Mục 2, Mục 3]
```

Dấu `...` gọi là *spread operator*. Bài 8 sẽ dùng nó để ghép các widget vào một cột.

## Bài tập

1. Tạo `List<String>` 5 món đồ, thêm 1, xoá 1, in danh sách cuối cùng.
2. Có `List<int> diem = [8, 5, 9, 3, 7];` — dùng `where` lọc điểm từ 5 trở lên, dùng `reduce` tính tổng.
3. Tạo `Map` mô tả một sản phẩm gồm tên, giá, số lượng. In từng cặp khoá–giá trị.
4. Tạo `List<Map<String, dynamic>>` gồm 4 sản phẩm, sắp xếp theo giá tăng dần rồi in ra.
5. Dùng collection if dựng danh sách menu có mục 'Quản trị' chỉ khi `laAdmin == true`.
</script>

<script type="text/markdown" data-id="fl-4" data-nav="Bài 4 · Dart: hàm">
# Bài 4 — Dart: hàm

**Mục tiêu:** viết hàm với các kiểu tham số của Dart. Flutter dùng hàm ở khắp nơi, nhất là tham số đặt tên.

## Hàm cơ bản

```dart
// Ham khong tra ve gi
void chao(String ten) {
  print('Xin chào $ten');
}

// Ham co tra ve
int cong(int a, int b) {
  return a + b;
}

// Arrow function: than ham chi co 1 dong
int nhan(int a, int b) => a * b;

void main() {
  chao('Trang');
  print(cong(3, 4));
  print(nhan(3, 4));
}
```

`=>` là cách viết tắt của `{ return ...; }`. Flutter dùng dạng này rất nhiều.

## Tham số đặt tên — quan trọng nhất cho Flutter

```dart
void taoUser({
  required String ten,
  int tuoi = 18,
  String? email,
}) {
  print('$ten, $tuoi tuổi, email: ${email ?? "chưa có"}');
}

void main() {
  taoUser(ten: 'Trang');
  taoUser(ten: 'Nam', tuoi: 25, email: 'nam@test.com');
  taoUser(tuoi: 30, ten: 'Lan');     // thu tu khong quan trong
}
```

| Từ khoá | Nghĩa |
| --- | --- |
| `{ }` quanh tham số | Tham số đặt tên — gọi phải ghi `ten:` |
| `required` | Bắt buộc phải truyền |
| `= 18` | Giá trị mặc định nếu không truyền |
| `String?` | Có thể không truyền, mặc định null |

Đây chính là cách mọi widget Flutter nhận tham số:

```dart
Text('Xin chào', style: TextStyle(fontSize: 20))
Container(width: 100, height: 50, color: Colors.blue)
```

Hiểu tham số đặt tên là hiểu được cú pháp Flutter.

## Tham số vị trí tuỳ chọn

```dart
String ghep(String a, [String? b, String? c]) {
  return '$a ${b ?? ""} ${c ?? ""}'.trim();
}

print(ghep('Xin'));                  // Xin
print(ghep('Xin', 'chào', 'bạn'));   // Xin chào bạn
```

Ít dùng hơn tham số đặt tên.

## Hàm là một giá trị

Trong Dart, hàm có thể gán vào biến và truyền vào hàm khác:

```dart
void main() {
  // gan ham vao bien
  var tinh = (int a, int b) => a + b;
  print(tinh(2, 3));

  // truyen ham vao ham khac
  List<int> so = [1, 2, 3];
  so.forEach((s) => print(s * 2));
}
```

Hàm không tên như `(s) => print(s * 2)` gọi là *anonymous function*. Khi bạn viết `onPressed: () { ... }` trong Flutter, đó chính là một anonymous function.

## Callback — hàm chạy khi có việc xảy ra

```dart
void bamNut(String nhan, void Function() khiBam) {
  print('Nút "$nhan" được bấm');
  khiBam();
}

void main() {
  bamNut('Lưu', () {
    print('Đang lưu dữ liệu...');
  });
}
```

`void Function()` là kiểu "hàm không tham số, không trả về". Mọi nút bấm trong Flutter nhận đúng kiểu này.

## Hàm trả về nhiều giá trị

Dart 3 có **record**:

```dart
(String, int) layThongTin() {
  return ('Trang', 30);
}

void main() {
  var (ten, tuoi) = layThongTin();
  print('$ten - $tuoi');
}
```

## Bài tập

1. Viết hàm `tinhTB(List<int> diem)` trả về điểm trung bình kiểu `double`.
2. Viết hàm `taoSanPham({required String ten, required int gia, int soLuong = 1})` in ra thông tin.
3. Viết hàm `xepLoai(double diem)` trả về `'Giỏi'`, `'Khá'`, `'Trung bình'` hoặc `'Yếu'`, dùng arrow function nếu được.
4. Viết hàm nhận một callback và gọi nó 3 lần.
5. Viết hàm trả về record gồm tên và giá của sản phẩm rẻ nhất trong một list.
</script>

<script type="text/markdown" data-id="fl-5" data-nav="Bài 5 · Dart: class và OOP">
# Bài 5 — Dart: class và lập trình hướng đối tượng

**Mục tiêu:** viết class để mô tả dữ liệu. Mọi widget Flutter đều là class, và mọi dữ liệu từ API đều được chuyển thành class.

## Class đầu tiên

```dart
class SanPham {
  String ten;
  int gia;
  bool conHang;

  SanPham(this.ten, this.gia, this.conHang);

  void hienThi() {
    print('$ten - $gia đ - ${conHang ? "Còn hàng" : "Hết hàng"}');
  }
}

void main() {
  var ao = SanPham('Áo thun', 150000, true);
  ao.hienThi();
  print(ao.gia);
}
```

Dòng `SanPham(this.ten, this.gia, this.conHang);` là **constructor** — hàm chạy khi tạo đối tượng. Cú pháp `this.ten` là cách viết tắt của Dart: nhận tham số và gán thẳng vào thuộc tính.

Dart không cần từ khoá `new`, viết `SanPham(...)` là đủ.

## Constructor với tham số đặt tên

Đây mới là dạng bạn dùng trong Flutter:

```dart
class SanPham {
  final String ten;
  final int gia;
  final int soLuong;

  SanPham({
    required this.ten,
    required this.gia,
    this.soLuong = 1,
  });

  int get thanhTien => gia * soLuong;
}

void main() {
  var ao = SanPham(ten: 'Áo thun', gia: 150000, soLuong: 2);
  print(ao.thanhTien);    // 300000
}
```

Để thuộc tính là `final` khi dữ liệu không đổi sau khi tạo — an toàn hơn và giúp Flutter tối ưu.

`get thanhTien` là **getter**: một giá trị tính ra từ các thuộc tính khác, gọi như thuộc tính chứ không phải method (không có dấu ngoặc).

## Chuyển đổi với JSON

Phần quan trọng nhất của bài này — Bài 15 sẽ dùng liên tục:

```dart
class SanPham {
  final String ten;
  final int gia;

  SanPham({required this.ten, required this.gia});

  // Tu Map (JSON) sang object
  factory SanPham.fromJson(Map<String, dynamic> json) {
    return SanPham(
      ten: json['ten'] ?? '',
      gia: json['gia'] ?? 0,
    );
  }

  // Tu object sang Map
  Map<String, dynamic> toJson() {
    return {'ten': ten, 'gia': gia};
  }
}

void main() {
  var json = {'ten': 'Áo thun', 'gia': 150000};
  var sp = SanPham.fromJson(json);
  print(sp.ten);
  print(sp.toJson());
}
```

`factory` là constructor đặc biệt, cho phép xử lý trước khi trả về đối tượng. Dùng `?? ''` và `?? 0` để app không crash khi API thiếu trường.

## Kế thừa

```dart
class NguoiDung {
  final String ten;
  NguoiDung(this.ten);

  void gioiThieu() {
    print('Tôi là $ten');
  }
}

class Admin extends NguoiDung {
  final List<String> quyen;

  Admin(String ten, this.quyen) : super(ten);

  @override
  void gioiThieu() {
    super.gioiThieu();
    print('Tôi có ${quyen.length} quyền');
  }
}

void main() {
  var a = Admin('Trang', ['xoa', 'sua']);
  a.gioiThieu();
}
```

| Từ khoá | Nghĩa |
| --- | --- |
| `extends` | Kế thừa class khác |
| `super(...)` | Gọi constructor của class cha |
| `@override` | Viết đè method của class cha |
| `super.method()` | Gọi method gốc của class cha |

Khi viết Flutter bạn sẽ gõ `extends StatelessWidget` và `@override Widget build(...)` ở mọi màn hình.

## abstract class

```dart
abstract class HinhHoc {
  double dienTich();       // chua co than ham

  void inRa() {
    print('Diện tích: ${dienTich()}');
  }
}

class HinhTron extends HinhHoc {
  final double banKinh;
  HinhTron(this.banKinh);

  @override
  double dienTich() => 3.14 * banKinh * banKinh;
}
```

`abstract` nghĩa là không tạo đối tượng trực tiếp được, chỉ dùng để class khác kế thừa. Nó bắt class con phải viết các method chưa có thân.

## copyWith — mẫu rất hay dùng

Tạo bản sao với vài trường đổi:

```dart
class SanPham {
  final String ten;
  final int gia;

  SanPham({required this.ten, required this.gia});

  SanPham copyWith({String? ten, int? gia}) {
    return SanPham(
      ten: ten ?? this.ten,
      gia: gia ?? this.gia,
    );
  }
}

void main() {
  var ao = SanPham(ten: 'Áo thun', gia: 150000);
  var aoGiamGia = ao.copyWith(gia: 99000);
  print('${aoGiamGia.ten} - ${aoGiamGia.gia}');
}
```

Bài 14 sẽ dùng `copyWith` khi quản lý state.

## Bài tập

1. Viết class `SinhVien` có tên, tuổi, danh sách điểm; thêm getter `diemTB`.
2. Viết constructor dùng tham số đặt tên với `required` và giá trị mặc định.
3. Thêm `fromJson` và `toJson` cho class đó.
4. Viết `abstract class ConVat` có method `keu()`, rồi tạo `Cho` và `Meo` kế thừa nó.
5. Thêm `copyWith` cho class `SanPham` và tạo một bản sao đổi giá.
</script>

<script type="text/markdown" data-id="fl-6" data-nav="Bài 6 · Dart: async và Future">
# Bài 6 — Dart: async, await và Future

**Mục tiêu:** xử lý việc mất thời gian — gọi API, đọc file, truy vấn database. Không hiểu phần này thì không gọi được API ở Bài 15.

## Vấn đề

Gọi API mất 1–2 giây. Nếu chương trình đứng chờ, app sẽ đơ, người dùng bấm gì cũng không được. Dart giải quyết bằng cách cho việc đó chạy nền và báo lại khi xong.

## Future — một giá trị sẽ có trong tương lai

```dart
Future<String> layTenNguoiDung() async {
  await Future.delayed(Duration(seconds: 2));    // gia lap goi API
  return 'Trang';
}

void main() async {
  print('Bắt đầu');
  String ten = await layTenNguoiDung();
  print('Tên: $ten');
  print('Kết thúc');
}
```

Kết quả: in `Bắt đầu`, chờ 2 giây, rồi in `Tên: Trang` và `Kết thúc`.

| Từ khoá | Nghĩa |
| --- | --- |
| `Future<String>` | Hứa sẽ trả về một `String`, nhưng chưa có ngay |
| `async` | Đánh dấu hàm này có việc chờ bên trong |
| `await` | Dừng ở đây, chờ kết quả rồi mới chạy tiếp |

Quy tắc: **có `await` thì hàm phải có `async`.** Thiếu `async` là lỗi ngay.

## Quên await thì sao

```dart
void main() async {
  String ten = await layTenNguoiDung();   // Trang
  var ten2 = layTenNguoiDung();           // Instance of 'Future<String>'
  print(ten2);
}
```

Không `await` thì bạn nhận về cái hộp, không phải giá trị bên trong. Đây là lỗi phổ biến nhất khi mới học async.

## Bắt lỗi

```dart
Future<String> layDuLieu() async {
  await Future.delayed(Duration(seconds: 1));
  throw Exception('Mất kết nối mạng');
}

void main() async {
  try {
    String kq = await layDuLieu();
    print(kq);
  } catch (e) {
    print('Lỗi: $e');
  } finally {
    print('Đã xử lý xong');
  }
}
```

Mọi lệnh gọi API trong app thật đều phải bọc `try/catch`. Thiếu nó, mạng yếu là app crash.

## Chạy nhiều việc cùng lúc

```dart
void main() async {
  // Cach cham: 3 giay
  var a = await viecMotGiay();
  var b = await viecMotGiay();
  var c = await viecMotGiay();

  // Cach nhanh: 1 giay - chay song song
  var kq = await Future.wait([
    viecMotGiay(),
    viecMotGiay(),
    viecMotGiay(),
  ]);
  print(kq);
}
```

`Future.wait` dùng khi màn hình cần gọi nhiều API độc lập nhau — ví dụ vừa lấy danh sách sản phẩm vừa lấy thông tin người dùng.

## Stream — nhiều giá trị theo thời gian

`Future` trả về **một** giá trị. `Stream` trả về **nhiều** giá trị liên tiếp — như tin nhắn mới, vị trí GPS, dữ liệu realtime.

```dart
Stream<int> demNguoc(int tu) async* {
  for (int i = tu; i >= 0; i--) {
    await Future.delayed(Duration(seconds: 1));
    yield i;                  // phat ra mot gia tri
  }
}

void main() async {
  await for (int so in demNguoc(3)) {
    print(so);                // 3, 2, 1, 0 - moi giay mot so
  }
}
```

| Khái niệm | Future | Stream |
| --- | --- | --- |
| Trả về | Một giá trị | Nhiều giá trị theo thời gian |
| Khai báo hàm | `async` | `async*` |
| Trả giá trị | `return` | `yield` |
| Nhận giá trị | `await` | `await for` |
| Widget tương ứng | `FutureBuilder` | `StreamBuilder` |

Bài 15 dùng `FutureBuilder`; Bài 22 dùng `StreamBuilder` khi lấy dữ liệu realtime từ Firebase.

## Ví dụ gần với app thật

```dart
class SanPham {
  final String ten;
  final int gia;
  SanPham(this.ten, this.gia);
}

Future<List<SanPham>> taiSanPham() async {
  await Future.delayed(Duration(seconds: 2));
  return [
    SanPham('Áo thun', 150000),
    SanPham('Quần jean', 350000),
  ];
}

void main() async {
  print('Đang tải...');
  try {
    var ds = await taiSanPham();
    for (var sp in ds) {
      print('${sp.ten}: ${sp.gia} đ');
    }
  } catch (e) {
    print('Không tải được: $e');
  }
}
```

Đúng cấu trúc bạn sẽ viết ở Bài 15, chỉ khác là thay `Future.delayed` bằng lệnh gọi API thật.

## Bài tập

1. Viết hàm `Future<int> tinhTong()` chờ 1 giây rồi trả về tổng của một list.
2. Gọi hàm đó cả có `await` lẫn không `await`, so sánh kết quả in ra.
3. Viết hàm ném lỗi và bắt bằng `try/catch/finally`.
4. Dùng `Future.wait` chạy 3 hàm cùng lúc, đo thời gian bằng `DateTime.now()`.
5. Viết `Stream` phát ra 5 số ngẫu nhiên, mỗi giây một số, và in ra bằng `await for`.
</script>

<script type="text/markdown" data-id="fl-7" data-nav="Bài 7 · Widget đầu tiên">
# Bài 7 — Widget: viên gạch của Flutter

**Mục tiêu:** hiểu widget và tự viết màn hình đầu tiên. Từ bài này trở đi là Flutter thật.

## Mọi thứ đều là widget

Chữ, nút, ảnh, khoảng trắng, cả màn hình — đều là widget. Giao diện Flutter là một **cây widget**: widget chứa widget khác.

```text
MaterialApp
└── Scaffold
    ├── AppBar
    │   └── Text('Trang chủ')
    └── Center
        └── Text('Xin chào')
```

## App đầu tiên viết tay

Xoá hết `lib/main.dart` và thay bằng:

```dart
import 'package:flutter/material.dart';

void main() {
  runApp(const MyApp());
}

class MyApp extends StatelessWidget {
  const MyApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'App đầu tiên',
      theme: ThemeData(
        colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
        useMaterial3: true,
      ),
      home: const TrangChu(),
    );
  }
}

class TrangChu extends StatelessWidget {
  const TrangChu({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Trang chủ'),
      ),
      body: const Center(
        child: Text(
          'Xin chào Flutter!',
          style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold),
        ),
      ),
    );
  }
}
```

Chạy `flutter run`.

## Giải thích từng phần

| Dòng | Nghĩa |
| --- | --- |
| `import 'package:flutter/material.dart'` | Nạp bộ widget Material Design, luôn có ở mọi file |
| `runApp(...)` | Khởi động app với widget gốc |
| `extends StatelessWidget` | Widget không có trạng thái thay đổi |
| `const MyApp({super.key})` | Constructor chuẩn của widget |
| `Widget build(BuildContext context)` | Hàm vẽ ra giao diện, Flutter tự gọi |
| `MaterialApp` | Widget gốc, cấu hình theme và điều hướng |
| `Scaffold` | Khung một màn hình: appBar, body, nút nổi, menu |
| `AppBar` | Thanh tiêu đề trên cùng |
| `body` | Phần nội dung chính |
| `Center` | Căn giữa widget con |

`build` là hàm quan trọng nhất: Flutter gọi nó mỗi khi cần vẽ lại màn hình.

## Scaffold — khung một màn hình

```dart
Scaffold(
  appBar: AppBar(title: const Text('Tiêu đề')),
  body: const Center(child: Text('Nội dung')),
  floatingActionButton: FloatingActionButton(
    onPressed: () {},
    child: const Icon(Icons.add),
  ),
  bottomNavigationBar: BottomNavigationBar(
    items: const [
      BottomNavigationBarItem(icon: Icon(Icons.home), label: 'Trang chủ'),
      BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Cá nhân'),
    ],
  ),
)
```

## Vì sao có const ở khắp nơi

```dart
const Text('Xin chào')      // tot
Text('Xin chào')            // chay duoc nhung cham hon
```

`const` nói với Flutter: widget này không bao giờ đổi, không cần vẽ lại. Thêm `const` ở đâu được thì thêm — VS Code tự gợi ý.

Chỉ dùng `const` khi mọi giá trị bên trong đều cố định. `Text(ten)` với `ten` là biến thì không `const` được.

## Tách widget thành class riêng

Đừng viết một hàm `build` dài 300 dòng. Tách ra:

```dart
class TheSanPham extends StatelessWidget {
  final String ten;
  final int gia;

  const TheSanPham({super.key, required this.ten, required this.gia});

  @override
  Widget build(BuildContext context) {
    return Card(
      child: ListTile(
        title: Text(ten),
        subtitle: Text('$gia đ'),
        trailing: const Icon(Icons.chevron_right),
      ),
    );
  }
}
```

Dùng:

```dart
body: Column(
  children: const [
    TheSanPham(ten: 'Áo thun', gia: 150000),
    TheSanPham(ten: 'Quần jean', gia: 350000),
  ],
)
```

Đây chính là class và tham số đặt tên ở Bài 4 và 5 — giờ bạn thấy nó dùng để làm gì.

## Xem cây widget

Flutter DevTools cho bạn nhìn toàn bộ cây widget đang chạy. Trong VS Code: mở Command Palette (Ctrl+Shift+P) → **Flutter: Open DevTools** → tab **Widget Inspector**.

Rất hữu ích khi giao diện hiển thị sai mà bạn không biết widget nào gây ra.

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `No MaterialLocalizations found` | Dùng widget Material ngoài `MaterialApp` | Bọc trong `MaterialApp` |
| `Scaffold.of() called with a context that does not contain a Scaffold` | Gọi sai chỗ | Tách widget con ra class riêng |
| `The argument type 'Widget' can't be assigned to 'List<Widget>'` | `children:` nhận list, bạn truyền một widget | Bọc trong `[ ]` |
| Màn hình trắng trơn | Quên `home:` hoặc `body:` | Kiểm tra cấu trúc |

## Bài tập

1. Viết lại `main.dart` theo mẫu trên, đổi tiêu đề và nội dung thành của bạn.
2. Đổi `seedColor` sang màu khác, xem toàn bộ app đổi tông màu.
3. Thêm `floatingActionButton` hình dấu cộng.
4. Tạo widget `TheSanPham` riêng và hiển thị 3 sản phẩm.
5. Mở DevTools và tìm widget `Text` của bạn trong cây widget.
</script>

<script type="text/markdown" data-id="fl-8" data-nav="Bài 8 · Layout: sắp xếp giao diện">
# Bài 8 — Layout: sắp xếp widget trên màn hình

**Mục tiêu:** đặt widget đúng chỗ mình muốn. Đây là bài quyết định bạn dựng được giao diện hay không.

## Column và Row — hai widget quan trọng nhất

```dart
// Xep doc
Column(
  children: const [
    Text('Dòng 1'),
    Text('Dòng 2'),
    Text('Dòng 3'),
  ],
)

// Xep ngang
Row(
  children: const [
    Icon(Icons.star),
    Text('4.5'),
    Text('(120 đánh giá)'),
  ],
)
```

## Căn chỉnh trong Column và Row

```dart
Column(
  mainAxisAlignment: MainAxisAlignment.center,      // doc: tren-duoi
  crossAxisAlignment: CrossAxisAlignment.start,     // ngang: trai-phai
  children: [...],
)
```

Quy tắc dễ nhớ:

| Widget | mainAxis | crossAxis |
| --- | --- | --- |
| `Column` | Dọc (trên–dưới) | Ngang (trái–phải) |
| `Row` | Ngang (trái–phải) | Dọc (trên–dưới) |

Giá trị hay dùng:

| Giá trị | Kết quả |
| --- | --- |
| `start` | Dồn về đầu |
| `center` | Vào giữa |
| `end` | Dồn về cuối |
| `spaceBetween` | Dàn đều, sát hai mép |
| `spaceEvenly` | Dàn đều kể cả hai đầu |
| `spaceAround` | Dàn đều, hai đầu nửa khoảng |

```dart
// Ten san pham ben trai, gia ben phai
Row(
  mainAxisAlignment: MainAxisAlignment.spaceBetween,
  children: const [
    Text('Áo thun'),
    Text('150.000 đ'),
  ],
)
```

## Container — hộp vạn năng

```dart
Container(
  width: 200,
  height: 100,
  padding: const EdgeInsets.all(16),
  margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
  decoration: BoxDecoration(
    color: Colors.teal.shade50,
    borderRadius: BorderRadius.circular(12),
    border: Border.all(color: Colors.teal),
    boxShadow: const [
      BoxShadow(color: Colors.black12, blurRadius: 6, offset: Offset(0, 2)),
    ],
  ),
  child: const Text('Nội dung'),
)
```

| Thuộc tính | Nghĩa |
| --- | --- |
| `padding` | Khoảng cách **bên trong**, giữa viền và nội dung |
| `margin` | Khoảng cách **bên ngoài**, đẩy các widget khác ra |
| `decoration` | Màu nền, bo góc, viền, đổ bóng |

Lưu ý: đặt `color` cùng lúc với `decoration` sẽ báo lỗi. Có `decoration` thì màu đặt bên trong nó.

Cách viết EdgeInsets:

```dart
EdgeInsets.all(16)                                 // 4 phia
EdgeInsets.symmetric(horizontal: 16, vertical: 8)  // ngang/doc
EdgeInsets.only(left: 16, top: 8)                  // tung phia
```

## Expanded và Flexible — chia không gian

```dart
Row(
  children: [
    Expanded(
      flex: 2,
      child: Container(height: 100, color: Colors.teal),
    ),
    Expanded(
      flex: 1,
      child: Container(height: 100, color: Colors.orange),
    ),
  ],
)
```

`Expanded` bảo widget chiếm hết chỗ còn trống. `flex: 2` và `flex: 1` nghĩa là chia theo tỷ lệ 2:1.

Đây cũng là cách sửa lỗi tràn phổ biến nhất: `Text` dài trong `Row` bị tràn thì bọc nó trong `Expanded`.

## SizedBox — khoảng trống và kích thước

```dart
const SizedBox(height: 16)      // khoang cach doc
const SizedBox(width: 8)        // khoang cach ngang
SizedBox(
  width: double.infinity,        // rong het man hinh
  child: ElevatedButton(onPressed: () {}, child: const Text('Lưu')),
)
```

`SizedBox` nhẹ hơn `Container` khi chỉ cần tạo khoảng trống. Dùng nó thay vì `Container(height: 16)`.

## Stack — chồng lớp

```dart
Stack(
  children: [
    Image.network('https://picsum.photos/400/200'),
    Positioned(
      right: 8,
      top: 8,
      child: Container(
        padding: const EdgeInsets.all(6),
        color: Colors.red,
        child: const Text('-20%', style: TextStyle(color: Colors.white)),
      ),
    ),
  ],
)
```

Dùng cho nhãn giảm giá đè lên ảnh, nút đè lên bản đồ, avatar có chấm online.

## SingleChildScrollView — cho nội dung dài

`Column` không tự cuộn. Nội dung dài hơn màn hình sẽ báo lỗi tràn:

```dart
SingleChildScrollView(
  child: Column(
    children: [ ... nhieu widget ... ],
  ),
)
```

Danh sách nhiều phần tử thì dùng `ListView` ở Bài 10 thay vì cách này.

## Ví dụ: thẻ sản phẩm hoàn chỉnh

```dart
Card(
  margin: const EdgeInsets.all(12),
  child: Padding(
    padding: const EdgeInsets.all(12),
    child: Row(
      children: [
        ClipRRect(
          borderRadius: BorderRadius.circular(8),
          child: Image.network(
            'https://picsum.photos/80',
            width: 80,
            height: 80,
            fit: BoxFit.cover,
          ),
        ),
        const SizedBox(width: 12),
        Expanded(
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: const [
              Text('Áo thun cotton',
                  style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
              SizedBox(height: 4),
              Text('Còn 12 sản phẩm',
                  style: TextStyle(color: Colors.grey, fontSize: 13)),
              SizedBox(height: 8),
              Text('150.000 đ',
                  style: TextStyle(color: Colors.teal, fontWeight: FontWeight.bold)),
            ],
          ),
        ),
      ],
    ),
  ),
)
```

Đọc kỹ ví dụ này: nó gộp `Card`, `Padding`, `Row`, `Expanded`, `Column`, `SizedBox` — đúng những thứ bạn dùng 90% thời gian.

## Lỗi tràn — lỗi phổ biến nhất

Màn hình hiện sọc vàng đen kèm dòng `RenderFlex overflowed by 42 pixels`:

| Tình huống | Cách sửa |
| --- | --- |
| `Text` dài trong `Row` | Bọc `Expanded` |
| `Column` dài hơn màn hình | Bọc `SingleChildScrollView` |
| Ảnh quá to | Đặt `width`, `height` và `fit: BoxFit.cover` |
| Bàn phím đẩy giao diện lên | Bọc `SingleChildScrollView`, hoặc dùng `ListView` |

## Bài tập

1. Dựng màn hình có tiêu đề ở giữa, 3 nút xếp dọc cách nhau 16px.
2. Dùng `Row` + `spaceBetween` đặt tên sản phẩm bên trái, giá bên phải.
3. Dùng `Expanded` với `flex` 2:1 chia màn hình thành hai khối màu.
4. Dựng lại thẻ sản phẩm ở ví dụ trên.
5. Cố tình tạo lỗi tràn bằng một `Text` rất dài trong `Row`, rồi sửa bằng `Expanded`.
</script>

# Bài 9 — Hiển thị nội dung và theme

**Mục tiêu:** trình bày chữ, ảnh, icon cho đẹp và thống nhất toàn app.

## Text và kiểu chữ

```dart
Text(
  'Áo thun cotton',
  style: TextStyle(
    fontSize: 18,
    fontWeight: FontWeight.bold,      // w100 den w900, hoac bold/normal
    color: Colors.teal,
    letterSpacing: 0.5,
    height: 1.5,                       // gian dong
    fontStyle: FontStyle.italic,
    decoration: TextDecoration.lineThrough,
  ),
  maxLines: 2,
  overflow: TextOverflow.ellipsis,     // dai qua thi hien ...
  textAlign: TextAlign.center,
)
```

`maxLines` + `overflow` là cặp bắt buộc khi hiển thị nội dung từ API — tên sản phẩm dài bất ngờ sẽ làm vỡ giao diện.

## Dùng style từ theme

Thay vì gõ `fontSize` ở mọi chỗ, lấy từ theme:

```dart
Text('Tiêu đề', style: Theme.of(context).textTheme.headlineSmall)
Text('Nội dung', style: Theme.of(context).textTheme.bodyMedium)
```

Sửa theme một chỗ thì cả app đổi theo. Đây là cách làm đúng cho app thật.

## Text nhiều kiểu trong một dòng

```dart
RichText(
  text: TextSpan(
    style: DefaultTextStyle.of(context).style,
    children: const [
      TextSpan(text: 'Tổng: '),
      TextSpan(
        text: '450.000 đ',
        style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red),
      ),
    ],
  ),
)
```

## Ảnh

```dart
// Anh tu mang
Image.network(
  'https://picsum.photos/400/200',
  width: double.infinity,
  height: 200,
  fit: BoxFit.cover,
  loadingBuilder: (context, child, progress) {
    if (progress == null) return child;
    return const Center(child: CircularProgressIndicator());
  },
  errorBuilder: (context, error, stack) =>
      const Icon(Icons.broken_image, size: 48),
)

// Anh trong app (Bai 19 se huong dan khai bao)
Image.asset('assets/images/logo.png', width: 120)
```

Luôn có `errorBuilder` cho ảnh mạng. Link hỏng mà không xử lý thì màn hình hiện ô lỗi xấu, hoặc app văng.

| `fit` | Kết quả |
| --- | --- |
| `BoxFit.cover` | Lấp đầy khung, cắt phần thừa — dùng nhiều nhất |
| `BoxFit.contain` | Hiện trọn ảnh, có thể còn chỗ trống |
| `BoxFit.fill` | Kéo giãn cho vừa, ảnh bị méo |

Bo góc ảnh:

```dart
ClipRRect(
  borderRadius: BorderRadius.circular(12),
  child: Image.network(url, fit: BoxFit.cover),
)
```

## Icon

```dart
const Icon(Icons.shopping_cart, size: 28, color: Colors.teal)
const Icon(Icons.favorite_border)
const Icon(Icons.star, color: Colors.amber)
```

Gõ `Icons.` trong editor rồi xem gợi ý — có hàng nghìn icon sẵn, không cần cài gì.

## Card và ListTile

```dart
Card(
  elevation: 2,
  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
  child: ListTile(
    leading: const CircleAvatar(child: Icon(Icons.person)),
    title: const Text('Nguyễn Văn A'),
    subtitle: const Text('Đơn hàng #1234'),
    trailing: const Icon(Icons.chevron_right),
    onTap: () {},
  ),
)
```

`ListTile` dựng sẵn bố cục "icon bên trái, hai dòng chữ ở giữa, icon bên phải" — dùng cho danh sách, menu, cài đặt. Tiết kiệm rất nhiều code.

## Theme — thống nhất toàn app

```dart
MaterialApp(
  theme: ThemeData(
    colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
    useMaterial3: true,
    appBarTheme: const AppBarTheme(centerTitle: true),
    elevatedButtonTheme: ElevatedButtonThemeData(

`ColorScheme.fromSeed` sinh ra cả bảng màu hài hoà từ một màu gốc. Đây là cách nhanh nhất để app trông chuyên nghiệp.

Lấy màu từ theme trong widget:

```dart
Container(color: Theme.of(context).colorScheme.primary)
Text('abc', style: TextStyle(color: Theme.of(context).colorScheme.onSurface))
```

## Màu

```dart
Colors.teal
Colors.teal.shade700
Colors.black54                      // den 54% do dam

4. Đổi `seedColor` và thêm `darkTheme`, bật chế độ tối trên máy ảo để kiểm tra.

<script type="text/markdown" data-id="fl-10" data-nav="Bài 10 · ListView và GridView">
# Bài 10 — Danh sách: ListView và GridView

**Mục tiêu:** hiển thị danh sách dài mượt mà. Gần như app nào cũng có ít nhất một danh sách.

## ListView đơn giản

```dart
ListView(
  children: const [
    ListTile(title: Text('Mục 1')),
    ListTile(title: Text('Mục 2')),
    ListTile(title: Text('Mục 3')),
  ],
)
```

Dùng khi biết trước số phần tử và số đó nhỏ. `ListView` tự cuộn được, khác `Column`.

## ListView.builder — dạng dùng nhiều nhất

```dart
class DanhSachSanPham extends StatelessWidget {
  final List<Map<String, dynamic>> sanPham = const [
    {'ten': 'Áo thun', 'gia': 150000},
    {'ten': 'Quần jean', 'gia': 350000},
    {'ten': 'Mũ lưỡi trai', 'gia': 90000},
  ];

  const DanhSachSanPham({super.key});

  @override
  Widget build(BuildContext context) {
    return ListView.builder(
      itemCount: sanPham.length,
      itemBuilder: (context, index) {
        final sp = sanPham[index];
        return Card(
          margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
          child: ListTile(
            leading: CircleAvatar(child: Text('${index + 1}')),
            title: Text(sp['ten']),
            subtitle: Text('${sp['gia']} đ'),
            trailing: const Icon(Icons.chevron_right),
            onTap: () {},
          ),
        );
      },
    );
  }
}
```

Vì sao `builder` tốt hơn: nó **chỉ dựng những phần tử đang nhìn thấy**. Danh sách 10.000 sản phẩm vẫn mượt, vì Flutter chỉ vẽ khoảng 10 cái trên màn hình.

| Tham số | Nghĩa |
| --- | --- |
| `itemCount` | Tổng số phần tử |
| `itemBuilder` | Hàm dựng widget cho phần tử thứ `index` |
| `index` | Số thứ tự, đếm từ 0 |

## ListView.separated — có đường kẻ giữa các mục

```dart
ListView.separated(
  itemCount: sanPham.length,
  separatorBuilder: (context, index) => const Divider(height: 1),
  itemBuilder: (context, index) => ListTile(title: Text(sanPham[index]['ten'])),
)
```

## GridView — dạng lưới

```dart
GridView.builder(
  padding: const EdgeInsets.all(12),
  gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
    crossAxisCount: 2,          // 2 cot
    crossAxisSpacing: 12,
    mainAxisSpacing: 12,
    childAspectRatio: 0.75,     // ty le rong/cao cua moi o
  ),
  itemCount: sanPham.length,
  itemBuilder: (context, index) {
    return Card(
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.stretch,
        children: [
          Expanded(
            child: Image.network(
              'https://picsum.photos/200?random=$index',
              fit: BoxFit.cover,
            ),
          ),
          Padding(
            padding: const EdgeInsets.all(8),
            child: Text(sanPham[index]['ten']),
          ),
        ],
      ),
    );
  },
)
```

`childAspectRatio` nhỏ hơn 1 nghĩa là ô cao hơn rộng. Chỉnh số này khi nội dung bị tràn trong ô lưới.

## Danh sách ngang

```dart
SizedBox(
  height: 120,
  child: ListView.builder(
    scrollDirection: Axis.horizontal,
    itemCount: 10,
    itemBuilder: (context, index) => Container(
      width: 100,
      margin: const EdgeInsets.all(8),
      color: Colors.teal.shade100,
      child: Center(child: Text('$index')),
    ),
  ),
)
```

Danh sách ngang **bắt buộc có chiều cao cố định**, thường bọc trong `SizedBox`. Thiếu là lỗi ngay.

## Kéo để làm mới

```dart
RefreshIndicator(
  onRefresh: () async {
    await Future.delayed(const Duration(seconds: 1));
    // tai lai du lieu
  },
  child: ListView.builder(...),
)
```

## Danh sách rỗng

Luôn xử lý trường hợp không có dữ liệu:

```dart
sanPham.isEmpty
    ? const Center(
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(Icons.inbox, size: 64, color: Colors.grey),
            SizedBox(height: 12),
            Text('Chưa có sản phẩm nào'),
          ],
        ),
      )
    : ListView.builder(...)
```

Màn hình trắng trơn khi chưa có dữ liệu là lỗi trải nghiệm hay gặp nhất ở app của người mới. Bài 18 nói kỹ hơn.

## ListView lồng trong Column

Lỗi kinh điển: đặt `ListView` trong `Column` sẽ báo lỗi vì cả hai đều muốn chiếm chiều cao vô hạn.

```dart
Column(
  children: [
    const Text('Tiêu đề'),
    Expanded(                   // bat buoc
      child: ListView.builder(...),
    ),
  ],
)
```

Nếu danh sách ngắn và không cần cuộn riêng:

```dart
ListView.builder(
  shrinkWrap: true,
  physics: const NeverScrollableScrollPhysics(),
  ...
)
```

Chỉ dùng `shrinkWrap` cho danh sách ngắn — với danh sách dài nó làm mất ưu điểm hiệu năng của `builder`.

## Bài tập

1. Tạo `List` 20 sản phẩm bằng vòng lặp, hiển thị bằng `ListView.builder`.
2. Đổi sang `ListView.separated` có `Divider` giữa các mục.
3. Hiển thị cùng danh sách đó bằng `GridView` 2 cột, chỉnh `childAspectRatio` cho vừa.
4. Thêm danh sách ngang các danh mục ở đầu màn hình.
5. Thêm trạng thái rỗng và `RefreshIndicator` cho danh sách.
</script>

<script type="text/markdown" data-id="fl-11" data-nav="Bài 11 · StatefulWidget và setState">
# Bài 11 — StatefulWidget: giao diện thay đổi được

**Mục tiêu:** làm giao diện phản ứng với thao tác người dùng. Đây là bước ngoặt từ "màn hình tĩnh" sang "app thật".

## Hai loại widget

| | StatelessWidget | StatefulWidget |
| --- | --- | --- |
| Dữ liệu đổi được | Không | Có |
| Dùng cho | Hiển thị cố định | Bộ đếm, form, danh sách thay đổi, tải dữ liệu |
| Cách vẽ lại | Không cần | Gọi `setState()` |

Nguyên tắc: dùng `StatelessWidget` trước, chỉ đổi sang `StatefulWidget` khi thật sự cần thay đổi.

## StatefulWidget đầu tiên

```dart
class BoDem extends StatefulWidget {
  const BoDem({super.key});

  @override
  State<BoDem> createState() => _BoDemState();
}

class _BoDemState extends State<BoDem> {
  int _dem = 0;

  void _tang() {
    setState(() {
      _dem++;
    });
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Bộ đếm')),
      body: Center(
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Text('Đã bấm $_dem lần',
                style: const TextStyle(fontSize: 24)),
            const SizedBox(height: 16),
            ElevatedButton(
              onPressed: _tang,
              child: const Text('Bấm tôi'),
            ),
          ],
        ),
      ),
    );
  }
}
```

Cấu trúc gồm hai class: class widget và class state. Trong VS Code gõ `stful` rồi Tab, editor sinh sẵn khung này.

Dấu `_` đầu tên (`_dem`, `_BoDemState`) nghĩa là **riêng tư trong file** — quy ước của Dart.

## setState làm gì

```dart
// SAI: doi gia tri nhung man hinh khong doi
_dem++;

// DUNG: doi gia tri va bao Flutter ve lai
setState(() {
  _dem++;
});
```

`setState` báo cho Flutter: dữ liệu đã đổi, hãy chạy lại `build`. Quên `setState` là lỗi phổ biến nhất của người mới — code đúng, giá trị đổi thật, nhưng màn hình đứng im.

Đặt **mọi lệnh thay đổi dữ liệu** vào trong `setState`, đừng để ngoài.

## Ví dụ thực tế: giỏ hàng

```dart
class GioHang extends StatefulWidget {
  const GioHang({super.key});

  @override
  State<GioHang> createState() => _GioHangState();
}

class _GioHangState extends State<GioHang> {
  final List<Map<String, dynamic>> _gio = [];

  void _them(String ten, int gia) {
    setState(() {
      _gio.add({'ten': ten, 'gia': gia});
    });
  }

  void _xoa(int index) {
    setState(() {
      _gio.removeAt(index);
    });
  }

  int get _tong => _gio.fold(0, (tong, sp) => tong + (sp['gia'] as int));

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: Text('Giỏ hàng (${_gio.length})')),
      body: _gio.isEmpty
          ? const Center(child: Text('Giỏ hàng trống'))
          : ListView.builder(
              itemCount: _gio.length,
              itemBuilder: (context, index) => ListTile(
                title: Text(_gio[index]['ten']),
                subtitle: Text('${_gio[index]['gia']} đ'),
                trailing: IconButton(
                  icon: const Icon(Icons.delete_outline),
                  onPressed: () => _xoa(index),
                ),
              ),
            ),
      bottomNavigationBar: Padding(
        padding: const EdgeInsets.all(16),
        child: Text('Tổng: $_tong đ',
            style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
      ),
      floatingActionButton: FloatingActionButton(
        onPressed: () => _them('Sản phẩm ${_gio.length + 1}', 100000),
        child: const Icon(Icons.add),
      ),
    );
  }
}
```

Bài này gộp đủ: `StatefulWidget`, `setState`, `ListView.builder`, trạng thái rỗng, getter tính tổng.

## Vòng đời của State

```dart
class _ManHinhState extends State<ManHinh> {
  @override
  void initState() {
    super.initState();
    // Chay MOT LAN khi widget duoc tao
    // Dung de: tai du lieu lan dau, khoi tao controller
  }

  @override
  void dispose() {
    // Chay khi widget bi huy
    // Dung de: huy controller, dong stream
    super.dispose();
  }

  @override
  Widget build(BuildContext context) => const SizedBox();
}
```

| Method | Chạy khi nào | Dùng để |
| --- | --- | --- |
| `initState` | Một lần, lúc tạo | Tải dữ liệu lần đầu |
| `build` | Mỗi lần vẽ lại | Dựng giao diện |
| `dispose` | Lúc huỷ | Dọn dẹp, tránh rò rỉ bộ nhớ |

Quên `dispose` các controller là nguyên nhân rò rỉ bộ nhớ thường gặp. Bài 12 sẽ dùng đến.

## Truyền dữ liệu từ widget vào state

```dart
class ChiTiet extends StatefulWidget {
  final String ten;
  const ChiTiet({super.key, required this.ten});

  @override
  State<ChiTiet> createState() => _ChiTietState();
}

class _ChiTietState extends State<ChiTiet> {
  @override
  Widget build(BuildContext context) {
    return Text(widget.ten);     // dung widget. de lay tham so
  }
}
```

Trong class state, truy cập tham số của widget qua `widget.<tên>`.

## Lỗi hay gặp

| Hiện tượng | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| Bấm nút không thấy gì đổi | Quên `setState` | Bọc thay đổi trong `setState` |
| `setState() called after dispose()` | Gọi setState sau khi màn hình đóng | Kiểm tra `if (mounted)` trước khi gọi |
| Dữ liệu reset khi xoay màn hình | Dữ liệu khai trong `build` | Chuyển lên khai trong class state |
| `setState` trong `build` | Lặp vô tận | Chỉ gọi `setState` trong hàm xử lý sự kiện |

## Bài tập

1. Viết bộ đếm có cả nút tăng, giảm và đặt lại về 0.
2. Viết màn hình có nút chuyển đổi giữa chế độ sáng và tối của một `Container`.
3. Dựng lại ví dụ giỏ hàng, thêm nút tăng giảm số lượng cho từng món.
4. Thêm `initState` in ra console, mở và thoát màn hình để xem nó chạy lúc nào.
5. Cố tình đổi biến mà không gọi `setState`, quan sát màn hình không đổi.
</script>

# Bài 12 — Form, nhập liệu và kiểm tra dữ liệu

**Mục tiêu:** làm màn hình đăng nhập, đăng ký, thêm sản phẩm — có kiểm tra dữ liệu đầy đủ.

## TextField cơ bản

```dart
class _FormState extends State<FormDemo> {
  final _emailController = TextEditingController();

  @override
  void dispose() {
    _emailController.dispose();      // bat buoc, tranh ro ri bo nho
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Column(
      children: [
        TextField(
          controller: _emailController,
          decoration: const InputDecoration(
            labelText: 'Email',
            hintText: 'nhap@email.com',
            prefixIcon: Icon(Icons.email_outlined),
            border: OutlineInputBorder(),
          ),
          keyboardType: TextInputType.emailAddress,
        ),
        ElevatedButton(
          onPressed: () => print(_emailController.text),
          child: const Text('Gửi'),
        ),
      ],
    );
  }
}
```

`TextEditingController` giữ nội dung ô nhập. Lấy giá trị bằng `.text`. **Luôn gọi `dispose()`** — đây là lý do Bài 11 dạy `dispose`.

| `keyboardType` | Bàn phím hiện ra |
| --- | --- |
| `TextInputType.text` | Thường |
| `TextInputType.emailAddress` | Có dấu @ |
| `TextInputType.number` | Chỉ số |
| `TextInputType.phone` | Bàn phím điện thoại |

## Ô mật khẩu có nút hiện/ẩn

```dart
bool _an = true;

TextField(
  obscureText: _an,
  decoration: InputDecoration(
    labelText: 'Mật khẩu',
    border: const OutlineInputBorder(),
    suffixIcon: IconButton(
      icon: Icon(_an ? Icons.visibility_off : Icons.visibility),
      onPressed: () => setState(() => _an = !_an),
    ),
  ),
)
```

## Form với kiểm tra dữ liệu

Đây mới là cách làm đúng cho app thật:

```dart
class DangKy extends StatefulWidget {
  const DangKy({super.key});

  @override
  State<DangKy> createState() => _DangKyState();
}

class _DangKyState extends State<DangKy> {
  final _formKey = GlobalKey<FormState>();
  final _emailController = TextEditingController();
  final _matKhauController = TextEditingController();

  @override
  void dispose() {
    _emailController.dispose();
    _matKhauController.dispose();
    super.dispose();
  }

  void _guiForm() {
    if (_formKey.currentState!.validate()) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('Đăng ký: ${_emailController.text}')),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Đăng ký')),
      body: Padding(
        padding: const EdgeInsets.all(16),
        child: Form(
          key: _formKey,
          child: ListView(
            children: [
              TextFormField(
                controller: _emailController,
                decoration: const InputDecoration(
                  labelText: 'Email',
                  border: OutlineInputBorder(),
                ),
                keyboardType: TextInputType.emailAddress,
                validator: (giaTri) {
                  if (giaTri == null || giaTri.isEmpty) {
                    return 'Vui lòng nhập email';
                  }
                  if (!giaTri.contains('@') || !giaTri.contains('.')) {
                    return 'Email không hợp lệ';
                  }
                  return null;          // null = hop le
                },
              ),
              const SizedBox(height: 16),
              TextFormField(
                controller: _matKhauController,
                obscureText: true,
                decoration: const InputDecoration(
                  labelText: 'Mật khẩu',
                  border: OutlineInputBorder(),
                ),
                validator: (giaTri) {
                  if (giaTri == null || giaTri.length < 8) {
                    return 'Mật khẩu tối thiểu 8 ký tự';
                  }
                  if (!giaTri.contains(RegExp(r'[0-9]'))) {
                    return 'Mật khẩu phải có ít nhất một chữ số';
                  }
                  return null;
                },
              ),
              const SizedBox(height: 24),
              SizedBox(
                width: double.infinity,
                child: ElevatedButton(
                  onPressed: _guiForm,
                  child: const Text('Đăng ký'),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
```

Ba thứ phối hợp với nhau:

| Thành phần | Vai trò |
| --- | --- |
| `Form` + `GlobalKey<FormState>` | Quản lý cả nhóm ô nhập |
| `TextFormField` | Ô nhập có kiểm tra (khác `TextField` thường) |
| `validator` | Trả về chuỗi lỗi, hoặc `null` nếu hợp lệ |
| `_formKey.currentState!.validate()` | Chạy mọi validator cùng lúc |

Dùng `ListView` thay cho `Column` trong form: khi bàn phím hiện lên, nội dung cuộn được thay vì bị tràn.

## Các widget nhập liệu khác

```dart
// Checkbox
CheckboxListTile(
  title: const Text('Tôi đồng ý với điều khoản'),
  value: _dongY,

// Dropdown
DropdownButtonFormField<String>(

  items: const [

```

## Phản hồi cho người dùng

```dart
// Thong bao ngan
ScaffoldMessenger.of(context).showSnackBar(
  const SnackBar(content: Text('Đã lưu')),
);

// Hop thoai xac nhan
final xacNhan = await showDialog<bool>(
  context: context,
  builder: (context) => AlertDialog(
    title: const Text('Xác nhận'),

    actions: [
      TextButton(
        onPressed: () => Navigator.pop(context, false),
        child: const Text('Huỷ'),
      ),
      FilledButton(
        onPressed: () => Navigator.pop(context, true),

if (xacNhan == true) {

```

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| Bàn phím che mất nút | Dùng `Column` | Đổi sang `ListView` hoặc bọc `SingleChildScrollView` |
| `validator` không chạy | Dùng `TextField` thay vì `TextFormField` | Đổi sang `TextFormField` |
| `A RenderFlex overflowed` khi mở bàn phím | Như trên | Như trên |
| Giá trị ô nhập bị mất khi vẽ lại | Không dùng controller | Khai controller trong class state |
| Cảnh báo rò rỉ bộ nhớ | Quên `dispose` controller | Thêm vào `dispose()` |

## Bài tập

1. Dựng form đăng nhập có email và mật khẩu, kiểm tra cả hai trường.
2. Thêm nút hiện/ẩn mật khẩu.
3. Thêm checkbox "Ghi nhớ đăng nhập" và dropdown chọn tỉnh.
4. Hiện `SnackBar` khi đăng nhập thành công.
5. Thêm hộp thoại xác nhận trước khi xoá một mục trong danh sách ở Bài 11.
