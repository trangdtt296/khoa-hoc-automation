<script type="text/markdown" data-id="fl-13" data-nav="Bài 13 · Điều hướng nhiều màn hình">
# Bài 13 — Điều hướng giữa các màn hình

**Mục tiêu:** app có nhiều màn hình, chuyển qua lại và truyền dữ liệu được.

## Chuyển màn hình

```dart
// Di toi man hinh moi
Navigator.push(
  context,
  MaterialPageRoute(builder: (context) => const ChiTietSanPham()),
);

// Quay lai
Navigator.pop(context);
```

Flutter quản lý màn hình theo kiểu chồng đĩa: `push` đặt màn hình mới lên trên, `pop` lấy ra. Nút back của Android tự gọi `pop`.

## Truyền dữ liệu sang màn hình mới

```dart
// Man hinh danh sach
ListTile(
  title: Text(sp['ten']),
  onTap: () {
    Navigator.push(
      context,
      MaterialPageRoute(
        builder: (context) => ChiTietSanPham(
          ten: sp['ten'],
          gia: sp['gia'],
        ),
      ),
    );
  },
)

// Man hinh chi tiet
class ChiTietSanPham extends StatelessWidget {
  final String ten;
  final int gia;

  const ChiTietSanPham({super.key, required this.ten, required this.gia});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: Text(ten)),
      body: Center(child: Text('Giá: $gia đ')),
    );
  }
}
```

Truyền dữ liệu qua constructor — đúng như tham số đặt tên ở Bài 4.

## Nhận kết quả trả về

```dart
// Mo man hinh va cho ket qua
final ketQua = await Navigator.push<String>(
  context,
  MaterialPageRoute(builder: (context) => const ManHinhChon()),
);

if (ketQua != null) {
  setState(() => _daChon = ketQua);
}

// Trong ManHinhChon: tra ve gia tri
Navigator.pop(context, 'Quảng Bình');
```

Dùng cho màn hình chọn tỉnh, chọn danh mục, chọn ảnh.

## Named routes — cho app nhiều màn hình

Khai báo một lần trong `MaterialApp`:

```dart
MaterialApp(
  initialRoute: '/',
  routes: {
    '/': (context) => const TrangChu(),
    '/gio-hang': (context) => const GioHang(),
    '/ca-nhan': (context) => const CaNhan(),
  },
)
```

Dùng:

```dart
Navigator.pushNamed(context, '/gio-hang');
```

Gọn hơn khi app có nhiều màn hình và nhiều chỗ cùng dẫn tới một màn hình.

## Các kiểu chuyển màn hình khác

```dart
// Thay the man hinh hien tai (khong quay lai duoc)
Navigator.pushReplacement(
  context,
  MaterialPageRoute(builder: (_) => const TrangChu()),
);

// Xoa het va mo man hinh moi - dung khi dang xuat
Navigator.pushAndRemoveUntil(
  context,
  MaterialPageRoute(builder: (_) => const DangNhap()),
  (route) => false,
);
```

`pushReplacement` dùng sau khi đăng nhập thành công — người dùng không nên bấm back về lại màn hình đăng nhập.

## BottomNavigationBar — thanh điều hướng dưới

```dart
class ManHinhChinh extends StatefulWidget {
  const ManHinhChinh({super.key});

  @override
  State<ManHinhChinh> createState() => _ManHinhChinhState();
}

class _ManHinhChinhState extends State<ManHinhChinh> {
  int _chiSo = 0;

  final _manHinh = const [
    TrangChu(),
    DanhSachSanPham(),
    GioHang(),
    CaNhan(),
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: _manHinh[_chiSo],
      bottomNavigationBar: NavigationBar(
        selectedIndex: _chiSo,
        onDestinationSelected: (i) => setState(() => _chiSo = i),
        destinations: const [
          NavigationDestination(icon: Icon(Icons.home_outlined), label: 'Trang chủ'),
          NavigationDestination(icon: Icon(Icons.grid_view), label: 'Sản phẩm'),
          NavigationDestination(icon: Icon(Icons.shopping_cart_outlined), label: 'Giỏ'),
          NavigationDestination(icon: Icon(Icons.person_outline), label: 'Cá nhân'),
        ],
      ),
    );
  }
}
```

`NavigationBar` là bản Material 3 của `BottomNavigationBar`, giao diện mới hơn.

Lưu ý: cách này **vẽ lại màn hình mỗi lần chuyển tab**. Muốn giữ nguyên trạng thái từng tab thì bọc trong `IndexedStack`:

```dart
body: IndexedStack(index: _chiSo, children: _manHinh),
```

## TabBar — tab ngang

```dart
DefaultTabController(
  length: 3,
  child: Scaffold(
    appBar: AppBar(
      title: const Text('Đơn hàng'),
      bottom: const TabBar(
        tabs: [
          Tab(text: 'Chờ xác nhận'),
          Tab(text: 'Đang giao'),
          Tab(text: 'Đã giao'),
        ],
      ),
    ),
    body: const TabBarView(
      children: [
        Center(child: Text('Chờ xác nhận')),
        Center(child: Text('Đang giao')),
        Center(child: Text('Đã giao')),
      ],
    ),
  ),
)
```

## Drawer — menu trượt

```dart
Scaffold(
  appBar: AppBar(title: const Text('Trang chủ')),
  drawer: Drawer(
    child: ListView(
      padding: EdgeInsets.zero,
      children: [
        const DrawerHeader(
          decoration: BoxDecoration(color: Colors.teal),
          child: Text('Menu', style: TextStyle(color: Colors.white, fontSize: 24)),
        ),
        ListTile(
          leading: const Icon(Icons.settings),
          title: const Text('Cài đặt'),
          onTap: () {
            Navigator.pop(context);           // dong drawer truoc
            Navigator.pushNamed(context, '/cai-dat');
          },
        ),
      ],
    ),
  ),
)
```

Có `drawer:` thì `AppBar` tự hiện nút ba gạch, không cần viết thêm.

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `Navigator operation requested with a context that does not include a Navigator` | Gọi `Navigator` từ context bên ngoài `MaterialApp` | Tách widget ra class riêng |
| Bấm back thoát app luôn | Dùng `pushReplacement` nhầm chỗ | Dùng `push` thường |
| Trạng thái tab mất khi chuyển qua lại | Vẽ lại mỗi lần | Dùng `IndexedStack` |
| Drawer không đóng khi bấm mục | Thiếu `Navigator.pop` | Thêm `Navigator.pop(context)` trước |

## Bài tập

1. Làm 2 màn hình: danh sách sản phẩm và chi tiết, bấm vào mục thì chuyển và truyền tên, giá.
2. Thêm màn hình chọn danh mục, trả giá trị về màn hình trước.
3. Dựng app 4 tab bằng `NavigationBar`, dùng `IndexedStack` để giữ trạng thái.
4. Thêm `TabBar` 3 tab trạng thái đơn hàng.
5. Thêm `Drawer` có 3 mục dẫn tới 3 màn hình khác nhau.
</script>

<script type="text/markdown" data-id="fl-14" data-nav="Bài 14 · Quản lý state với Provider">
# Bài 14 — Quản lý state: khi setState không đủ

**Mục tiêu:** chia sẻ dữ liệu giữa nhiều màn hình. Đây là ranh giới giữa app bài tập và app thật.

## Vấn đề của setState

Giỏ hàng cần hiển thị ở: màn hình danh sách (số trên icon), màn hình chi tiết (nút đã thêm chưa), màn hình giỏ (danh sách), màn hình thanh toán (tổng tiền).

Với `setState`, dữ liệu nằm trong một màn hình. Muốn màn hình khác dùng, bạn phải truyền qua constructor từng cấp — gọi là *prop drilling*, và nó rối rất nhanh.

## Các cách quản lý state

| Cách | Phù hợp khi |
| --- | --- |
| `setState` | Dữ liệu chỉ dùng trong một màn hình |
| **Provider** | App vừa và nhỏ, dễ học nhất — khoá này dùng |
| Riverpod | Nâng cấp của Provider, an toàn kiểu hơn |
| Bloc | App lớn, nhiều người, luồng dữ liệu phức tạp |
| GetX | Nhanh, nhiều tiện ích, nhưng dễ viết lộn xộn |

Học Provider trước. Hiểu nguyên lý rồi chuyển sang cái khác rất nhanh.

## Cài Provider

Mở `pubspec.yaml`, thêm vào mục `dependencies`:

```yaml
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
```

Rồi chạy:

```bash
flutter pub get
```

## Tạo lớp chứa dữ liệu

`lib/providers/gio_hang_provider.dart`:

```dart
import 'package:flutter/foundation.dart';

class SanPham {
  final String ten;
  final int gia;
  int soLuong;

  SanPham({required this.ten, required this.gia, this.soLuong = 1});
}

class GioHangProvider extends ChangeNotifier {
  final List<SanPham> _gio = [];

  List<SanPham> get gio => List.unmodifiable(_gio);
  int get soLuong => _gio.fold(0, (t, sp) => t + sp.soLuong);
  int get tongTien => _gio.fold(0, (t, sp) => t + sp.gia * sp.soLuong);

  void them(SanPham sp) {
    final i = _gio.indexWhere((e) => e.ten == sp.ten);
    if (i >= 0) {
      _gio[i].soLuong++;
    } else {
      _gio.add(sp);
    }
    notifyListeners();            // bao cho giao dien ve lai
  }

  void xoa(String ten) {
    _gio.removeWhere((sp) => sp.ten == ten);
    notifyListeners();
  }

  void doiSoLuong(String ten, int soLuongMoi) {
    final i = _gio.indexWhere((e) => e.ten == ten);
    if (i < 0) return;
    if (soLuongMoi <= 0) {
      _gio.removeAt(i);
    } else {
      _gio[i].soLuong = soLuongMoi;
    }
    notifyListeners();
  }

  void xoaHet() {
    _gio.clear();
    notifyListeners();
  }
}
```

`notifyListeners()` chính là `setState` ở phạm vi toàn app: nó báo mọi widget đang nghe rằng dữ liệu đã đổi.

Trả về `List.unmodifiable(_gio)` để bên ngoài không sửa trộm danh sách — mọi thay đổi phải đi qua method của provider.

## Đăng ký provider ở gốc app

```dart
import 'package:flutter/material.dart';
import 'package:provider/provider.dart';

void main() {
  runApp(
    MultiProvider(
      providers: [
        ChangeNotifierProvider(create: (_) => GioHangProvider()),
        // them provider khac o day
      ],
      child: const MyApp(),
    ),
  );
}
```

## Dùng trong widget

Ba cách, chọn theo nhu cầu:

```dart
// 1. watch: doc du lieu VA ve lai khi doi
final gio = context.watch<GioHangProvider>();
Text('${gio.soLuong} sản phẩm');

// 2. read: chi goi method, KHONG ve lai
context.read<GioHangProvider>().them(sanPham);

// 3. Consumer: chi ve lai phan ben trong
Consumer<GioHangProvider>(
  builder: (context, gio, child) => Text('${gio.tongTien} đ'),
)
```

Quy tắc dễ nhớ:

| Dùng | Khi nào |
| --- | --- |
| `context.watch<T>()` | Trong `build`, cần hiển thị dữ liệu |
| `context.read<T>()` | Trong `onPressed`, chỉ gọi hành động |
| `Consumer<T>` | Muốn giới hạn phạm vi vẽ lại cho nhẹ |

Lỗi hay gặp: dùng `watch` trong `onPressed` — sẽ báo lỗi. Dùng `read` ở đó.

## Màn hình giỏ hàng dùng Provider

```dart
class GioHangScreen extends StatelessWidget {
  const GioHangScreen({super.key});

  @override
  Widget build(BuildContext context) {
    final gio = context.watch<GioHangProvider>();

    return Scaffold(
      appBar: AppBar(title: Text('Giỏ hàng (${gio.soLuong})')),
      body: gio.gio.isEmpty
          ? const Center(child: Text('Giỏ hàng trống'))
          : ListView.builder(
              itemCount: gio.gio.length,
              itemBuilder: (context, i) {
                final sp = gio.gio[i];
                return ListTile(
                  title: Text(sp.ten),
                  subtitle: Text('${sp.gia} đ x ${sp.soLuong}'),
                  trailing: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      IconButton(
                        icon: const Icon(Icons.remove),
                        onPressed: () => context
                            .read<GioHangProvider>()
                            .doiSoLuong(sp.ten, sp.soLuong - 1),
                      ),
                      Text('${sp.soLuong}'),
                      IconButton(
                        icon: const Icon(Icons.add),
                        onPressed: () => context
                            .read<GioHangProvider>()
                            .doiSoLuong(sp.ten, sp.soLuong + 1),
                      ),
                    ],
                  ),
                );
              },
            ),
      bottomNavigationBar: Padding(
        padding: const EdgeInsets.all(16),
        child: Text('Tổng: ${gio.tongTien} đ',
            style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
      ),
    );
  }
}
```

Icon giỏ hàng ở màn hình khác chỉ cần:

```dart
Badge(
  label: Text('${context.watch<GioHangProvider>().soLuong}'),
  child: const Icon(Icons.shopping_cart),
)
```

Không cần truyền dữ liệu qua constructor nữa — đó là giá trị của Provider.

## Lỗi hay gặp

| Lỗi | Cách sửa |
| --- | --- |
| `Could not find the correct Provider above this widget` | Provider phải đăng ký **phía trên** widget trong cây; đặt ở `main()` |
| `setState() or markNeedsBuild() called during build` | Gọi `read().method()` trong `build`; chuyển vào `onPressed` hoặc `initState` |
| Giao diện không đổi dù dữ liệu đổi | Quên `notifyListeners()` |
| Dùng `watch` trong `onPressed` | Đổi sang `read` |

## Bài tập

1. Cài `provider`, tạo `GioHangProvider` theo mẫu trên.
2. Thêm nút "Thêm vào giỏ" ở màn hình sản phẩm, dùng `context.read`.
3. Hiện số lượng trên icon giỏ ở AppBar của mọi màn hình.
4. Làm màn hình giỏ hàng có tăng giảm số lượng và tổng tiền.
5. Viết thêm `ThemeProvider` cho phép đổi sáng/tối toàn app từ màn hình cài đặt.
</script>

<script type="text/markdown" data-id="fl-15" data-nav="Bài 15 · Gọi API">
# Bài 15 — Gọi API và hiển thị dữ liệu thật

**Mục tiêu:** lấy dữ liệu từ server và hiện lên app. Đây là thứ phân biệt app demo với app thật.

## Cài thư viện

```yaml
dependencies:
  http: ^1.2.2
```

```bash
flutter pub get
```

Android cần quyền internet. Mở `android/app/src/main/AndroidManifest.xml`, thêm trước thẻ `<application>`:

```xml
<uses-permission android:name="android.permission.INTERNET"/>
```

Thiếu dòng này, app chạy máy ảo vẫn gọi được nhưng bản release sẽ lỗi mạng.

## Gọi API đầu tiên

Dùng API công khai `jsonplaceholder.typicode.com` để luyện.

```dart
import 'dart:convert';
import 'package:http/http.dart' as http;

Future<List<dynamic>> layBaiViet() async {
  final url = Uri.parse('https://jsonplaceholder.typicode.com/posts');
  final res = await http.get(url);

  if (res.statusCode == 200) {
    return jsonDecode(res.body);
  } else {
    throw Exception('Lỗi ${res.statusCode}');
  }
}
```

| Thành phần | Vai trò |
| --- | --- |
| `Uri.parse(...)` | Chuyển chuỗi thành địa chỉ |
| `http.get(url)` | Gửi request, trả về `Future` |
| `res.statusCode` | 200 là thành công, 404 không tìm thấy, 500 lỗi server |
| `res.body` | Nội dung trả về, dạng chuỗi JSON |
| `jsonDecode` | Chuyển chuỗi JSON thành `List`/`Map` của Dart |

Đây là lý do Bài 6 dạy `async/await` và Bài 3 dạy `Map`.

## Model class — đừng dùng Map trực tiếp

```dart
class BaiViet {
  final int id;
  final String tieuDe;
  final String noiDung;

  BaiViet({required this.id, required this.tieuDe, required this.noiDung});

  factory BaiViet.fromJson(Map<String, dynamic> json) {
    return BaiViet(
      id: json['id'] ?? 0,
      tieuDe: json['title'] ?? '',
      noiDung: json['body'] ?? '',
    );
  }
}
```

Vì sao nên có model:

- Gõ `sp.tieuDe` được editor gợi ý; gõ `sp['title']` thì không.
- Gõ sai tên trường, model báo lỗi lúc viết code; Map thì phải chạy mới biết.
- `?? ''` và `?? 0` giúp app không crash khi API thiếu trường.

Đây chính là `fromJson` ở Bài 5.

## Tách thành service

`lib/services/api_service.dart`:

```dart
import 'dart:convert';
import 'package:http/http.dart' as http;

class ApiService {
  static const String _baseUrl = 'https://jsonplaceholder.typicode.com';

  Future<List<BaiViet>> layDanhSach() async {
    final res = await http.get(Uri.parse('$_baseUrl/posts'));

    if (res.statusCode == 200) {
      final List<dynamic> data = jsonDecode(res.body);
      return data.map((e) => BaiViet.fromJson(e)).toList();
    }
    throw Exception('Không tải được dữ liệu (${res.statusCode})');
  }

  Future<BaiViet> layChiTiet(int id) async {
    final res = await http.get(Uri.parse('$_baseUrl/posts/$id'));
    if (res.statusCode == 200) {
      return BaiViet.fromJson(jsonDecode(res.body));
    }
    throw Exception('Không tìm thấy bài viết');
  }

  Future<BaiViet> taoMoi(String tieuDe, String noiDung) async {
    final res = await http.post(
      Uri.parse('$_baseUrl/posts'),
      headers: {'Content-Type': 'application/json'},
      body: jsonEncode({'title': tieuDe, 'body': noiDung}),
    );
    if (res.statusCode == 201) {
      return BaiViet.fromJson(jsonDecode(res.body));
    }
    throw Exception('Tạo thất bại');
  }
}
```

Giữ mọi lệnh gọi mạng trong service, không viết `http.get` rải rác trong widget. Bài 17 nói rõ lý do.

## FutureBuilder — hiển thị dữ liệu bất đồng bộ

```dart
class DanhSachBaiViet extends StatefulWidget {
  const DanhSachBaiViet({super.key});

  @override
  State<DanhSachBaiViet> createState() => _DanhSachBaiVietState();
}

class _DanhSachBaiVietState extends State<DanhSachBaiViet> {
  late Future<List<BaiViet>> _future;

  @override
  void initState() {
    super.initState();
    _future = ApiService().layDanhSach();
  }

  Future<void> _taiLai() async {
    setState(() {
      _future = ApiService().layDanhSach();
    });
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Bài viết')),
      body: FutureBuilder<List<BaiViet>>(
        future: _future,
        builder: (context, snapshot) {
          if (snapshot.connectionState == ConnectionState.waiting) {
            return const Center(child: CircularProgressIndicator());
          }

          if (snapshot.hasError) {
            return Center(
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  const Icon(Icons.error_outline, size: 48, color: Colors.red),
                  const SizedBox(height: 12),
                  Text('Lỗi: ${snapshot.error}'),
                  const SizedBox(height: 12),
                  ElevatedButton(onPressed: _taiLai, child: const Text('Thử lại')),
                ],
              ),
            );
          }

          final ds = snapshot.data ?? [];
          if (ds.isEmpty) {
            return const Center(child: Text('Chưa có bài viết nào'));
          }

          return RefreshIndicator(
            onRefresh: _taiLai,
            child: ListView.builder(
              itemCount: ds.length,
              itemBuilder: (context, i) => ListTile(
                leading: CircleAvatar(child: Text('${ds[i].id}')),
                title: Text(ds[i].tieuDe, maxLines: 1,
                    overflow: TextOverflow.ellipsis),
                subtitle: Text(ds[i].noiDung, maxLines: 2,
                    overflow: TextOverflow.ellipsis),
              ),
            ),
          );
        },
      ),
    );
  }
}
```

Bốn trạng thái phải xử lý đủ: **đang tải, lỗi, rỗng, có dữ liệu**. Thiếu trạng thái nào là app có lúc hiện màn hình trắng.

Gọi API trong `initState`, **không gọi trong `build`** — `build` chạy nhiều lần, gọi ở đó sẽ bắn request liên tục.

## Bắt lỗi mạng

```dart
import 'dart:io';
import 'dart:async';

try {
  final res = await http
      .get(Uri.parse(url))
      .timeout(const Duration(seconds: 15));
  ...
} on SocketException {
  throw Exception('Không có kết nối mạng');
} on TimeoutException {
  throw Exception('Máy chủ phản hồi quá lâu');
} catch (e) {
  throw Exception('Đã xảy ra lỗi: $e');
}
```

Luôn đặt `timeout`. Không có nó, mạng yếu sẽ làm app treo ở vòng xoay mãi mãi.

## Bài tập

1. Cài `http`, thêm quyền INTERNET, gọi `/posts` và in kết quả ra console.
2. Viết model `BaiViet` với `fromJson`.
3. Tách `ApiService` và hiển thị danh sách bằng `FutureBuilder` đủ 4 trạng thái.
4. Làm màn hình chi tiết, bấm vào một bài thì gọi `/posts/{id}`.
5. Thử tắt mạng máy ảo, kiểm tra app hiện thông báo lỗi và nút Thử lại.
</script>

<script type="text/markdown" data-id="fl-16" data-nav="Bài 16 · Lưu dữ liệu trên máy">
# Bài 16 — Lưu dữ liệu trên máy

**Mục tiêu:** dữ liệu còn nguyên sau khi tắt app — nhớ đăng nhập, lưu giỏ hàng, chế độ tối.

## Chọn cách lưu nào

| Cách | Lưu được gì | Dùng cho |
| --- | --- | --- |
| `shared_preferences` | Giá trị nhỏ: chuỗi, số, bool, list chuỗi | Cài đặt, token, chế độ tối |
| `hive` | Đối tượng, danh sách lớn | Dữ liệu offline, giỏ hàng |
| `sqflite` | Bảng dữ liệu, truy vấn SQL | Dữ liệu nhiều, cần lọc phức tạp |
| `flutter_secure_storage` | Dữ liệu nhạy cảm, có mã hoá | Mật khẩu, token quan trọng |

Khoá này dùng `shared_preferences` và `hive` — đủ cho phần lớn app.

## shared_preferences

```yaml
dependencies:
  shared_preferences: ^2.3.2
```

```dart
import 'package:shared_preferences/shared_preferences.dart';

class BoNho {
  static const _KEY_TEN = 'ten_nguoi_dung';
  static const _KEY_TOI = 'che_do_toi';

  static Future<void> luuTen(String ten) async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setString(_KEY_TEN, ten);
  }

  static Future<String?> layTen() async {
    final prefs = await SharedPreferences.getInstance();
    return prefs.getString(_KEY_TEN);
  }

  static Future<void> luuCheDoToi(bool bat) async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setBool(_KEY_TOI, bat);
  }

  static Future<bool> layCheDoToi() async {
    final prefs = await SharedPreferences.getInstance();
    return prefs.getBool(_KEY_TOI) ?? false;
  }

  static Future<void> xoaHet() async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.clear();
  }
}
```

Các method có sẵn: `setString` `setInt` `setDouble` `setBool` `setStringList`, và `getString` `getInt`... tương ứng. Khoá đặt thành hằng số để không gõ sai.

Dùng trong app:

```dart
@override
void initState() {
  super.initState();
  _taiCaiDat();
}

Future<void> _taiCaiDat() async {
  final toi = await BoNho.layCheDoToi();
  if (!mounted) return;
  setState(() => _cheDoToi = toi);
}
```

Dòng `if (!mounted) return;` rất quan trọng: nếu người dùng thoát màn hình trước khi đọc xong, gọi `setState` sẽ báo lỗi.

## Lưu đối tượng bằng JSON

`shared_preferences` không lưu được object, nhưng lưu được chuỗi JSON:

```dart
import 'dart:convert';

Future<void> luuGioHang(List<SanPham> gio) async {
  final prefs = await SharedPreferences.getInstance();
  final chuoi = jsonEncode(gio.map((sp) => sp.toJson()).toList());
  await prefs.setString('gio_hang', chuoi);
}

Future<List<SanPham>> layGioHang() async {
  final prefs = await SharedPreferences.getInstance();
  final chuoi = prefs.getString('gio_hang');
  if (chuoi == null) return [];
  final List<dynamic> data = jsonDecode(chuoi);
  return data.map((e) => SanPham.fromJson(e)).toList();
}
```

Đây là lý do Bài 5 dạy `toJson` và `fromJson`.

## Hive — nhanh hơn cho dữ liệu nhiều

```yaml
dependencies:
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
```

```dart
import 'package:hive_ce_flutter/hive_flutter.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Hive.initFlutter();
  await Hive.openBox('gioHang');
  runApp(const MyApp());
}

// Dung o bat ky dau
final box = Hive.box('gioHang');

box.put('ten', 'Áo thun');
print(box.get('ten'));
box.delete('ten');
print(box.keys);

// Hien thi va tu cap nhat khi du lieu doi
ValueListenableBuilder(
  valueListenable: Hive.box('gioHang').listenable(),
  builder: (context, box, _) => Text('${box.length} sản phẩm'),
)
```

`WidgetsFlutterBinding.ensureInitialized()` bắt buộc khi `main()` có `await` trước `runApp`.

Ưu điểm của Hive so với shared_preferences: nhanh hơn nhiều với dữ liệu lớn, và có `listenable()` để giao diện tự cập nhật.

## Ghép với Provider

```dart
class CaiDatProvider extends ChangeNotifier {
  bool _cheDoToi = false;
  bool get cheDoToi => _cheDoToi;

  CaiDatProvider() {
    _tai();
  }

  Future<void> _tai() async {
    _cheDoToi = await BoNho.layCheDoToi();
    notifyListeners();
  }

  Future<void> doiCheDo(bool bat) async {
    _cheDoToi = bat;
    notifyListeners();            // cap nhat giao dien ngay
    await BoNho.luuCheDoToi(bat); // luu xuong may sau
  }
}
```

Thứ tự này quan trọng: cập nhật giao diện trước, ghi xuống máy sau. Người dùng thấy phản hồi tức thì.

## Đường dẫn file

Lưu file ảnh, PDF, file tải về:

```yaml
dependencies:
  path_provider: ^2.1.4
```

```dart
import 'package:path_provider/path_provider.dart';
import 'dart:io';

Future<void> ghiFile(String noiDung) async {
  final thuMuc = await getApplicationDocumentsDirectory();
  final file = File('${thuMuc.path}/ghi_chu.txt');
  await file.writeAsString(noiDung);
}

Future<String> docFile() async {
  try {
    final thuMuc = await getApplicationDocumentsDirectory();
    final file = File('${thuMuc.path}/ghi_chu.txt');
    return await file.readAsString();
  } catch (e) {
    return '';
  }
}
```

## Bài tập

1. Cài `shared_preferences`, lưu và đọc lại tên người dùng.
2. Làm công tắc chế độ tối, tắt app mở lại vẫn giữ trạng thái.
3. Lưu giỏ hàng dạng JSON, tắt app mở lại vẫn còn sản phẩm.
4. Ghép `CaiDatProvider` vào app, đổi theme từ màn hình cài đặt.
5. Thêm nút "Xoá dữ liệu" gọi `prefs.clear()` có hộp thoại xác nhận.
</script>

<script type="text/markdown" data-id="fl-17" data-nav="Bài 17 · Kiến trúc project">
# Bài 17 — Tổ chức project cho dễ bảo trì

**Mục tiêu:** sắp xếp code để project 5.000 dòng vẫn dễ sửa. Đây là thứ phân biệt người mới với người đi làm.

## Vấn đề

File `main.dart` 2.000 dòng chứa tất cả: giao diện, gọi API, xử lý dữ liệu. Sửa một chỗ hỏng ba chỗ, và không ai khác đọc nổi.

## Cấu trúc thư mục đề xuất

```text
lib/
├── main.dart
├── models/              # lop du lieu
│   ├── san_pham.dart
│   └── nguoi_dung.dart
├── services/            # goi API, luu tru
│   ├── api_service.dart
│   └── bo_nho_service.dart
├── providers/           # quan ly state
│   ├── gio_hang_provider.dart
│   └── cai_dat_provider.dart
├── screens/             # man hinh
│   ├── trang_chu/
│   │   └── trang_chu_screen.dart
│   ├── san_pham/
│   │   ├── danh_sach_screen.dart
│   │   └── chi_tiet_screen.dart
│   └── gio_hang/
│       └── gio_hang_screen.dart
├── widgets/             # widget dung lai nhieu noi
│   ├── the_san_pham.dart
│   ├── nut_chinh.dart
│   └── trang_thai_rong.dart
└── utils/               # tien ich, hang so
    ├── dinh_dang.dart
    └── hang_so.dart
```

Tên file viết thường, nối bằng `_` — quy ước của Dart.

## Nguyên tắc chia lớp

| Lớp | Được làm gì | Không được làm gì |
| --- | --- | --- |
| `models/` | Mô tả dữ liệu, `fromJson`, `toJson` | Gọi API, vẽ giao diện |
| `services/` | Gọi mạng, đọc ghi máy | Vẽ giao diện |
| `providers/` | Giữ state, gọi service | Vẽ giao diện |
| `screens/` | Dựng giao diện, gọi provider | Gọi `http.get` trực tiếp |
| `widgets/` | Widget nhỏ dùng lại | Giữ dữ liệu toàn cục |

Quy tắc một câu: **màn hình không bao giờ gọi `http` trực tiếp.** Màn hình gọi provider, provider gọi service, service gọi mạng.

Vì sao: đổi từ API này sang API khác chỉ sửa trong `services/`. Màn hình không phải động vào.

## Luồng dữ liệu

```text
Màn hình  →  Provider  →  Service  →  API / Bộ nhớ máy
    ↑                          │
    └──── notifyListeners() ───┘
```

## Ví dụ hoàn chỉnh

`models/san_pham.dart`:

```dart
class SanPham {
  final int id;
  final String ten;
  final int gia;

  const SanPham({required this.id, required this.ten, required this.gia});

  factory SanPham.fromJson(Map<String, dynamic> json) => SanPham(
        id: json['id'] ?? 0,
        ten: json['ten'] ?? '',
        gia: json['gia'] ?? 0,
      );
}
```

`services/san_pham_service.dart`:

```dart
class SanPhamService {
  static const _baseUrl = 'https://api.example.com';

  Future<List<SanPham>> layDanhSach() async {
    final res = await http.get(Uri.parse('$_baseUrl/san-pham'));
    if (res.statusCode != 200) throw Exception('Lỗi ${res.statusCode}');
    final List data = jsonDecode(res.body);
    return data.map((e) => SanPham.fromJson(e)).toList();
  }
}
```

`providers/san_pham_provider.dart`:

```dart
class SanPhamProvider extends ChangeNotifier {
  final _service = SanPhamService();

  List<SanPham> _danhSach = [];
  bool _dangTai = false;
  String? _loi;

  List<SanPham> get danhSach => _danhSach;
  bool get dangTai => _dangTai;
  String? get loi => _loi;

  Future<void> tai() async {
    _dangTai = true;
    _loi = null;
    notifyListeners();

    try {
      _danhSach = await _service.layDanhSach();
    } catch (e) {
      _loi = e.toString();
    } finally {
      _dangTai = false;
      notifyListeners();
    }
  }
}
```

`screens/san_pham/danh_sach_screen.dart`:

```dart
class DanhSachScreen extends StatefulWidget {
  const DanhSachScreen({super.key});

  @override
  State<DanhSachScreen> createState() => _DanhSachScreenState();
}

class _DanhSachScreenState extends State<DanhSachScreen> {
  @override
  void initState() {
    super.initState();
    WidgetsBinding.instance.addPostFrameCallback((_) {
      context.read<SanPhamProvider>().tai();
    });
  }

  @override
  Widget build(BuildContext context) {
    final p = context.watch<SanPhamProvider>();

    return Scaffold(
      appBar: AppBar(title: const Text('Sản phẩm')),
      body: switch (p) {
        _ when p.dangTai => const Center(child: CircularProgressIndicator()),
        _ when p.loi != null => Center(child: Text(p.loi!)),
        _ when p.danhSach.isEmpty => const Center(child: Text('Không có sản phẩm')),
        _ => ListView.builder(
            itemCount: p.danhSach.length,
            itemBuilder: (_, i) => TheSanPham(sanPham: p.danhSach[i]),
          ),
      },
    );
  }
}
```

`addPostFrameCallback` cho phép gọi provider an toàn trong `initState` — gọi thẳng sẽ báo lỗi "called during build".

## Tách hằng số

`utils/hang_so.dart`:

```dart
class AppMau {
  static const chinh = Color(0xFF009688);
  static const loi = Color(0xFFD32F2F);
}

class AppKhoangCach {
  static const nho = 8.0;
  static const vua = 16.0;
  static const lon = 24.0;
}
```

`utils/dinh_dang.dart`:

```dart
import 'package:intl/intl.dart';

String dinhDangTien(int so) =>
    NumberFormat.currency(locale: 'vi_VN', symbol: 'đ').format(so);

String dinhDangNgay(DateTime d) => DateFormat('dd/MM/yyyy').format(d);
```

Cần thêm `intl` vào `pubspec.yaml`. Hàm định dạng tiền dùng ở mọi chỗ hiển thị giá — viết một lần, sửa một chỗ.

## Bài tập

1. Tách project hiện tại của bạn theo cấu trúc thư mục trên.
2. Chuyển mọi lệnh `http.get` từ màn hình vào `services/`.
3. Tạo provider có đủ `dangTai`, `loi`, `danhSach` theo mẫu.
4. Tách `TheSanPham` thành widget riêng trong `widgets/`.
5. Tạo `utils/dinh_dang.dart` và thay mọi chỗ hiển thị giá bằng `dinhDangTien()`.

# Bài 18 — Trạng thái màn hình và giao diện co giãn

**Mục tiêu:** app trông chuyên nghiệp ở mọi tình huống — đang tải, lỗi, rỗng, và trên mọi kích thước màn hình.

## Bốn trạng thái của mọi màn hình có dữ liệu

| Trạng thái | Hiện gì |
| --- | --- |
| Đang tải | Vòng xoay, hoặc khung xương |
| Lỗi | Thông báo dễ hiểu + nút Thử lại |
| Rỗng | Icon + câu giải thích + hành động gợi ý |
| Có dữ liệu | Nội dung |

Người mới hay chỉ làm trạng thái thứ tư. Ba trạng thái đầu là thứ khiến app trông được đầu tư.

## Widget trạng thái dùng lại

`widgets/trang_thai.dart`:

```dart
class TrangThaiRong extends StatelessWidget {
  final IconData icon;
  final String tieuDe;
  final String? moTa;
  final String? nhanNut;
  final VoidCallback? khiBam;

  const TrangThaiRong({
    super.key,
    this.icon = Icons.inbox_outlined,
    required this.tieuDe,
    this.moTa,
    this.nhanNut,
    this.khiBam,
  });

  @override
  Widget build(BuildContext context) {
    return Center(
      child: Padding(
        padding: const EdgeInsets.all(32),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(icon, size: 72, color: Colors.grey.shade400),
            const SizedBox(height: 16),
            Text(tieuDe,
                style: Theme.of(context).textTheme.titleMedium,
                textAlign: TextAlign.center),
            if (moTa != null) ...[
              const SizedBox(height: 8),
              Text(moTa!,
                  style: TextStyle(color: Colors.grey.shade600),
                  textAlign: TextAlign.center),
            ],
            if (nhanNut != null) ...[
              const SizedBox(height: 20),
              FilledButton(onPressed: khiBam, child: Text(nhanNut!)),
            ],
          ],
        ),
      ),
    );
  }
}
```

Chú ý `if (moTa != null) ...[ ... ]` — đây là collection if kết hợp spread ở Bài 3. Nó cho phép thêm nhiều widget có điều kiện vào `children`.

Dùng:

```dart
const TrangThaiRong(
  icon: Icons.shopping_cart_outlined,
  tieuDe: 'Giỏ hàng trống',
  moTa: 'Thêm sản phẩm để bắt đầu mua sắm',
  nhanNut: 'Xem sản phẩm',
)
```

## Viết thông báo lỗi cho người dùng

| Đừng viết | Hãy viết |
| --- | --- |
| `Exception: SocketException...` | Không có kết nối mạng. Kiểm tra wifi rồi thử lại. |
| `Error 404` | Không tìm thấy sản phẩm này. |
| `null is not a subtype of String` | Đã xảy ra lỗi. Vui lòng thử lại. |

Lỗi kỹ thuật ghi vào log cho lập trình viên; người dùng cần biết **chuyện gì xảy ra và làm gì tiếp**.

## Khung xương khi tải

Mượt hơn vòng xoay vì giữ bố cục ổn định:

```dart
Widget _khungXuong() => ListView.builder(
      itemCount: 6,
      itemBuilder: (_, __) => Padding(
        padding: const EdgeInsets.all(12),
        child: Row(
          children: [
            Container(width: 60, height: 60, color: Colors.grey.shade300),
            const SizedBox(width: 12),
            Expanded(
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Container(height: 14, color: Colors.grey.shade300),
                  const SizedBox(height: 8),
                  Container(
                      height: 12, width: 120, color: Colors.grey.shade300),
                ],
              ),
            ),
          ],
        ),
      ),
    );
```

Thư viện `shimmer` thêm hiệu ứng nhấp nháy nếu bạn muốn.

## Giao diện co giãn theo màn hình

Điện thoại nhỏ, điện thoại lớn, máy tính bảng — bố cục phải khác nhau.

```dart
LayoutBuilder(
  builder: (context, rangBuoc) {
    if (rangBuoc.maxWidth > 900) {
      return _boCucMayTinh();        // 3 cot
    } else if (rangBuoc.maxWidth > 600) {
      return _boCucTablet();         // 2 cot
    }
    return _boCucDienThoai();        // 1 cot
  },
)
```

Lấy kích thước màn hình:

```dart
final kichThuoc = MediaQuery.of(context).size;
final rong = kichThuoc.width;
final doiNgang = MediaQuery.of(context).orientation == Orientation.landscape;
final choBanPhim = MediaQuery.of(context).viewInsets.bottom;
```

GridView tự đổi số cột:

```dart
GridView.builder(
  gridDelegate: const SliverGridDelegateWithMaxCrossAxisExtent(
    maxCrossAxisExtent: 200,      // moi o rong toi da 200
    crossAxisSpacing: 12,
    mainAxisSpacing: 12,
  ),
  ...
)
```

Cách này tốt hơn `crossAxisCount` cố định: màn hình to thì tự thêm cột.

## Tránh tràn và chữ quá nhỏ

```dart
// Chu tu dong thu nho cho vua
FittedBox(
  fit: BoxFit.scaleDown,
  child: Text('Nội dung dài'),
)

// Gioi han chieu rong
ConstrainedBox(
  constraints: const BoxConstraints(maxWidth: 600),
  child: ...,
)

// Vung an toan - tranh tai tho va thanh dieu huong
SafeArea(child: ...)
```

`SafeArea` cần cho màn hình không có `Scaffold`, hoặc khi nội dung sát mép.

## Bài tập

1. Viết widget `TrangThaiRong` và dùng cho màn hình giỏ hàng.
2. Viết widget `TrangThaiLoi` có nút Thử lại.
3. Đổi mọi thông báo lỗi kỹ thuật trong app sang câu dễ hiểu.
4. Thêm khung xương khi tải cho danh sách sản phẩm.
5. Dùng `LayoutBuilder` cho danh sách hiện 1 cột trên điện thoại, 2 cột khi xoay ngang.

<script type="text/markdown" data-id="fl-19" data-nav="Bài 19 · Ảnh, font, icon app">
# Bài 19 — Asset, font, icon và màn hình chờ

**Mục tiêu:** app có ảnh riêng, font riêng, icon riêng — trông như app thật chứ không phải bài tập.

## Thêm ảnh vào app

Tạo thư mục ở gốc project:

```text
assets/
├── images/
│   ├── logo.png
│   └── banner.jpg
└── fonts/
    ├── BeVietnamPro-Regular.ttf
    └── BeVietnamPro-Bold.ttf
```

Khai báo trong `pubspec.yaml` — **chú ý thụt lề, sai một dấu cách là lỗi**:

```yaml
flutter:
  uses-material-design: true

  assets:
    - assets/images/
```

Rồi chạy `flutter pub get`. Dùng:

```dart
Image.asset('assets/images/logo.png', width: 120)
```

Khai báo cả thư mục (có dấu `/` cuối) tiện hơn khai báo từng file.

## Thêm font tiếng Việt

Tải font từ `fonts.google.com` (Be Vietnam Pro, Inter, Roboto đều hỗ trợ tiếng Việt tốt), đặt file `.ttf` vào `assets/fonts/`:

```yaml
flutter:
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
```

Dùng cho toàn app:

```dart
MaterialApp(
  theme: ThemeData(
    fontFamily: 'BeVietnamPro',
    colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
  ),
)
```

Cách nhanh hơn, không cần tải file:

```yaml
dependencies:
  google_fonts: ^6.2.1
```

```dart
import 'package:google_fonts/google_fonts.dart';

theme: ThemeData(
  textTheme: GoogleFonts.beVietnamProTextTheme(),
)
```

Lưu ý: `google_fonts` tải font từ mạng lần đầu. App cần chạy offline hoàn toàn thì nên nhúng file `.ttf`.

## Icon của app

```yaml
dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#009688"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
```

Ảnh gốc nên là PNG vuông 1024×1024. Chạy:

```bash
flutter pub get
dart run flutter_launcher_icons
```

Công cụ tự sinh icon đủ kích thước cho cả Android và iOS.

## Màn hình chờ khi mở app

```yaml
dev_dependencies:
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  color_dark: "#121212"
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"
```

```bash
dart run flutter_native_splash:create
```

## Đổi tên app

**Android** — `android/app/src/main/AndroidManifest.xml`:

```xml
<application
    android:label="Tên App Của Bạn"
    ...>
```

**iOS** — `ios/Runner/Info.plist`:

```xml
<key>CFBundleDisplayName</key>
<string>Tên App Của Bạn</string>
```

## Tìm và chọn thư viện

Mọi thư viện Flutter nằm ở **pub.dev**. Trước khi cài, kiểm tra 4 điểm:

| Kiểm tra | Dấu hiệu tốt |
| --- | --- |
| Lần cập nhật cuối | Trong vòng 6 tháng |
| Điểm likes và popularity | Càng cao càng nhiều người dùng |
| Hỗ trợ nền tảng | Có đủ Android, iOS bạn cần |
| Null safety | Bắt buộc, thư viện cũ không có sẽ không build được |

Thư viện hay dùng:

| Thư viện | Dùng để |
| --- | --- |
| `http` hoặc `dio` | Gọi API |
| `provider` / `flutter_riverpod` | Quản lý state |
| `shared_preferences` | Lưu cài đặt |
| `intl` | Định dạng ngày, tiền |
| `cached_network_image` | Ảnh mạng có cache |
| `url_launcher` | Mở link, gọi điện, gửi mail |
| `image_picker` | Chọn ảnh từ máy hoặc chụp |
| `flutter_svg` | Hiển thị ảnh SVG |

## cached_network_image — nên dùng thay Image.network

```dart
CachedNetworkImage(
  imageUrl: url,
  placeholder: (context, url) => const Center(
    child: CircularProgressIndicator(),
  ),
  errorWidget: (context, url, error) => const Icon(Icons.broken_image),
  fit: BoxFit.cover,
)
```

Ảnh tải một lần rồi lưu lại, lần sau hiện ngay — danh sách cuộn mượt hơn hẳn.

## Lỗi hay gặp

| Lỗi | Cách sửa |
| --- | --- |
| `Unable to load asset` | Sai đường dẫn, hoặc quên khai trong `pubspec.yaml`, hoặc chưa `flutter pub get` |
| Font không đổi | Sai thụt lề trong `pubspec.yaml`; thử `flutter clean` rồi chạy lại |
| Icon app không đổi | Gỡ app khỏi máy ảo rồi cài lại |
| `pubspec.yaml` báo lỗi khó hiểu | Kiểm tra thụt lề — YAML chỉ nhận dấu cách, không nhận Tab |

## Bài tập

1. Thêm một ảnh logo vào `assets/images/` và hiển thị ở màn hình chính.
2. Thêm font Be Vietnam Pro và áp dụng cho toàn app.
3. Tạo icon app bằng `flutter_launcher_icons`, gỡ cài lại để kiểm tra.
4. Thêm màn hình chờ bằng `flutter_native_splash`.
5. Thay mọi `Image.network` bằng `CachedNetworkImage`.
</script>

<script type="text/markdown" data-id="fl-20" data-nav="Bài 20 · Animation">
# Bài 20 — Animation

**Mục tiêu:** thêm chuyển động cho app. Animation đúng mức làm app mượt; quá tay làm app rối và chậm.

## Animation tự động — dễ nhất

Đổi `Container` thành `AnimatedContainer` là xong:

```dart
class ONhap extends StatefulWidget {
  const ONhap({super.key});

  @override
  State<ONhap> createState() => _ONhapState();
}

class _ONhapState extends State<ONhap> {
  bool _moRong = false;

  @override
  Widget build(BuildContext context) {
    return GestureDetector(
      onTap: () => setState(() => _moRong = !_moRong),
      child: AnimatedContainer(
        duration: const Duration(milliseconds: 300),
        curve: Curves.easeInOut,
        width: _moRong ? 300 : 150,
        height: _moRong ? 200 : 100,
        decoration: BoxDecoration(
          color: _moRong ? Colors.teal : Colors.orange,
          borderRadius: BorderRadius.circular(_moRong ? 24 : 8),
        ),
        child: const Center(child: Text('Bấm tôi')),
      ),
    );
  }
}
```

Chỉ cần `setState` đổi giá trị, Flutter tự chạy chuyển động từ giá trị cũ sang mới.

## Các widget Animated có sẵn

| Widget | Chuyển động |
| --- | --- |
| `AnimatedContainer` | Kích thước, màu, bo góc, padding |
| `AnimatedOpacity` | Mờ dần, hiện dần |
| `AnimatedPositioned` | Di chuyển trong `Stack` |
| `AnimatedSwitcher` | Đổi hẳn widget này sang widget khác |
| `AnimatedCrossFade` | Chuyển giữa đúng hai widget |
| `AnimatedList` | Thêm, xoá mục trong danh sách |

```dart
AnimatedOpacity(
  opacity: _hien ? 1.0 : 0.0,
  duration: const Duration(milliseconds: 400),
  child: const Text('Nội dung'),
)

AnimatedSwitcher(
  duration: const Duration(milliseconds: 300),
  child: _dangTai
      ? const CircularProgressIndicator(key: ValueKey('tai'))
      : const Text('Xong', key: ValueKey('xong')),
)
```

`AnimatedSwitcher` cần `key` khác nhau cho mỗi widget con, nếu không Flutter không biết đã đổi.

## Đường cong chuyển động

| `Curves` | Cảm giác |
| --- | --- |
| `linear` | Đều, hơi máy móc |
| `easeInOut` | Tự nhiên nhất, dùng mặc định |
| `easeOut` | Nhanh rồi chậm dần — hợp khi mở ra |
| `bounceOut` | Nảy ở cuối — vui mắt, dùng tiết chế |
| `elasticOut` | Rung, dùng cho hiệu ứng đặc biệt |

## Hero — chuyển ảnh giữa hai màn hình

```dart
// Man hinh danh sach
Hero(
  tag: 'sp-${sanPham.id}',
  child: Image.network(sanPham.anh, width: 80, height: 80),
)

// Man hinh chi tiet
Hero(
  tag: 'sp-${sanPham.id}',
  child: Image.network(sanPham.anh, width: double.infinity, height: 300),
)
```

`tag` giống nhau ở hai màn hình là đủ — Flutter tự làm ảnh bay từ vị trí cũ sang vị trí mới. Rất ấn tượng mà gần như không tốn công.

Lưu ý `tag` phải **duy nhất** trong một màn hình, nên gắn kèm id.

## Animation thủ công — khi cần kiểm soát

```dart
class HieuUng extends StatefulWidget {
  const HieuUng({super.key});

  @override
  State<HieuUng> createState() => _HieuUngState();
}

class _HieuUngState extends State<HieuUng>
    with SingleTickerProviderStateMixin {
  late AnimationController _controller;
  late Animation<double> _animation;

  @override
  void initState() {
    super.initState();
    _controller = AnimationController(
      duration: const Duration(seconds: 2),
      vsync: this,
    );
    _animation = Tween<double>(begin: 0, end: 1).animate(
      CurvedAnimation(parent: _controller, curve: Curves.easeInOut),
    );
    _controller.repeat(reverse: true);
  }

  @override
  void dispose() {
    _controller.dispose();          // bat buoc
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return FadeTransition(
      opacity: _animation,
      child: const Icon(Icons.favorite, size: 64, color: Colors.red),
    );
  }
}
```

| Thành phần | Vai trò |
| --- | --- |
| `AnimationController` | Điều khiển thời gian, chạy từ 0 đến 1 |
| `SingleTickerProviderStateMixin` | Cung cấp nhịp vẽ cho controller |
| `Tween` | Ánh xạ 0–1 sang khoảng giá trị bạn muốn |
| `_controller.forward()` | Chạy tới |
| `_controller.repeat(reverse: true)` | Lặp qua lại |

Luôn `dispose()` controller. Quên là rò rỉ bộ nhớ, và đây là lỗi hay bị bỏ sót.

## Dùng animation có chừng mực

| Nên | Không nên |
| --- | --- |
| 200–400 ms cho chuyển động giao diện | Trên 800 ms, người dùng thấy chậm |
| Animation có mục đích: báo trạng thái đổi | Animation chỉ để đẹp ở mọi nút |
| `Hero` cho chuyển màn hình | Năm hiệu ứng khác nhau trên một màn hình |

App tốt thường chỉ có vài chỗ có animation, và người dùng không để ý — họ chỉ thấy "mượt".

## Bài tập

1. Làm thẻ sản phẩm phóng to khi bấm bằng `AnimatedContainer`.
2. Làm nút tim đổi màu và phóng to khi bấm.
3. Thêm `Hero` cho ảnh sản phẩm giữa màn hình danh sách và chi tiết.
4. Dùng `AnimatedSwitcher` chuyển giữa vòng xoay và nội dung khi tải xong.
5. Viết animation thủ công làm icon thông báo rung nhẹ khi có tin mới.
</script>

<script type="text/markdown" data-id="fl-21" data-nav="Bài 21 · Kiểm thử app Flutter">
# Bài 21 — Kiểm thử app Flutter

**Mục tiêu:** viết test cho chính app mình. Nếu bạn đã học các khoá kiểm thử trong trang này, bài này là chỗ hai mảng gặp nhau.

## Ba cấp độ test trong Flutter

| Loại | Kiểm gì | Tốc độ | Số lượng nên có |
| --- | --- | --- | --- |
| **Unit test** | Một hàm, một class — không có giao diện | Rất nhanh | Nhiều nhất |
| **Widget test** | Một widget hiển thị và phản ứng đúng không | Nhanh | Vừa |
| **Integration test** | Cả app chạy trên máy ảo, luồng đầy đủ | Chậm | Ít nhất |

Đây đúng là hình tháp kiểm thử: nhiều test nhỏ ở đáy, ít test lớn ở đỉnh.

## Unit test

Flutter tạo sẵn thư mục `test/`. Tạo `test/gio_hang_test.dart`:

```dart
import 'package:flutter_test/flutter_test.dart';
import 'package:my_app/providers/gio_hang_provider.dart';

void main() {
  group('GioHangProvider', () {
    late GioHangProvider gio;

    setUp(() {
      gio = GioHangProvider();      // chay truoc moi test
    });

    test('gio hang moi tao phai rong', () {
      expect(gio.gio.length, 0);
      expect(gio.tongTien, 0);
    });

    test('them san pham thi so luong tang', () {
      gio.them(SanPham(ten: 'Áo thun', gia: 150000));
      expect(gio.gio.length, 1);
      expect(gio.tongTien, 150000);
    });

    test('them cung san pham hai lan thi gop so luong', () {
      gio.them(SanPham(ten: 'Áo thun', gia: 150000));
      gio.them(SanPham(ten: 'Áo thun', gia: 150000));
      expect(gio.gio.length, 1);
      expect(gio.gio.first.soLuong, 2);
      expect(gio.tongTien, 300000);
    });

    test('xoa san pham khoi gio', () {
      gio.them(SanPham(ten: 'Áo thun', gia: 150000));
      gio.xoa('Áo thun');
      expect(gio.gio.isEmpty, true);
    });

    test('doi so luong ve 0 thi xoa khoi gio', () {
      gio.them(SanPham(ten: 'Áo thun', gia: 150000));
      gio.doiSoLuong('Áo thun', 0);
      expect(gio.gio.isEmpty, true);
    });
  });
}
```

| Hàm | Vai trò | Tương đương |
| --- | --- | --- |
| `group` | Gom test cùng chủ đề | class test |
| `test` | Một test case | `def test_x()` / `@Test` |
| `setUp` | Chạy trước mỗi test | fixture / `@BeforeMethod` |
| `expect(thucTe, mongDoi)` | Assertion | `assert` / `Assert.assertEquals` |

Chạy:

```bash
flutter test
flutter test test/gio_hang_test.dart
```

## Widget test

```dart
import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';

void main() {
  testWidgets('bo dem tang khi bam nut', (WidgetTester tester) async {
    // Dung widget
    await tester.pumpWidget(const MaterialApp(home: BoDem()));

    // Kiem tra trang thai ban dau
    expect(find.text('Đã bấm 0 lần'), findsOneWidget);
    expect(find.text('Đã bấm 1 lần'), findsNothing);

    // Bam nut
    await tester.tap(find.byType(ElevatedButton));
    await tester.pump();            // ve lai sau khi setState

    // Kiem tra ket qua
    expect(find.text('Đã bấm 1 lần'), findsOneWidget);
  });

  testWidgets('form bao loi khi email trong', (WidgetTester tester) async {
    await tester.pumpWidget(const MaterialApp(home: DangKy()));

    await tester.tap(find.text('Đăng ký'));
    await tester.pump();

    expect(find.text('Vui lòng nhập email'), findsOneWidget);
  });

  testWidgets('nhap email roi gui thi khong con loi', (tester) async {
    await tester.pumpWidget(const MaterialApp(home: DangKy()));

    await tester.enterText(find.byType(TextFormField).first, 'a@b.com');
    await tester.tap(find.text('Đăng ký'));
    await tester.pump();

    expect(find.text('Vui lòng nhập email'), findsNothing);
  });
}
```

Các cách tìm widget:

```dart
find.text('Đăng nhập')
find.byType(ElevatedButton)
find.byIcon(Icons.add)
find.byKey(const Key('nut_luu'))         // ben nhat
find.widgetWithText(ElevatedButton, 'Lưu')
```

Kết quả mong đợi:

```dart
findsOneWidget      // dung 1
findsNothing        // khong co
findsNWidgets(3)    // dung 3
findsWidgets        // it nhat 1
```

Hai hàm vẽ lại:

| Hàm | Dùng khi |
| --- | --- |
| `tester.pump()` | Vẽ lại một khung — sau `setState` |
| `tester.pumpAndSettle()` | Vẽ cho đến khi hết animation — sau chuyển màn hình |

## Gắn Key để test bám vào

Giống việc đề nghị dev thêm `testID` ở khoá mobile automation — ở đây bạn vừa là dev vừa là tester:

```dart
ElevatedButton(
  key: const Key('nut_dang_nhap'),
  onPressed: _dangNhap,
  child: const Text('Đăng nhập'),
)
```

```dart
await tester.tap(find.byKey(const Key('nut_dang_nhap')));
```

Locator bằng `Key` không hỏng khi bạn đổi chữ trên nút hay đổi ngôn ngữ app.

## Integration test — chạy cả app

```yaml
dev_dependencies:
  integration_test:
    sdk: flutter
```

`integration_test/app_test.dart`:

```dart
import 'package:flutter_test/flutter_test.dart';
import 'package:integration_test/integration_test.dart';
import 'package:my_app/main.dart' as app;

void main() {
  IntegrationTestWidgetsFlutterBinding.ensureInitialized();

  testWidgets('luong them san pham vao gio', (tester) async {
    app.main();
    await tester.pumpAndSettle();

    await tester.tap(find.text('Áo thun'));
    await tester.pumpAndSettle();

    await tester.tap(find.text('Thêm vào giỏ'));
    await tester.pumpAndSettle();

    await tester.tap(find.byIcon(Icons.shopping_cart));
    await tester.pumpAndSettle();

    expect(find.text('Áo thun'), findsOneWidget);
    expect(find.text('Tổng: 150000 đ'), findsOneWidget);

```

Chạy trên máy ảo đang bật:

```bash
flutter test integration_test/app_test.dart
```

## Nên test gì trước

| Ưu tiên | Test gì |
| --- | --- |
| 1 | Logic tính toán: tổng tiền, giảm giá, định dạng |
| 2 | Provider: thêm, xoá, cập nhật state |
| 3 | Validator của form |
| 4 | Widget quan trọng: nút thanh toán, màn hình đăng nhập |
| 5 | Luồng chính end-to-end: đăng nhập → mua hàng |

Không cần test mọi widget. Test chỗ sai thì thiệt hại lớn.

## Xem độ phủ

```bash
flutter test --coverage
```

Kết quả ở `coverage/lcov.info`. Độ phủ cao không đồng nghĩa test tốt — một test không có `expect` vẫn tính là đã chạy qua code.

1. Viết 5 unit test cho `GioHangProvider` của bạn.
2. Viết widget test cho màn hình đăng nhập: bỏ trống email phải báo lỗi.
3. Thêm `Key` cho 3 nút quan trọng và viết test dùng `find.byKey`.
4. Viết một integration test cho luồng thêm sản phẩm vào giỏ.
5. Cố tình sửa logic `tongTien` cho sai, chạy `flutter test` và xác nhận test bắt được lỗi.

<script type="text/markdown" data-id="fl-22" data-nav="Bài 22 · Firebase">
# Bài 22 — Firebase: đăng nhập và dữ liệu đám mây

**Mục tiêu:** app có tài khoản người dùng và dữ liệu lưu trên mạng, nhiều máy xem chung.

Firebase là dịch vụ backend của Google. Nó cho bạn đăng nhập, database, lưu ảnh mà không phải tự viết server — rất hợp khi bạn làm app một mình.

## Chuẩn bị

1. Vào `console.firebase.google.com`, tạo project mới.
2. Cài công cụ dòng lệnh:

```bash
npm install -g firebase-tools
firebase login
dart pub global activate flutterfire_cli
```

3. Trong thư mục project Flutter:

```bash
flutterfire configure
```

Chọn project vừa tạo, chọn nền tảng Android. Lệnh này tự sinh file `lib/firebase_options.dart` và cấu hình Android.

```yaml
dependencies:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
```

## Khởi động Firebase

```dart
import 'package:firebase_core/firebase_core.dart';
import 'firebase_options.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Firebase.initializeApp(
    options: DefaultFirebaseOptions.currentPlatform,
  );
  runApp(const MyApp());
}
```

## Đăng ký và đăng nhập

Bật trước trong Firebase Console: **Authentication** → **Sign-in method** → bật **Email/Password**.

```dart
import 'package:firebase_auth/firebase_auth.dart';

class AuthService {
  final _auth = FirebaseAuth.instance;

  User? get nguoiDungHienTai => _auth.currentUser;
  Stream<User?> get trangThai => _auth.authStateChanges();

  Future<String?> dangKy(String email, String matKhau) async {
    try {
      await _auth.createUserWithEmailAndPassword(
        email: email,
        password: matKhau,
      );
      return null;                 // null = thanh cong
    } on FirebaseAuthException catch (e) {
      return switch (e.code) {
        'weak-password' => 'Mật khẩu quá yếu, cần ít nhất 6 ký tự',
        'email-already-in-use' => 'Email này đã được đăng ký',
        'invalid-email' => 'Email không hợp lệ',
        _ => 'Đăng ký thất bại: ${e.code}',
      };
    }
  }

  Future<String?> dangNhap(String email, String matKhau) async {
    try {
      await _auth.signInWithEmailAndPassword(
        email: email,
        password: matKhau,
      );
      return null;
    } on FirebaseAuthException catch (e) {
      return switch (e.code) {
        'user-not-found' || 'wrong-password' || 'invalid-credential' =>
          'Email hoặc mật khẩu không đúng',
        'too-many-requests' => 'Thử quá nhiều lần, vui lòng đợi',
        _ => 'Đăng nhập thất bại: ${e.code}',
      };
    }
  }

  Future<void> dangXuat() => _auth.signOut();
}
```

Chuyển mã lỗi của Firebase sang câu tiếng Việt dễ hiểu — đúng nguyên tắc ở Bài 18.

## Tự chuyển màn hình theo trạng thái đăng nhập

```dart
StreamBuilder<User?>(
  stream: FirebaseAuth.instance.authStateChanges(),
  builder: (context, snapshot) {
    if (snapshot.connectionState == ConnectionState.waiting) {
      return const Scaffold(
        body: Center(child: CircularProgressIndicator()),
      );
    }
    return snapshot.hasData ? const TrangChu() : const DangNhap();
  },
)
```

Đây là `StreamBuilder` — anh em của `FutureBuilder`, dùng cho dữ liệu đến liên tục (Bài 6). Đăng nhập xong app tự vào trang chủ, đăng xuất tự về màn hình đăng nhập, không cần `Navigator`.

## Firestore — database đám mây

Bật trong Console: **Firestore Database** → **Create database** → chọn chế độ test lúc học.

```dart
import 'package:cloud_firestore/cloud_firestore.dart';

class SanPhamService {
  final _db = FirebaseFirestore.instance;

  // Them
  Future<void> them(String ten, int gia) async {
    await _db.collection('sanPham').add({
      'ten': ten,
      'gia': gia,
      'ngayTao': FieldValue.serverTimestamp(),
    });
  }

  // Doc mot lan
  Future<List<SanPham>> layDanhSach() async {
    final snap = await _db.collection('sanPham').orderBy('ngayTao').get();
    return snap.docs
        .map((d) => SanPham.fromJson({...d.data(), 'id': d.id}))
        .toList();
  }

  // Doc realtime - tu cap nhat khi du lieu doi
  Stream<List<SanPham>> theoDoi() {
    return _db.collection('sanPham').snapshots().map((snap) => snap.docs
        .map((d) => SanPham.fromJson({...d.data(), 'id': d.id}))
        .toList());
  }

  Future<void> sua(String id, int giaMoi) =>
      _db.collection('sanPham').doc(id).update({'gia': giaMoi});

  Future<void> xoa(String id) =>
      _db.collection('sanPham').doc(id).delete();
}
```

Hiển thị realtime:

```dart
StreamBuilder<List<SanPham>>(
  stream: SanPhamService().theoDoi(),
  builder: (context, snapshot) {
    if (snapshot.hasError) return const Text('Có lỗi xảy ra');
    if (!snapshot.hasData) {
      return const Center(child: CircularProgressIndicator());
    }
    final ds = snapshot.data!;
    if (ds.isEmpty) return const Text('Chưa có sản phẩm');

    return ListView.builder(
      itemCount: ds.length,
      itemBuilder: (_, i) => ListTile(title: Text(ds[i].ten)),
    );
  },
)
```

Sửa dữ liệu trên Console thì app đang mở **tự đổi ngay**, không cần tải lại. Đây là điểm mạnh nhất của Firestore.

## Quy tắc bảo mật — đừng bỏ qua

Chế độ test cho phép mọi người đọc ghi, và Firebase sẽ tự khoá sau 30 ngày. Trước khi phát hành, vào **Firestore** → **Rules**:

```text
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /sanPham/{id} {
      allow read: if true;
      allow write: if request.auth != null;
    }
    match /donHang/{id} {
      allow read, write: if request.auth != null
                         && request.auth.uid == resource.data.userId;
    }
  }
}
```

Ý nghĩa: ai cũng xem được sản phẩm, chỉ người đã đăng nhập mới thêm sửa; đơn hàng thì chỉ chủ đơn mới xem được đơn của mình.

Để nguyên chế độ test khi phát hành nghĩa là bất kỳ ai cũng xoá sạch được database của bạn.

## Bài tập

1. Tạo project Firebase, chạy `flutterfire configure` thành công.
2. Làm màn hình đăng ký và đăng nhập, hiện thông báo lỗi tiếng Việt.
3. Dùng `StreamBuilder` tự chuyển giữa màn hình đăng nhập và trang chủ.
4. Lưu danh sách sản phẩm lên Firestore, hiển thị realtime.
5. Viết quy tắc bảo mật chỉ cho người đã đăng nhập được ghi dữ liệu.
</script>

# Bài 23 — Build và phát hành app

**Mục tiêu:** xuất file cài đặt và đưa app lên Google Play.

## Kiểm tra trước khi build

```bash
flutter analyze        # tim loi va canh bao trong code
flutter test           # chay toan bo test
flutter clean          # xoa cache khi build loi la
```

`flutter analyze` nên sạch hoàn toàn trước khi phát hành.

## Tạo khoá ký

Android bắt buộc app phải được ký. **Giữ file khoá này cẩn thận** — mất là không cập nhật được app trên Play Store nữa, phải đăng app mới.

```bash
keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload
```

Tạo `android/key.properties`:

```text
storePassword=mat_khau_cua_ban
keyPassword=mat_khau_cua_ban
keyAlias=upload
storeFile=C:/Users/ten-ban/upload-keystore.jks
```

**Thêm file này vào `.gitignore`** — nó chứa mật khẩu, không được đẩy lên GitHub.

Sửa `android/app/build.gradle.kts` (hoặc `.gradle` với project cũ), thêm trước `android {`:

```kotlin
import java.util.Properties
import java.io.FileInputStream

val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(FileInputStream(keystorePropertiesFile))
}
```

Trong khối `android { }`:

```kotlin
signingConfigs {
    create("release") {
        keyAlias = keystoreProperties["keyAlias"] as String
        keyPassword = keystoreProperties["keyPassword"] as String
        storeFile = file(keystoreProperties["storeFile"] as String)
        storePassword = keystoreProperties["storePassword"] as String
    }
}

buildTypes {
    getByName("release") {
        signingConfig = signingConfigs.getByName("release")
        isMinifyEnabled = true
        isShrinkResources = true
    }
}
```

## Build file cài đặt

```bash
# APK - gui truc tiep cho nguoi khac cai thu
flutter build apk --release

# APK tach theo kien truc - nhe hon
flutter build apk --split-per-abi

# App Bundle - bat buoc khi dua len Google Play
flutter build appbundle --release
```

Vị trí file:

| Lệnh | File nằm ở |
| --- | --- |
| `build apk` | `build/app/outputs/flutter-apk/app-release.apk` |
| `build appbundle` | `build/app/outputs/bundle/release/app-release.aab` |

APK gửi cho bạn bè cài thử. AAB mới là thứ tải lên Google Play.

## Đổi thông tin app

`android/app/build.gradle.kts`:

```kotlin
defaultConfig {
    applicationId = "com.tenban.tenapp"   // duy nhat tren toan Play Store
    minSdk = 23
    targetSdk = 35
    versionCode = 1                        // tang moi lan cap nhat
    versionName = "1.0.0"                  // nguoi dung nhin thay
}
```

Hoặc đơn giản hơn, đổi trong `pubspec.yaml`:

```yaml
version: 1.0.0+1      # versionName+versionCode
```

`versionCode` **phải tăng** mỗi lần tải bản mới lên Play, nếu không sẽ bị từ chối.

## Đưa lên Google Play

1. Đăng ký tài khoản nhà phát triển tại `play.google.com/console` — phí 25 USD, trả một lần.
2. **Create app** → điền tên, ngôn ngữ, loại app.
3. Chuẩn bị tài liệu bắt buộc:

| Thứ | Yêu cầu |
| --- | --- |
| Icon | PNG 512×512 |
| Ảnh bìa | 1024×500 |
| Ảnh chụp màn hình | Tối thiểu 2 ảnh điện thoại |
| Mô tả ngắn | Tối đa 80 ký tự |
| Mô tả đầy đủ | Tối đa 4000 ký tự |
| Chính sách quyền riêng tư | Một trang web công khai — bắt buộc |

4. Tải file `.aab` lên mục **Production** hoặc **Internal testing**.
5. Điền bảng câu hỏi về nội dung, đối tượng, quyền riêng tư.
6. Gửi duyệt — thường 1–7 ngày.

Lời khuyên: dùng **Internal testing** trước. Nó cho phép tối đa 100 người cài thử qua link, duyệt nhanh hơn nhiều, và bạn sửa lỗi trước khi công bố rộng.

## Build cho iOS

Cần máy macOS và tài khoản Apple Developer (99 USD/năm):

```bash
flutter build ios --release
```

Rồi mở `ios/Runner.xcworkspace` bằng Xcode để ký và tải lên App Store Connect.

## Tự động build bằng GitHub Actions

```yaml
name: Build APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
```

Đẩy một tag `v1.0.0` lên là GitHub tự build và cho bạn tải APK về.

## Lỗi hay gặp khi build

| Lỗi | Cách sửa |
| --- | --- |
| `Execution failed for task ':app:lintVitalRelease'` | Thêm `lint { checkReleaseBuilds = false }` vào `android {}` |
| `Keystore file not found` | Kiểm tra đường dẫn trong `key.properties`, dùng dấu `/` |
| APK chạy máy ảo nhưng bản release lỗi mạng | Thiếu quyền INTERNET trong AndroidManifest |
| Build rất lâu lần đầu | Bình thường, Gradle đang tải phụ thuộc |
| `minSdkVersion` quá thấp | Nâng `minSdk` lên 23 hoặc cao hơn |

## Bài tập

1. Chạy `flutter analyze` và sửa hết cảnh báo.
2. Tạo keystore và cấu hình ký cho bản release.
3. Build APK release và cài lên máy ảo hoặc điện thoại thật.
4. Đổi `applicationId`, tên app và version.
5. Thêm workflow GitHub Actions tự build APK khi đẩy tag.
</script>

<script type="text/markdown" data-id="fl-24" data-nav="Bài 24 · Dự án cuối Flutter">
# Bài 24 — Dự án cuối: app hoàn chỉnh

**Mục tiêu:** một app chạy được trên điện thoại thật, có repo GitHub, đưa được vào CV.

## Đề bài

Làm app **quản lý chi tiêu cá nhân**. Chọn đề này vì nó dùng hết kiến thức của khoá mà vẫn đủ nhỏ để hoàn thành.

Muốn làm đề khác cũng được, miễn đủ các yêu cầu kỹ thuật bên dưới: app ghi chú, app to-do, app đọc tin tức, app danh bạ.

## Chức năng

| # | Màn hình | Chức năng |
| --- | --- | --- |
| 1 | Đăng nhập | Email và mật khẩu, kiểm tra dữ liệu đầu vào |
| 2 | Trang chủ | Tổng thu, tổng chi, số dư tháng này; danh sách giao dịch gần đây |
| 3 | Thêm giao dịch | Số tiền, loại thu/chi, danh mục, ngày, ghi chú |
| 4 | Danh sách | Toàn bộ giao dịch, lọc theo tháng và danh mục |
| 5 | Chi tiết | Xem, sửa, xoá một giao dịch |
| 6 | Thống kê | Tổng theo danh mục, phần trăm từng mục |
| 7 | Cài đặt | Chế độ tối, đổi đơn vị tiền, xoá dữ liệu, đăng xuất |

- [ ] Cấu trúc thư mục theo Bài 17: `models/`, `services/`, `providers/`, `screens/`, `widgets/`, `utils/`

## Gợi ý mô hình dữ liệu

```dart
enum LoaiGiaoDich { thu, chi }

class GiaoDich {
  final String id;
  final int soTien;
  final LoaiGiaoDich loai;
  final String danhMuc;
  final DateTime ngay;
  final String? ghiChu;

  const GiaoDich({
    required this.id,
    required this.soTien,
    required this.loai,
    required this.danhMuc,
    required this.ngay,
    this.ghiChu,
  });

  factory GiaoDich.fromJson(Map<String, dynamic> json) => GiaoDich(
        id: json['id'] ?? '',
        soTien: json['soTien'] ?? 0,
        loai: json['loai'] == 'thu' ? LoaiGiaoDich.thu : LoaiGiaoDich.chi,
        danhMuc: json['danhMuc'] ?? 'Khác',
        ngay: DateTime.tryParse(json['ngay'] ?? '') ?? DateTime.now(),
        ghiChu: json['ghiChu'],
      );

  Map<String, dynamic> toJson() => {
        'id': id,
        'soTien': soTien,
        'loai': loai.name,
        'danhMuc': danhMuc,
        'ngay': ngay.toIso8601String(),
        'ghiChu': ghiChu,
      };
}
```

`enum` là kiểu liệt kê — an toàn hơn dùng chuỗi `'thu'` và `'chi'`, vì gõ sai sẽ báo lỗi ngay lúc viết code.

# Bài 0 — Tester làm gì trong một dự án phần mềm

**Mục tiêu:** hiểu vị trí của mình trong nhóm, biết mình làm việc với ai và làm gì mỗi ngày.

## Tester không phải người "bấm thử xem có lỗi không"

Công việc thật của một tester:

| Giai đoạn | Tester làm gì |
| --- | --- |
| Khi có yêu cầu mới | Đọc tài liệu, hỏi lại chỗ mơ hồ — tìm lỗi **trước khi** code được viết |
| Khi dev đang code | Viết test case, chuẩn bị dữ liệu test, chuẩn bị môi trường |
| Khi có bản build | Thực thi test, ghi kết quả, báo lỗi |
| Khi gần release | Chạy regression, báo cáo, tư vấn có nên phát hành không |
| Sau release | Theo dõi lỗi từ người dùng, bổ sung test case |

Phần giá trị nhất nằm ở hàng đầu tiên. Một câu hỏi đúng lúc đọc tài liệu tiết kiệm nhiều ngày công hơn mười bug tìm được lúc cuối.

## Các vai trò trong nhóm

| Vai trò | Làm gì | Bạn làm việc với họ khi nào |
| --- | --- | --- |
| BA / PO | Viết yêu cầu, quyết định nghiệp vụ | Hỏi khi tài liệu chưa rõ |
| Dev | Viết code | Báo bug, trao đổi cách tái hiện |
| Designer | Thiết kế giao diện | Đối chiếu khi giao diện lệch thiết kế |
| Tester (bạn) | Kiểm thử, báo cáo chất lượng | — |
| QA Lead / Test Manager | Phân công, lập kế hoạch | Nhận việc, báo tiến độ |
| DevOps | Môi trường, triển khai | Khi môi trường test lỗi |

## QA và QC khác nhau

Hai từ hay bị dùng lẫn lộn, và hay được hỏi khi phỏng vấn:

| | QA (Quality Assurance) | QC (Quality Control) |
| --- | --- | --- |
| Mục tiêu | **Ngăn** lỗi xảy ra | **Tìm** lỗi đã có |
| Tập trung vào | Quy trình | Sản phẩm |
| Ví dụ | Đặt ra quy định review code trước khi merge | Chạy test case trên bản build |
| Thời điểm | Suốt dự án | Khi đã có sản phẩm |

Ở Việt Nam, vị trí ghi là "QA" thường thực chất làm công việc QC. Đừng bận tâm tên gọi, nhưng hiểu khác biệt để trả lời phỏng vấn.

## Mô hình phát triển phần mềm

Tester làm việc khác nhau tuỳ mô hình nhóm đang dùng:

| Mô hình | Cách chạy | Tester tham gia khi nào |
| --- | --- | --- |
| **Waterfall** | Làm tuần tự: phân tích → thiết kế → code → test | Chỉ ở cuối, dễ bị dồn việc |
| **Agile / Scrum** | Chia sprint 1–4 tuần, mỗi sprint ra một phần chạy được | Từ đầu sprint, cùng lúc với dev |
| **V-Model** | Mỗi giai đoạn phát triển có một cấp độ test tương ứng | Lập kế hoạch test ngay từ đầu |

Phần lớn công ty ở Việt Nam dùng Scrum hoặc biến thể của nó. Bài 16 nói kỹ về vai trò tester trong sprint.

## Một ngày của tester trong nhóm Scrum

| Thời điểm | Việc |
| --- | --- |
| Sáng | Daily meeting 15 phút: hôm qua làm gì, hôm nay làm gì, có gì vướng |
| Trong ngày | Viết test case cho story mới, test story dev vừa xong, báo bug |
| Khi dev fix xong | Verify lại bug, đóng ticket nếu đã sửa |
| Cuối sprint | Chạy regression, tham gia demo và họp rút kinh nghiệm |

## Kỹ năng cần có

| Nhóm | Cụ thể |
| --- | --- |
| Tư duy | Đặt câu hỏi "nếu người dùng làm sai thì sao", nhìn ra trường hợp ngoài kịch bản chính |
| Nghiệp vụ | Hiểu sản phẩm đang làm gì, phục vụ ai |
| Kỹ thuật | Đọc được log, dùng DevTools, biết SQL cơ bản, hiểu API |
| Giao tiếp | Viết bug report rõ ràng, trao đổi với dev không gây căng thẳng |
| Tiếng Anh | Đọc tài liệu, thuật ngữ — rất nhiều JD yêu cầu |

Kỹ năng quan trọng nhất là nhóm đầu. Công cụ học được trong một tuần; tư duy kiểm thử mất nhiều tháng.

## Lộ trình nghề

```text
Fresher/Intern Manual Tester
        ↓  6-18 thang
Manual Tester co kinh nghiem
        ↓  chon huong
┌───────────────┬──────────────────┬─────────────────┐
Automation      Test Lead /        Chuyen sau
Tester          Test Manager       (Performance,
                                    Security, BA)
```

Khoá Manual này là nền. Xong nó, các khoá automation trong trang sẽ dễ hơn nhiều, vì bạn đã biết **test cái gì** trước khi học **tự động hoá thế nào**.

## Bài tập

1. Chọn một app bạn hay dùng, viết ra 5 chức năng chính của nó.
2. Với mỗi chức năng, nghĩ ra 2 tình huống người dùng có thể làm sai.
3. Tìm 3 tin tuyển dụng Fresher Manual Tester, liệt kê những yêu cầu lặp lại ở cả 3 tin.
4. Viết một đoạn ngắn phân biệt QA và QC bằng lời của bạn.

# Bài 1 — Bảy nguyên lý kiểm thử và quy trình test

**Mục tiêu:** nắm nền tảng lý thuyết mà mọi tester phải biết. Phần này cũng nằm trong Chương 1 của kỳ thi ISTQB.

## Bảy nguyên lý kiểm thử

**1. Kiểm thử chỉ chứng minh có lỗi, không chứng minh không có lỗi**

Test pass hết nghĩa là bạn chưa tìm thấy lỗi, không phải phần mềm không có lỗi. Đừng bao giờ nói "sản phẩm không còn bug".

**2. Không thể kiểm thử toàn bộ**

Một ô nhập số có vô số giá trị. Kiểm hết là bất khả thi. Vì vậy mới cần các kỹ thuật thiết kế test case ở Phần 2 — chọn ít trường hợp nhưng phủ được nhiều rủi ro.

**3. Kiểm thử sớm tiết kiệm thời gian và tiền bạc**

Lỗi tìm thấy lúc đọc tài liệu sửa mất vài phút. Cũng lỗi đó tìm thấy sau khi release có thể mất hàng tuần và mất cả uy tín.

**4. Lỗi thường tụ lại một chỗ**

Thực tế: phần lớn lỗi tập trung ở một số ít module. Module nào đã nhiều lỗi thì khả năng còn lỗi nữa rất cao — nên tập trung test kỹ chỗ đó.

**5. Thuốc trừ sâu bị nhờn**

Chạy mãi một bộ test case thì nó không tìm ra lỗi mới nữa. Phải thường xuyên rà soát và bổ sung test case.

**6. Kiểm thử phụ thuộc ngữ cảnh**

Test app ngân hàng khác test game. App y tế đòi độ chính xác cao hơn app đọc tin tức. Không có một cách test đúng cho mọi dự án.

**7. Sai lầm "không có lỗi"**

Phần mềm không còn bug nhưng không ai dùng được vì làm sai nhu cầu — vẫn là thất bại. Tester phải quan tâm sản phẩm có **đúng việc người dùng cần** không, không chỉ có chạy đúng code không.

Bảy nguyên lý này hay bị hỏi trong phỏng vấn. Học thuộc kèm được một ví dụ cho mỗi cái.

## Lỗi, sai sót và thất bại

Ba từ dễ nhầm, kỳ thi ISTQB hỏi rất kỹ:

| Thuật ngữ | Tiếng Anh | Nghĩa |
| --- | --- | --- |
| Sai sót | **Error / Mistake** | Con người làm sai — lập trình viên hiểu nhầm yêu cầu |
| Khuyết tật | **Defect / Bug / Fault** | Kết quả của sai sót nằm trong code hoặc tài liệu |
| Thất bại | **Failure** | Khi chạy, hệ thống cho kết quả sai so với mong đợi |

Chuỗi quan hệ: **Error → Defect → Failure**. Một defect có thể không bao giờ gây failure nếu đoạn code đó không bao giờ chạy tới.

## Quy trình kiểm thử

Mọi hoạt động test đều theo 5 bước này, dù dự án lớn hay nhỏ:

| Bước | Tên | Làm gì | Sản phẩm |
| --- | --- | --- | --- |
| 1 | Lập kế hoạch | Xác định phạm vi, nguồn lực, lịch, rủi ro | Test plan |
| 2 | Phân tích và thiết kế | Đọc yêu cầu, xác định điều kiện test, viết test case | Test case, test data |
| 3 | Thực thi | Chạy test case, so kết quả, ghi nhận | Test log, bug report |
| 4 | Đánh giá và báo cáo | Đối chiếu tiêu chí kết thúc, tổng hợp | Test report |
| 5 | Kết thúc | Lưu tài liệu, rút kinh nghiệm | Bài học, tài sản test |

Thực tế các bước này chồng lên nhau, không tuần tự tuyệt đối — nhất là trong Agile.

## Tiêu chí vào và tiêu chí ra

**Tiêu chí vào (Entry criteria)** — đủ điều kiện mới bắt đầu test:

- Môi trường test đã sẵn sàng
- Bản build đã được triển khai thành công
- Test case đã viết và được review
- Smoke test pass

**Tiêu chí ra (Exit criteria)** — đủ điều kiện mới kết thúc test:

- Đã chạy hết test case đã lên kế hoạch
- Không còn bug mức Critical và High chưa xử lý
- Tỷ lệ pass đạt ngưỡng đã thống nhất, ví dụ 95%
- Đã hoàn thành báo cáo kiểm thử

Nhóm không định nghĩa hai tiêu chí này thì test sẽ kéo dài vô thời hạn, hoặc dừng tuỳ hứng.

## Xác minh và thẩm định

| | Verification | Validation |
| --- | --- | --- |
| Câu hỏi | Chúng ta xây đúng cách chưa? | Chúng ta xây đúng thứ cần chưa? |
| Đối chiếu với | Tài liệu đặc tả | Nhu cầu thật của người dùng |
| Ví dụ | Review tài liệu, review code | UAT, kiểm thử chấp nhận |

## Bài tập

1. Viết 7 nguyên lý ra giấy kèm một ví dụ thật cho mỗi nguyên lý.
2. Với một bug bạn từng gặp, chỉ ra đâu là error, defect và failure.
3. Viết tiêu chí vào và tiêu chí ra cho việc test chức năng đăng nhập.
4. Giải thích bằng lời của bạn khác biệt giữa verification và validation.

# Bài 2 — Các cấp độ và loại kiểm thử

**Mục tiêu:** gọi đúng tên việc mình đang làm. Đây là phần hay bị hỏi nhất trong phỏng vấn Fresher.

## Bốn cấp độ kiểm thử

Phân theo **phạm vi** của thứ được kiểm:

| Cấp độ | Kiểm gì | Ai làm | Ví dụ |
| --- | --- | --- | --- |
| **Unit / Component** | Một hàm, một class riêng lẻ | Dev | Hàm tính tổng tiền trả đúng chưa |
| **Integration** | Các phần ghép với nhau | Dev hoặc Tester | Màn hình giỏ hàng gọi đúng API tính tiền chưa |
| **System** | Toàn hệ thống hoàn chỉnh | Tester | Luồng mua hàng từ đầu đến cuối |
| **Acceptance (UAT)** | Hệ thống có đáp ứng nhu cầu không | Khách hàng, người dùng | Khách nghiệm thu trước khi release |

Manual tester làm chủ yếu ở cấp **System** và hỗ trợ **UAT**.

## Các loại kiểm thử

Phân theo **mục đích** của việc kiểm:

### Kiểm thử chức năng

Kiểm hệ thống **làm gì** — có đúng yêu cầu không. Đây là phần lớn công việc manual testing.

### Kiểm thử phi chức năng

Kiểm hệ thống **làm tốt đến đâu**:

| Loại | Kiểm gì |
| --- | --- |
| Performance | Chạy nhanh không, chịu được bao nhiêu người dùng (khoá JMeter trong trang này) |
| Usability | Dễ dùng không, người mới có hiểu được không |
| Security | Có lỗ hổng bảo mật không |
| Compatibility | Chạy đúng trên các trình duyệt, thiết bị, hệ điều hành khác nhau |
| Reliability | Chạy liên tục có ổn định không |
| Portability | Cài đặt, chuyển đổi môi trường có dễ không |

### Kiểm thử cấu trúc (White-box)

Kiểm **cấu trúc bên trong** của code — độ phủ câu lệnh, độ phủ nhánh. Thường do dev làm.

### Kiểm thử liên quan đến thay đổi

| Loại | Khi nào chạy | Phạm vi |
| --- | --- | --- |
| **Confirmation / Re-test** | Sau khi dev báo đã fix bug | Chỉ đúng bug đó |
| **Regression** | Sau mỗi thay đổi code | Các chức năng cũ, kiểm xem có bị hỏng không |

Phân biệt hai cái này là câu phỏng vấn kinh điển. Re-test kiểm **lỗi đã sửa chưa**; regression kiểm **sửa chỗ này có làm hỏng chỗ khác không**.

Regression là lý do tồn tại của automation test: chạy tay mỗi lần release thì không xuể.

## Ba loại test theo mức độ

| Loại | Phạm vi | Khi nào |
| --- | --- | --- |
| **Smoke test** | Vài chức năng chính, chạy nhanh | Ngay khi có build mới, xem có đáng test tiếp không |
| **Sanity test** | Một vùng chức năng vừa sửa | Sau một thay đổi nhỏ |
| **Regression test** | Toàn bộ hoặc phần lớn | Trước release |

Ví dụ smoke test cho app thương mại điện tử: mở app được, đăng nhập được, xem được danh sách sản phẩm, thêm được vào giỏ. Bốn cái này fail thì trả build về cho dev, không test tiếp.

## Hộp đen, hộp trắng, hộp xám

| | Black-box | White-box | Grey-box |
| --- | --- | --- | --- |
| Biết gì về bên trong | Không | Biết hết code | Biết một phần |
| Dựa vào | Yêu cầu, đặc tả | Cấu trúc code | Cả hai |
| Ai làm | Tester | Dev | Tester có kiến thức kỹ thuật |

Manual tester làm black-box là chính. Biết thêm chút kỹ thuật (đọc log, xem API) thì chuyển sang grey-box, và giá trị tăng lên rõ rệt.

## Positive và negative testing

| | Positive | Negative |
| --- | --- | --- |
| Kiểm gì | Hệ thống chạy đúng với dữ liệu hợp lệ | Hệ thống xử lý đúng với dữ liệu sai |
| Ví dụ | Đăng nhập đúng tài khoản → vào được | Nhập email sai định dạng → báo lỗi rõ ràng |

Người mới hay chỉ viết test case positive. Bug thật thường nằm ở negative: bỏ trống ô, nhập quá dài, nhập ký tự đặc biệt, bấm hai lần liên tiếp, mất mạng giữa chừng.

**Tỷ lệ tham khảo:** một bộ test case tốt thường có khoảng 40% positive và 60% negative.

## Bài tập

1. Với chức năng đăng nhập, viết ra test case thuộc 4 cấp độ khác nhau.
2. Liệt kê 5 chức năng cho smoke test của một app bạn hay dùng.
3. Cho tình huống "dev sửa bug ở màn hình thanh toán" — viết ra bạn sẽ re-test gì và regression gì.
4. Viết 3 test case positive và 5 test case negative cho ô nhập số điện thoại.
</script>

# Bài 3 — Đọc hiểu yêu cầu và đặt câu hỏi

**Mục tiêu:** tìm lỗi trong tài liệu trước khi dev viết một dòng code. Đây là việc có giá trị cao nhất của tester, và là việc người mới hay bỏ qua.

## Các loại tài liệu bạn sẽ đọc

| Tài liệu | Nội dung | Ai viết |
| --- | --- | --- |
| **SRS / BRD** | Đặc tả yêu cầu đầy đủ, dùng trong Waterfall | BA |
| **User story** | Yêu cầu ngắn theo góc nhìn người dùng, dùng trong Agile | PO / BA |
| **Acceptance criteria** | Điều kiện để story được coi là xong | PO / BA |
| **Wireframe / Design** | Bản vẽ giao diện | Designer |
| **API documentation** | Mô tả các API | Dev |

## User story và acceptance criteria

Mẫu chuẩn của user story:

```text
Là một <vai trò>
Tôi muốn <làm gì>
Để <đạt được điều gì>
```

Ví dụ:

```text
Là một khách hàng
Tôi muốn đặt lại mật khẩu qua email
Để đăng nhập được khi quên mật khẩu

Acceptance criteria:
1. Người dùng nhập email đã đăng ký, hệ thống gửi link đặt lại
2. Link có hiệu lực 15 phút
3. Mật khẩu mới tối thiểu 8 ký tự, có chữ và số
4. Sau khi đổi thành công, các phiên đăng nhập cũ bị đăng xuất
```

Acceptance criteria chính là **nguồn trực tiếp để viết test case**. Mỗi tiêu chí thường sinh ra ít nhất 2 test case: một positive, một negative.

## Checklist rà soát yêu cầu

Đọc một yêu cầu, hỏi lần lượt 7 câu:

| # | Câu hỏi | Ví dụ vấn đề tìm ra |
| --- | --- | --- |
| 1 | Có đo được không? | "Hệ thống phải nhanh" — nhanh là bao nhiêu giây? |
| 2 | Có trường hợp biên nào chưa nói? | Link hết hạn đúng lúc người dùng bấm thì sao? |
| 3 | Luồng lỗi xử lý thế nào? | Email không tồn tại thì báo gì? |
| 4 | Có mâu thuẫn với yêu cầu khác không? | Chỗ này nói 8 ký tự, chỗ kia nói 6 |
| 5 | Ai được phép làm? | Tài khoản bị khoá có đặt lại mật khẩu được không? |
| 6 | Dữ liệu lưu ở đâu, lưu bao lâu? | Link cũ còn trong database không? |
| 7 | Có ảnh hưởng chức năng khác không? | Đổi mật khẩu có ảnh hưởng app mobile đang đăng nhập? |

Áp 7 câu này vào ví dụ ở trên, bạn sẽ tìm ra ít nhất 5 chỗ chưa rõ — tất cả đều là câu hỏi đáng gửi cho BA.

## Yêu cầu tốt có đặc điểm gì

| Đặc điểm | Nghĩa là |
| --- | --- |
| Rõ ràng | Chỉ hiểu được một cách |
| Đo được | Có con số, có tiêu chí kiểm chứng |
| Đầy đủ | Nói cả luồng chính lẫn luồng lỗi |
| Nhất quán | Không mâu thuẫn với yêu cầu khác |
| Khả thi | Làm được với công nghệ và thời gian hiện có |
| Kiểm thử được | Có cách xác minh đúng/sai |

Gặp câu "giao diện phải thân thiện" — đó là yêu cầu không kiểm thử được. Hỏi lại: thân thiện nghĩa là gì, đo bằng gì.

## Cách hỏi BA cho hiệu quả

Hỏi kém:

```text
Yêu cầu này chưa rõ.
```

Hỏi tốt:

```text
Về story đặt lại mật khẩu, em có 3 câu hỏi:

1. Link hết hạn sau 15 phút — nếu người dùng bấm đúng lúc hết hạn
   thì hiển thị màn hình gì? Có cho gửi lại link không?
2. Tài khoản đang bị khoá có được phép đặt lại mật khẩu không?
3. Sau khi đổi mật khẩu, app mobile đang đăng nhập có bị đăng xuất
   theo không, hay chỉ web?

Em cần thông tin này để viết test case cho các luồng đó.
```

Đặc điểm của câu hỏi tốt: cụ thể, đánh số, nêu rõ vì sao cần biết. BA trả lời được ngay thay vì phải hỏi lại bạn.

## Ghi lại câu trả lời

Trả lời qua miệng trong cuộc họp sẽ quên. Luôn ghi lại vào ticket hoặc tài liệu, và xác nhận:

```text
Em ghi nhận lại theo trao đổi hôm nay:
- Link hết hạn: hiện màn hình "Link đã hết hạn" kèm nút gửi lại
- Tài khoản bị khoá: KHÔNG cho đặt lại, báo "Liên hệ hỗ trợ"
- Đăng xuất: áp dụng cả web và mobile

Anh/chị xác nhận giúp em nhé.
```

Việc này còn bảo vệ bạn: khi có tranh cãi về sau, có bằng chứng về điều đã thống nhất.

## Bài tập

1. Lấy một user story bất kỳ (tự viết hoặc từ dự án), áp 7 câu hỏi và liệt kê chỗ chưa rõ.
2. Viết acceptance criteria cho chức năng "tìm kiếm sản phẩm".
3. Soạn một email hỏi BA theo mẫu trên, có đánh số câu hỏi.
4. Tìm trong một tài liệu bất kỳ 3 câu không kiểm thử được và viết lại cho kiểm thử được.
