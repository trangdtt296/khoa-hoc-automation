appium --port 4725
```

## 6. Thứ tự khởi động mỗi lần làm việc

Luôn theo đúng thứ tự này:

| Bước | Lệnh | Kiểm tra |
| --- | --- | --- |
| 1 | Khởi động máy ảo | `adb devices` thấy `device` |
| 2 | `appium` | Thấy dòng `listener started on ... 4723` |
| 3 | Chạy test | Bấm ▶ trong IntelliJ, hoặc `mvn test` ở Terminal thứ hai |

Bỏ bước nào cũng ra lỗi ở bước sau. Lỗi `Connection refused` gần như luôn là quên bước 2.

## Appium Inspector

Tải riêng tại GitHub `appium/appium-inspector`, mục Releases. Bài 5 sẽ dùng. Cài trước để khỏi mất mạch sau.

macOS báo không mở được do nhà phát triển chưa xác minh: chuột phải vào app → **Open** → **Open**.

## Lỗi hay gặp

| Lỗi | Cách sửa |
| --- | --- |
| `appium: command not found` | Node chưa vào PATH, hoặc cài thiếu `-g` |
| `Could not find driver uiautomator2` | Chạy lại `appium driver install uiautomator2` |
| `Error: listen EADDRINUSE :::4723` | Cổng đang bị chiếm, dùng `appium --port 4725` |
| Doctor báo thiếu ANDROID_HOME | Làm lại Bài 2, mở Terminal mới |
| Server chạy nhưng script báo `Connection refused` | Script trỏ sai cổng, hoặc server đã tắt |

## Bài tập

1. Cài Node.js, Appium 2, driver UiAutomator2, chạy `appium driver list --installed` xác nhận.
2. Chạy `appium driver doctor uiautomator2` cho đến khi mọi dòng đều ✔.
3. Khởi động server và đọc kỹ dòng log báo cổng.
4. Tải Appium Inspector về máy.
5. Viết ra giấy thứ tự 3 bước khởi động, dán cạnh màn hình.
</script>

<script type="text/markdown" data-id="pl-thiet-bi" data-nav="Chạy trên điện thoại thật">
# Phụ lục — Chạy test trên điện thoại thật

Máy ảo chậm, hoặc máy tính yếu không chạy nổi emulator thì dùng điện thoại Android thật. Cách này còn gần với thực tế hơn: test trên thiết bị thật phát hiện được lỗi về hiệu năng, mạng và cảm ứng mà máy ảo bỏ sót.

## Bật chế độ nhà phát triển

| Bước | Thao tác trên điện thoại |
| --- | --- |
| 1 | **Cài đặt** → **Giới thiệu điện thoại** |
| 2 | Bấm **Số hiệu bản dựng** (Build number) 7 lần liên tiếp |
| 3 | Nhập mã mở khoá nếu có, hiện thông báo "Bạn đã là nhà phát triển" |
| 4 | Quay lại **Cài đặt** → **Hệ thống** → **Tuỳ chọn nhà phát triển** |
| 5 | Bật **Gỡ lỗi USB** (USB debugging) |

Máy Xiaomi và Oppo còn cần bật thêm **Cài đặt qua USB** (Install via USB) trong cùng mục đó.

## Kết nối

Cắm cáp USB vào máy tính, điện thoại hiện hộp thoại "Cho phép gỡ lỗi USB?" — tick **Luôn cho phép** rồi bấm OK.

```bash
adb devices
```

Kết quả phải ra:

```text
List of devices attached
R58M12ABCDE     device
```

Dãy chữ số đó là `deviceName` dùng trong capabilities:

```java
.setDeviceName("R58M12ABCDE")
```

Hoặc truyền từ dòng lệnh nếu bạn đã làm theo Bài 4: `mvn test -Ddevice=R58M12ABCDE`.

Không thấy thiết bị: đổi cáp USB (nhiều cáp chỉ sạc, không truyền dữ liệu), đổi cổng USB, hoặc cài driver USB của hãng trên Windows.

## Kết nối không dây

Android 11 trở lên hỗ trợ gỡ lỗi qua Wi-Fi, tiện khi cần vuốt màn hình bằng tay trong lúc test:

```bash
adb tcpip 5555
adb connect 192.168.1.15:5555
```

Địa chỉ IP xem ở **Cài đặt** → **Giới thiệu** → **Trạng thái**. Rút cáp ra vẫn chạy được. Lệnh `adb disconnect` để ngắt.

## Khác biệt cần lưu ý

| Điểm | Máy ảo | Máy thật |
| --- | --- | --- |
| Tốc độ | Chậm hơn | Nhanh, đúng thực tế |
| Kích thước màn hình | Cố định | Mỗi máy một khác — tránh locator theo toạ độ |
| Popup hệ thống | Ít | Nhiều: cập nhật, pin yếu, thông báo nhà mạng |
| Khoá màn hình | Không có | Phải tắt khoá màn hình trước khi chạy test |

Trước khi chạy bộ test trên máy thật: tắt khoá màn hình, bật **Luôn bật màn hình khi sạc** trong tuỳ chọn nhà phát triển, và tắt thông báo không cần thiết.

## Chạy test trên nhiều thiết bị cùng lúc

Mỗi thiết bị cần một cổng Appium riêng:

```bash
appium --port 4723
appium --port 4725
```

Và mỗi phiên trỏ đúng `device_name` cùng cổng tương ứng. Đây là lúc nên nghĩ tới device cloud (BrowserStack, Kobiton, Sauce Labs) thay vì tự dựng — các dịch vụ đó cho mượn hàng trăm thiết bị thật qua mạng, trả tiền theo giờ.
</script>

<script type="text/markdown" data-id="pl-ios" data-nav="Ghi chú về iOS">
# Phụ lục — Test app iOS

Khoá Appium và Maestro trong trang này đều dùng Android. Phần này tóm tắt những gì khác khi chuyển sang iOS.

## Điều kiện bắt buộc

**Phải có máy macOS.** Không có cách nào hợp lệ để chạy iOS simulator hay build ứng dụng iOS trên Windows. Đây là giới hạn của Apple, không phải của Appium.

| Cần | Ghi chú |
| --- | --- |
| macOS | Bắt buộc |
| Xcode | Tải từ App Store, nặng khoảng 15 GB |
| Xcode Command Line Tools | `xcode-select --install` |
| Driver XCUITest | `appium driver install xcuitest` |
| Tài khoản Apple Developer | Chỉ cần khi chạy trên máy iPhone thật |

## Capabilities cho iOS

```java
import io.appium.java_client.ios.IOSDriver;
import io.appium.java_client.ios.options.XCUITestOptions;

XCUITestOptions options = new XCUITestOptions()
        .setPlatformName("iOS")
        .setAutomationName("XCUITest")
        .setDeviceName("iPhone 15")
        .setPlatformVersion("17.0")
        .setBundleId("com.saucelabs.mydemoapp.rn");

IOSDriver driver = new IOSDriver(new URL("http://127.0.0.1:4723"), options);
```

`bundleId` của iOS tương đương `appPackage` của Android. Lấy bằng lệnh:

```bash
xcrun simctl listapps booted
```

## Locator khác gì

| Android | iOS |
| --- | --- |
| `accessibilityId` | `accessibilityId` — dùng được cả hai |
| `id` (resource-id) | Không có, dùng `iOSNsPredicateString` |
| `androidUIAutomator` | `iOSNsPredicateString` hoặc `iOSClassChain` |

```java
driver.findElement(AppiumBy.iOSNsPredicateString("label == 'Login'"));
driver.findElement(AppiumBy.iOSClassChain("**/XCUIElementTypeButton[`label == 'Login'`]"));
```

Đây là lý do `accessibilityId` được xếp ưu tiên số một ở Bài 6: nó là chiến lược duy nhất dùng chung được cho cả hai nền tảng. Project nào định chạy cả Android lẫn iOS nên yêu cầu dev gắn accessibility id thống nhất.

## Thiết kế framework chạy cả hai nền tảng

Tách phần capabilities ra theo nền tảng, giữ nguyên screen class và test:

```java
public static AppiumDriver taoDriver() throws Exception {
    String nenTang = System.getProperty("platform", "android");
    if (nenTang.equalsIgnoreCase("ios")) {
        return taoDriverIOS();
    }
    return taoDriverAndroid();
}
```

Chạy: `mvn test -Dplatform=ios`.

Nếu locator khác nhau giữa hai nền tảng, PageFactory cho phép khai báo cả hai ngay trên một trường:

```java
@AndroidFindBy(accessibility = "Login button")
@iOSXCUITFindBy(accessibility = "Login")
private WebElement nutLogin;
``` Đây là lúc Page Object Model trả công: test không phải sửa gì.

## Maestro trên iOS

Maestro hỗ trợ iOS simulator sẵn, không cần cài thêm driver:

```bash
maestro test flow.yaml
```

Chỉ cần đổi `appId` sang bundle id của app iOS. Cú pháp flow giữ nguyên hoàn toàn — đây là một ưu điểm lớn của Maestro so với Appium.

## Nếu không có máy macOS

| Cách | Ghi chú |
| --- | --- |
| Device cloud | BrowserStack, Sauce Labs, Kobiton cho thuê thiết bị iOS thật qua mạng |
| Mac cho thuê theo giờ | MacStadium, MacinCloud |
| Chỉ học Android | Phần lớn JD fresher ở VN chấp nhận kinh nghiệm Android |

Với người mới, học chắc Android trước là lựa chọn hợp lý. Khái niệm chuyển sang iOS gần như y hệt.
</script>

<script type="text/markdown" data-id="pl-java" data-nav="Đối chiếu Python ↔ Java">
# Phụ lục — Đối chiếu Java ↔ Python cho Appium

Khoá Appium trong trang này dùng **Java + TestNG**, vì phần lớn JD Automation Tester ở Việt Nam yêu cầu đúng bộ này.

Phần đối chiếu này dùng cho hai tình huống: bạn đã học xong khoá Playwright và muốn viết Appium bằng Python cho liền mạch; hoặc bạn cần đọc hiểu code Appium Python của nhóm khác.

Điểm quan trọng: **khái niệm giống hệt nhau**. Desired capabilities, driver, locator strategy, wait, Page Object Model — tất cả không đổi. Chỉ cú pháp khác.

## Bộ công cụ tương đương

| Việc | Python | Java |
| --- | --- | --- |
| Quản lý thư viện | pip + `requirements.txt` | Maven + `pom.xml` |
| Thư viện Appium | `Appium-Python-Client` | `java-client` |
| Chạy test | pytest | TestNG (hoặc JUnit) |
| Báo cáo | pytest-html, Allure | Allure, ExtentReports |
| IDE | VS Code | IntelliJ IDEA Community |

## Khởi tạo driver

**Python**

```python
from appium import webdriver
from appium.options.android import UiAutomator2Options

options = UiAutomator2Options()
options.platform_name = "Android"
options.device_name = "emulator-5554"
options.app_package = "com.example.app"
driver = webdriver.Remote("http://127.0.0.1:4723", options=options)
```

**Java**

```java
UiAutomator2Options options = new UiAutomator2Options();
options.setPlatformName("Android");
options.setDeviceName("emulator-5554");
options.setAppPackage("com.example.app");
AndroidDriver driver = new AndroidDriver(new URL("http://127.0.0.1:4723"), options);
```

## Tìm phần tử và thao tác

| Việc | Python | Java |
| --- | --- | --- |
| Tìm theo accessibility id | `driver.find_element(AppiumBy.ACCESSIBILITY_ID, "login")` | `driver.findElement(AppiumBy.accessibilityId("login"))` |
| Tìm nhiều | `find_elements(...)` | `findElements(...)` |
| Bấm | `el.click()` | `el.click()` |
| Gõ chữ | `el.send_keys("abc")` | `el.sendKeys("abc")` |
| Đọc chữ | `el.text` | `el.getText()` |
| Đóng phiên | `driver.quit()` | `driver.quit()` |

## Wait

**Python**

```python
wait = WebDriverWait(driver, 15)
el = wait.until(EC.visibility_of_element_located(
    (AppiumBy.ACCESSIBILITY_ID, "Products")
))
```

**Java**

```java
WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(15));
WebElement el = wait.until(ExpectedConditions.visibilityOfElementLocated(
    AppiumBy.accessibilityId("Products")
));
```

## Cấu trúc test

| Python (pytest) | Java (TestNG) |
| --- | --- |
| `@pytest.fixture` | `@BeforeMethod` / `@AfterMethod` |
| `def test_xxx():` | `@Test public void testXxx()` |
| `assert a == b` | `Assert.assertEquals(a, b)` |
| `@pytest.mark.smoke` | `@Test(groups = "smoke")` |
| `@pytest.mark.parametrize` | `@DataProvider` |
| `conftest.py` | `BaseTest` class |
| `pytest.ini` | `testng.xml` |

## Page Object

Ý tưởng giống hệt. Java có thêm `PageFactory` với annotation `@AndroidFindBy`:

```java
public class LoginScreen extends BaseScreen {
    @AndroidFindBy(accessibility = "Username input field")
    private WebElement oUsername;

    @AndroidFindBy(accessibility = "Login button")
    private WebElement nutLogin;

    public void dangNhap(String user, String pass) {
        oUsername.sendKeys(user);
        nutLogin.click();
    }
}
```

Tương đương với cách khai báo locator thành hằng số ở Bài 11.

## Nếu bạn muốn làm dự án cuối bằng Python

Hoàn toàn được, và là bài tập tốt. Cách nhanh nhất: làm xong dự án Bài 13 bằng Java trước, rồi viết lại bằng Python. Viết lại một project mình đã hiểu rõ bằng ngôn ngữ khác là cách học nhanh nhất, vì bạn chỉ phải nghĩ về cú pháp, không phải nghĩ về logic.

Bộ công cụ tương ứng bên Python:

```bash
pip install Appium-Python-Client pytest pytest-html
```

Cấu trúc đổi tương ứng: `screens/` giữ nguyên ý tưởng, `BaseTest` thành `conftest.py` với fixture, `@DataProvider` thành `@pytest.mark.parametrize`, `testng.xml` thành `pytest.ini`.

## Chọn ngôn ngữ nào khi đi xin việc

| Tình huống | Nên |
| --- | --- |
| JD ghi rõ Java + TestNG | Java — đúng cái khoá này dạy |
| JD ghi Python hoặc không ghi ngôn ngữ | Cái nào cũng được, nói rõ bạn biết cả hai |
| Công ty đã có framework sẵn | Theo ngôn ngữ của framework đó |

Trong phỏng vấn, hiểu **khái niệm** quan trọng hơn thuộc cú pháp. Trả lời được 9 câu hỏi ở Bài 13 có giá trị hơn nhiều so với việc nhớ chính xác tên một method.
</script>

<script type="text/markdown" data-id="pl-so-sanh" data-nav="So sánh Appium vs Maestro">
# Phụ lục — Appium và Maestro: cùng một test case

So sánh bằng cùng một test case thật: **đăng nhập thành công rồi kiểm tra vào được màn hình sản phẩm**.

## Maestro

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- tapOn:
    id: "open menu"
- tapOn: "Log In"
- tapOn:
    id: "Username input field"
- inputText: "bob@example.com"
- tapOn:
    id: "Password input field"
- inputText: "10203040"
- hideKeyboard
- tapOn: "Login"
- assertVisible: "Products"
```

11 dòng, một file, chạy bằng `maestro test login.yaml`.

## Appium + Java

```java
// DriverFactory.java
public class DriverFactory {
    public static AndroidDriver taoDriver() throws Exception {
        UiAutomator2Options options = new UiAutomator2Options()
                .setPlatformName("Android")
                .setAutomationName("UiAutomator2")
                .setDeviceName("emulator-5554")
                .setAppPackage("com.saucelabs.mydemoapp.rn")
                .setAppActivity("com.saucelabs.mydemoapp.rn.MainActivity")
                .setNoReset(false);
        return new AndroidDriver(new URL("http://127.0.0.1:4723"), options);
    }
}

// BaseTest.java
public class BaseTest {
    protected AndroidDriver driver;

    @BeforeMethod
    public void moApp() throws Exception {
        driver = DriverFactory.taoDriver();
        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
    }

    @AfterMethod
    public void dongApp() {
        if (driver != null) driver.quit();
    }
}

// LoginTest.java
public class LoginTest extends BaseTest {

    @Test
    public void dangNhapThanhCong() {
        WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(15));

        driver.findElement(AppiumBy.accessibilityId("open menu")).click();
        wait.until(ExpectedConditions.elementToBeClickable(
                AppiumBy.accessibilityId("Log In Menu Item"))).click();
        driver.findElement(AppiumBy.accessibilityId("Username input field"))
              .sendKeys("bob@example.com");
        driver.findElement(AppiumBy.accessibilityId("Password input field"))
              .sendKeys("10203040");
        driver.hideKeyboard();
        driver.findElement(AppiumBy.accessibilityId("Login button")).click();

        Assert.assertTrue(wait.until(ExpectedConditions.visibilityOfElementLocated(
                AppiumBy.accessibilityId("Products"))).isDisplayed());
    }
}
```

Khoảng 55 dòng, 3 file, cộng thêm `pom.xml` khai báo thư viện, và cần Appium Server chạy sẵn.

## Bảng so sánh

| Tiêu chí | Maestro | Appium |
| --- | --- | --- |
| Số dòng cho test này | 11 | ~45 |
| Số file | 1 | 3 |
| Thời gian cài đặt ban đầu | 15 phút | 2–3 giờ |
| Cần biết lập trình | Không | Có |
| Chờ element | Tự động | Tự viết |
| Chạy test | `maestro test` | Bật server rồi `pytest` |
| Đọc file Excel, gọi API, query database | Không | Có |
| Logic phức tạp (vòng lặp lồng, xử lý dữ liệu) | Hạn chế | Không giới hạn |
| Báo cáo | Cơ bản | Allure, ExtentReports |
| Chạy song song nhiều thiết bị | Hạn chế | Có |
| Hỗ trợ iOS | Có, cùng cú pháp | Có, phải đổi locator |
| Cộng đồng và tài liệu | Nhỏ hơn, đang lớn nhanh | Rất lớn, nhiều năm |
| Số JD ở Việt Nam | Ít | Nhiều |

## Nên chọn cái nào

| Tình huống | Chọn |
| --- | --- |
| Cần có test tự động trong tuần này | Maestro |
| Nhóm QA chưa ai biết code | Maestro |
| Smoke test chạy sau mỗi bản build | Maestro |
| App đổi giao diện liên tục | Maestro |
| Test cần dữ liệu từ database hoặc API | Appium |
| Regression lớn, hàng trăm test case | Appium |
| Chạy trên nhiều thiết bị thật cùng lúc | Appium |
| Công ty đã có framework Java/Python | Appium |
| Bạn đang xây CV automation tester | Học cả hai, Appium là chính |

## Dùng cả hai cùng lúc

Nhiều nhóm làm như sau, và đây là cách hợp lý nhất:

- **Maestro** cho bộ smoke test 10–15 flow, chạy sau mỗi bản build, cho kết quả trong vài phút.
- **Appium** cho bộ regression đầy đủ, chạy hằng đêm, có báo cáo chi tiết và dữ liệu lấy từ API.

Trong phỏng vấn, trả lời được "khi nào chọn cái nào và vì sao" có giá trị hơn nhiều so với chỉ biết cú pháp một công cụ.
</script>

<script type="text/markdown" data-id="ap-4" data-nav="Bài 4 · Project Maven và test đầu tiên">
# Bài 4 — Project Maven và script Appium đầu tiên

**Mục tiêu:** code Java tự mở app trên máy ảo.

## Tạo project Maven

IntelliJ → **New Project**: Name `mobile-automation`, Language **Java**, Build system **Maven**, JDK **17**. Bấm Create.

## Khai báo thư viện trong pom.xml

Mở file `pom.xml`, thay toàn bộ nội dung bằng:

```xml
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
    <modelVersion>4.0.0</modelVersion>

    <groupId>com.trangdtt</groupId>
    <artifactId>mobile-automation</artifactId>
    <version>1.0</version>

    <properties>
        <maven.compiler.source>17</maven.compiler.source>
        <maven.compiler.target>17</maven.compiler.target>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
    </properties>

    <dependencies>
        <dependency>
            <groupId>io.appium</groupId>
            <artifactId>java-client</artifactId>
            <version>9.2.2</version>
        </dependency>
        <dependency>
            <groupId>org.testng</groupId>
            <artifactId>testng</artifactId>
            <version>7.10.2</version>
        </dependency>
    </dependencies>
</project>
```

Lưu file. IntelliJ hiện biểu tượng Maven góc trên phải — bấm vào để tải thư viện. Lần đầu mất vài phút.

| Thư viện | Để làm gì |
| --- | --- |
| `java-client` | Gửi lệnh từ Java tới Appium Server; đã kèm sẵn Selenium |
| `testng` | Chạy test, assertion, nhóm test (dùng từ Bài 10) |

Thư viện không tải được: kiểm tra mạng, rồi chuột phải vào `pom.xml` → **Maven** → **Reload project**.

## Script đầu tiên

Tạo file `src/main/java/BaiTapAppium.java`:

```java
import io.appium.java_client.android.AndroidDriver;
import io.appium.java_client.android.options.UiAutomator2Options;

import java.net.URL;

public class BaiTapAppium {
    public static void main(String[] args) throws Exception {
        UiAutomator2Options options = new UiAutomator2Options()
                .setPlatformName("Android")
                .setAutomationName("UiAutomator2")
                .setDeviceName("emulator-5554")
                .setAppPackage("com.saucelabs.mydemoapp.rn")
                .setAppActivity("com.saucelabs.mydemoapp.rn.MainActivity")
                .setNoReset(false)
                .setAutoGrantPermissions(true);

        AndroidDriver driver = new AndroidDriver(
                new URL("http://127.0.0.1:4723"), options);

        System.out.println("Đã mở app");
        System.out.println("Màn hình hiện tại: " + driver.currentActivity());

        Thread.sleep(3000);    // chỉ để bạn kịp nhìn, Bài 8 sẽ bỏ
        driver.quit();
    }
}
```

Trước khi chạy, nhớ đúng thứ tự: **máy ảo bật → `appium` chạy ở Terminal → bấm ▶ trong IntelliJ**.

App tự mở trên máy ảo là thành công.

## Giải thích

| Dòng | Ý nghĩa |
| --- | --- |
| `UiAutomator2Options` | Khai báo thông số kết nối, gọi là **capabilities** |
| `.setPlatformName("Android")` | Hệ điều hành |
| `.setAutomationName("UiAutomator2")` | Tên driver dùng cho Android |
| `.setDeviceName(...)` | Tên thiết bị, lấy từ `adb devices` |
| `.setAppPackage(...)` | Package của app, lấy ở Bài 2 |
| `.setAppActivity(...)` | Màn hình khởi động, lấy ở Bài 2 |
| `.setNoReset(false)` | Xoá dữ liệu app mỗi lần chạy |
| `.setAutoGrantPermissions(true)` | Tự đồng ý mọi popup xin quyền |
| `new AndroidDriver(url, options)` | Kết nối tới server và mở app |
| `driver.quit()` | Đóng phiên, luôn phải có |

Địa chỉ `http://127.0.0.1:4723` **không có `/wd/hub`** ở cuối — đó là Appium 1, dùng nhầm sẽ báo lỗi 404.

Các lời gọi `.setXxx()` nối liền nhau được vì mỗi lời gọi trả về chính đối tượng đó. Cách viết này gọi là *chuỗi method*, rất phổ biến trong Java.

## Tách capabilities ra class dùng chung

Mọi test đều cần đoạn khai báo này. Tạo `src/main/java/DriverFactory.java`:

```java
import io.appium.java_client.android.AndroidDriver;
import io.appium.java_client.android.options.UiAutomator2Options;

import java.net.URL;
import java.time.Duration;

public class DriverFactory {
    public static final String APPIUM_SERVER = "http://127.0.0.1:4723";
    public static final String APP_PACKAGE = "com.saucelabs.mydemoapp.rn";
    public static final String APP_ACTIVITY = "com.saucelabs.mydemoapp.rn.MainActivity";

    public static AndroidDriver taoDriver() throws Exception {
        UiAutomator2Options options = new UiAutomator2Options()
                .setPlatformName("Android")
                .setAutomationName("UiAutomator2")
                .setDeviceName(System.getProperty("device", "emulator-5554"))
                .setAppPackage(APP_PACKAGE)
                .setAppActivity(APP_ACTIVITY)
                .setNoReset(false)
                .setAutoGrantPermissions(true)
                .setNewCommandTimeout(Duration.ofSeconds(300));

        return new AndroidDriver(new URL(APPIUM_SERVER), options);
    }
}
```

Dùng:

```java
AndroidDriver driver = DriverFactory.taoDriver();
```

`System.getProperty("device", "emulator-5554")` cho phép đổi thiết bị từ dòng lệnh mà không sửa code:

```bash
mvn test -Ddevice=R58M12ABCDE
```

## Vài lệnh driver hữu ích

```java
System.out.println(driver.currentActivity());
System.out.println(driver.getCurrentPackage());
driver.runAppInBackground(Duration.ofSeconds(5));
driver.rotate(org.openqa.selenium.ScreenOrientation.LANDSCAPE);
driver.navigate().back();
```

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `Connection refused` | Appium Server chưa chạy | Mở Terminal, gõ `appium` |
| `Could not find a connected Android device` | Máy ảo chưa bật | Kiểm tra `adb devices` |
| `Activity used to start app doesn't exist` | Sai `appActivity` | Lấy lại bằng lệnh ở Bài 2 |
| `cannot find symbol: class AndroidDriver` | Maven chưa tải thư viện | Reload project trong IntelliJ |
| `404` khi kết nối | URL có `/wd/hub` | Bỏ `/wd/hub` đi |

## Bài tập

1. Tạo project Maven, khai báo `pom.xml`, tải thư viện thành công.
2. Chạy `BaiTapAppium` mở được app trên máy ảo.
3. Tạo `DriverFactory` và viết lại script dùng `taoDriver()`.
4. In ra `currentActivity()` và `getCurrentPackage()`, đối chiếu với giá trị lấy ở Bài 2.
5. Thử bỏ `driver.quit()`, chạy 2 lần liên tiếp và xem điều gì xảy ra.
</script>

<script type="text/markdown" data-id="ap-5" data-nav="Bài 5 · Appium Inspector">
# Bài 5 — Appium Inspector

**Mục tiêu:** soi được cấu trúc app để lấy locator thay vì đoán. Đây là F12 của thế giới mobile.

## Khởi động

Máy ảo đang chạy, `appium` đang chạy. Mở Appium Inspector, điền:

| Trường | Giá trị |
| --- | --- |
| Remote Host | `127.0.0.1` |
| Remote Port | `4723` |
| Remote Path | `/` |

Ở ô **Capability Builder**, thêm từng dòng:

| Name | Type | Value |
| --- | --- | --- |
| platformName | text | `Android` |
| appium:automationName | text | `UiAutomator2` |
| appium:deviceName | text | `emulator-5554` |
| appium:appPackage | text | `com.saucelabs.mydemoapp.rn` |
| appium:appActivity | text | `com.saucelabs.mydemoapp.rn.MainActivity` |

Bấm **Start Session**. Ảnh app hiện ra bên trái. Bấm **Save As** lưu bộ capabilities để lần sau không phải gõ lại.

## Ba khung của Inspector

| Khung | Nội dung |
| --- | --- |
| Trái | Ảnh màn hình app, bấm vào phần tử để chọn |
| Giữa | Cây phần tử (App Source) dạng XML |
| Phải | Thuộc tính của phần tử đang chọn |

Bấm vào một nút, khung bên phải hiện các thuộc tính:

| Thuộc tính | Dùng làm locator | Ưu tiên |
| --- | --- | --- |
| `content-desc` | `AppiumBy.accessibilityId()` | 1 — tốt nhất |
| `resource-id` | `AppiumBy.id()` | 2 |
| `text` | `AppiumBy.androidUIAutomator()` | 3 |
| `class` | Không dùng một mình | — |
| `bounds` | Toạ độ, không nên dùng | — |

Inspector gợi ý sẵn locator ở mục **Find By** — copy về dùng được ngay.

## Các nút quan trọng

| Nút | Công dụng |
| --- | --- |
| **Refresh Source** | Cập nhật cây sau khi app đổi màn hình |
| **Tap** / **Send Keys** | Thao tác trực tiếp để chuyển màn hình trong Inspector |
| **Start Recording** | Ghi thao tác và sinh code |
| **Search for element** | Thử một locator xem có trúng không |

**Search for element** là tính năng tiết kiệm thời gian nhất: gõ locator vào, Inspector báo tìm được bao nhiêu phần tử. Giống `document.querySelectorAll` bên khoá web.

## Quy trình làm việc đúng

| Bước | Làm ở đâu |
| --- | --- |
| Tìm locator, thử xem có trúng không | Appium Inspector |
| Viết code | IntelliJ |
| Chạy test | IntelliJ hoặc `mvn test` |

Đừng viết code rồi chạy để xem locator có đúng không — mỗi lần chạy mất 20–30 giây khởi động app. Thử trong Inspector mất 2 giây.

## Lưu ý

- Inspector **chiếm phiên kết nối**. Đang mở session trong Inspector thì code Java không kết nối được. Bấm **Quit Session** trước khi chạy test.
- Cây phần tử chỉ phản ánh màn hình tại thời điểm Refresh. Chuyển màn hình xong phải bấm **Refresh Source**.
- Code do Recording sinh ra thường dùng XPath dài. Tham khảo thôi, đừng copy nguyên.

## Bài tập

1. Kết nối Inspector vào app mẫu thành công, lưu bộ capabilities.
2. Bấm vào 5 phần tử, ghi lại `content-desc`, `resource-id`, `text` của từng cái.
3. Dùng **Search for element** thử một locator, xác nhận tìm đúng 1 phần tử.
4. Dùng Tap đi tới màn hình giỏ hàng, bấm Refresh Source và soi phần tử ở đó.
5. Lập một bảng ghi lại locator của 10 phần tử bạn sẽ dùng ở các bài sau.
</script>

<script type="text/markdown" data-id="ap-6" data-nav="Bài 6 · Locator trong Appium">
# Bài 6 — Locator: tìm đúng phần tử

**Mục tiêu:** viết locator bền. Nguyên tắc giống Bài 12 khoá web, chỉ đổi tên chiến lược.

## Thứ tự ưu tiên

```java
import io.appium.java_client.AppiumBy;

// 1. Accessibility ID — tốt nhất, dùng được cả iOS
driver.findElement(AppiumBy.accessibilityId("open menu"));

// 2. ID — rất tốt, chỉ Android
driver.findElement(AppiumBy.id("com.saucelabs.mydemoapp.rn:id/productTV"));

// 3. UiAutomator — linh hoạt, chỉ Android
driver.findElement(AppiumBy.androidUIAutomator("new UiSelector().text(\"Login\")"));

// 4. XPath — chậm và dễ hỏng, dùng cuối cùng
driver.findElement(AppiumBy.xpath("//android.widget.TextView[@text='Login']"));
```

Chú ý dấu nháy trong chuỗi Java: chuỗi bọc bằng `"`, nên dấu nháy bên trong phải viết `\"`. Dùng nháy đơn trong XPath (`@text='Login'`) để đỡ phải escape.

| Chiến lược | Lấy từ thuộc tính | Nhận xét |
| --- | --- | --- |
| `accessibilityId` | `content-desc` | Bền nhất, chạy được cả iOS |
| `id` | `resource-id` | Bền, chỉ Android |
| `androidUIAutomator` | Nhiều thuộc tính | Mạnh, tìm nhanh |
| `xpath` | Bất kỳ | Chậm hơn nhiều, dễ hỏng |
| `className` | `class` | Chỉ dùng kèm điều kiện khác |

XPath trên mobile chậm hơn hẳn so với web vì Appium phải dựng lại toàn bộ cây XML mỗi lần tìm. Một test dùng nhiều XPath có thể chậm gấp 2–3 lần.

## UiAutomator — công cụ mạnh nhất trên Android

```java
driver.findElement(AppiumBy.androidUIAutomator(
        "new UiSelector().text(\"Login\")"));

driver.findElement(AppiumBy.androidUIAutomator(
        "new UiSelector().textContains(\"Sauce\")"));

driver.findElement(AppiumBy.androidUIAutomator(
        "new UiSelector().description(\"open menu\")"));

driver.findElement(AppiumBy.androidUIAutomator(
        "new UiSelector().className(\"android.widget.Button\").text(\"Add To Cart\")"));
```

Cuộn tới phần tử rồi tìm — rất hay dùng với danh sách dài:

```java
driver.findElement(AppiumBy.androidUIAutomator(
        "new UiScrollable(new UiSelector().scrollable(true))"
      + ".scrollIntoView(new UiSelector().text(\"Sauce Labs Onesie\"))"));
```

## Tìm nhiều phần tử

```java
import org.openqa.selenium.WebElement;
import java.util.List;

List<WebElement> sanPham = driver.findElements(
        AppiumBy.accessibilityId("Product Item"));

System.out.println(sanPham.size());

for (WebElement sp : sanPham) {
    System.out.println(sp.getText());
}

sanPham.get(0).click();
```

`findElement` (số ít) không thấy thì ném lỗi `NoSuchElementException`. `findElements` (số nhiều) trả về `List` rỗng — dùng nó để đếm hoặc kiểm tra tồn tại:

```java
if (!driver.findElements(AppiumBy.accessibilityId("popup close")).isEmpty()) {
    driver.findElement(AppiumBy.accessibilityId("popup close")).click();
}
```

Đây là kiến thức `List` ở Bài 4 phần Java: `.size()`, `.get(0)`, `.isEmpty()`.

## Khai báo locator thành hằng số

Ngay từ giờ nên viết thế này thay vì rải locator khắp nơi:

```java
import org.openqa.selenium.By;

public class LoginLocators {
    public static final By MENU = AppiumBy.accessibilityId("open menu");
    public static final By O_USERNAME = AppiumBy.accessibilityId("Username input field");
    public static final By NUT_LOGIN = AppiumBy.accessibilityId("Login button");
}
```

`AppiumBy` là class con của `By`, nên khai báo kiểu `By` dùng được cho mọi chiến lược. Bài 11 sẽ đưa các hằng này vào từng screen class.

## Tìm trong phạm vi một phần tử

```java
WebElement gioHang = driver.findElement(AppiumBy.id("com.example:id/cart_list"));
WebElement nutXoa = gioHang.findElement(AppiumBy.accessibilityId("Remove Item"));
```

Tìm từ một phần tử cha giúp tránh nhầm với phần tử trùng tên ở chỗ khác.

## Lấy thông tin từ phần tử

```java
WebElement el = driver.findElement(AppiumBy.accessibilityId("Sauce Labs Backpack"));

System.out.println(el.getText());
System.out.println(el.isDisplayed());
System.out.println(el.isEnabled());
System.out.println(el.getAttribute("content-desc"));
System.out.println(el.getLocation());
System.out.println(el.getSize());
```

## Đánh giá locator

| Locator | Đánh giá |
| --- | --- |
| `content-desc="open menu"` | Tốt nhất |
| `resource-id="com.app:id/login_btn"` | Tốt |
| `text="Đăng nhập"` | Được, hỏng khi đổi ngôn ngữ |
| `//android.widget.Button[3]` | Rất yếu |
| Theo `bounds` (toạ độ) | Không bao giờ dùng |

Phần tử không có `content-desc` lẫn `resource-id`: đề nghị dev thêm `contentDescription` (Android) hoặc `testID` (React Native).

## Bài tập

1. Tìm nút menu bằng `accessibilityId` và bấm vào.
2. Tìm tất cả tên sản phẩm bằng `findElements`, in số lượng và từng tên.
3. Viết locator UiAutomator dùng `textContains`.
4. Dùng `UiScrollable` cuộn tới sản phẩm cuối danh sách.
5. Viết đoạn code đóng popup nếu có, dùng `findElements().isEmpty()`.
6. Tạo class `LoginLocators` khai báo 4 locator thành hằng số.
</script>

<script type="text/markdown" data-id="ap-7" data-nav="Bài 7 · Tương tác với app">
# Bài 7 — Tương tác với app

**Mục tiêu:** thực hiện mọi thao tác cơ bản: bấm, gõ chữ, xoá, đọc nội dung, kiểm tra trạng thái.

## Thao tác cơ bản

```java
import io.appium.java_client.AppiumBy;
import org.openqa.selenium.WebElement;

WebElement oUsername = driver.findElement(
        AppiumBy.accessibilityId("Username input field"));

oUsername.click();                       // bấm
oUsername.sendKeys("bob@example.com");   // gõ chữ
oUsername.clear();                       // xoá nội dung
System.out.println(oUsername.getText()); // đọc chữ
```

Thứ tự luôn là: tìm phần tử → bấm vào nó → gõ chữ.

## Bàn phím

```java
import io.appium.java_client.android.nativekey.AndroidKey;
import io.appium.java_client.android.nativekey.KeyEvent;

driver.hideKeyboard();
driver.pressKey(new KeyEvent(AndroidKey.BACK));
driver.pressKey(new KeyEvent(AndroidKey.ENTER));
driver.pressKey(new KeyEvent(AndroidKey.HOME));
```

Luôn `hideKeyboard()` sau khi điền form — bàn phím ảo che mất nút ở nửa dưới màn hình. Đây là nguyên nhân rất hay gặp của lỗi "không bấm được nút Đăng nhập".

Bàn phím không hiện mà gọi `hideKeyboard()` sẽ ném lỗi, nên bọc lại:

```java
public static void anBanPhim(AndroidDriver driver) {
    try {
        driver.hideKeyboard();
    } catch (Exception e) {
        // ban phim khong hien, bo qua
    }
}
```

## Script đăng nhập hoàn chỉnh

```java
import io.appium.java_client.AppiumBy;
import io.appium.java_client.android.AndroidDriver;

public class TestDangNhap {
    public static void main(String[] args) throws Exception {
        AndroidDriver driver = DriverFactory.taoDriver();

        try {
            driver.findElement(AppiumBy.accessibilityId("open menu")).click();
            driver.findElement(AppiumBy.accessibilityId("Log In Menu Item")).click();

            driver.findElement(AppiumBy.accessibilityId("Username input field"))
                  .sendKeys("bob@example.com");
            driver.findElement(AppiumBy.accessibilityId("Password input field"))
                  .sendKeys("10203040");

            try {
                driver.hideKeyboard();
            } catch (Exception e) {
            }

            driver.findElement(AppiumBy.accessibilityId("Login button")).click();

            String tieuDe = driver.findElement(
                    AppiumBy.accessibilityId("Products")).getText();
            System.out.println("Màn hình sau đăng nhập: " + tieuDe);
        } finally {
            driver.quit();
        }
    }
}
```

`try ... finally` đảm bảo `driver.quit()` luôn chạy kể cả khi có lỗi. Thiếu nó, phiên Appium treo lại và lần chạy sau báo lỗi kết nối.

Tên accessibility id trong app mẫu có thể khác tuỳ phiên bản — lấy đúng bằng Appium Inspector ở Bài 5, đừng gõ theo bài.

## Kiểm tra trạng thái

```java
WebElement nut = driver.findElement(AppiumBy.accessibilityId("Login button"));

System.out.println(nut.isDisplayed());   // có hiển thị không
System.out.println(nut.isEnabled());     // có bấm được không
System.out.println(nut.isSelected());    // checkbox có được chọn không
```

## Kiểm tra phần tử có tồn tại

```java
public static boolean coTonTai(AndroidDriver driver, By locator) {
    return !driver.findElements(locator).isEmpty();
}
```

Dùng:

```java
if (coTonTai(driver, AppiumBy.accessibilityId("popup close"))) {
    driver.findElement(AppiumBy.accessibilityId("popup close")).click();
}
```

Dùng `findElements` thay vì bọc `try/catch` quanh `findElement` — code sạch hơn và chạy nhanh hơn.

## Chụp màn hình

```java
import org.openqa.selenium.OutputType;
import org.openqa.selenium.TakesScreenshot;
import java.io.File;
import java.nio.file.Files;

File anh = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);
Files.copy(anh.toPath(), new File("anh/dang-nhap.png").toPath());
```

## Điều hướng

```java
driver.navigate().back();
driver.runAppInBackground(java.time.Duration.ofSeconds(5));
driver.activateApp("com.saucelabs.mydemoapp.rn");
driver.terminateApp("com.saucelabs.mydemoapp.rn");
System.out.println(driver.currentActivity());
```

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `NoSuchElementException` | Locator sai, hoặc phần tử chưa xuất hiện | Kiểm tra bằng Inspector; thêm wait ở Bài 8 |
| `ElementNotInteractableException` | Phần tử bị che, thường là bàn phím | `hideKeyboard()` hoặc cuộn tới |
| `StaleElementReferenceException` | Màn hình đã vẽ lại, phần tử cũ không còn | Tìm lại phần tử sau khi đổi màn hình |
| `InvalidSessionIdException` | Phiên đã đóng | Kiểm tra `driver.quit()` có bị gọi sớm không |

## Bài tập

1. Viết script đăng nhập hoàn chỉnh theo mẫu, chạy thành công.
2. Viết script bấm vào sản phẩm đầu tiên và in tên, giá ra màn hình.
3. Viết method `coTonTai` và dùng nó để đóng popup nếu có.
4. Thử bỏ `hideKeyboard()` ở form đăng nhập và quan sát lỗi.
5. Chụp màn hình sau khi đăng nhập và mở file ảnh xem.
</script>

<script type="text/markdown" data-id="ap-8" data-nav="Bài 8 · Wait — chống test flaky">
# Bài 8 — Wait: nguyên nhân số một gây test flaky

**Mục tiêu:** bỏ hẳn `Thread.sleep()` và viết wait đúng cách. App mobile tải chậm hơn web nhiều, nên đây là bài quan trọng nhất của phần Appium cơ bản.

## Vấn đề

Code chạy nhanh hơn app vẽ màn hình. Tìm phần tử ngay sau khi bấm nút thì phần tử chưa kịp xuất hiện, test fail — nhưng chạy lại có khi lại pass. Đó là **test flaky**.

Playwright có auto-wait sẵn, Appium **không tự chờ**. Bạn phải tự viết.

## Ba loại wait

| Loại | Cách hoạt động | Nên dùng |
| --- | --- | --- |
| `Thread.sleep(5000)` | Dừng đúng 5 giây dù phần tử đã sẵn sàng | Không bao giờ |
| Implicit wait | Đặt một lần, áp dụng cho mọi `findElement` | Có, mức nền |
| Explicit wait | Chờ một điều kiện cụ thể | Có, dùng chính |

## Implicit wait

```java
import java.time.Duration;

driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
```

Đặt ngay sau khi tạo driver. Nó giải quyết phần lớn trường hợp thông thường.

Hạn chế: chỉ chờ phần tử **xuất hiện trong cây**, không chờ phần tử **hiển thị** hay **bấm được**. Và nó làm chậm `findElements` khi bạn cố tình kiểm tra phần tử không tồn tại.

## Explicit wait

```java
import org.openqa.selenium.support.ui.WebDriverWait;
import org.openqa.selenium.support.ui.ExpectedConditions;
import java.time.Duration;

WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(15));

// Chờ phần tử hiển thị rồi trả về chính nó
WebElement el = wait.until(ExpectedConditions.visibilityOfElementLocated(
        AppiumBy.accessibilityId("Products")));

// Chờ bấm được
wait.until(ExpectedConditions.elementToBeClickable(
        AppiumBy.accessibilityId("Login button"))).click();

// Chờ phần tử biến mất
wait.until(ExpectedConditions.invisibilityOfElementLocated(
        AppiumBy.id("com.example:id/loading")));

// Chờ chữ xuất hiện trong phần tử
wait.until(ExpectedConditions.textToBePresentInElementLocated(
        AppiumBy.accessibilityId("cart badge"), "3"));
```

| Điều kiện | Chờ cho đến khi |
| --- | --- |
| `presenceOfElementLocated` | Phần tử có trong cây (chưa chắc nhìn thấy) |
| `visibilityOfElementLocated` | Phần tử hiển thị trên màn hình |
| `elementToBeClickable` | Phần tử hiển thị và bấm được |
| `invisibilityOfElementLocated` | Phần tử biến mất |
| `textToBePresentInElementLocated` | Phần tử chứa đoạn chữ |

Dùng `visibilityOfElementLocated` làm mặc định. `presenceOf` dễ gây hiểu nhầm: phần tử có trong cây nhưng bị che vẫn tính là có.

## Gói lại thành class dùng chung

Tạo `src/main/java/WaitHelper.java`:

```java
import io.appium.java_client.android.AndroidDriver;
import org.openqa.selenium.By;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

import java.time.Duration;

public class WaitHelper {
    private static final int MAC_DINH = 15;

    public static WebElement choHienThi(AndroidDriver driver, By locator) {
        return new WebDriverWait(driver, Duration.ofSeconds(MAC_DINH))
                .until(ExpectedConditions.visibilityOfElementLocated(locator));
    }

    public static WebElement choBamDuoc(AndroidDriver driver, By locator) {
        return new WebDriverWait(driver, Duration.ofSeconds(MAC_DINH))
                .until(ExpectedConditions.elementToBeClickable(locator));
    }

    public static boolean choBienMat(AndroidDriver driver, By locator) {
        return new WebDriverWait(driver, Duration.ofSeconds(MAC_DINH))
                .until(ExpectedConditions.invisibilityOfElementLocated(locator));
    }
}
```

Dùng:

```java
WaitHelper.choBamDuoc(driver, AppiumBy.accessibilityId("Login button")).click();
```

Bài 11 sẽ đưa các method này vào `BaseScreen` để mọi screen dùng chung.

## Fluent wait — khi cần kiểm soát kỹ hơn

```java
import org.openqa.selenium.support.ui.FluentWait;
import org.openqa.selenium.NoSuchElementException;

WebElement el = new FluentWait<>(driver)
        .withTimeout(Duration.ofSeconds(30))
        .pollingEvery(Duration.ofMillis(500))
        .ignoring(NoSuchElementException.class)
        .until(d -> d.findElement(AppiumBy.accessibilityId("Products")));
```

Dùng khi app có màn hình tải rất chậm và bạn muốn giảm tần suất kiểm tra.

## Khi nào buộc phải dùng sleep

Gần như không bao giờ. Trường hợp hiếm là chờ hiệu ứng chuyển cảnh mà không có phần tử nào để bám vào. Kể cả vậy, hãy thử `elementToBeClickable` trước.

Nếu bắt buộc dùng, ghi chú rõ lý do:

```java
Thread.sleep(1000);   // cho animation chuyen man hinh chay xong, khong co element de cho
```

## Bài tập

1. Viết lại script đăng nhập Bài 7, bỏ hết `Thread.sleep`, thay bằng explicit wait.
2. Tạo class `WaitHelper` với 3 method ở trên.
3. Viết đoạn code chờ số trên badge giỏ hàng đổi thành "2" sau khi thêm 2 sản phẩm.
4. Đặt timeout 2 giây cho một phần tử tải chậm, xem lỗi `TimeoutException`.
5. So sánh thời gian chạy của script dùng `sleep(5000)` và script dùng explicit wait.
</script>

<script type="text/markdown" data-id="ap-9" data-nav="Bài 9 · Gesture: vuốt, cuộn">
# Bài 9 — Gesture: vuốt, cuộn, nhấn giữ

**Mục tiêu:** thao tác với nội dung dài hơn màn hình và các cử chỉ đặc trưng của mobile.

Appium 2 với driver UiAutomator2 cung cấp các lệnh `mobile:` — ngắn gọn và ổn định hơn cách dựng chuỗi toạ độ thủ công.

## Cuộn tới phần tử

Cách tốt nhất trên Android là `UiScrollable`, vì không phụ thuộc kích thước màn hình:

```java
driver.findElement(AppiumBy.androidUIAutomator(
        "new UiScrollable(new UiSelector().scrollable(true))"
      + ".scrollIntoView(new UiSelector().text(\"Sauce Labs Onesie\"))"))
      .click();
```

Cách thứ hai dùng lệnh `mobile:`:

```java
import java.util.Map;

driver.executeScript("mobile: scrollGesture", Map.of(
        "left", 100, "top", 300, "width", 800, "height", 1200,
        "direction", "down",
        "percent", 1.0
));
```

| Tham số | Nghĩa |
| --- | --- |
| `left`, `top`, `width`, `height` | Vùng màn hình thực hiện cuộn |
| `direction` | `up`, `down`, `left`, `right` |
| `percent` | Cuộn bao nhiêu phần vùng đó, `1.0` là trọn vùng |

`Map.of(...)` là cách tạo Map nhanh trong Java 9 trở lên — đúng kiến thức Bài 4 phần Java.

## Vuốt

```java
driver.executeScript("mobile: swipeGesture", Map.of(
        "left", 100, "top", 500, "width", 600, "height", 400,
        "direction", "left",
        "percent", 0.75
));
```

Vuốt trên một phần tử cụ thể — ví dụ vuốt xoá món trong giỏ:

```java
WebElement el = driver.findElement(AppiumBy.accessibilityId("Sauce Labs Backpack"));

driver.executeScript("mobile: swipeGesture", Map.of(
        "elementId", ((RemoteWebElement) el).getId(),
        "direction", "left",
        "percent", 0.8
));
```

Cần `import org.openqa.selenium.remote.RemoteWebElement;` cho dòng ép kiểu.

## Nhấn giữ và bấm theo toạ độ

```java
driver.executeScript("mobile: longClickGesture", Map.of(
        "elementId", ((RemoteWebElement) el).getId(),
        "duration", 2000
));

driver.executeScript("mobile: doubleClickGesture", Map.of(
        "elementId", ((RemoteWebElement) el).getId()
));

// Bam theo toa do - chi dung khi khong con cach nao khac
driver.executeScript("mobile: clickGesture", Map.of("x", 500, "y", 1200));
```

Bấm theo toạ độ là lựa chọn cuối: màn hình khác kích thước là sai ngay.

## Kéo thả

```java
driver.executeScript("mobile: dragGesture", Map.of(
        "startX", 300, "startY", 800,
        "endX", 300, "endY", 300,
        "speed", 1000
));
```

## Method dùng chung

Thêm vào `WaitHelper` hoặc tạo `GestureHelper`:

```java
public class GestureHelper {

    public static WebElement cuonToi(AndroidDriver driver, String chu) {
        return driver.findElement(AppiumBy.androidUIAutomator(
                "new UiScrollable(new UiSelector().scrollable(true))"
              + ".scrollIntoView(new UiSelector().textContains(\"" + chu + "\"))"));
    }

    public static void vuotTren(AndroidDriver driver, WebElement el, String huong) {
        driver.executeScript("mobile: swipeGesture", Map.of(
                "elementId", ((RemoteWebElement) el).getId(),
                "direction", huong,
                "percent", 0.8
        ));
    }
}
```

## Lỗi hay gặp

| Hiện tượng | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| Cuộn mãi không thấy phần tử | Chữ không khớp chính xác | Dùng `textContains` thay cho `text` |
| `UiScrollable` báo lỗi không tìm thấy vùng cuộn | Màn hình không có vùng scrollable | Dùng `mobile: scrollGesture` theo toạ độ |
| Vuốt chạy trên máy ảo, sai trên máy thật | Kích thước màn hình khác | Dùng `elementId` thay cho toạ độ cố định |
| Thao tác quá nhanh, app không kịp | Thiếu wait | Thêm explicit wait sau mỗi gesture |

## Bài tập

1. Dùng `UiScrollable` cuộn tới sản phẩm cuối danh sách và bấm vào.
2. Thêm sản phẩm vào giỏ rồi vuốt trái để xoá, kiểm tra giỏ trống.
3. Viết class `GestureHelper` và dùng lại ở 2 script khác nhau.
4. Thử nhấn giữ một sản phẩm, quan sát app có hiện menu gì không.
5. Viết đoạn code pull-to-refresh màn hình danh sách sản phẩm.
</script>

<script type="text/markdown" data-id="ap-10" data-nav="Bài 10 · TestNG">
# Bài 10 — TestNG: tổ chức và chạy test

**Mục tiêu:** chuyển từ script rời thành bộ test chạy bằng một lệnh, có assertion và báo cáo pass/fail.

TestNG với Java tương đương pytest với Python.

## Cấu trúc thư mục chuẩn Maven

Code test nằm ở `src/test/java`, không phải `src/main/java`:

```text
mobile-automation/
├── src/
│   ├── main/java/        ← code dùng chung: DriverFactory, screens
│   └── test/java/        ← các class test
├── pom.xml
└── testng.xml
```

## Test đầu tiên

Tạo `src/test/java/tests/LoginTest.java`:

```java
package tests;

import io.appium.java_client.AppiumBy;
import io.appium.java_client.android.AndroidDriver;
import org.testng.Assert;
import org.testng.annotations.AfterMethod;
import org.testng.annotations.BeforeMethod;
import org.testng.annotations.Test;

import java.time.Duration;

public class LoginTest {
    private AndroidDriver driver;

    @BeforeMethod
    public void moApp() throws Exception {
        driver = DriverFactory.taoDriver();
        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
    }

    @AfterMethod
    public void dongApp() {
        if (driver != null) {
            driver.quit();
        }
    }

    @Test(groups = {"smoke"})
    public void dangNhapThanhCong() {
        driver.findElement(AppiumBy.accessibilityId("open menu")).click();
        driver.findElement(AppiumBy.accessibilityId("Log In Menu Item")).click();
        driver.findElement(AppiumBy.accessibilityId("Username input field"))
              .sendKeys("bob@example.com");
        driver.findElement(AppiumBy.accessibilityId("Password input field"))
              .sendKeys("10203040");
        driver.findElement(AppiumBy.accessibilityId("Login button")).click();

        boolean hienThi = WaitHelper
                .choHienThi(driver, AppiumBy.accessibilityId("Products"))
                .isDisplayed();
        Assert.assertTrue(hienThi, "Không vào được màn hình Products");
    }

    @Test
    public void dangNhapSaiMatKhau() {
        driver.findElement(AppiumBy.accessibilityId("open menu")).click();
        driver.findElement(AppiumBy.accessibilityId("Log In Menu Item")).click();
        driver.findElement(AppiumBy.accessibilityId("Username input field"))
              .sendKeys("bob@example.com");
        driver.findElement(AppiumBy.accessibilityId("Password input field"))
              .sendKeys("sai_mat_khau");
        driver.findElement(AppiumBy.accessibilityId("Login button")).click();

        String loi = driver.findElement(
                AppiumBy.xpath("//*[contains(@text,'do not match')]")).getText();
        Assert.assertTrue(loi.contains("do not match"), "Sai thông báo lỗi: " + loi);
    }
}
```

## Các annotation của TestNG

| Annotation | Chạy khi nào | Tương đương pytest |
| --- | --- | --- |
| `@BeforeMethod` | Trước **mỗi** test | fixture (phần trước `yield`) |
| `@AfterMethod` | Sau **mỗi** test | fixture (phần sau `yield`) |
| `@BeforeClass` | Một lần trước cả class | fixture `scope="class"` |
| `@AfterSuite` | Một lần sau toàn bộ | fixture `scope="session"` |
| `@Test` | Chính là một test case | `def test_xxx()` |
| `@Test(groups = {"smoke"})` | Gắn nhóm | `@pytest.mark.smoke` |
| `@Test(enabled = false)` | Tạm bỏ qua | `@pytest.mark.skip` |

`@AfterMethod` chạy kể cả khi test fail, nên `driver.quit()` luôn được gọi. Nhờ vậy không còn phiên Appium bị treo.

## Assertion

```java
Assert.assertTrue(dieuKien, "Thông báo khi fail");
Assert.assertFalse(dieuKien, "Thông báo");
Assert.assertEquals(thucTe, mongDoi, "Thông báo");
Assert.assertNotEquals(a, b);
Assert.assertNull(x);
```

**Luôn viết thông báo ở tham số cuối.** Khi test fail trên CI lúc 2 giờ sáng, dòng thông báo đó là thứ duy nhất cho bạn biết chuyện gì xảy ra.

Thứ tự tham số của `assertEquals` là **(thực tế, mong đợi)** — ngược với một số thư viện khác. Viết nhầm thì thông báo lỗi sẽ đọc ngược.

## Soft assertion — kiểm nhiều thứ trong một test

```java
import org.testng.asserts.SoftAssert;

SoftAssert soft = new SoftAssert();
soft.assertEquals(ten, "Sauce Labs Backpack", "Sai tên sản phẩm");
soft.assertEquals(gia, "$29.99", "Sai giá");
soft.assertTrue(nutThem.isDisplayed(), "Không thấy nút thêm giỏ");
soft.assertAll();     // bắt buộc, nếu quên thì test luôn pass
```

`Assert` thường dừng test ngay khi fail. `SoftAssert` ghi nhận hết rồi báo một lượt ở `assertAll()` — hợp khi kiểm tra nhiều trường trên cùng một màn hình.

## testng.xml — chọn test để chạy

Tạo `testng.xml` ở thư mục gốc:

```xml
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">
<suite name="MobileSuite">
    <test name="SmokeTests">
        <groups>
            <run>
                <include name="smoke"/>
            </run>
        </groups>
        <classes>
            <class name="tests.LoginTest"/>
            <class name="tests.CartTest"/>
        </classes>
    </test>
</suite>
```

Thêm plugin vào `pom.xml` để `mvn test` đọc file này:

```xml
<build>
    <plugins>
        <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-surefire-plugin</artifactId>
            <version>3.2.5</version>
            <configuration>
                <suiteXmlFiles>
                    <suiteXmlFile>testng.xml</suiteXmlFile>
                </suiteXmlFiles>
            </configuration>
        </plugin>
    </plugins>
</build>
```

## Chạy test

| Cách | Lệnh |
| --- | --- |
| Một test | Bấm ▶ bên trái method trong IntelliJ |
| Cả class | Bấm ▶ bên trái tên class |
| Cả suite | Chuột phải `testng.xml` → Run |
| Dòng lệnh | `mvn test` |
| Đổi thiết bị | `mvn test -Ddevice=emulator-5556` |

Kết quả ở Terminal:

```text
===============================================
MobileSuite
Total tests run: 2, Passes: 2, Failures: 0, Skips: 0
===============================================
```

## Thứ tự và phụ thuộc

```java
@Test(priority = 1)
public void dangNhap() { }

@Test(priority = 2, dependsOnMethods = "dangNhap")
public void themVaoGio() { }
```

Dùng hạn chế. Test phụ thuộc nhau thì một test hỏng kéo theo cả chuỗi, và không chạy song song được. Cách tốt hơn là mỗi test tự chuẩn bị dữ liệu của mình trong `@BeforeMethod`.

## Bài tập

1. Tạo `LoginTest` với `@BeforeMethod`, `@AfterMethod` và 2 test, chạy thành công.
2. Gắn `groups = {"smoke"}` cho test chính, tạo `testng.xml` chỉ chạy nhóm smoke.
3. Thêm plugin surefire và chạy `mvn test` từ Terminal.
4. Viết một test dùng `SoftAssert` kiểm 3 thứ trên màn hình chi tiết sản phẩm.
5. Cố tình để một assertion fail, đọc thông báo và xác nhận nó nói rõ sai ở đâu.
</script>

<script type="text/markdown" data-id="ap-11" data-nav="Bài 11 · Page Object Model">
# Bài 11 — Page Object Model cho mobile

**Mục tiêu:** tách locator ra khỏi test. Đây là kiến thức được hỏi gần như chắc chắn khi phỏng vấn.

## Vấn đề

Locator `accessibilityId("Username input field")` xuất hiện trong 20 test. Dev đổi một lần là bạn sửa 20 chỗ.

## Cấu trúc project

```text
src/
├── main/java/
│   ├── DriverFactory.java
│   ├── WaitHelper.java
│   └── screens/
│       ├── BaseScreen.java
│       ├── LoginScreen.java
│       ├── ProductsScreen.java
│       ├── CartScreen.java
│       └── CheckoutScreen.java
└── test/java/
    └── tests/
        ├── BaseTest.java
        ├── LoginTest.java
        └── CartTest.java
```

## BaseScreen — lớp cha dùng chung

```java
package screens;

import io.appium.java_client.AppiumBy;
import io.appium.java_client.android.AndroidDriver;
import org.openqa.selenium.By;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

import java.time.Duration;
import java.util.List;

public class BaseScreen {
    protected AndroidDriver driver;
    protected WebDriverWait wait;

    public BaseScreen(AndroidDriver driver) {
        this.driver = driver;
        this.wait = new WebDriverWait(driver, Duration.ofSeconds(15));
    }

    protected WebElement choHienThi(By locator) {
        return wait.until(ExpectedConditions.visibilityOfElementLocated(locator));
    }

    protected WebElement choBamDuoc(By locator) {
        return wait.until(ExpectedConditions.elementToBeClickable(locator));
    }

    protected void bam(By locator) {
        choBamDuoc(locator).click();
    }

    protected void nhap(By locator, String chu) {
        WebElement el = choHienThi(locator);
        el.clear();
        el.sendKeys(chu);
    }

    protected String layChu(By locator) {
        return choHienThi(locator).getText();
    }

    protected boolean coTonTai(By locator) {
        return !driver.findElements(locator).isEmpty();
    }

    protected void anBanPhim() {
        try {
            driver.hideKeyboard();
        } catch (Exception e) {
            // ban phim khong hien, bo qua
        }
    }

    protected WebElement cuonToi(String chu) {
        return driver.findElement(AppiumBy.androidUIAutomator(
                "new UiScrollable(new UiSelector().scrollable(true))"
              + ".scrollIntoView(new UiSelector().textContains(\"" + chu + "\"))"));
    }
}
```

Đây chính là kế thừa ở Bài 5 phần Java: `protected` cho class con dùng được, class ngoài thì không.

## LoginScreen

```java
package screens;

import io.appium.java_client.AppiumBy;
import io.appium.java_client.android.AndroidDriver;
import org.openqa.selenium.By;

public class LoginScreen extends BaseScreen {

    private static final By MENU = AppiumBy.accessibilityId("open menu");
    private static final By MUC_LOG_IN = AppiumBy.accessibilityId("Log In Menu Item");
    private static final By O_USERNAME = AppiumBy.accessibilityId("Username input field");
    private static final By O_PASSWORD = AppiumBy.accessibilityId("Password input field");
    private static final By NUT_LOGIN = AppiumBy.accessibilityId("Login button");
    private static final By THONG_BAO_LOI = AppiumBy.xpath("//*[contains(@text,'do not match')]");

    public LoginScreen(AndroidDriver driver) {
        super(driver);
    }

    public void moManHinhDangNhap() {
        bam(MENU);
        bam(MUC_LOG_IN);
    }

    public void dangNhap(String username, String password) {
        if (!username.isEmpty()) {
            nhap(O_USERNAME, username);
        }
        if (!password.isEmpty()) {
            nhap(O_PASSWORD, password);
        }
        anBanPhim();
        bam(NUT_LOGIN);
    }

    public String layThongBaoLoi() {
        return layChu(THONG_BAO_LOI);
    }
}
```

Locator khai báo thành hằng `private static final By` ở đầu class. Nhìn vào là biết màn hình này có những phần tử nào.

## ProductsScreen

```java
package screens;

import io.appium.java_client.AppiumBy;
import io.appium.java_client.android.AndroidDriver;
import org.openqa.selenium.By;

public class ProductsScreen extends BaseScreen {

    private static final By TIEU_DE = AppiumBy.accessibilityId("Products");
    private static final By DANH_SACH_SP = AppiumBy.accessibilityId("Product Item");
    private static final By BADGE_GIO = AppiumBy.accessibilityId("cart badge");
    private static final By ICON_GIO = AppiumBy.accessibilityId("cart");

    public ProductsScreen(AndroidDriver driver) {
        super(driver);
    }

    public boolean dangOManHinhNay() {
        return choHienThi(TIEU_DE).isDisplayed();
    }

    public int demSanPham() {
        return driver.findElements(DANH_SACH_SP).size();
    }

    public void moSanPham(String ten) {
        cuonToi(ten).click();
    }

    public String soLuongTrongGio() {
        return coTonTai(BADGE_GIO) ? layChu(BADGE_GIO) : "0";
    }

    public void moGioHang() {
        bam(ICON_GIO);
    }
}
```

## Test viết lại bằng POM

```java
package tests;

import org.testng.Assert;
import org.testng.annotations.Test;
import screens.LoginScreen;
import screens.ProductsScreen;

public class LoginTest extends BaseTest {

    @Test(groups = {"smoke"})

        ProductsScreen products = new ProductsScreen(driver);

        login.moManHinhDangNhap();

Test giờ đọc như mô tả test case. Không còn `AppiumBy` nào trong file test.

## PageFactory — cách viết thứ hai

Java có thêm `PageFactory` với annotation:

```java
import io.appium.java_client.pagefactory.AndroidFindBy;
import io.appium.java_client.pagefactory.AppiumFieldDecorator;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.support.PageFactory;

public class LoginScreenPF extends BaseScreen {

    @AndroidFindBy(accessibility = "Username input field")
    private WebElement oUsername;

    @AndroidFindBy(accessibility = "Login button")
    private WebElement nutLogin;

    public LoginScreenPF(AndroidDriver driver) {
        super(driver);
        PageFactory.initElements(
                new AppiumFieldDecorator(driver, Duration.ofSeconds(15)), this);
    }

    public void dangNhap(String user, String pass) {
        oUsername.sendKeys(user);
        nutLogin.click();
    }
}
```

Hai cách đều đúng và đều gặp trong thực tế. Cách khai báo `By` thành hằng linh hoạt hơn khi cần truyền locator vào method; PageFactory gọn hơn khi locator cố định. Biết cả hai để đọc được code của nhóm khác.

## Nguyên tắc

| Nên | Không nên |
| --- | --- |
| Locator là hằng `private static final By` | Locator rải trong test |
| Method đặt theo nghiệp vụ: `dangNhap` | Đặt theo thao tác: `clickButton2` |
| Một class cho một màn hình | Một class cho cả app |
| `Assert` nằm trong test | Nhét hết assert vào screen class |
| Thao tác chung đặt ở `BaseScreen` | Copy wait vào từng screen |

## Bài tập

1. Tạo `BaseScreen`, `LoginScreen`, `BaseTest` và chạy lại 2 test.
2. Viết `ProductsScreen` theo mẫu ở trên.
3. Viết `CartScreen` với `demSanPhamTrongGio()`, `xoaSanPham(String ten)`, `moCheckout()`.
4. Chuyển toàn bộ test cũ sang POM, xác nhận không còn `AppiumBy` nào trong `src/test`.
5. Viết lại `LoginScreen` bằng PageFactory để so sánh hai cách.
</script>

# Bài 12 — Data-driven với DataProvider và báo cáo Allure

**Mục tiêu:** chạy một test với nhiều bộ dữ liệu, và xuất báo cáo gửi được cho leader.

## DataProvider — nhiều bộ dữ liệu

```java
package tests;

import org.testng.Assert;
import org.testng.annotations.DataProvider;
import org.testng.annotations.Test;
import screens.LoginScreen;

public class LoginFailTest extends BaseTest {

    @DataProvider(name = "taiKhoanSai")
    public Object[][] duLieuDangNhapSai() {
        return new Object[][]{
                {"bob@example.com", "sai_mat_khau", "do not match"},
                {"sai@example.com", "10203040", "do not match"},
                {"", "10203040", "Username is required"},
                {"bob@example.com", "", "Password is required"},
                {"khong-phai-email", "10203040", "valid email"},
        };
    }

    @Test(dataProvider = "taiKhoanSai")
    public void dangNhapThatBai(String username, String password, String thongBao) {
        LoginScreen login = new LoginScreen(driver);
        login.moManHinhDangNhap();
        login.dangNhap(username, password);

        Assert.assertTrue(login.layThongBaoLoi().contains(thongBao),
                "Sai thông báo với tài khoản: " + username);
    }
}
```

TestNG chạy test này 5 lần, mỗi dòng dữ liệu một lần, báo cáo 5 kết quả riêng. Một bộ fail không ảnh hưởng các bộ còn lại.

`Object[][]` chính là mảng hai chiều ở Bài 4 phần Java.

Thông báo lỗi thật của app có thể khác — lấy đúng chữ bằng Appium Inspector rồi sửa lại bảng dữ liệu.

## Đọc dữ liệu từ CSV

File `src/test/resources/taikhoan.csv`:

```csv
username,password,thongBao
bob@example.com,sai_mat_khau,do not match
,10203040,Username is required
bob@example.com,,Password is required
```

Class đọc file:

```java
package tests;

import java.io.BufferedReader;
import java.io.FileReader;
import java.util.ArrayList;
import java.util.List;

public class DocCSV {

    public static Object[][] doc(String duongDan) throws Exception {
        List<Object[]> dong = new ArrayList<>();
        try (BufferedReader br = new BufferedReader(new FileReader(duongDan))) {
            br.readLine();                       // bo qua dong tieu de
            String line;
            while ((line = br.readLine()) != null) {
                dong.add(line.split(",", -1));   // -1 de giu o trong
            }
        }
        return dong.toArray(new Object[0][]);
    }
}
```

Dùng:

```java
@DataProvider(name = "tuCSV")
public Object[][] duLieuTuFile() throws Exception {
    return DocCSV.doc("src/test/resources/taikhoan.csv");
}
```

Tham số `-1` trong `split` rất quan trọng: thiếu nó, Java bỏ các ô trống ở cuối dòng và bạn sẽ gặp lỗi thiếu tham số.

Thêm test case giờ chỉ là thêm một dòng vào CSV.

## Báo cáo Allure

Thêm vào `pom.xml`:

```xml
<dependency>
    <groupId>io.qameta.allure</groupId>
    <artifactId>allure-testng</artifactId>
    <version>2.25.0</version>
</dependency>
```

Gắn thông tin vào test:

```java
import io.qameta.allure.*;

@Epic("Mobile Automation")
@Feature("Đăng nhập")
public class LoginTest extends BaseTest {

    @Test(groups = {"smoke"})
    @Story("Đăng nhập thành công")
    @Severity(SeverityLevel.CRITICAL)
    @Description("Kiểm tra đăng nhập bằng tài khoản hợp lệ vào được màn hình sản phẩm")
    public void dangNhapThanhCong() {
        moManHinhDangNhap();
        kiemTraVaoDuocTrangSanPham();
    }

    @Step("Mở màn hình đăng nhập")
    public void moManHinhDangNhap() {
        new LoginScreen(driver).moManHinhDangNhap();
    }

    @Step("Kiểm tra đã vào trang sản phẩm")
    public void kiemTraVaoDuocTrangSanPham() {
        Assert.assertTrue(new ProductsScreen(driver).dangOManHinhNay());
    }
}
```

Mỗi `@Step` hiện thành một dòng trong báo cáo — rất hợp để đối chiếu với các bước trong test case viết tay.

Xem báo cáo:

```bash
mvn clean test
allure serve target/allure-results
```

Lệnh `allure` cần cài Allure commandline riêng. Chưa cài thì dùng tạm báo cáo mặc định của TestNG ở `target/surefire-reports/index.html`.

## Chụp ảnh tự động khi test fail

Thêm vào `BaseTest`:

```java
import io.qameta.allure.Allure;
import org.openqa.selenium.OutputType;
import org.openqa.selenium.TakesScreenshot;
import org.testng.ITestResult;

import java.io.ByteArrayInputStream;

@AfterMethod
public void dongApp(ITestResult ketQua) {
    if (driver != null) {
        if (ketQua.getStatus() == ITestResult.FAILURE) {
            byte[] anh = ((TakesScreenshot) driver).getScreenshotAs(OutputType.BYTES);
            Allure.addAttachment("man-hinh-loi", new ByteArrayInputStream(anh));
        }
        driver.quit();
    }
}
```

TestNG truyền `ITestResult` vào `@AfterMethod` tự động. Mỗi test fail sẽ có một ảnh đính kèm trong báo cáo — đây là thứ đầu tiên bạn nhìn khi test fail trên máy khác.

Chạy song song trên mobile cần **mỗi luồng một thiết bị và một cổng Appium riêng**, phức tạp hơn web nhiều. Với máy ảo trên máy cá nhân thường không đủ tài nguyên. Để dành đến khi dùng device cloud.

```yaml
name: Appium Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cai Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Chay test tren may ao
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install app-release.apk
            appium &
            sleep 10
            mvn clean test

      - name: Luu bao cao

        uses: actions/upload-artifact@v4
        with:
          name: bao-cao

            target/surefire-reports/
            allure-results/
```

# Bài 0 — Agent là gì và khác gì những thứ đã học

**Mục tiêu:** phân biệt rõ chatbot, skill, rule và agent, để biết khi nào dùng cái nào.

## Ba mức dùng AI

| Mức | Bạn làm gì | AI làm gì | Đã học ở |
| --- | --- | --- | --- |
| Hỏi đáp | Gõ một câu hỏi | Trả lời một lần | Bài 26–27 |
| Skill + rule | Viết sẵn hướng dẫn và ràng buộc | Làm theo đúng khuôn mỗi lần | Bài 28–29 |
| **Agent** | Giao một **mục tiêu** | Tự chia bước, tự dùng công cụ, tự kiểm tra, lặp đến khi xong | Bài này |

Khác biệt cốt lõi: chatbot **trả lời**, agent **làm việc**.

## Agent khác chatbot ở ba điểm

**1. Tự lập kế hoạch nhiều bước**

Bạn nói "viết test đăng nhập cho trang này". Chatbot trả về một đoạn code. Agent thì: mở trang, đọc HTML thật, tìm locator, viết code, chạy thử, thấy fail thì sửa, chạy lại, rồi báo kết quả.

**2. Dùng được công cụ**

Agent đọc và ghi file trong project, chạy lệnh trong terminal, mở trình duyệt, gọi API. Chatbot chỉ sinh ra chữ.

**3. Tự kiểm tra và sửa**

Agent chạy test, đọc thông báo lỗi, sửa, chạy lại. Vòng lặp này là thứ làm nên giá trị thật — và cũng là thứ cần kiểm soát, vì agent có thể "sửa cho pass" theo cách sai (xem Bài 3).

## Đặt vào đúng bối cảnh nghề test

Việc một tester làm mỗi ngày, xếp theo mức độ hợp với agent:

| Việc | Hợp với agent | Vì sao |
| --- | --- | --- |
| Chuyển 30 test case tay thành script | Rất hợp | Lặp lại, có khuôn mẫu, kiểm chứng được bằng cách chạy thử |
| Sửa 20 locator sau khi dev đổi giao diện | Rất hợp | Máy móc, agent tự chạy test để xác nhận |
| Điều tra một test flaky | Hợp | Agent đọc được log, trace, chạy lại nhiều lần |
| Viết test case từ user story | Hợp một phần | Agent sinh nháp, bạn bổ sung theo rủi ro nghiệp vụ |
| Quyết định phạm vi kiểm thử | Không hợp | Cần hiểu rủi ro, deadline, lịch sử lỗi của hệ thống |
| Quyết định lỗi này có chặn release không | Không hợp | Trách nhiệm của con người |
| Exploratory testing | Không hợp | Dựa trên quan sát và trực giác |

Ranh giới không đổi so với Bài 26: **agent làm phần máy móc, bạn giữ phần phán đoán.**

## Agent chạy ở đâu

| Nơi | Dùng cho |
| --- | --- |
| Trong IDE (VS Code, IntelliJ) | Viết và sửa code test ngay trong project |
| Trong terminal | Chạy nhiều bước: sửa code, chạy test, đọc log |
| Trong CI | Tự phân tích test fail sau mỗi lần build |

Khoá này không gắn với một công cụ cụ thể nào. Nguyên tắc giao việc và kiểm soát bên dưới áp dụng được cho mọi công cụ agent, và công cụ thì thay đổi liên tục.

## Vì sao tester nên học phần này

Hai lý do thực tế:

- **Khối lượng việc.** Một người làm được việc của ba người khi phần máy móc được giao đi. Đây là thứ đang đổi cách tuyển dụng ở vị trí automation.
- **Câu hỏi phỏng vấn.** "Bạn dùng AI vào việc test thế nào?" đang thành câu hỏi phổ biến. Trả lời được kèm ví dụ cụ thể và cách bạn kiểm soát chất lượng sẽ khác hẳn trả lời chung chung.

Điều cần tránh: nói rằng AI viết hết test cho bạn. Người phỏng vấn sẽ hỏi tiếp bạn kiểm tra thế nào — và đó mới là phần họ muốn nghe.

## Bài tập

1. Liệt kê 5 việc bạn làm nhiều nhất trong tuần, xếp mỗi việc vào nhóm "hợp với agent" hay "cần con người".
2. Với mỗi việc hợp với agent, viết một câu mô tả kết quả bạn mong muốn.
3. Viết ra 2 việc bạn **không** muốn giao cho agent và lý do.
</script>

<script type="text/markdown" data-id="ag-1" data-nav="Bài 1 · Giao việc cho agent">
# Bài 1 — Giao việc cho agent đúng cách

**Mục tiêu:** viết được một yêu cầu mà agent làm ra kết quả dùng được, không phải sửa lại từ đầu.

## Một yêu cầu tốt có 4 phần

| Phần | Nội dung | Thiếu thì sao |
| --- | --- | --- |
| **Mục tiêu** | Kết quả cuối cùng, không phải từng bước | Agent làm nửa chừng rồi dừng |
| **Bối cảnh** | Project nào, file nào, công nghệ gì | Agent đoán, thường đoán sai |
| **Ranh giới** | Được sửa gì, không được đụng gì | Agent sửa cả file bạn không muốn |
| **Cách kiểm chứng** | Làm sao biết đã xong đúng | Agent báo xong khi chưa chạy thử |

Phần cuối là phần hay bị bỏ nhất và quan trọng nhất.

## So sánh hai cách giao việc

Giao kém:

```text
Viết test cho chức năng giỏ hàng
```

Giao tốt:

```text
MỤC TIÊU
Viết 4 test case cho chức năng giỏ hàng của app saucedemo, chạy pass hết.

BỐI CẢNH
- Project Python + Playwright + pytest, đã có Page Object Model trong pages/
- Đã có pages/login_page.py và fixture da_dang_nhap trong conftest.py
- Trang: https://www.saucedemo.com, tài khoản standard_user / secret_sauce

PHẠM VI
4 test: thêm 1 sản phẩm, thêm nhiều sản phẩm, xoá sản phẩm, giỏ trống.

RANH GIỚI
- Chỉ tạo pages/cart_page.py và tests/test_cart.py
- Không sửa file nào khác trong pages/ hay conftest.py
- Không thêm thư viện mới
- Tuân thủ RULES.md trong project

KIỂM CHỨNG
Chạy `pytest tests/test_cart.py -v`, cả 4 test phải pass.
Báo lại kết quả chạy thật, không được nói "chắc là chạy được".
```

Khác biệt nằm ở mục RANH GIỚI và KIỂM CHỨNG. Hai mục này biến agent từ "sinh code" thành "giao việc".

## Nguyên tắc: giao mục tiêu, không giao thao tác

| Giao thao tác | Giao mục tiêu |
| --- | --- |
| "Mở file cart_page.py, thêm method dem_san_pham" | "Viết CartScreen có các method cần cho 4 test ở trên" |
| "Sửa dòng 15 thành get_by_role" | "Sửa các locator yếu trong file này theo thứ tự ưu tiên ở RULES.md" |

Giao thao tác thì bạn vẫn phải nghĩ hết, agent chỉ gõ hộ. Giao mục tiêu thì agent nghĩ phần máy móc.

Ngoại lệ: khi bạn biết chính xác phải sửa gì, giao thao tác nhanh hơn. Đừng bắt agent làm việc nhỏ bằng một đoạn mô tả dài.

## Chia việc lớn thành mốc kiểm tra

Đừng giao "viết cả bộ 15 test case" trong một lần. Agent chạy lâu, và nếu lệch hướng từ bước 2 thì 13 bước sau đều sai.

Cách làm tốt hơn:

| Vòng | Giao gì | Bạn kiểm gì |
| --- | --- | --- |
| 1 | Viết `CartScreen` với 4 method | Đọc locator có bền không |
| 2 | Viết 2 test đầu, chạy pass | Chạy thử, đọc assertion |
| 3 | Viết 2 test còn lại | Chạy cả bộ |
| 4 | Thêm data-driven đọc CSV | Kiểm dữ liệu |

Mỗi vòng xong bạn xem rồi mới cho đi tiếp. Mất thêm vài phút nhưng tránh được việc phải bỏ hết làm lại.

## Cho agent đúng bối cảnh

Agent không tự biết project của bạn. Ba thứ nên đưa:

- **File RULES.md** (Bài 29) — agent đọc là biết quy ước của project.
- **Một file mẫu đã viết đúng** — "viết theo đúng kiểu của `pages/login_page.py`" hiệu quả hơn mô tả bằng lời.
- **HTML thật hoặc ảnh màn hình** — không có thì agent đoán locator, và locator đoán gần như luôn sai.

## Khi agent đi sai hướng

Dừng lại sớm. Dấu hiệu:

- Nó sửa file bạn không yêu cầu
- Nó thêm thư viện mới
- Nó viết rất nhiều code cho một việc nhỏ
- Nó báo xong mà chưa chạy thử

Cách xử lý: dừng, nói rõ cái sai, yêu cầu quay lại trạng thái trước. Đừng cố "chữa cháy" bằng cách giao thêm yêu cầu chồng lên — càng chồng càng rối.

## Bài tập

1. Viết lại một yêu cầu bạn từng giao cho AI theo đủ 4 phần ở trên.
2. Giao cho agent viết `CartScreen` theo mẫu `LoginScreen` của bạn, so sánh kết quả với lần bạn chỉ nói một câu.
3. Chia việc "viết 15 test case" thành 4 vòng, viết rõ mỗi vòng kiểm gì.
4. Thử cố tình giao thiếu phần KIỂM CHỨNG, xem agent có tự chạy test không.

<script type="text/markdown" data-id="ag-2" data-nav="Bài 2 · Agent trong quy trình QA">
# Bài 2 — Agent trong quy trình QA hằng ngày

**Mục tiêu:** 5 tình huống cụ thể giao được cho agent, kèm cách giao và cách kiểm.

## 1. Chuyển test case tay thành script

Việc tốn thời gian nhất của một automation tester mới, và hợp với agent nhất.

```text
MỤC TIÊU: chuyển 8 test case trong file data/testcase-login.csv thành test Playwright.
BỐI CẢNH: project đã có POM trong pages/, xem pages/login_page.py làm mẫu.
         HTML của form đăng nhập ở cuối yêu cầu này.
RANH GIỚI: chỉ tạo tests/test_login.py, không sửa pages/.
KIỂM CHỨNG: chạy pytest tests/test_login.py -v, báo lại số pass/fail thật.
```

**Bạn kiểm:** mỗi test có assertion kiểm tra nghiệp vụ không, hay chỉ kiểm "không crash". Đây là chỗ agent hay làm ẩu nhất.

## 2. Sửa hàng loạt locator sau khi dev đổi giao diện

```text
MỤC TIÊU: cập nhật locator trong pages/ cho khớp HTML mới (đính kèm).
RANH GIỚI: chỉ sửa phần khai báo locator, không đổi tên method, không sửa tests/.
KIỂM CHỨNG: chạy cả bộ test, báo test nào còn fail và vì sao.
```

**Bạn kiểm:** locator mới có theo thứ tự ưu tiên trong RULES.md không, hay agent lại dùng XPath cho nhanh.

## 3. Điều tra test flaky

```text
MỤC TIÊU: tìm nguyên nhân test_them_vao_gio lúc pass lúc fail.
BỐI CẢNH: file trace.zip và log 10 lần chạy gần nhất ở thư mục test-results/.
YÊU CẦU: chạy lại test này 10 lần, ghi lại tỷ lệ fail, chỉ ra nguyên nhân khả dĩ
         kèm bằng chứng từ log. Đề xuất cách sửa, chưa sửa vội.
```

Agent chạy lặp 10 lần là việc bạn ngại làm bằng tay. Lưu ý câu cuối: **chưa sửa vội** — bạn muốn xem chẩn đoán trước khi cho sửa.

**Bạn kiểm:** nguyên nhân có bằng chứng cụ thể từ log không, hay chỉ là phỏng đoán chung chung kiểu "có thể do mạng chậm".

## 4. Phân tích test fail trên CI

```text
MỤC TIÊU: đọc báo cáo lần chạy CI gần nhất, phân loại 6 test fail thành:
          (a) bug thật của sản phẩm
          (b) lỗi của test script
          (c) vấn đề môi trường CI
Mỗi test nêu rõ căn cứ. Không sửa gì.
```

Phân loại này giúp bạn biết nên báo dev hay tự sửa test. Agent đọc log nhanh hơn người, nhưng **kết luận cuối là của bạn** — nhất là nhóm (a), vì báo nhầm bug làm mất uy tín.

## 5. Rà soát bộ test hiện có

```text
MỤC TIÊU: rà toàn bộ thư mục tests/ và chỉ ra:
          1. Test không có assertion thật
          2. Test còn dùng sleep
          3. Locator dễ hỏng
          4. Test trùng nội dung nhau
          5. Chức năng chưa được phủ test
Xuất ra bảng Markdown. Không sửa gì.
```

Mục 5 là thứ agent làm kém nhất — nó không biết nghiệp vụ của bạn. Nhưng mục 1–4 thì rất nhanh và chính xác.

## Nối agent với công cụ của nhóm

Agent mạnh hơn hẳn khi đọc được dữ liệu thật của nhóm: ticket trên Jira, test case trên TestRail, log trên hệ thống giám sát. Nhiều công cụ hiện nay kết nối theo **MCP** — một chuẩn mở để agent gọi tới công cụ bên ngoài.

Khi có kết nối đó, yêu cầu trở thành:

```text
Đọc ticket BUG-1234 trên Jira, viết test case tái hiện lỗi,
rồi viết script Playwright cho test case đó.
```

Chưa có kết nối thì bạn dán nội dung ticket vào — vẫn chạy được, chỉ tốn thêm một bước copy.

Lưu ý quyền riêng tư ở Bài 26 vẫn nguyên giá trị: agent kết nối vào hệ thống thật thì dữ liệu thật đi qua nó. Kiểm tra chính sách công ty trước khi nối.

## Việc không nên giao

| Việc | Vì sao |
| --- | --- |
| Tự sửa code sản phẩm để test pass | Vượt quyền hạn của tester, và che mất bug thật |
| Tự đóng ticket, tự đổi trạng thái bug | Quyết định nghiệp vụ |
| Tự push code lên nhánh chính | Phải qua review của người |
| Tự chạy test trên môi trường production | Rủi ro dữ liệu thật |

Quy tắc chung: agent được **đề xuất** và **làm trong phạm vi project test**, không được tự thay đổi thứ nằm ngoài đó.

## Bài tập

1. Chọn một trong 5 tình huống trên, giao cho agent với project của bạn.
2. Ghi lại: agent mất bao lâu, bạn phải sửa bao nhiêu phần trăm kết quả.
3. Làm tình huống 5 (rà soát bộ test) trên chính project Bài 20, xem nó tìm ra lỗi nào bạn chưa thấy.
4. Viết ra 3 việc trong nhóm bạn tuyệt đối không giao cho agent, kèm lý do.

# Bài 3 — Kiểm soát chất lượng và dự án cuối

**Mục tiêu:** biết agent sai kiểu gì và chặn được, rồi làm một dự án nhỏ để tự đánh giá.

## 5 kiểu sai đặc trưng của agent

**1. Sửa test cho pass thay vì sửa lỗi**

Nguy hiểm nhất. Test fail vì app có bug, agent sửa giá trị mong đợi cho khớp với thực tế — test xanh, bug vẫn còn.

```python
# Truoc: assertion dung, test fail vi app co bug
expect(page.locator(".total")).to_have_text("$32.39")

# Agent "sua": doi gia tri mong doi cho khop thuc te
expect(page.locator(".total")).to_have_text("$29.99")
```

**Cách chặn:** ghi trong yêu cầu — *"nếu test fail, phân tích nguyên nhân trước; chỉ sửa test khi chắc chắn lỗi nằm ở script, không được đổi giá trị mong đợi để test pass"*.

**2. Assertion luôn đúng**

```python
assert len(san_pham) >= 0        # luon dung, vo nghia
expect(page.locator("body")).to_be_visible()    # luon dung
```

**Cách chặn:** sau khi nhận code, đổi một giá trị mong đợi thành sai và chạy lại. Test **phải fail**. Không fail nghĩa là assertion vô nghĩa.

**3. Thêm sleep để "cho chắc"**

Agent gặp test flaky thường thêm `sleep` thay vì tìm wait đúng. RULES.md ở Bài 29 cấm việc này — nhưng phải kiểm lại, vì agent không phải lúc nào cũng tuân thủ.

**4. Viết thừa**

Giao viết 4 test, agent viết thêm 3 helper class, một file config và một README. Code nhiều hơn nghĩa là phải bảo trì nhiều hơn.

**Cách chặn:** nêu rõ phạm vi file được tạo trong phần RANH GIỚI.

**5. Báo xong mà chưa chạy**

**Cách chặn:** luôn yêu cầu dán kết quả chạy thật. Và tự chạy lại một lần nữa ở máy mình.

## Checklist trước khi commit code có agent tham gia

- [ ] Đã tự chạy lại toàn bộ test, không chỉ test mới
- [ ] Mọi locator đã kiểm chứng trên giao diện thật
- [ ] Không còn `sleep` nào
- [ ] **Đã thử làm test fail có chủ đích** — đổi giá trị mong đợi, test phải fail
- [ ] Đọc hiểu được từng dòng code mình commit
- [ ] Không có dữ liệu thật hoặc secret lọt vào code
- [ ] Số file thay đổi đúng như phạm vi đã giao
- [ ] Nếu agent sửa test đang fail: đã tự xác nhận đó là lỗi script, không phải bug sản phẩm

Mục 4 và mục 8 là hai mục quan trọng nhất và hay bị bỏ nhất.

## Trách nhiệm không chuyển giao được

Khi bộ test của bạn bỏ sót một bug ra production, không ai hỏi agent. Họ hỏi bạn.

Vì vậy nguyên tắc cuối cùng của phần này: **đừng commit code bạn không đọc hiểu.** Agent viết nhanh hơn bạn đọc, nên cám dỗ bỏ qua bước đọc là có thật. Code bạn không hiểu thì bạn không bảo trì được, và không bảo vệ được trong review.

## Dự án cuối

Làm trên chính project Bài 20 (saucedemo) bạn đã có.

**Phần 1 — Dùng agent mở rộng bộ test**

Giao cho agent viết thêm 5 test case cho luồng checkout, theo đúng 4 phần ở Bài 1. Ghi lại:

| Mục | Ghi lại |
| --- | --- |
| Yêu cầu bạn viết | Dán nguyên văn |
| Thời gian agent làm | Bao nhiêu phút |
| Bạn phải sửa gì | Liệt kê từng chỗ |
| Tỷ lệ dùng được ngay | Bao nhiêu phần trăm |

**Phần 2 — Kiểm chất lượng**

Chạy đủ checklist 8 mục ở trên. Riêng mục 4, ghi lại kết quả: test nào fail đúng như mong đợi, test nào vẫn pass (và đó là assertion cần viết lại).

**Phần 3 — Rút ra quy tắc**

Mỗi chỗ bạn phải sửa, viết thành một dòng trong `RULES.md`. Đây chính là cách file rule ở Bài 29 lớn dần theo kinh nghiệm thật.

**Phần 4 — Viết lại thành câu trả lời phỏng vấn**

Viết một đoạn 5–7 câu trả lời câu hỏi *"Bạn dùng AI trong công việc test như thế nào?"*, dựa trên đúng những gì bạn vừa làm. Nêu được 3 thứ:

1. Việc cụ thể bạn giao cho AI và việc bạn giữ lại
2. Cách bạn kiểm soát chất lượng kết quả
3. Một lần AI làm sai và bạn phát hiện ra bằng cách nào

Điểm 3 là điểm thuyết phục nhất. Nó cho thấy bạn dùng AI mà vẫn kiểm soát được, thay vì tin tưởng mù quáng.

## Tổng kết khoá AI cho Tester

| Phần | Bạn học được |
| --- | --- |
| Bài 26 | AI làm được gì, không làm được gì, 5 nguyên tắc an toàn dữ liệu |
| Bài 27 | 6 workflow hằng ngày kèm prompt mẫu |
| Bài 28 | Đóng gói quy trình lặp lại thành skill dùng chung cho nhóm |
| Bài 29 | File rule ràng buộc AI theo chuẩn của project |
| Agent 0–3 | Giao việc nhiều bước cho agent và kiểm soát kết quả |

Thứ không đổi qua cả 8 bài: **AI sinh bản nháp, bạn chịu trách nhiệm bản cuối.** Công cụ sẽ thay đổi liên tục, nguyên tắc này thì không.
