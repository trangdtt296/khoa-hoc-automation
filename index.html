# Bài 4 — Kế hoạch kiểm thử

**Mục tiêu:** viết được một test plan đơn giản mà dùng thật được, không phải tài liệu để đó.

## Test plan là gì

Tài liệu trả lời 5 câu: **test cái gì, không test cái gì, ai test, khi nào, và khi nào thì dừng**.

Dự án nhỏ thì test plan chỉ cần 1–2 trang. Dự án lớn hoặc khách hàng yêu cầu thì mới làm đầy đủ theo chuẩn.

## Cấu trúc test plan

```text
1. Giới thiệu
   - Sản phẩm, phiên bản, mục đích tài liệu
2. Phạm vi kiểm thử
   - Trong phạm vi: những chức năng sẽ test
   - Ngoài phạm vi: những gì KHÔNG test, kèm lý do
3. Chiến lược kiểm thử
   - Cấp độ test, loại test áp dụng
   - Kỹ thuật thiết kế test case sẽ dùng
4. Môi trường test
   - URL, tài khoản, thiết bị, trình duyệt
   - Dữ liệu test
5. Tiêu chí vào và ra
6. Lịch và phân công
7. Rủi ro và phương án
8. Sản phẩm bàn giao
   - Test case, bug report, test report
```

Mục 2 là mục quan trọng nhất và hay bị viết sơ sài. **Ghi rõ cái gì KHÔNG test** giúp tránh tranh cãi về sau: "sao chỗ này không test mà vẫn để lọt bug".

## Ví dụ test plan rút gọn

```text
KẾ HOẠCH KIỂM THỬ — CHỨC NĂNG ĐẶT LẠI MẬT KHẨU
Phiên bản: 2.3.0 | Người lập: TrangDTT59 | Ngày: 15/11/2026

1. PHẠM VI
Trong phạm vi:
- Gửi link đặt lại qua email
- Xác thực link (còn hạn, hết hạn, đã dùng)
- Đặt mật khẩu mới và kiểm tra quy tắc
- Đăng xuất các phiên cũ

Ngoài phạm vi:
- Đặt lại mật khẩu qua SMS (chưa phát triển)
- Hiệu năng gửi email hàng loạt (nhóm Performance phụ trách)

2. CHIẾN LƯỢC
- Cấp độ: System testing, hỗ trợ UAT
- Loại: Functional, một phần Usability và Security cơ bản
- Kỹ thuật: Phân vùng tương đương, giá trị biên, bảng quyết định

3. MÔI TRƯỜNG
- URL: https://staging.example.com
- Trình duyệt: Chrome, Safari (2 bản mới nhất), Edge
- Thiết bị: iPhone 13, Samsung A54
- Tài khoản test: 5 tài khoản (thường, bị khoá, chưa kích hoạt, admin, mới)

4. TIÊU CHÍ
Vào: build đã deploy staging, smoke test pass, test case đã review
Ra: chạy đủ 24 test case, không còn bug Critical/High, tỷ lệ pass >= 95%

5. LỊCH
- 16-17/11: Viết và review test case
- 18-20/11: Thực thi vòng 1
- 21/11: Re-test và regression
- 22/11: Báo cáo

6. RỦI RO
| Rủi ro | Ảnh hưởng | Phương án |
| Email staging không gửi được | Chặn toàn bộ test | Dùng Mailtrap, đã xác nhận với DevOps |
| Build trễ | Dồn lịch | Ưu tiên test case High trước |

7. BÀN GIAO
Test case trên TestRail, bug trên Jira, báo cáo tổng hợp ngày 22/11
```

## Ước lượng thời gian test

Câu hỏi phỏng vấn hay gặp: "Làm sao bạn ước lượng thời gian test?"

Cách đơn giản và đủ dùng cho Fresher:

| Bước | Cách tính |
| --- | --- |
| 1 | Đếm số test case dự kiến |
| 2 | Nhân thời gian trung bình mỗi test case (5–15 phút tuỳ độ phức tạp) |
| 3 | Cộng thời gian viết test case (thường bằng 50–70% thời gian thực thi) |
| 4 | Cộng thời gian re-test và regression (khoảng 30%) |
| 5 | Cộng dự phòng 20% cho phát sinh |

Ví dụ: 24 test case × 10 phút = 240 phút ≈ 4 giờ thực thi. Viết test case ≈ 2,5 giờ. Re-test ≈ 1,2 giờ. Dự phòng 20% ≈ 1,5 giờ. **Tổng ≈ 9 giờ, làm tròn 1,5 ngày.**

Nêu được cách tính cụ thể trong phỏng vấn tốt hơn nhiều so với trả lời "em ước chừng".

## Test plan và test strategy khác nhau

| | Test Strategy | Test Plan |
| --- | --- | --- |
| Phạm vi | Toàn công ty hoặc toàn dự án | Một đợt test cụ thể |
| Thay đổi | Hiếm khi | Mỗi release |
| Nội dung | Nguyên tắc chung, công cụ chuẩn | Chi tiết: ai, khi nào, test gì |

## Rủi ro trong kiểm thử

Hai loại rủi ro cần phân biệt:

| Loại | Nghĩa | Ví dụ |
| --- | --- | --- |
| **Product risk** | Rủi ro sản phẩm có lỗi gây hậu quả | Tính sai tiền thanh toán |
| **Project risk** | Rủi ro ảnh hưởng tiến độ dự án | Môi trường test hỏng, nhân sự nghỉ |

Test dựa trên rủi ro (risk-based testing) nghĩa là: chức năng nào rủi ro cao thì test kỹ trước. Chức năng thanh toán test kỹ hơn trang Giới thiệu.

## Bài tập

1. Viết test plan rút gọn cho chức năng đăng ký tài khoản, đủ 7 mục.
2. Phần "Ngoài phạm vi" phải có ít nhất 2 mục kèm lý do.
3. Ước lượng thời gian test cho 30 test case theo cách tính ở trên.
4. Liệt kê 3 product risk và 3 project risk cho một dự án bạn biết.

# Bài 5 — Phân vùng tương đương và phân tích giá trị biên

**Mục tiêu:** từ vô số trường hợp chọn ra ít test case nhưng phủ được nhiều rủi ro. Đây là hai kỹ thuật dùng nhiều nhất trong nghề.

## Vấn đề

Ô nhập tuổi cho phép từ 18 đến 60. Kiểm hết mọi số là bất khả thi. Chọn thế nào cho hợp lý?

## Phân vùng tương đương

Ý tưởng: chia dữ liệu thành các **nhóm mà hệ thống xử lý giống nhau**. Mỗi nhóm chỉ cần test một giá trị đại diện.

Ví dụ ô tuổi 18–60:

| Phân vùng | Khoảng | Giá trị đại diện | Kết quả mong đợi |
| --- | --- | --- | --- |
| Dưới khoảng hợp lệ | < 18 | 15 | Báo lỗi |
| Hợp lệ | 18–60 | 35 | Chấp nhận |
| Trên khoảng hợp lệ | > 60 | 70 | Báo lỗi |
| Không phải số | — | `abc` | Báo lỗi |
| Để trống | — | (rỗng) | Báo lỗi |

Từ vô số trường hợp còn **5 test case**. Logic: nếu 35 chạy đúng thì 36, 37, 42 cũng sẽ đúng, vì cùng một nhánh code xử lý.

Lưu ý quan trọng: nhớ cả phân vùng **không hợp lệ**, không chỉ phân vùng hợp lệ. Người mới hay chỉ test vùng hợp lệ.

## Phân tích giá trị biên

Lỗi thường nằm ở **ranh giới** chứ không ở giữa. Lập trình viên hay viết nhầm `>` thành `>=`.

Với khoảng 18–60, kiểm các giá trị:

| Giá trị | Vị trí | Mong đợi |
| --- | --- | --- |
| 17 | Ngay dưới biên dưới | Lỗi |
| 18 | Biên dưới | Hợp lệ |
| 19 | Ngay trên biên dưới | Hợp lệ |
| 59 | Ngay dưới biên trên | Hợp lệ |
| 60 | Biên trên | Hợp lệ |
| 61 | Ngay trên biên trên | Lỗi |

Có hai cách làm:

| Cách | Giá trị kiểm mỗi biên | Số test case |
| --- | --- | --- |
| **2 điểm** | Giá trị biên và giá trị ngay ngoài | 17, 18, 60, 61 |
| **3 điểm** | Thêm giá trị ngay trong | 17, 18, 19, 59, 60, 61 |

Thực tế dùng 2 điểm là đủ cho phần lớn trường hợp. Dùng 3 điểm khi chức năng quan trọng, ví dụ tính lãi suất hay tính thuế.

## Kết hợp hai kỹ thuật

Luôn dùng chung. Phân vùng tương đương cho bạn các nhóm, giá trị biên cho bạn điểm cần kiểm trong mỗi nhóm.

Ví dụ đầy đủ cho ô **mật khẩu 8–20 ký tự, phải có chữ và số**:

| # | Dữ liệu | Kỹ thuật | Mong đợi |
| --- | --- | --- | --- |
| 1 | (rỗng) | Phân vùng | "Vui lòng nhập mật khẩu" |
| 2 | `abc12` (5 ký tự) | Phân vùng | "Tối thiểu 8 ký tự" |
| 3 | `abcdef1` (7) | Biên | "Tối thiểu 8 ký tự" |
| 4 | `abcdef12` (8) | Biên | Hợp lệ |
| 5 | `abcdefg123456789012` (20) | Biên | Hợp lệ |
| 6 | `abcdefg1234567890123` (21) | Biên | "Tối đa 20 ký tự" |
| 7 | `abcdefgh` (chỉ chữ) | Phân vùng | "Phải có ít nhất một chữ số" |
| 8 | `12345678` (chỉ số) | Phân vùng | "Phải có ít nhất một chữ cái" |
| 9 | `Abc@1234` | Phân vùng | Hợp lệ |
| 10 | `abc 1234` (có dấu cách) | Phân vùng | Theo quy tắc nghiệp vụ |

Mười test case này phủ gần hết rủi ro của một ô mật khẩu.

## Áp dụng cho dữ liệu không phải số

Kỹ thuật này không chỉ dùng cho số:

**Ngày tháng** — ô chọn ngày sinh, cho phép từ 1/1/1900 đến hôm nay:

| Giá trị | Mong đợi |
| --- | --- |
| 31/12/1899 | Lỗi |
| 1/1/1900 | Hợp lệ |
| Hôm nay | Hợp lệ |
| Ngày mai | Lỗi |
| 29/2 năm không nhuận | Lỗi |
| 31/4 | Lỗi |

**Danh mục** — ô chọn tỉnh có 63 lựa chọn:

| Phân vùng | Ví dụ |
| --- | --- |
| Hợp lệ | Quảng Bình |
| Chưa chọn | (để trống) |
| Giá trị không có trong danh sách | Gửi qua API một mã tỉnh không tồn tại |

**File upload** — ảnh tối đa 5 MB, định dạng jpg/png:

| Trường hợp | Mong đợi |
| --- | --- |
| 4,9 MB jpg | Hợp lệ |
| 5 MB jpg | Hợp lệ |
| 5,1 MB jpg | Lỗi dung lượng |
| 1 MB pdf | Lỗi định dạng |
| File 0 byte | Lỗi |
| File đổi đuôi từ .exe thành .jpg | Lỗi — đây là test bảo mật |

## Sai lầm thường gặp

| Sai lầm | Hậu quả |
| --- | --- |
| Chỉ test giá trị ở giữa khoảng | Bỏ lọt lỗi biên, loại lỗi phổ biến nhất |
| Quên phân vùng không hợp lệ | Không biết hệ thống xử lý sai thế nào |
| Test quá nhiều giá trị cùng một phân vùng | Tốn thời gian mà không thêm giá trị |
| Quên trường hợp để trống | Rất hay lọt bug |

## Bài tập

1. Ô nhập số lượng sản phẩm, từ 1 đến 99. Liệt kê phân vùng và giá trị biên cần test.
2. Ô nhập email. Liệt kê 5 phân vùng không hợp lệ khác nhau.
3. Chức năng giảm giá: đơn từ 500.000đ được giảm 10%, từ 1.000.000đ giảm 20%. Viết các giá trị biên cần test.
4. Ô upload ảnh đại diện, tối đa 2 MB, chỉ jpg và png. Viết đủ test case.
5. Lấy một form trong dự án bạn đang làm, áp hai kỹ thuật này cho mọi ô nhập.
</script>

<script type="text/markdown" data-id="mt-6" data-nav="Bài 6 · Bảng quyết định, chuyển trạng thái">
# Bài 6 — Bảng quyết định và sơ đồ chuyển trạng thái

**Mục tiêu:** xử lý nghiệp vụ có nhiều điều kiện kết hợp, và nghiệp vụ có trạng thái thay đổi.

## Bảng quyết định

Dùng khi kết quả phụ thuộc vào **nhiều điều kiện cùng lúc**. Phân vùng tương đương không xử lý được loại này vì các điều kiện tác động lẫn nhau.

### Ví dụ: chính sách miễn phí vận chuyển

Quy tắc: miễn phí ship khi **đơn từ 500.000đ** hoặc **là thành viên VIP**. Nhưng giao ngoại thành thì luôn tính phí.

| Điều kiện | TC1 | TC2 | TC3 | TC4 | TC5 | TC6 | TC7 | TC8 |
| --- | --- | --- | --- | --- | --- | --- | --- | --- |
| Đơn ≥ 500k | Đ | Đ | Đ | Đ | S | S | S | S |
| Là VIP | Đ | Đ | S | S | Đ | Đ | S | S |
| Giao ngoại thành | Đ | S | Đ | S | Đ | S | Đ | S |
| **Kết quả** | | | | | | | | |
| Miễn phí ship | | ✓ | | ✓ | | ✓ | | |
| Tính phí ship | ✓ | | ✓ | | ✓ | | ✓ | ✓ |

Cách lập:

1. Liệt kê các điều kiện — ở đây có 3.
2. Số cột = 2 mũ số điều kiện = 2³ = **8 cột**.
3. Điền Đ/S theo quy luật: điều kiện 1 đổi mỗi 4 cột, điều kiện 2 mỗi 2 cột, điều kiện 3 mỗi 1 cột.
4. Điền kết quả cho từng cột theo quy tắc nghiệp vụ.
5. Mỗi cột thành một test case.

Giá trị thật của kỹ thuật này: lập bảng xong, bạn thường phát hiện **có cột mà tài liệu chưa nói kết quả là gì** — đó chính là lỗ hổng trong yêu cầu, mang đi hỏi BA ngay.

### Rút gọn bảng

8 cột có thể rút nếu một số cột cho cùng kết quả bất kể điều kiện còn lại. Ở ví dụ trên, khi "giao ngoại thành = Đ" thì luôn tính phí, không cần quan tâm hai điều kiện kia:

| Điều kiện | TC1 | TC2 | TC3 | TC4 |
| --- | --- | --- | --- | --- |
| Giao ngoại thành | Đ | S | S | S |
| Đơn ≥ 500k | – | Đ | S | S |
| Là VIP | – | – | Đ | S |
| **Miễn phí ship** | | ✓ | ✓ | |
| **Tính phí ship** | ✓ | | | ✓ |

Dấu `–` nghĩa là không quan trọng. Từ 8 còn 4 test case mà vẫn phủ đủ.

## Sơ đồ chuyển trạng thái

Dùng khi đối tượng có **nhiều trạng thái** và chuyển giữa chúng theo sự kiện.

### Ví dụ: trạng thái đơn hàng

```text
[Chờ xác nhận] --xác nhận--> [Đang chuẩn bị] --giao--> [Đang giao]
       |                            |                        |
      huỷ                          huỷ                   giao xong
       v                            v                        v
    [Đã huỷ]                    [Đã huỷ]              [Hoàn thành]
```

Bảng chuyển trạng thái:

| Trạng thái hiện tại | Sự kiện | Trạng thái mới |
| --- | --- | --- |
| Chờ xác nhận | Xác nhận | Đang chuẩn bị |
| Chờ xác nhận | Huỷ | Đã huỷ |
| Đang chuẩn bị | Giao hàng | Đang giao |
| Đang chuẩn bị | Huỷ | Đã huỷ |
| Đang giao | Giao xong | Hoàn thành |
| Đang giao | Huỷ | **Không cho phép** |
| Hoàn thành | Huỷ | **Không cho phép** |
| Đã huỷ | Xác nhận | **Không cho phép** |

Hai nhóm test case cần viết:

| Nhóm | Kiểm gì | Ví dụ |
| --- | --- | --- |
| **Chuyển hợp lệ** | Đi đúng trạng thái mới | Chờ xác nhận → xác nhận → Đang chuẩn bị |
| **Chuyển không hợp lệ** | Hệ thống **chặn** đúng cách | Đơn đã huỷ mà bấm xác nhận → phải báo lỗi, không được đổi trạng thái |

Nhóm thứ hai là chỗ hay có bug nhất. Nút bị ẩn trên giao diện không có nghĩa là API chặn — thử gọi thẳng API để kiểm tra.

### Các trạng thái khác hay gặp

| Đối tượng | Các trạng thái |
| --- | --- |
| Tài khoản | Chưa kích hoạt → Hoạt động → Bị khoá → Đã xoá |
| Bug | New → Open → In Progress → Fixed → Verified → Closed |
| Bài viết | Nháp → Chờ duyệt → Đã xuất bản → Đã gỡ |
| Thanh toán | Chờ → Đang xử lý → Thành công / Thất bại → Hoàn tiền |

## Chọn kỹ thuật nào

| Tình huống | Kỹ thuật |
| --- | --- |
| Ô nhập có khoảng giá trị | Phân vùng + giá trị biên (Bài 5) |
| Nhiều điều kiện kết hợp quyết định kết quả | Bảng quyết định |
| Đối tượng có trạng thái thay đổi theo sự kiện | Sơ đồ chuyển trạng thái |
| Luồng nghiệp vụ từ đầu đến cuối | Use case testing (Bài 7) |

Một chức năng thường cần nhiều kỹ thuật cùng lúc. Chức năng đặt hàng có: ô số lượng (phân vùng + biên), chính sách giảm giá (bảng quyết định), trạng thái đơn (chuyển trạng thái).

## Bài tập

1. Lập bảng quyết định cho chính sách: giảm 10% nếu là sinh viên, giảm thêm 5% nếu mua từ 3 sản phẩm, không áp dụng cho hàng khuyến mãi.
2. Rút gọn bảng vừa lập, đếm số test case tiết kiệm được.
3. Vẽ sơ đồ chuyển trạng thái cho vòng đời một bug.
4. Liệt kê 5 chuyển trạng thái **không hợp lệ** cho đơn hàng và cách kiểm tra.
5. Lập bảng quyết định cho màn hình đăng nhập có 3 điều kiện: đúng tài khoản, tài khoản đã kích hoạt, chưa bị khoá.
</script>

<script type="text/markdown" data-id="mt-7" data-nav="Bài 7 · Use case, pairwise, exploratory">
# Bài 7 — Use case, pairwise và kiểm thử thăm dò

**Mục tiêu:** ba kỹ thuật còn lại, mỗi cái giải một bài toán riêng.

## Kiểm thử theo use case

Kiểm **luồng nghiệp vụ từ đầu đến cuối**, theo đúng cách người dùng thật sử dụng — khác với các kỹ thuật trước chỉ kiểm từng ô, từng điều kiện.

Cấu trúc một use case:

```text
Use case: Đặt hàng online
Tác nhân: Khách hàng đã đăng nhập
Tiền điều kiện: Giỏ hàng có ít nhất 1 sản phẩm

Luồng chính:
1. Khách bấm "Thanh toán"
2. Hệ thống hiện form địa chỉ giao hàng
3. Khách điền địa chỉ, chọn phương thức thanh toán
4. Khách bấm "Đặt hàng"
5. Hệ thống tạo đơn, gửi email xác nhận
6. Hệ thống hiện màn hình "Đặt hàng thành công"

Luồng thay thế:
3a. Khách chọn địa chỉ đã lưu → bỏ qua bước điền
4a. Thanh toán online thất bại → quay lại bước 3, giữ thông tin đã điền
4b. Sản phẩm hết hàng trong lúc thanh toán → báo và xoá khỏi giỏ
5a. Gửi email thất bại → vẫn tạo đơn, ghi log, không báo lỗi cho khách
```

Mỗi luồng thành một test case: luồng chính một cái, mỗi luồng thay thế một cái.

Luồng thay thế là nơi bug sống. Luồng chính thường đã được dev chạy thử nhiều lần.

## Kiểm thử cặp đôi (Pairwise)

Dùng khi có **nhiều tham số, mỗi tham số nhiều giá trị** — tổ hợp đầy đủ quá lớn.

Ví dụ kiểm thử tương thích:

| Tham số | Giá trị |
| --- | --- |
| Trình duyệt | Chrome, Safari, Edge |
| Hệ điều hành | Windows, macOS, Android |
| Ngôn ngữ | Tiếng Việt, Tiếng Anh |
| Vai trò | Khách, Thành viên, VIP |

Tổ hợp đầy đủ: 3 × 3 × 2 × 3 = **54 test case**. Quá nhiều.

Cơ sở của pairwise: phần lớn lỗi phát sinh từ tương tác của **hai** tham số, hiếm khi từ ba trở lên. Vậy chỉ cần đảm bảo mọi **cặp** giá trị đều xuất hiện ít nhất một lần.

Kết quả: khoảng **9 test case** phủ được mọi cặp, giảm hơn 80%.

Lập bảng pairwise bằng tay rất mất công. Dùng công cụ miễn phí:

| Công cụ | Ghi chú |
| --- | --- |
| **PICT** của Microsoft | Dòng lệnh, miễn phí |
| **pairwise.teremokgames.com** | Chạy trên trình duyệt, nhanh gọn |
| **AllPairs** | Python |

Khi nào không nên dùng: khi có những tổ hợp **bắt buộc phải test** vì quan trọng (ví dụ Chrome + Windows + khách hàng VIP là luồng doanh thu chính). Thêm thủ công các tổ hợp đó vào.

## Đoán lỗi (Error guessing)

Dựa vào kinh nghiệm để đoán chỗ dễ sai. Không có công thức, nhưng có danh sách những chỗ hay lỗi:

| Nhóm | Thử gì |
| --- | --- |
| Dữ liệu trống | Để trống mọi ô rồi submit |
| Ký tự đặc biệt | `' " < > & \| / \ % #` và emoji |
| Dấu tiếng Việt | Tên có dấu, có khoảng trắng kép |
| Số 0 và số âm | Số lượng 0, giá -1 |
| Chuỗi rất dài | Dán 5.000 ký tự vào ô tên |
| Thao tác nhanh | Bấm nút Submit 5 lần liên tiếp |
| Ngắt giữa chừng | Tắt mạng lúc đang thanh toán |
| Thứ tự lạ | Bấm Back khi đang ở giữa luồng |
| Phiên đăng nhập | Để yên 30 phút rồi thao tác tiếp |
| Hai cửa sổ | Mở hai tab cùng sửa một dữ liệu |

Những test này ít khi nằm trong tài liệu, nhưng lại hay ra bug thật. Lưu danh sách này thành checklist cá nhân và bổ sung dần theo kinh nghiệm.

## Kiểm thử thăm dò (Exploratory testing)

Vừa tìm hiểu vừa thiết kế vừa chạy test, không theo test case viết sẵn.

Khác với "bấm lung tung": kiểm thử thăm dò **có cấu trúc**, dùng phương pháp **test charter**:

```text
CHARTER: Khám phá chức năng tìm kiếm sản phẩm
Mục tiêu: tìm lỗi liên quan đến bộ lọc và sắp xếp
Thời gian: 45 phút
Khu vực: trang danh sách sản phẩm, web và mobile

Ghi chú trong lúc test:
- 10:05 Lọc giá 0-100k ra sản phẩm 150k → BUG
- 10:12 Sắp xếp giá tăng dần rồi chuyển trang 2, thứ tự reset → BUG
- 10:20 Tìm từ khoá có dấu tiếng Việt OK
- 10:25 Tìm chuỗi rỗng → hiện toàn bộ sản phẩm, đúng như mong đợi?
        Cần hỏi BA
- 10:38 Lọc + tìm kiếm cùng lúc: kết quả đúng

Kết quả: 2 bug, 1 câu hỏi cho BA
```

Khi nào dùng:

| Phù hợp | Không phù hợp |
| --- | --- |
| Sản phẩm mới, chưa có tài liệu | Cần bằng chứng đã test đủ cho khách hàng |
| Thời gian gấp | Nghiệp vụ cực phức tạp cần kiểm có hệ thống |
| Sau khi đã chạy hết test case, muốn tìm thêm | Người test chưa hiểu nghiệp vụ |

Thực tế tốt nhất là kết hợp: chạy test case đã viết để đảm bảo độ phủ, rồi dành 1–2 giờ thăm dò để tìm những gì test case bỏ sót.

## Tóm tắt các kỹ thuật

| Kỹ thuật | Dùng khi | Bài |
| --- | --- | --- |
| Phân vùng tương đương | Ô nhập có nhiều giá trị | 5 |
| Giá trị biên | Có khoảng giới hạn | 5 |
| Bảng quyết định | Nhiều điều kiện kết hợp | 6 |
| Chuyển trạng thái | Đối tượng có trạng thái | 6 |
| Use case | Luồng nghiệp vụ đầu-cuối | 7 |
| Pairwise | Nhiều tham số cấu hình | 7 |
| Đoán lỗi | Bổ sung dựa trên kinh nghiệm | 7 |
| Thăm dò | Tìm cái test case bỏ sót | 7 |

## Bài tập

1. Viết use case đầy đủ cho chức năng đăng ký, gồm ít nhất 3 luồng thay thế.
2. Dùng công cụ pairwise cho 4 tham số tự chọn, so sánh số test case với tổ hợp đầy đủ.
3. Lập checklist đoán lỗi riêng của bạn, tối thiểu 15 mục.
4. Làm một phiên thăm dò 45 phút trên một app bất kỳ, viết charter và ghi chú như mẫu.
5. Với chức năng giỏ hàng, chỉ ra nên dùng kỹ thuật nào cho phần nào.
</script>

<script type="text/markdown" data-id="mt-8" data-nav="Bài 8 · Viết test case chuẩn">
# Bài 8 — Viết test case chuẩn

**Mục tiêu:** viết test case mà người khác đọc là làm theo được, không cần hỏi lại.

## Mẫu test case

| Trường | Nội dung |
| --- | --- |
| **Mã TC** | Mã duy nhất: `TC_LOGIN_001` |
| **Tiêu đề** | Mô tả ngắn mục đích test |
| **Mức độ ưu tiên** | High / Medium / Low |
| **Tiền điều kiện** | Trạng thái cần có trước khi chạy |
| **Dữ liệu test** | Dữ liệu cụ thể dùng cho lần chạy |
| **Các bước** | Đánh số, mỗi bước một hành động |
| **Kết quả mong đợi** | Cụ thể, kiểm chứng được |
| **Kết quả thực tế** | Điền khi chạy |
| **Trạng thái** | Pass / Fail / Blocked / Skipped |

## Ví dụ test case tốt

```text
Mã TC: TC_LOGIN_005
Tiêu đề: Đăng nhập thất bại khi tài khoản bị khoá
Ưu tiên: High

Tiền điều kiện:
- Tài khoản locked@test.com tồn tại và đang ở trạng thái Bị khoá
- Đang ở trang https://staging.example.com/login

Dữ liệu test:
- Email: locked@test.com
- Mật khẩu: Test@1234

Các bước:
1. Nhập "locked@test.com" vào ô Email
2. Nhập "Test@1234" vào ô Mật khẩu
3. Bấm nút "Đăng nhập"

Kết quả mong đợi:
1. Hiển thị thông báo đỏ dưới form: "Tài khoản của bạn đã bị khoá.
   Vui lòng liên hệ hỗ trợ."
2. Vẫn ở trang đăng nhập, URL không đổi
3. Ô Email giữ nguyên giá trị, ô Mật khẩu bị xoá trắng
4. Không có phiên đăng nhập nào được tạo
```

So sánh với test case kém:

```text
Mã TC: TC_05
Tiêu đề: Test login
Các bước: Đăng nhập với tài khoản khoá
Kết quả mong đợi: Không đăng nhập được
```

Test case kém có 4 vấn đề: không biết tài khoản nào, không biết đang ở đâu, bước thực hiện không rõ, và "không đăng nhập được" không kiểm chứng được — không đăng nhập được vì báo lỗi gì, hay vì trang trắng?

## Sáu quy tắc viết test case

**1. Một test case kiểm một điều**

Gộp "đăng nhập đúng, sai mật khẩu, bỏ trống" vào một test case thì khi fail không biết phần nào hỏng.

**2. Bước thực hiện là hành động, không phải mô tả**

| Kém | Tốt |
| --- | --- |
| Kiểm tra form đăng nhập | 1. Mở trang /login<br>2. Nhập email vào ô Email |

**3. Kết quả mong đợi phải kiểm chứng được**

| Kém | Tốt |
| --- | --- |
| Hiển thị đúng | Hiển thị "Đăng nhập thành công" và chuyển sang /dashboard |
| Hoạt động bình thường | Danh sách hiện đúng 6 sản phẩm, sắp xếp theo giá tăng dần |

**4. Dữ liệu test ghi cụ thể**

Ghi `admin@test.com / Test@1234`, đừng ghi "tài khoản hợp lệ". Người chạy test không đoán được bạn định dùng tài khoản nào.

**5. Người chưa biết hệ thống cũng làm theo được**

Test case sẽ được người khác chạy, hoặc chính bạn chạy sau 3 tháng. Viết đủ để không phải hỏi lại.

**6. Độc lập với test case khác**

TC_010 không nên phụ thuộc vào việc TC_009 đã chạy. Tiền điều kiện phải tự mô tả đủ trạng thái cần có.

## Đặt mã test case

```text
TC_<MODULE>_<SỐ>

TC_LOGIN_001      Đăng nhập
TC_CART_015       Giỏ hàng
TC_CHECKOUT_003   Thanh toán
```

Dùng 3 chữ số để sắp xếp đúng thứ tự. Đặt mã theo module giúp lọc và báo cáo theo chức năng.

## Mức độ ưu tiên

| Mức | Dành cho | Ví dụ |
| --- | --- | --- |
| **High** | Luồng chính, ảnh hưởng doanh thu hoặc dữ liệu | Thanh toán, đăng nhập |
| **Medium** | Chức năng phụ nhưng người dùng hay dùng | Lọc, sắp xếp |
| **Low** | Hiếm dùng, ảnh hưởng nhỏ | Đổi avatar, trang Giới thiệu |

Hết thời gian thì chạy High trước. Đây là lý do phải gán ưu tiên từ lúc viết.

## Checklist review test case

Trước khi nộp cho leader hoặc đưa vào chạy:

- [ ] Mỗi test case kiểm đúng một điều
- [ ] Tiền điều kiện đủ để bắt đầu chạy
- [ ] Dữ liệu test cụ thể, không mơ hồ
- [ ] Bước thực hiện đánh số, mỗi bước một hành động
- [ ] Kết quả mong đợi kiểm chứng được, không dùng từ "đúng", "bình thường"
- [ ] Có đủ cả test case positive và negative
- [ ] Không có test case trùng nhau
- [ ] Mức ưu tiên hợp lý với rủi ro
- [ ] Mã test case theo đúng quy ước
- [ ] Đã phủ hết acceptance criteria của story

Mục cuối quan trọng: đối chiếu ngược lại từng acceptance criteria xem đã có test case tương ứng chưa. Đây gọi là **truy vết yêu cầu**.

## Ma trận truy vết

Bảng đối chiếu yêu cầu với test case, dùng để chứng minh đã test đủ:

| Yêu cầu | Test case liên quan |
| --- | --- |
| AC1: Gửi link đặt lại qua email | TC_PWD_001, TC_PWD_002 |
| AC2: Link có hiệu lực 15 phút | TC_PWD_003, TC_PWD_004, TC_PWD_005 |
| AC3: Mật khẩu tối thiểu 8 ký tự có chữ và số | TC_PWD_006 đến TC_PWD_012 |
| AC4: Đăng xuất phiên cũ | TC_PWD_013 |

Yêu cầu nào không có test case nào là lỗ hổng. Test case nào không gắn với yêu cầu nào thì xem lại có cần thiết không.

## Bài tập

1. Viết 8 test case cho chức năng đăng nhập theo mẫu đầy đủ ở trên.
2. Trong đó phải có ít nhất 5 test case negative.
3. Chạy checklist review cho 8 test case vừa viết, tự sửa chỗ chưa đạt.
4. Lập ma trận truy vết giữa test case và acceptance criteria.
5. Đưa cho một người không biết hệ thống đọc và làm theo, xem họ có hỏi lại gì không.
</script>

<script type="text/markdown" data-id="mt-9" data-nav="Bài 9 · Dữ liệu test">
# Bài 9 — Chuẩn bị dữ liệu test

**Mục tiêu:** có đúng dữ liệu để chạy test. Thiếu dữ liệu là nguyên nhân chặn test phổ biến nhất trong thực tế.

## Vì sao dữ liệu test quan trọng

Test case viết hay đến mấy, không có tài khoản VIP đang có đơn hàng ở trạng thái "Đang giao" thì không chạy được. Chuẩn bị dữ liệu thường chiếm 20–30% thời gian của một đợt test.

## Các loại dữ liệu cần chuẩn bị

| Loại | Ví dụ |
| --- | --- |
| Tài khoản các vai trò | Khách, thành viên, VIP, admin, tài khoản bị khoá, chưa kích hoạt |
| Dữ liệu nghiệp vụ | Sản phẩm còn hàng, hết hàng, đang giảm giá |
| Dữ liệu ở các trạng thái | Đơn hàng ở đủ 5 trạng thái |
| Dữ liệu biên | Tên 255 ký tự, đơn 1 sản phẩm, đơn 100 sản phẩm |
| Dữ liệu không hợp lệ | Email sai định dạng, ngày 31/2 |
| Dữ liệu tiếng Việt | Tên có dấu, địa chỉ có dấu |

## Bảng quản lý tài khoản test

Luôn giữ một bảng như thế này, chia sẻ cho cả nhóm:

| Tài khoản | Mật khẩu | Vai trò | Trạng thái | Ghi chú |
| --- | --- | --- | --- | --- |
| user01@test.com | Test@1234 | Thành viên | Hoạt động | Dùng cho luồng chính |
| vip01@test.com | Test@1234 | VIP | Hoạt động | Có ưu đãi ship |
| locked@test.com | Test@1234 | Thành viên | Bị khoá | Test luồng khoá |
| new@test.com | Test@1234 | Thành viên | Chưa kích hoạt | Test luồng kích hoạt |
| empty@test.com | Test@1234 | Thành viên | Hoạt động | Không có đơn hàng nào |

Quy ước đặt tên tài khoản theo mục đích giúp cả nhóm biết dùng cái nào.

## Nguyên tắc về dữ liệu

**1. Không dùng dữ liệu thật của khách hàng**

Tên, email, số điện thoại, địa chỉ, số thẻ của người thật tuyệt đối không được dùng trên môi trường test. Đây vừa là vấn đề pháp lý vừa là vấn đề đạo đức nghề nghiệp.

Cần dữ liệu giống thật thì dùng công cụ sinh dữ liệu giả: **mockaroo.com**, **generatedata.com**, hoặc thư viện Faker.

**2. Dữ liệu test phải tái lập được**

Sau mỗi đợt test, dữ liệu bị thay đổi. Cần có cách đưa về trạng thái ban đầu:

| Cách | Khi nào dùng |
| --- | --- |
| Script khôi phục database | Tốt nhất, nhờ DevOps làm |
| Tạo dữ liệu mới mỗi lần test | An toàn, nhưng chậm |
| Dọn dẹp sau khi test | Dễ quên sót |

**3. Mỗi tester dùng tài khoản riêng khi có thể**

Hai người cùng test một tài khoản sẽ giẫm chân nhau: bạn đang test giỏ hàng, người kia xoá sạch giỏ.

## Thẻ thanh toán test

Cổng thanh toán đều có thẻ test riêng, không trừ tiền thật:

| Cổng | Thẻ test |
| --- | --- |
| Stripe | `4242 4242 4242 4242`, ngày hết hạn tương lai bất kỳ |
| VNPay, Momo | Có bộ thẻ sandbox riêng, xem tài liệu tích hợp |

**Tuyệt đối không dùng thẻ thật để test.** Nếu dự án yêu cầu test với thẻ thật, đó là việc của nhóm nghiệp vụ, có quy trình riêng và phải được phê duyệt.

## Môi trường test

| Môi trường | Dùng cho | Ai dùng |
| --- | --- | --- |
| **DEV** | Dev tự kiểm, thay đổi liên tục | Dev |
| **TEST / QA** | Tester chạy test | Tester |
| **STAGING / UAT** | Giống production nhất, khách nghiệm thu | Tester, khách hàng |
| **PRODUCTION** | Người dùng thật | Không test ở đây |

Quy tắc: **không bao giờ test trên production**, trừ khi có kế hoạch riêng được duyệt (ví dụ smoke test sau release, với tài khoản và dữ liệu chuyên dụng).

Trước khi báo bug, luôn ghi rõ phát hiện trên môi trường nào. Bug chỉ xuất hiện trên staging mà không có trên test có thể là do cấu hình khác nhau.

## SQL cơ bản cho tester

Biết chút SQL giúp bạn tự tạo và kiểm tra dữ liệu, không phải chờ dev:

```sql
-- Xem du lieu
SELECT * FROM users WHERE email = 'user01@test.com';

-- Dem
SELECT COUNT(*) FROM orders WHERE status = 'pending';

-- Loc va sap xep
SELECT id, total, created_at
FROM orders
WHERE user_id = 123 AND total > 500000
ORDER BY created_at DESC
LIMIT 10;

-- Noi bang
SELECT o.id, u.email, o.total
FROM orders o
JOIN users u ON o.user_id = u.id
WHERE o.status = 'completed';
```

Dùng SQL để **kiểm tra kết quả**, không chỉ nhìn giao diện. Ví dụ: giao diện báo đặt hàng thành công, nhưng kiểm database thấy đơn chưa được tạo — đó là bug mà nhìn màn hình không thấy.

Lưu ý: chỉ chạy lệnh `SELECT` trên môi trường test. `UPDATE` và `DELETE` chỉ khi được phép và biết rõ mình đang làm gì.

## Bài tập

1. Lập bảng tài khoản test cho một dự án, tối thiểu 6 tài khoản ở các trạng thái khác nhau.
2. Dùng mockaroo.com sinh 50 dòng dữ liệu khách hàng giả, xuất ra CSV.
3. Liệt kê dữ liệu cần chuẩn bị để test chức năng "lịch sử đơn hàng".
4. Viết 3 câu SQL kiểm tra kết quả sau khi đặt hàng thành công.
5. Viết ra quy trình đưa dữ liệu về trạng thái ban đầu sau mỗi đợt test.
</script>

<script type="text/markdown" data-id="mt-10" data-nav="Bài 10 · Thực thi test">
# Bài 10 — Thực thi kiểm thử

**Mục tiêu:** chạy test có kỷ luật, ghi nhận đủ để chứng minh và tái hiện được.

## Trước khi bắt đầu

| Kiểm tra | Vì sao |
| --- | --- |
| Build đúng phiên bản cần test chưa | Test nhầm build cũ là mất công vô ích |
| Môi trường chạy được không | Chạy smoke test 5–10 phút trước |
| Dữ liệu test đã sẵn sàng chưa | Thiếu dữ liệu sẽ phải dừng giữa chừng |
| Test case đã được review chưa | Tránh phát hiện test case sai lúc đang chạy |

Smoke test fail thì **trả build về cho dev ngay**, đừng test tiếp. Ghi rõ: "Build 2.3.0 không đăng nhập được, dừng test, chờ build mới."

## Bốn trạng thái kết quả

| Trạng thái | Khi nào dùng |
| --- | --- |
| **Pass** | Kết quả thực tế khớp hoàn toàn kết quả mong đợi |
| **Fail** | Kết quả khác mong đợi — phải tạo bug |
| **Blocked** | Không chạy được vì lý do ngoài test case (môi trường lỗi, chức năng phụ thuộc đang hỏng) |
| **Skipped** | Cố ý không chạy (ngoài phạm vi đợt này, thiếu thời gian) |

Phân biệt **Fail** và **Blocked** rất quan trọng khi báo cáo. Fail nghĩa là sản phẩm có lỗi; Blocked nghĩa là bạn chưa kiểm được, chưa kết luận gì.

Đừng ghi Pass khi "gần đúng". Kết quả lệch một chút so với mong đợi vẫn là Fail — hoặc test case sai và cần sửa.

## Ghi nhận trong lúc chạy

Với mỗi test case fail, ghi ngay tại chỗ:

| Thông tin | Ví dụ |
| --- | --- |
| Kết quả thực tế | Hiện "Error 500" thay vì thông báo lỗi |
| Ảnh chụp màn hình | Chụp cả URL và thời gian |
| Dữ liệu đã dùng | Tài khoản, giá trị nhập |
| Môi trường | Staging, Chrome 141, Windows 11 |
| Thời điểm | 15/11/2026 14:32 |

Ghi ngay lúc phát hiện. Để đến cuối ngày mới ghi thì sẽ quên chi tiết, và bug report sẽ mơ hồ.

## Tái hiện trước khi báo bug

Thấy lỗi, đừng báo ngay. Làm 3 bước:

1. **Làm lại** đúng các bước đó xem có lỗi lại không.
2. **Thu hẹp**: bỏ bớt bước thừa để tìm ra bước tối thiểu gây lỗi.
3. **Kiểm tra điều kiện**: chỉ xảy ra với tài khoản này, hay mọi tài khoản? Chỉ Chrome hay cả Safari?

Bug report ghi "chỉ xảy ra với tài khoản VIP, trên Safari" có giá trị hơn nhiều so với "lỗi khi thanh toán".

Lỗi không tái hiện được thì vẫn báo, nhưng ghi rõ "chưa tái hiện lại được" kèm mọi thông tin đã có. Đừng giấu đi.

## Thu thập bằng chứng

| Loại | Cách lấy |
| --- | --- |
| Ảnh màn hình | Phím Print Screen, hoặc công cụ như Lightshot, ShareX |
| Video | Công cụ quay màn hình — rất hữu ích cho lỗi theo luồng |
| Console log | F12 → tab Console, chụp lại lỗi màu đỏ |
| Network | F12 → tab Network, xem request lỗi, chụp status code và response |
| Log server | Xin dev hoặc DevOps nếu có quyền |

Console và Network là hai thứ tester hay bỏ qua, nhưng lại là thứ dev cần nhất. Bug report có kèm response của API lỗi giúp dev tiết kiệm hàng giờ.

## Test log

Bảng theo dõi kết quả từng lần chạy:

| Mã TC | Lần 1 (18/11) | Lần 2 (21/11) | Ghi chú |
| --- | --- | --- | --- |
| TC_LOGIN_001 | Pass | Pass | |
| TC_LOGIN_002 | Fail | Pass | BUG-234 đã fix |
| TC_LOGIN_003 | Blocked | Pass | Môi trường lỗi ngày 18 |
| TC_LOGIN_004 | Pass | Fail | Lỗi mới sau khi fix BUG-234 |

Dòng cuối là ví dụ điển hình vì sao cần regression: sửa chỗ này làm hỏng chỗ khác.

## Quản lý thời gian

| Tình huống | Cách xử lý |
| --- | --- |
| Không đủ thời gian chạy hết | Chạy theo ưu tiên: High → Medium → Low |
| Gặp lỗi chặn nhiều test case | Báo ngay, chuyển sang module khác, không ngồi chờ |
| Phát hiện nhiều bug cùng lúc | Báo bug quan trọng trước, ghi chú các bug nhỏ để báo sau |
| Test case sai | Ghi chú lại, sửa sau khi chạy xong, đừng dừng để sửa |

Báo sớm khi thấy sẽ không kịp. Leader cần biết để điều chỉnh, không phải nghe vào ngày cuối.

## Bài tập

1. Viết checklist những thứ cần kiểm tra trước khi bắt đầu một đợt test.
2. Chạy 8 test case đăng nhập đã viết ở Bài 8, ghi test log đầy đủ.
3. Với một lỗi bất kỳ, thực hành 3 bước tái hiện và thu hẹp.
4. Mở F12 trên một trang web, chụp lại tab Console và Network khi có request lỗi.
5. Tạo bảng test log theo dõi 2 lần chạy cho bộ test case của bạn.
</script>

<script type="text/markdown" data-id="mt-11" data-nav="Bài 11 · Bug report">
# Bài 11 — Viết bug report và quản lý lỗi

**Mục tiêu:** viết bug report mà dev đọc là sửa được ngay, không phải hỏi lại. Đây là sản phẩm thể hiện trình độ tester rõ nhất.

## Cấu trúc bug report

| Trường | Nội dung |
| --- | --- |
| **Tiêu đề** | Một dòng, nêu rõ triệu chứng và chỗ xảy ra |
| **Môi trường** | URL, trình duyệt, thiết bị, phiên bản build |
| **Mức độ nghiêm trọng** | Severity |
| **Mức độ ưu tiên** | Priority |
| **Các bước tái hiện** | Đánh số, chi tiết đến mức làm theo được |
| **Kết quả mong đợi** | Theo yêu cầu/tài liệu nào |
| **Kết quả thực tế** | Chuyện thật sự xảy ra |
| **Bằng chứng** | Ảnh, video, log |
| **Ghi chú** | Tần suất, điều kiện đặc biệt |

## Ví dụ bug report tốt

```text
Tiêu đề: [Thanh toán] Tổng tiền không trừ mã giảm giá khi đổi
         phương thức thanh toán

Môi trường:
- URL: https://staging.example.com/checkout
- Build: 2.3.0-rc2
- Trình duyệt: Chrome 141, Windows 11
- Tài khoản: user01@test.com

Severity: Major    Priority: High

Các bước tái hiện:
1. Đăng nhập bằng user01@test.com
2. Thêm sản phẩm "Áo thun cotton" (150.000đ) vào giỏ
3. Vào giỏ hàng, bấm "Thanh toán"
4. Nhập mã giảm giá "SALE20", bấm "Áp dụng"
   → Tổng tiền hiển thị đúng: 120.000đ
5. Đổi phương thức thanh toán từ "COD" sang "Chuyển khoản"

Kết quả mong đợi:
Tổng tiền giữ nguyên 120.000đ, mã giảm giá vẫn được áp dụng
(theo AC3 của story US-456)

Kết quả thực tế:
Tổng tiền quay về 150.000đ. Mã giảm giá vẫn hiển thị trong ô
nhưng không được tính vào tổng.

Bằng chứng:
- anh1-truoc-khi-doi.png
- anh2-sau-khi-doi.png
- video-tai-hien.mp4
- Network: POST /api/checkout/payment-method trả về total=150000,
  không có trường discount

Ghi chú:
- Tái hiện 5/5 lần
- Xảy ra với mọi mã giảm giá đã thử (SALE20, FREESHIP)
- Không xảy ra khi đổi ngược từ Chuyển khoản sang COD
```

Ghi chú cuối cùng rất giá trị: nó thu hẹp phạm vi cho dev.

## Viết tiêu đề tốt

Công thức: **[Module] Triệu chứng khi điều kiện nào**

| Kém | Tốt |
| --- | --- |
| Lỗi thanh toán | [Thanh toán] Tổng tiền không trừ mã giảm giá khi đổi phương thức thanh toán |
| Không đăng nhập được | [Đăng nhập] Báo lỗi "Error 500" khi mật khẩu chứa ký tự tiếng Việt |
| Giao diện xấu | [Danh sách SP] Tên sản phẩm dài tràn khỏi thẻ trên màn hình dưới 400px |

Dev nhìn tiêu đề là biết việc gì, mức độ nghiêm trọng, và có thuộc phần mình phụ trách không.

## Severity và Priority

Hai khái niệm khác nhau, hay bị nhầm, và hay được hỏi khi phỏng vấn.

**Severity — mức độ nghiêm trọng về mặt kỹ thuật:**

| Mức | Nghĩa | Ví dụ |
| --- | --- | --- |
| Critical | Hệ thống sập, mất dữ liệu | Không đăng nhập được, app crash khi mở |
| Major | Chức năng chính sai | Tính sai tiền, không đặt được hàng |
| Minor | Chức năng phụ sai, có cách làm khác | Bộ lọc sai thứ tự |
| Trivial | Lỗi hiển thị nhỏ | Sai chính tả, lệch 2px |

**Priority — mức độ cần sửa gấp về mặt nghiệp vụ:**

| Mức | Nghĩa |
| --- | --- |
| High | Sửa ngay, chặn release |
| Medium | Sửa trong sprint này |
| Low | Đưa vào backlog |

Bốn tổ hợp để hiểu rõ khác biệt:

| Tổ hợp | Ví dụ |
| --- | --- |
| Severity cao, Priority cao | Không thanh toán được |
| Severity cao, Priority thấp | App crash ở chức năng sắp gỡ bỏ |
| Severity thấp, Priority cao | Sai tên công ty trên trang chủ — nhỏ về kỹ thuật, nhưng ảnh hưởng hình ảnh |
| Severity thấp, Priority thấp | Lệch 2px ở trang ít người xem |

Tester đề xuất Severity; Priority thường do PO hoặc leader quyết.

## Vòng đời của bug

```text
   New
    │ leader xac nhan
    v
  Open ──────────────> Rejected (khong phai bug)
    │ dev nhan                │
    v                    Duplicate (trung bug cu)
In Progress                   │
    │ dev sua xong        Deferred (hoan sang sau)
    v
  Fixed
    │ tester kiem tra lai
    ├──> Reopened (van con loi) ──> In Progress
    v
 Verified
    │
    v
  Closed
```

Trạng thái **Reopened** là bình thường, không phải lỗi của ai. Nhưng một bug bị reopen 3 lần là dấu hiệu mô tả chưa rõ, hoặc hai bên hiểu khác nhau về kết quả mong đợi — nên nói chuyện trực tiếp thay vì tiếp tục qua ticket.

## Khi bug bị từ chối

Dev ghi "Không phải bug" hoặc "Không tái hiện được". Cách xử lý:

| Tình huống | Làm gì |
| --- | --- |
| Dev không tái hiện được | Bổ sung video, ghi rõ môi trường, dữ liệu, thời điểm |
| Dev nói đúng thiết kế | Kiểm lại tài liệu; nếu tài liệu không nói rõ, hỏi BA và dẫn câu trả lời vào ticket |
| Dev nói lỗi môi trường | Thử trên môi trường khác, kiểm chứng |
| Bạn sai thật | Đóng ticket, ghi rõ lý do, không cần ngại — chuyện bình thường |

Nguyên tắc: tranh luận dựa trên **tài liệu và bằng chứng**, không dựa trên cảm tính. Và giữ thái độ hợp tác — dev và tester cùng một mục tiêu.

## Những điều không nên viết trong bug report

| Đừng viết | Vì sao |
| --- | --- |
| "Chức năng này làm ẩu quá" | Công kích cá nhân, làm hỏng quan hệ |
| "Chắc do cache" | Suy đoán nguyên nhân khi chưa chắc, dẫn dev đi sai hướng |
| "Lỗi y như lần trước" | Dev không biết "lần trước" là lần nào |
| "Xem video thì biết" | Video là bằng chứng bổ sung, không thay thế mô tả |

Mô tả **hiện tượng quan sát được**, không mô tả nguyên nhân bạn đoán — trừ khi bạn có bằng chứng.

## Bài tập

1. Viết 3 bug report đầy đủ cho 3 lỗi bạn tự tìm trên một trang web bất kỳ.
2. Với mỗi bug, gán Severity và Priority kèm lý do.
3. Viết lại 5 tiêu đề bug kém thành tiêu đề tốt theo công thức.
4. Vẽ vòng đời bug của công ty hoặc nhóm bạn đang làm.
5. Nghĩ một ví dụ cho mỗi tổ hợp Severity/Priority ở bảng trên.

# Bài 12 — Công cụ của manual tester

**Mục tiêu:** dùng được các công cụ xuất hiện trong mọi JD tuyển dụng.

## Jira — quản lý công việc và bug

Công cụ phổ biến nhất. Tester dùng Jira hằng ngày.

| Khái niệm | Nghĩa |
| --- | --- |
| **Project** | Một dự án |
| **Issue** | Một việc: story, task, bug |
| **Epic** | Nhóm nhiều story liên quan |
| **Sprint** | Chu kỳ làm việc 1–4 tuần |
| **Board** | Bảng Kanban/Scrum nhìn tiến độ |
| **Workflow** | Luồng trạng thái một issue đi qua |

Việc tester làm trên Jira:

- Tạo bug với đầy đủ thông tin, gắn vào story liên quan
- Gán cho dev, đặt Priority, gắn nhãn
- Đính kèm ảnh, video
- Chuyển trạng thái khi verify xong
- Lọc issue bằng JQL

JQL hay dùng:

```text
project = ECOM AND type = Bug AND status = Open
project = ECOM AND assignee = currentUser() AND sprint in openSprints()
project = ECOM AND priority = High AND created >= -7d
```

Biết viết JQL giúp bạn tự tạo báo cáo mà không phải hỏi leader.

## Công cụ quản lý test case

| Công cụ | Ghi chú |
| --- | --- |
| **TestRail** | Phổ biến nhất, trả phí |
| **Zephyr / Xray** | Plugin của Jira, tích hợp sẵn |
| **qTest** | Doanh nghiệp lớn |
| **Excel / Google Sheets** | Dự án nhỏ, hoàn toàn dùng được |

Đừng ngại Excel. Nhiều nhóm nhỏ ở Việt Nam quản lý test case bằng Google Sheets rất hiệu quả. Quan trọng là **có quản lý**, không phải dùng công cụ đắt tiền.

Mẫu Google Sheets đủ dùng: mỗi sheet một module, các cột theo mẫu test case ở Bài 8, thêm cột kết quả cho mỗi lần chạy.

## DevTools — F12

Công cụ miễn phí, quan trọng nhất với tester web. Bốn tab cần biết:

| Tab | Dùng để |
| --- | --- |
| **Elements** | Xem HTML, kiểm tra text hiển thị, class, kiểm tra giao diện |
| **Console** | Xem lỗi JavaScript — lỗi đỏ ở đây là bằng chứng quý cho bug report |
| **Network** | Xem request gửi đi và phản hồi: status code, payload, response |
| **Application** | Xem cookie, localStorage — kiểm tra phiên đăng nhập |

Cách dùng Network để điều tra bug:

1. Mở F12 → tab Network, bấm nút xoá cho sạch
2. Thực hiện thao tác gây lỗi
3. Tìm dòng màu đỏ hoặc có status 4xx/5xx
4. Bấm vào xem tab Payload (gửi gì) và Response (nhận gì)
5. Chụp lại đính vào bug report

Thông tin này thường chỉ ra ngay lỗi ở frontend hay backend — và đó là câu dev hỏi đầu tiên.

Giả lập thiết bị: F12 → biểu tượng điện thoại → chọn kích thước màn hình. Dùng kiểm tra giao diện responsive nhanh mà không cần điện thoại thật.

## Postman — kiểm thử API

Bài 15 sẽ hướng dẫn chi tiết. Ở đây chỉ cần biết: Postman cho phép gọi thẳng API mà không qua giao diện, để kiểm tra backend trả về đúng chưa.

## Công cụ chụp ảnh và quay màn hình

| Công cụ | Dùng cho |
| --- | --- |
| **Lightshot**, **ShareX** | Chụp màn hình, vẽ chú thích |
| **ScreenToGif** | Quay thành GIF, nhẹ, đính vào Jira tiện |
| **OBS Studio** | Quay video dài, miễn phí |

Ảnh có khoanh đỏ chỗ lỗi giá trị hơn ảnh chụp cả màn hình không chú thích.

## Công cụ khác hay dùng

| Công cụ | Dùng để |
| --- | --- |
| **Mailtrap**, **Mailinator** | Nhận email test mà không cần hộp thư thật |
| **DBeaver**, **HeidiSQL** | Kết nối database chạy câu SQL |
| **Mockaroo** | Sinh dữ liệu test giả |
| **BrowserStack** | Test trên nhiều trình duyệt, thiết bị thật |
| **Xmind** | Vẽ mind map phân tích chức năng |
| **JSON Formatter** | Đọc response API cho dễ |

## Mind map để phân tích chức năng

Kỹ thuật ít người dùng nhưng rất hiệu quả. Vẽ mind map cho một chức năng trước khi viết test case:

```text
Dang nhap
├── Giao dien
│   ├── Hien thi dung thiet ke
│   ├── Responsive mobile
│   └── Tieng Viet hien dung
├── Chuc nang
│   ├── Dang nhap dung
│   ├── Sai mat khau
│   ├── Sai email
│   ├── Bo trong
│   └── Tai khoan bi khoa
├── Bao mat
│   ├── Mat khau khong hien thi
│   ├── Gioi han so lan thu
│   └── Khong lo thong tin trong response
└── Khac
    ├── Nho dang nhap

```

Nhìn mind map là thấy ngay mình đã bỏ sót nhánh nào. Nhánh "Bảo mật" là nhánh người mới hay quên hoàn toàn.

## Bài tập

1. Tạo tài khoản Jira miễn phí, tạo project và viết 3 bug theo mẫu Bài 11.
2. Viết 3 câu JQL lọc bug theo tiêu chí khác nhau.
3. Mở F12 trên một trang web, tìm một request lỗi và chụp lại Payload với Response.
4. Dùng chế độ giả lập thiết bị kiểm tra một trang ở 3 kích thước màn hình.
5. Vẽ mind map cho chức năng "tìm kiếm sản phẩm", tối thiểu 4 nhánh chính.

# Bài 13 — Báo cáo kiểm thử

**Mục tiêu:** tổng hợp kết quả thành thứ leader đọc 2 phút là ra quyết định được.

## Người đọc cần gì

| Người đọc | Quan tâm |
| --- | --- |
| Test Lead | Tiến độ, bug còn lại, có kịp không |
| PO / PM | Có release được không, rủi ro gì |
| Dev | Bug nào cần sửa trước |
| Khách hàng | Chất lượng tổng thể, bằng chứng đã test |

Vì vậy báo cáo phải có **kết luận ở đầu**, chi tiết ở sau. Đừng bắt người đọc lần tới cuối mới biết kết quả.

## Mẫu báo cáo

```text
BÁO CÁO KIỂM THỬ — CHỨC NĂNG ĐẶT LẠI MẬT KHẨU
Build: 2.3.0-rc2 | Môi trường: Staging | Ngày: 22/11/2026
Người thực hiện: TrangDTT59

1. KẾT LUẬN
Chưa đạt tiêu chí phát hành. Còn 1 bug Critical chưa sửa (BUG-241:
link đặt lại vẫn dùng được sau khi đã đổi mật khẩu thành công).
Đề nghị sửa và test lại trước khi release.

2. PHẠM VI ĐÃ TEST
- Gửi link đặt lại qua email
- Xác thực link: còn hạn, hết hạn, đã dùng
- Quy tắc mật khẩu mới
- Đăng xuất phiên cũ
Ngoài phạm vi: đặt lại qua SMS (chưa phát triển)

3. KẾT QUẢ
| Chỉ số          | Số lượng | Tỷ lệ |
| Tổng test case  | 24       | 100%  |
| Pass            | 20       | 83%   |
| Fail            | 3        | 13%   |
| Blocked         | 1        | 4%    |

4. BUG PHÁT HIỆN
| Mã      | Tiêu đề                                  | Severity | Trạng thái |
| BUG-241 | Link còn dùng được sau khi đổi mật khẩu  | Critical | Open       |
| BUG-242 | Link hết hạn báo lỗi 500 thay vì thông báo| Major   | Fixed      |
| BUG-243 | Thông báo lỗi sai chính tả                | Trivial  | Open       |

5. VẤN ĐỀ CẦN LƯU Ý
- TC_PWD_018 bị Blocked: môi trường staging không gửi được email
  ngày 20/11, đã test lại ngày 21/11
- AC4 (đăng xuất phiên cũ) chỉ test được trên web, chưa test được
  trên app mobile do chưa có build mobile

6. ĐỀ XUẤT
- Sửa BUG-241 trước khi release — đây là lỗ hổng bảo mật
- BUG-243 có thể để sang sprint sau
- Cần build mobile để hoàn tất kiểm thử AC4
```

Mục 1 và mục 5 là hai mục quan trọng nhất. Mục 5 cho thấy bạn trung thực về những gì **chưa** kiểm được — điều này quan trọng hơn con số pass đẹp.

## Các chỉ số thường dùng

| Chỉ số | Công thức | Nói lên điều gì |
| --- | --- | --- |
| Tỷ lệ pass | Pass / Tổng đã chạy | Chất lượng build |
| Độ phủ yêu cầu | Số AC có test case / Tổng AC | Đã test đủ chưa |
| Mật độ lỗi | Số bug / Số chức năng | Chỗ nào nhiều lỗi |
| Tỷ lệ bug bị từ chối | Rejected / Tổng bug | Chất lượng bug report của bạn |
| Tỷ lệ reopen | Reopened / Fixed | Chất lượng sửa lỗi |

Hai chỉ số cuối phản ánh chính bạn. Tỷ lệ bug bị từ chối cao nghĩa là bạn báo bug chưa chuẩn — hoặc chưa đọc kỹ tài liệu.

## Cách trình bày số liệu

Đừng chỉ đưa con số, hãy kèm nhận xét:

| Kém | Tốt |
| --- | --- |
| Pass 83% | Pass 83%, dưới ngưỡng yêu cầu 95%. Nguyên nhân chính là BUG-241 chặn 3 test case liên quan đến bảo mật phiên. |

Con số không tự nói lên điều gì. Nhận xét mới là phần có giá trị.

## Báo cáo hằng ngày

Trong sprint, thường cần báo cáo ngắn mỗi ngày:

```text
Ngày 19/11 — Chức năng đặt lại mật khẩu
- Đã chạy: 16/24 test case
- Pass 13, Fail 2, Blocked 1
- Bug mới: BUG-241 (Critical), BUG-242 (Major)
- Vướng: staging không gửi được email, đã báo DevOps lúc 10:15
- Kế hoạch mai: chạy nốt 8 test case còn lại, re-test BUG-242
```

Ngắn, đủ, có mục "Vướng". Mục này giúp leader can thiệp kịp thời.

## Khi nào nói "không nên release"

Tester không quyết định release, nhưng có trách nhiệm **nêu rõ rủi ro**. Cách nói:

| Tránh | Nên |
| --- | --- |
| "Không được release" | "Theo tiêu chí ra đã thống nhất, build này chưa đạt vì còn 1 bug Critical. Nếu vẫn release, rủi ro là người dùng có thể dùng lại link cũ để đổi mật khẩu của tài khoản đã đổi." |

Nêu sự thật, nêu rủi ro cụ thể, để người có thẩm quyền quyết định. Và ghi lại bằng văn bản.

## Bài tập

1. Viết báo cáo đầy đủ cho đợt test chức năng đăng nhập bạn đã làm ở Bài 10.
2. Tính 5 chỉ số ở bảng trên cho đợt test đó.
3. Viết báo cáo hằng ngày cho 3 ngày test liên tiếp.
4. Viết một đoạn nêu rủi ro khi còn bug Critical mà vẫn muốn release.
5. Tự đánh giá tỷ lệ bug bị từ chối của bạn và nghĩ cách giảm nó.

| Nền | Thu nhỏ app rồi mở lại — còn trạng thái cũ không |
| Pin | Chế độ tiết kiệm pin có ảnh hưởng không |
| Quyền | Từ chối quyền camera/vị trí — app xử lý thế nào |
| Kích thước | Màn hình nhỏ nhất và lớn nhất trong danh sách hỗ trợ |
| Cỡ chữ hệ thống | Tăng cỡ chữ trong cài đặt máy — giao diện có vỡ không |
| Cài đặt | Cài mới, cập nhật từ bản cũ, gỡ rồi cài lại |

Mục "Gián đoạn" và "Cỡ chữ hệ thống" là hai mục người mới gần như luôn quên.

## Checklist giao diện

| # | Kiểm tra |
| --- | --- |
| 1 | So với thiết kế: màu, khoảng cách, cỡ chữ |
| 2 | Text dài có tràn không |
| 3 | Ảnh lỗi hiển thị thế nào |
| 4 | Trạng thái nút: bình thường, hover, bấm, bị khoá |
| 5 | Chế độ tối nếu có |
| 6 | Chính tả tiếng Việt |
| 7 | Nhất quán: cùng một hành động dùng cùng một từ ở mọi màn hình |

Mục 7 hay bị bỏ qua: màn này ghi "Xoá", màn kia ghi "Loại bỏ", màn khác ghi "Gỡ" — cho cùng một hành động.

## Checklist bảo mật cơ bản

Không thay thế kiểm thử bảo mật chuyên sâu, nhưng tester nào cũng nên kiểm:

| # | Kiểm tra |
| --- | --- |
| 1 | Mật khẩu có bị che khi nhập không |
| 2 | Response API có lộ mật khẩu, token không |
| 3 | Đăng xuất rồi bấm Back — có vào lại được không |
| 4 | Sửa URL để vào trang không có quyền — có chặn không |
| 5 | Gọi API trực tiếp với tài khoản không có quyền |
| 6 | Giới hạn số lần đăng nhập sai |
| 7 | Phiên đăng nhập có hết hạn không |
| 8 | Nhập `<img src=x onerror=alert(1)>` vào ô text — có bị thực thi không |

Mục 4 và 5 là lỗi nghiêm trọng hay gặp: giao diện ẩn nút nhưng API vẫn cho gọi.

## Cách dùng checklist

Checklist **không thay thế** test case. Nó bổ sung:

| | Test case | Checklist |
| --- | --- | --- |
| Dựa trên | Yêu cầu cụ thể của dự án | Kinh nghiệm chung |
| Chi tiết | Có dữ liệu, bước, kết quả mong đợi | Chỉ gợi ý kiểm gì |
| Dùng khi | Kiểm thử có hệ thống | Rà soát nhanh, thăm dò |

Cách dùng hiệu quả: chạy hết test case trước, rồi dùng checklist rà lại xem có gì bỏ sót.

## Bài tập

1. Áp checklist form vào một form đăng ký bất kỳ, ghi lại bug tìm được.
2. Áp checklist tìm kiếm vào một trang thương mại điện tử.
3. Test một app mobile theo checklist mobile, chú ý mục gián đoạn và cỡ chữ.
4. Chạy checklist bảo mật cơ bản, đặc biệt mục 3, 4, 8.
5. Bổ sung checklist của riêng bạn thêm 10 mục từ kinh nghiệm thực tế.
</script>

<script type="text/markdown" data-id="mt-15" data-nav="Bài 15 · Kiểm thử API với Postman">
# Bài 15 — Kiểm thử API với Postman

**Mục tiêu:** kiểm thử phía sau giao diện. Đây là kỹ năng nâng giá trị của một manual tester lên rõ rệt, và xuất hiện trong hầu hết JD.

## API là gì

Giao diện là phần bạn nhìn thấy. Khi bạn bấm "Đăng nhập", giao diện gửi một **request** tới server, server trả về **response**. API là cách hai bên nói chuyện.

Vì sao tester cần test API:

| Lý do | Giải thích |
| --- | --- |
| Tìm bug sớm | API xong trước giao diện, test được ngay |
| Tìm lỗ hổng giao diện che giấu | Nút bị ẩn không có nghĩa API chặn |
| Nhanh hơn | Test 20 trường hợp qua API mất 5 phút, qua giao diện mất 30 phút |
| Chính xác hơn | Biết chính xác server trả về gì |

## Khái niệm cơ bản

| Khái niệm | Nghĩa |
| --- | --- |
| **Endpoint** | Địa chỉ API: `https://api.example.com/users` |
| **Method** | Hành động: GET (lấy), POST (tạo), PUT/PATCH (sửa), DELETE (xoá) |
| **Header** | Thông tin kèm theo: loại dữ liệu, token xác thực |
| **Body** | Dữ liệu gửi đi, thường dạng JSON |
| **Status code** | Mã kết quả |
| **Response** | Dữ liệu server trả về |

Status code cần nhớ:

| Mã | Nghĩa | Khi nào gặp |
| --- | --- | --- |
| 200 | OK | Thành công |
| 201 | Created | Tạo mới thành công |
| 400 | Bad Request | Dữ liệu gửi lên sai |
| 401 | Unauthorized | Chưa đăng nhập, token sai |
| 403 | Forbidden | Đã đăng nhập nhưng không có quyền |
| 404 | Not Found | Không tìm thấy |
| 500 | Internal Server Error | Lỗi phía server |

Phân biệt 401 và 403 hay được hỏi: 401 là "bạn là ai", 403 là "biết bạn là ai rồi nhưng không cho".

## Request đầu tiên

Tải Postman tại `postman.com/downloads`. Luyện với API công khai `jsonplaceholder.typicode.com`.

**GET — lấy dữ liệu:**

```text
Method: GET
URL: https://jsonplaceholder.typicode.com/posts/1
```

Bấm **Send**. Response:

```json
{
  "userId": 1,
  "id": 1,
  "title": "sunt aut facere...",
  "body": "quia et suscipit..."
}
```

**POST — tạo mới:**

```text
Method: POST
URL: https://jsonplaceholder.typicode.com/posts
Headers: Content-Type: application/json
Body (chọn raw, kiểu JSON):
{
  "title": "Bài viết test",
  "body": "Nội dung",
  "userId": 1
}
```

Response trả về 201 kèm `id` của bản ghi vừa tạo.

## Kiểm gì trong một response

| Kiểm | Ví dụ |
| --- | --- |
| Status code | Đúng 200 hay 201 không |
| Cấu trúc | Có đủ các trường theo tài liệu không |
| Giá trị | Dữ liệu có đúng không |
| Kiểu dữ liệu | `gia` là số hay chuỗi |
| Thời gian phản hồi | Dưới ngưỡng cho phép không |
| Không lộ thông tin | Response có chứa mật khẩu, token nội bộ không |

Mục cuối là lỗi bảo mật hay gặp: API trả về cả trường `password_hash` mà giao diện không hiển thị.

## Test case cho API

Với mỗi endpoint, kiểm tối thiểu:

| # | Trường hợp |
| --- | --- |
| 1 | Dữ liệu hợp lệ → thành công |
| 2 | Thiếu trường bắt buộc → 400 |
| 3 | Sai kiểu dữ liệu (gửi chữ vào trường số) → 400 |
| 4 | Vượt giới hạn độ dài → 400 |
| 5 | Không có token → 401 |
| 6 | Token hết hạn → 401 |
| 7 | Token của tài khoản không có quyền → 403 |
| 8 | ID không tồn tại → 404 |
| 9 | Gửi cùng request hai lần → có tạo trùng không |

Trường hợp 7 là trường hợp quan trọng nhất mà giao diện không kiểm được: lấy token của tài khoản thường, gọi API dành cho admin. Trả về 200 là lỗ hổng nghiêm trọng.

## Biến môi trường

Đừng gõ URL và token vào từng request. Tạo Environment trong Postman:

| Biến | Giá trị |
| --- | --- |
| `base_url` | `https://staging.example.com/api` |
| `token` | `eyJhbGc...` |

Dùng trong request: `{{base_url}}/users`, và trong header: `Authorization: Bearer {{token}}`.

Đổi từ staging sang production chỉ cần đổi environment, không sửa từng request.

## Viết kiểm tra tự động trong Postman

Tab **Tests** của request, viết JavaScript đơn giản:

```javascript
pm.test("Status code la 200", function () {
    pm.response.to.have.status(200);
});

pm.test("Thoi gian phan hoi duoi 1 giay", function () {
    pm.expect(pm.response.responseTime).to.be.below(1000);
});

pm.test("Response co truong id", function () {
    const data = pm.response.json();
    pm.expect(data).to.have.property('id');
});

pm.test("Khong lo mat khau", function () {
    const data = pm.response.json();
    pm.expect(data).to.not.have.property('password');
});
```

Chạy xong Postman hiện Pass/Fail cho từng kiểm tra. Đây đã là bước đầu của automation.

## Collection và chạy hàng loạt

Gom các request thành **Collection**, rồi dùng **Collection Runner** chạy cả bộ một lần. Kết hợp với file CSV dữ liệu để chạy một request với nhiều bộ dữ liệu — giống data-driven ở các khoá automation.

Lưu token từ request đăng nhập để dùng cho các request sau, viết ở tab Tests của request đăng nhập:

```javascript
const data = pm.response.json();
pm.environment.set("token", data.accessToken);
```

## Bài tập

1. Cài Postman, gọi GET `/posts/1` và đọc response.
2. Gọi POST tạo bài viết mới, kiểm tra status 201.
3. Tạo Environment với `base_url`, dùng biến trong 3 request.
4. Viết 4 test tự động trong tab Tests cho một request.
5. Tạo Collection 5 request và chạy bằng Collection Runner.
6. Với một API cần đăng nhập, thử gọi không kèm token và kiểm tra trả về 401.
</script>

<script type="text/markdown" data-id="mt-16" data-nav="Bài 16 · Tester trong Agile">
# Bài 16 — Tester trong nhóm Agile

**Mục tiêu:** biết mình làm gì ở từng giai đoạn của sprint, và nói đúng ngôn ngữ của nhóm.

## Scrum trong 5 phút

| Khái niệm | Nghĩa |
| --- | --- |
| **Sprint** | Chu kỳ làm việc cố định, thường 2 tuần |
| **Product Backlog** | Danh sách mọi việc cần làm, PO sắp xếp ưu tiên |
| **Sprint Backlog** | Việc chọn làm trong sprint này |
| **User Story** | Một yêu cầu nhỏ, hoàn thành được trong sprint |
| **Definition of Done** | Điều kiện để coi một story là xong |
| **Velocity** | Số điểm nhóm hoàn thành được mỗi sprint |

| Vai trò | Làm gì |
| --- | --- |
| **Product Owner** | Quyết định làm gì trước, nghiệm thu story |
| **Scrum Master** | Gỡ vướng mắc, giữ nhịp quy trình |
| **Development Team** | Dev, tester, designer — cùng chịu trách nhiệm sản phẩm |

Điểm quan trọng: trong Scrum, tester **nằm trong nhóm phát triển**, không phải bộ phận riêng kiểm tra sản phẩm của người khác.

## Bốn cuộc họp và việc của tester

| Cuộc họp | Khi nào | Tester làm gì |
| --- | --- | --- |
| **Sprint Planning** | Đầu sprint | Ước lượng công sức test, nêu rủi ro, hỏi lại story chưa rõ |
| **Daily Standup** | Mỗi sáng, 15 phút | Báo hôm qua test gì, hôm nay test gì, đang vướng gì |
| **Sprint Review** | Cuối sprint | Tham gia demo, nêu chất lượng thực tế |
| **Retrospective** | Cuối sprint | Góp ý cải tiến quy trình |

Trong Planning, tester nên là người hỏi nhiều nhất. Câu hỏi hay hỏi:

- "Story này có acceptance criteria chưa?"
- "Trường hợp người dùng làm X thì mong đợi gì?"
- "Có cần test trên mobile không, hay chỉ web?"
- "Dữ liệu test ai chuẩn bị?"

## Definition of Done

Danh sách điều kiện để một story được coi là xong. Nhóm tự thống nhất, ví dụ:

- [ ] Code đã viết và được review
- [ ] Unit test đã viết và pass
- [ ] Đã deploy lên môi trường test
- [ ] Test case đã viết và chạy hết
- [ ] Không còn bug Critical/High
- [ ] PO đã nghiệm thu

Tester thường là người kiểm mục 4 và 5. Không có Definition of Done thì cuối sprint sẽ tranh cãi "xong" nghĩa là gì.

## Vấn đề kinh điển: test bị dồn cuối sprint

Dev code đến ngày 8 của sprint 10 ngày, tester chỉ còn 2 ngày để test tất cả.

Cách giảm:

| Cách | Cụ thể |
| --- | --- |
| Viết test case song song với dev | Ngay khi story được chốt, không chờ có build |
| Test từng story khi xong | Đừng chờ gom hết |
| Tham gia review tài liệu | Tìm lỗi trước khi code |
| Nêu rõ trong Planning | "Story này cần 2 ngày test, nhóm cân nhắc khi cam kết" |
| Định nghĩa "xong" gồm cả test | Story chưa test xong thì chưa tính hoàn thành |

Mục cuối là cách bền nhất. Khi "Done" bao gồm cả test, nhóm sẽ tự điều chỉnh để không dồn.

## Ước lượng bằng Story Point

Nhóm ước lượng độ phức tạp bằng dãy số Fibonacci: 1, 2, 3, 5, 8, 13.

Tester tham gia ước lượng, và cần tính cả công sức test vào điểm. Một story "đơn giản với dev" có thể rất tốn công test — ví dụ chức năng tính thuế: code ngắn nhưng phải test hàng chục trường hợp.

Nói rõ điều đó trong Planning là trách nhiệm của tester.

## Shift-left testing

Nghĩa là **dịch hoạt động kiểm thử về sớm hơn** trong quy trình:

```text
Truyen thong:  Phan tich → Thiet ke → Code ─────────────→ TEST → Release
Shift-left:    Phan tich → Thiet ke → Code → Release
               ↑TEST      ↑TEST      ↑TEST   ↑TEST
```

Thực tế với tester:

| Giai đoạn | Hoạt động kiểm thử |
| --- | --- |
| Phân tích yêu cầu | Review tài liệu, đặt câu hỏi (Bài 3) |
| Thiết kế | Review wireframe, nêu vấn đề trải nghiệm |
| Code | Viết test case, chuẩn bị dữ liệu |
| Có build | Thực thi test |

Đây là lý do nguyên lý thứ ba ở Bài 1 — "kiểm thử sớm tiết kiệm thời gian và tiền bạc".

## Thuật ngữ hay dùng trong nhóm Agile

| Thuật ngữ | Nghĩa |
| --- | --- |
| Grooming / Refinement | Họp làm rõ story trước khi đưa vào sprint |
| Blocker | Vấn đề chặn công việc |
| Spike | Thời gian nghiên cứu một vấn đề chưa rõ |
| Technical debt | Nợ kỹ thuật — code tạm thời cần sửa sau |
| MVP | Phiên bản tối thiểu dùng được |
| Hotfix | Bản sửa gấp đưa thẳng lên production |

Hotfix là tình huống tester cần cảnh giác nhất: sửa gấp, ít thời gian test, dễ gây lỗi mới. Luôn chạy ít nhất smoke test và regression cho vùng liên quan.

## Bài tập

1. Viết Definition of Done cho nhóm của bạn, tối thiểu 6 mục.
2. Soạn nội dung báo cáo daily standup cho 3 ngày.
3. Viết 5 câu hỏi bạn sẽ hỏi trong Sprint Planning cho một story bất kỳ.
4. Liệt kê 3 cách cụ thể giảm việc test bị dồn cuối sprint trong dự án của bạn.
5. Tìm hiểu nhóm bạn đang dùng mô hình gì và vẽ lại quy trình thực tế.
</script>

<script type="text/markdown" data-id="mt-17" data-nav="Bài 17 · CV và phỏng vấn">
# Bài 17 — CV và phỏng vấn Fresher Manual Tester

**Mục tiêu:** chuyển kiến thức đã học thành một bộ hồ sơ và khả năng trả lời phỏng vấn.

## CV cho vị trí Fresher

Nhà tuyển dụng đọc CV khoảng 30 giây. Thứ tự ưu tiên:

```text
1. Thông tin liên hệ
2. Mục tiêu nghề nghiệp (2-3 dòng, cụ thể)
3. Kỹ năng (chia nhóm rõ ràng)
4. Dự án (quan trọng nhất với Fresher)
5. Học vấn và chứng chỉ
6. Ngoại ngữ
```

Với Fresher chưa có kinh nghiệm đi làm, **mục Dự án quan trọng nhất**. Nó chứng minh bạn làm được việc.

## Mục tiêu nghề nghiệp

| Kém | Tốt |
| --- | --- |
| "Mong muốn làm việc trong môi trường năng động, có cơ hội phát triển bản thân" | "Tìm vị trí Fresher Manual Tester để áp dụng kiến thức về kỹ thuật thiết kế test case và quy trình kiểm thử. Mục tiêu 1 năm tới: thành thạo manual testing và chuyển dần sang automation với Playwright." |

Cụ thể, có mốc thời gian, cho thấy bạn hiểu lộ trình nghề.

## Mục kỹ năng

Chia nhóm thay vì liệt kê một dãy:

```text
Kiểm thử:    Thiết kế test case (phân vùng tương đương, giá trị biên,
             bảng quyết định, chuyển trạng thái), viết test plan,
             bug report, kiểm thử chức năng và phi chức năng cơ bản
Công cụ:     Jira, TestRail, Postman, DevTools, SQL cơ bản
Quy trình:   Agile/Scrum, SDLC, STLC
Automation:  Python, Playwright, pytest (đang học)
Ngoại ngữ:   Tiếng Anh đọc hiểu tài liệu kỹ thuật
```

Ghi "đang học" cho phần chưa thành thạo. Trung thực, và vẫn cho thấy bạn chủ động.

## Mục dự án

Với mỗi dự án, viết theo cấu trúc: **bối cảnh — bạn làm gì — kết quả cụ thể**.

```text
Dự án kiểm thử hệ thống E-Commerce (dự án học tập, 3 người)
- Phân tích yêu cầu và viết 85 test case cho 4 chức năng:
  đăng nhập, danh sách sản phẩm, giỏ hàng, thanh toán
- Áp dụng phân vùng tương đương, giá trị biên và bảng quyết định
- Thực thi test, phát hiện và báo cáo 23 bug trên Jira
- Viết test plan và báo cáo kiểm thử tổng hợp
- Công cụ: Jira, Google Sheets, Postman, DevTools
```

Con số cụ thể (85 test case, 23 bug) có sức thuyết phục hơn nhiều so với "tham gia kiểm thử hệ thống".

Chưa có dự án thật thì tự làm: chọn một app bất kỳ, viết test plan, 50 test case, chạy test, viết 10 bug report, viết báo cáo. Đó là một dự án hợp lệ để đưa vào CV, chỉ cần ghi rõ là dự án cá nhân.

## Chuẩn bị bộ hồ sơ

Ngoài CV, chuẩn bị sẵn để gửi khi được hỏi:

| Tài liệu | Nội dung |
| --- | --- |
| Bộ test case mẫu | 20–30 test case cho một chức năng, đủ các trường |
| Bug report mẫu | 3–5 bug viết chuẩn, có ảnh |
| Test plan mẫu | Một bản rút gọn |
| Báo cáo kiểm thử mẫu | Một bản đầy đủ |

Đưa được bộ này ra trong phỏng vấn tạo khác biệt rất lớn so với ứng viên chỉ nói suông.

## Câu hỏi phỏng vấn thường gặp

**Nhóm lý thuyết**

1. Nêu 7 nguyên lý kiểm thử, cho ví dụ một nguyên lý.
2. Phân biệt QA và QC.
3. Phân biệt Severity và Priority, cho ví dụ Severity cao Priority thấp.
4. Phân biệt Verification và Validation.
5. Phân biệt Smoke test và Sanity test.
6. Phân biệt Re-test và Regression test.
7. Các cấp độ kiểm thử là gì.
8. Vòng đời của một bug.

**Nhóm thực hành**

9. Cho ô nhập tuổi 18–60, bạn viết test case thế nào?
10. Test một cái thang máy / một cây bút / một cái ATM — bạn kiểm gì?
11. Bạn viết bug report gồm những gì?
12. Làm sao biết đã test đủ?
13. Dev nói "không phải bug", bạn xử lý thế nào?
14. Không có tài liệu yêu cầu, bạn test thế nào?
15. Sắp đến hạn release mà chưa test xong, bạn làm gì?

Câu 10 là dạng kiểm tra tư duy. Cách trả lời tốt: chia nhóm trước khi liệt kê — chức năng, phi chức năng, trường hợp biên, trải nghiệm người dùng. Đừng liệt kê lung tung.

Ví dụ với thang máy: **chức năng** (bấm tầng, mở đóng cửa, dừng đúng tầng), **tải trọng** (quá tải, rỗng), **an toàn** (mất điện, có người kẹt cửa, nút khẩn cấp), **trải nghiệm** (hiển thị tầng, âm thanh, thời gian chờ), **biên** (bấm mọi tầng cùng lúc, bấm liên tục một nút).

**Nhóm về bản thân**

16. Vì sao bạn chọn nghề tester?
17. Điểm mạnh và điểm yếu của bạn?
18. Mục tiêu 2 năm tới?
19. Bạn học testing từ đâu?

Câu 16 nên trả lời cụ thể, tránh câu chung chung "vì em cẩn thận". Ví dụ: "Em học ngôn ngữ, quen với việc đọc kỹ và phát hiện chỗ không nhất quán trong văn bản. Khi tìm hiểu về testing em thấy công việc phân tích yêu cầu và tìm trường hợp biên hợp với cách nghĩ của mình."

## Bài kiểm tra đầu vào

Nhiều công ty cho làm bài test trước khi phỏng vấn. Dạng hay gặp:

| Dạng bài | Chuẩn bị |
| --- | --- |
| Viết test case cho một chức năng | Luyện Bài 5–8 |
| Tìm bug trên một trang web cho sẵn | Luyện checklist Bài 14 |
| Viết bug report từ một tình huống | Luyện Bài 11 |
| Câu hỏi trắc nghiệm lý thuyết | Ôn Bài 1–2, hoặc khoá ISTQB |

Khi viết test case trong bài test, nhớ ghi đủ các trường và có cả test case negative. Nhiều ứng viên chỉ viết luồng chính và bị loại vì đó.

## Sau phỏng vấn

Gửi email cảm ơn ngắn trong vòng 24 giờ. Không bắt buộc, nhưng tạo ấn tượng tốt và rất ít ứng viên Fresher làm.

Bị từ chối thì hỏi lại lý do một cách lịch sự. Nhiều nơi sẽ trả lời, và đó là thông tin quý để cải thiện.

## Bài tập

1. Viết CV theo cấu trúc trên, mục dự án có con số cụ thể.
2. Chuẩn bị bộ 4 tài liệu mẫu để gửi kèm.
3. Tự trả lời 19 câu hỏi ở trên, viết ra giấy, đọc to để luyện.
4. Nhờ người khác hỏi lại 5 câu bất kỳ và nghe bạn trả lời.
5. Tìm 5 tin tuyển dụng phù hợp và nộp hồ sơ.

# Bài 0 — Tổng quan kỳ thi ISTQB CTFL v4.0

**Mục tiêu:** biết rõ mình sắp thi cái gì, thi thế nào, và ôn theo cách nào cho hiệu quả.

## ISTQB là gì

ISTQB (International Software Testing Qualifications Board) là tổ chức cấp chứng chỉ kiểm thử phần mềm được công nhận rộng rãi nhất thế giới. Chứng chỉ đầu tiên và phổ biến nhất là **CTFL — Certified Tester Foundation Level**.

Phiên bản hiện hành: **syllabus v4.0**, phát hành năm 2023, có bản chỉnh sửa nhỏ 4.0.1. Nếu bạn tìm được tài liệu ôn ghi v3.1 thì đó là bản cũ — cấu trúc chương đã thay đổi đáng kể.

## Chứng chỉ này có đáng không

| Có lợi khi | Ít tác dụng khi |
| --- | --- |
| Ứng tuyển công ty outsource, công ty Nhật, công ty lớn | Startup nhỏ quan tâm kỹ năng thực tế hơn |
| JD ghi rõ "ưu tiên có ISTQB" | Vị trí automation thuần kỹ thuật |
| Muốn hệ thống hoá kiến thức | Bạn đã có 3+ năm kinh nghiệm |

Với Fresher ở Việt Nam, CTFL là một điểm cộng rõ ràng trong CV và giúp bạn vượt qua vòng lọc hồ sơ. Nhưng nó không thay thế được kinh nghiệm thực tế — tốt nhất là có cả hai.

## Cấu trúc kỳ thi

| Mục | Chi tiết |
| --- | --- |
| Số câu hỏi | 40 câu trắc nghiệm |
| Thời gian | 60 phút |
| Điểm đạt | 26/40 câu đúng, tức 65% |
| Hình thức | Chọn một đáp án đúng; một số câu có thể chọn nhiều |
| Tài liệu | Không được mang (closed book) |
| Điều kiện dự thi | Không yêu cầu kinh nghiệm |

Người không dùng tiếng Anh là tiếng mẹ đẻ thường được cộng thêm 25% thời gian, thành 75 phút — hãy xác nhận với đơn vị tổ chức thi khi đăng ký.

Trung bình bạn có **90 giây cho mỗi câu**. Đủ nếu đã thuộc, nhưng không đủ để suy nghĩ lâu. Bài 8 sẽ nói về quản lý thời gian.

## Sáu chương của syllabus v4.0

| Chương | Tên | Số câu (xấp xỉ) |
| --- | --- | --- |
| 1 | Fundamentals of Testing — Cơ bản về kiểm thử | 8 |
| 2 | Testing Throughout the SDLC — Kiểm thử trong vòng đời phát triển | 6 |
| 3 | Static Testing — Kiểm thử tĩnh | 4 |
| 4 | Test Analysis and Design — Phân tích và thiết kế kiểm thử | 11 |
| 5 | Managing the Test Activities — Quản lý hoạt động kiểm thử | 9 |
| 6 | Test Tools — Công cụ kiểm thử | 2 |

Số câu là ước lượng theo trọng số học phần; hãy kiểm tra lại bảng phân bổ trong syllabus chính thức.

Điều quan trọng rút ra: **Chương 4 và 5 chiếm một nửa đề thi**. Dành thời gian ôn tương xứng, đừng dàn đều sáu chương.

## K-level — mức độ nhận thức

Mỗi mục tiêu học tập trong syllabus được gán một mức K. Biết mức K giúp bạn biết phải học đến đâu.

| Mức | Tên | Yêu cầu | Dạng câu hỏi |
| --- | --- | --- | --- |
| **K1** | Remember — Nhớ | Nhớ được định nghĩa, thuật ngữ | "Định nghĩa nào sau đây đúng về..." |
| **K2** | Understand — Hiểu | Giải thích, so sánh, phân loại | "Vì sao...", "Điểm khác nhau giữa..." |
| **K3** | Apply — Áp dụng | Vận dụng kỹ thuật vào tình huống cụ thể | "Cho khoảng 1–100, cần bao nhiêu test case..." |

Các câu K3 gần như chỉ nằm ở **Chương 4** (kỹ thuật thiết kế test case) và một phần Chương 5 (ước lượng). Đây là dạng câu mất thời gian nhất — phải tính toán thật.

## Lệ phí và cách đăng ký

| Mục | Thông tin |
| --- | --- |
| Lệ phí | Khoảng 200–250 USD tuỳ đơn vị tổ chức |
| Nơi thi | Thi online có giám sát, hoặc tại trung tâm |
| Đơn vị tổ chức | Các exam provider được ISTQB uỷ quyền |
| Thời gian có kết quả | Thường ngay sau khi nộp bài |
| Hiệu lực | Vĩnh viễn, không cần gia hạn |

Giá và quy trình thay đổi theo thời gian và theo đơn vị, nên kiểm tra trực tiếp trên trang của họ trước khi đăng ký. Thi trượt được thi lại, nhưng phải đóng phí lần nữa.

## Tài liệu chính thức

Cả ba tài liệu dưới đây đều **miễn phí**, không cần tạo tài khoản. Tất cả nằm trên trang chứng chỉ chính thức:

👉 **[istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0](https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0)**

Mở trang đó, kéo xuống khối **Download Materials**, bạn sẽ thấy:

| Tài liệu | Nằm ở mục | Ghi chú |
| --- | --- | --- |
| **Syllabus CTFL v4.0.1** | Download Materials → **Syllabus** | Tài liệu gốc, bản mới nhất. Đề thi ra đúng theo các Learning Objective trong này |

Về đề mẫu: **mỗi bộ gồm 2 file riêng** — file *Questions* để làm, file *Answers* để chữa. File đáp án không chỉ ghi A/B/C/D mà giải thích tại sao đúng, tại sao các phương án kia sai, và chỉ rõ câu đó thuộc Learning Objective nào. Đây là phần giá trị nhất, đừng chỉ dò đáp án rồi bỏ qua.

| Bộ | Làm khi nào |

**Nơi đăng ký thi:** danh sách đơn vị tổ chức thi được ISTQB uỷ quyền ở [istqb.org/certifications/exam-providers](https://istqb.org/certifications/exam-providers) — lọc theo Vietnam, hoặc chọn provider quốc tế nếu muốn thi online.

# Bài 1 — Chương 1: Fundamentals of Testing

**Khoảng 8 câu trong đề thi.** Chương nền tảng, nhiều định nghĩa phải nhớ chính xác.

## 1.1 Kiểm thử là gì

**Định nghĩa:** kiểm thử là một tập hợp các hoạt động nhằm phát hiện khuyết tật và đánh giá chất lượng của sản phẩm phần mềm.

Điểm thi hay hỏi: kiểm thử **không chỉ là chạy test**. Nó gồm cả lập kế hoạch, phân tích, thiết kế, và các hoạt động tĩnh như review tài liệu.

### Mục tiêu của kiểm thử

| Mục tiêu |
| --- |
| Đánh giá work product: yêu cầu, user story, thiết kế, code |
| Kích hoạt lỗi và tìm khuyết tật |
| Đảm bảo độ phủ cần thiết của đối tượng kiểm thử |
| Giảm mức rủi ro về chất lượng |
| Xác minh các yêu cầu đã được đáp ứng |
| Xác nhận đối tượng kiểm thử hoạt động như người dùng mong đợi |
| Cung cấp thông tin để các bên ra quyết định |
| Tuân thủ hợp đồng, quy định pháp lý hoặc tiêu chuẩn |

### Kiểm thử và gỡ lỗi khác nhau

| | Testing | Debugging |
| --- | --- | --- |
| Ai làm | Tester | Developer |
| Mục đích | Phát hiện failure | Tìm nguyên nhân và sửa defect |
| Kết quả | Báo cáo lỗi | Code đã sửa |

Sau khi dev debug và sửa xong, tester thực hiện **confirmation testing** để xác nhận, và **regression testing** để kiểm tra chỗ khác không bị ảnh hưởng.

## 1.2 Vì sao cần kiểm thử

### Đóng góp của kiểm thử

- Giảm rủi ro phần mềm lỗi khi vận hành
- Tiết kiệm chi phí: lỗi tìm sớm rẻ hơn tìm muộn
- Đáp ứng yêu cầu hợp đồng, pháp lý
- Cung cấp thông tin cho quyết định release

### Kiểm thử và đảm bảo chất lượng

| | Quality Assurance | Testing |
| --- | --- | --- |
| Tập trung vào | Quy trình | Sản phẩm |
| Mục tiêu | Ngăn ngừa lỗi | Phát hiện lỗi |
| Phạm vi | Toàn tổ chức | Một đối tượng kiểm thử |

Testing là **một phần** của QA, không phải thứ thay thế QA.

### Error, Defect, Failure và nguyên nhân gốc

| Thuật ngữ | Định nghĩa |
| --- | --- |
| **Error (Mistake)** | Hành động của con người tạo ra kết quả sai |
| **Defect (Fault, Bug)** | Khiếm khuyết trong một work product, có thể gây failure |
| **Failure** | Sự kiện khi hệ thống không làm đúng điều mong đợi |
| **Root cause** | Nguyên nhân sâu xa dẫn tới error |

Chuỗi: **Root cause → Error → Defect → Failure**

Lưu ý quan trọng cho bài thi: **không phải defect nào cũng gây failure.** Defect nằm ở đoạn code không bao giờ chạy thì không gây failure.

Ngoài ra, failure còn có thể do **điều kiện môi trường** (nhiễu điện từ, phóng xạ...) chứ không nhất thiết do defect trong code.

## 1.3 Bảy nguyên lý kiểm thử

Học thuộc cả bảy, kèm ý nghĩa:

| # | Nguyên lý | Nghĩa |
| --- | --- | --- |
| 1 | Testing shows the presence, not the absence of defects | Kiểm thử chứng minh có lỗi, không chứng minh không có lỗi |
| 2 | Exhaustive testing is impossible | Không thể kiểm thử vét cạn, trừ trường hợp cực kỳ đơn giản |
| 3 | Early testing saves time and money | Kiểm thử sớm tiết kiệm thời gian và tiền bạc |
| 4 | Defects cluster together | Lỗi tụ lại — số ít module chứa phần lớn lỗi |
| 5 | Tests wear out | Lặp mãi một bộ test thì không tìm ra lỗi mới |
| 6 | Testing is context dependent | Kiểm thử phụ thuộc ngữ cảnh |
| 7 | Absence-of-defects fallacy | Hết lỗi không có nghĩa hệ thống dùng được |

Đề thi hay cho một tình huống và hỏi nó minh hoạ nguyên lý nào. Ví dụ: "Nhóm chạy cùng một bộ regression 6 tháng, không tìm thêm lỗi nào" → nguyên lý 5.

## 1.4 Hoạt động, testware và vai trò

### Các hoạt động kiểm thử

| Hoạt động | Nội dung |
| --- | --- |
| Test planning | Xác định mục tiêu, cách tiếp cận, nguồn lực |
| Test monitoring and control | Theo dõi tiến độ, điều chỉnh khi lệch kế hoạch |
| Test analysis | Phân tích cơ sở kiểm thử, xác định test condition |
| Test design | Thiết kế test case và test data từ test condition |
| Test implementation | Chuẩn bị mọi thứ cần để thực thi |
| Test execution | Chạy test, so sánh kết quả |
| Test completion | Tổng hợp, lưu trữ, rút kinh nghiệm |

Lưu ý: các hoạt động này **không nhất thiết tuần tự**, có thể lặp và chồng lên nhau.

### Testware — sản phẩm của hoạt động kiểm thử

| Hoạt động | Testware tạo ra |
| --- | --- |
| Planning | Test plan, lịch, phân tích rủi ro |
| Analysis | Test condition |
| Design | Test case, test data, test charter |
| Implementation | Test procedure, test suite, dữ liệu đã nạp |
| Execution | Test log, báo cáo khuyết tật |
| Completion | Test completion report, bài học rút ra |

### Truy vết (Traceability)

Khả năng liên kết hai chiều giữa **test basis** (yêu cầu, user story) và **testware** (test case, kết quả).

Lợi ích:
- Đánh giá độ phủ: yêu cầu nào chưa có test case
- Phân tích ảnh hưởng: yêu cầu đổi thì test case nào phải sửa
- Giúp báo cáo tiến độ dễ hiểu cho người ngoài

### Vai trò

| Vai trò | Trách nhiệm chính |
| --- | --- |
| **Test management** | Lập kế hoạch, giám sát, điều khiển, báo cáo tổng thể |
| **Testing role** | Phân tích, thiết kế, thực thi, báo cáo kết quả |

Một người có thể đảm nhiệm cả hai vai trò, tuỳ quy mô dự án.

## 1.5 Kỹ năng và thực hành tốt

### Kỹ năng cần có của tester

Kiến thức về kiểm thử, cẩn thận và tò mò, kỹ năng giao tiếp, tư duy phân tích và phản biện, tư duy hệ thống, hiểu lĩnh vực nghiệp vụ.

### Whole team approach

Mọi thành viên trong nhóm cùng chịu trách nhiệm về chất lượng, không chỉ tester. Tester làm việc cùng dev, BA, PO ngay từ đầu.

### Tính độc lập của kiểm thử

| Mức độ độc lập | Ưu điểm | Nhược điểm |
| --- | --- | --- |
| Tác giả tự test | Nhanh, rẻ | Khó nhìn ra lỗi của chính mình |
| Đồng nghiệp trong nhóm test | Cân bằng | Vẫn chịu ảnh hưởng nhóm |
| Nhóm test độc lập trong tổ chức | Khách quan hơn | Xa cách với nhóm phát triển |
| Bên ngoài tổ chức | Khách quan nhất | Tốn kém, chậm, ít hiểu nghiệp vụ |

Độc lập cao hơn giúp tìm lỗi tốt hơn, nhưng dễ dẫn đến cô lập và chậm phản hồi. Đây là điểm cân bằng, không có mức nào luôn đúng.

## Điểm dễ sai trong bài thi

| Bẫy | Đúng là |
| --- | --- |
| "Testing chứng minh phần mềm không có lỗi" | Chỉ chứng minh có lỗi |
| "Mọi defect đều gây failure" | Không — defect ở code không chạy thì không gây failure |
| "Testing và QA là một" | Testing là một phần của QA |
| "Debugging là việc của tester" | Là việc của developer |
| "Exhaustive testing khả thi nếu có đủ thời gian" | Không khả thi, trừ trường hợp cực kỳ đơn giản |

## Bài tập

1. Viết 7 nguyên lý bằng cả tiếng Anh và tiếng Việt.
2. Vẽ chuỗi root cause → error → defect → failure với một ví dụ thật.
3. Lập bảng 7 hoạt động kiểm thử và testware tương ứng.
4. Giải thích traceability và nêu 3 lợi ích.
5. Làm 10 câu hỏi về Chương 1 trong đề mẫu.

# Bài 2 — Chương 2: Testing Throughout the SDLC

**Khoảng 6 câu trong đề thi.**

## 2.1 Kiểm thử trong bối cảnh vòng đời phát triển

### Ảnh hưởng của mô hình SDLC

Mô hình phát triển ảnh hưởng tới: thời điểm thực hiện hoạt động kiểm thử, mức độ chi tiết tài liệu, kỹ thuật áp dụng, và mức độ tự động hoá.

| Nhóm mô hình | Đặc điểm | Kiểm thử |
| --- | --- | --- |
| **Tuần tự** (Waterfall, V-model) | Hoàn thành giai đoạn này mới sang giai đoạn sau | V-model: mỗi mức phát triển có một mức kiểm thử tương ứng |
| **Lặp** (Iterative) | Làm từng phần, mỗi vòng mở rộng thêm | Kiểm thử lặp lại mỗi vòng |
| **Tăng trưởng** (Incremental) | Giao từng phần chức năng | Regression tăng dần theo mỗi phần |
| **Agile** | Sprint ngắn, nhiều phản hồi | Tester trong nhóm, test liên tục |

Trong Waterfall, kiểm thử tập trung ở cuối. Trong Agile, kiểm thử diễn ra suốt sprint.

### Thực hành tốt về kiểm thử, không phụ thuộc mô hình

- Mỗi mức phát triển có một mức kiểm thử tương ứng
- Thiết kế test cho một mức kiểm thử ngay khi work product tương ứng được viết
- Tester tham gia review work product ngay khi có bản nháp

### Testing as a driver

| Phương pháp | Nghĩa |
| --- | --- |
| **TDD** (Test-Driven Development) | Viết test trước, rồi viết code cho test pass |
| **ATDD** (Acceptance Test-Driven Development) | Viết acceptance test từ acceptance criteria trước khi code |
| **BDD** (Behavior-Driven Development) | Mô tả hành vi mong muốn bằng ngôn ngữ tự nhiên (Given-When-Then) |

Cả ba đều là ví dụ của **shift-left** — đưa hoạt động kiểm thử về sớm hơn.

### Các cách shift-left

- Review đặc tả dưới góc nhìn kiểm thử
- Viết test case trước khi code
- Dùng CI/CD với kiểm tra tự động nhanh
- Phân tích tĩnh mã nguồn trước khi test động

Lưu ý: shift-left có thể tốn thêm công sức ở giai đoạn đầu, nhưng tiết kiệm nhiều hơn ở giai đoạn sau.

### Retrospective và cải tiến quy trình

Họp rút kinh nghiệm cuối mỗi vòng lặp hoặc dự án. Lợi ích: tăng hiệu quả kiểm thử, cải thiện chất lượng testware, tăng gắn kết nhóm, nâng chất lượng test basis.

## 2.2 Các mức kiểm thử và loại kiểm thử

### Năm mức kiểm thử

| Mức | Đối tượng | Test basis | Ai thường làm |
| --- | --- | --- | --- |
| **Component testing** | Thành phần riêng lẻ | Thiết kế chi tiết, code | Developer |
| **Component integration testing** | Giao tiếp giữa các thành phần | Thiết kế phần mềm, sơ đồ tuần tự | Developer |
| **System testing** | Toàn hệ thống | Đặc tả yêu cầu, use case | Tester độc lập |
| **System integration testing** | Giao tiếp giữa hệ thống với hệ thống khác | Kiến trúc hệ thống, giao diện bên ngoài | Tester độc lập |
| **Acceptance testing** | Hệ thống đáp ứng nhu cầu | Yêu cầu người dùng, quy trình nghiệp vụ | Khách hàng, người dùng |

v4.0 có **5 mức** — khác bản cũ có 4 mức. Component integration và system integration được tách riêng.

### Bốn hình thức acceptance testing

| Hình thức | Mục đích |
| --- | --- |
| **UAT** (User acceptance testing) | Người dùng xác nhận hệ thống phù hợp nhu cầu |
| **OAT** (Operational acceptance testing) | Quản trị hệ thống kiểm tra sao lưu, khôi phục, bảo trì |
| **Contractual / Regulatory** | Kiểm tra tuân thủ hợp đồng, quy định pháp luật |
| **Alpha / Beta testing** | Alpha tại nơi phát triển; Beta tại nơi người dùng |

### Các loại kiểm thử

| Loại | Kiểm gì |
| --- | --- |
| **Functional testing** | Hệ thống làm gì — tính đầy đủ, đúng đắn, phù hợp |
| **Non-functional testing** | Làm tốt đến đâu — hiệu năng, bảo mật, khả dụng... |
| **Black-box testing** | Dựa trên đặc tả, không nhìn cấu trúc bên trong |
| **White-box testing** | Dựa trên cấu trúc bên trong, code |

Các đặc tính phi chức năng theo ISO 25010: functional suitability, performance efficiency, compatibility, interaction capability (usability), reliability, security, maintainability, flexibility (portability).

### Confirmation và regression testing

| | Confirmation testing | Regression testing |
| --- | --- | --- |
| Mục đích | Xác nhận defect đã được sửa | Phát hiện tác dụng phụ của thay đổi |
| Phạm vi | Chỉ phần đã sửa | Các phần không thay đổi |
| Khi nào | Sau khi dev báo fix | Sau mọi thay đổi |

Regression là ứng viên hàng đầu cho tự động hoá vì phải chạy lặp đi lặp lại.

## 2.3 Maintenance testing

Kiểm thử khi hệ thống đã vận hành và có thay đổi.

### Nguyên nhân cần maintenance testing

| Nhóm | Ví dụ |
| --- | --- |
| Sửa đổi | Sửa lỗi, nâng cấp chức năng, cải tiến |
| Nâng cấp môi trường | Đổi hệ điều hành, đổi database, đổi nền tảng |
| Ngừng vận hành | Kiểm thử việc lưu trữ dữ liệu, khôi phục |

### Impact analysis

Phân tích xem một thay đổi ảnh hưởng tới những phần nào, để quyết định phạm vi regression.

Khó khăn khi phân tích ảnh hưởng:
- Đặc tả lỗi thời hoặc thiếu
- Không có truy vết giữa yêu cầu và test case
- Người viết hệ thống không còn ở công ty
- Tài liệu kém

Đây là lý do traceability ở Chương 1 quan trọng.

## Điểm dễ sai trong bài thi

| Bẫy | Đúng là |
| --- | --- |
| "v4.0 có 4 mức kiểm thử" | Có 5 mức — integration tách thành component và system |
| "Acceptance testing chỉ có UAT" | Còn OAT, contractual/regulatory, alpha/beta |
| "Alpha test ở nơi khách hàng" | Alpha ở nơi phát triển, Beta ở nơi khách hàng |
| "Regression chỉ chạy trước release" | Chạy sau mọi thay đổi |
| "Component testing do tester làm" | Thường do developer làm |

## Bài tập

1. Lập bảng 5 mức kiểm thử kèm test basis và đối tượng kiểm thử.
2. Phân biệt 4 hình thức acceptance testing bằng lời của bạn.
3. Giải thích TDD, ATDD, BDD và cho biết điểm chung.
4. Nêu 4 khó khăn khi thực hiện impact analysis.
5. Làm các câu hỏi Chương 2 trong đề mẫu.
