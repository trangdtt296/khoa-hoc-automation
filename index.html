# Bài 0B — Terminal, thư mục và đường dẫn

**Mục tiêu:** tự tin gõ lệnh và biết mình đang đứng ở thư mục nào. Nếu bạn trái ngành và chưa bao giờ gõ lệnh, đừng bỏ bài này — phần lớn lỗi "chạy không được" về sau đều do đứng sai thư mục.

## Terminal là gì

Terminal là cửa sổ để ra lệnh cho máy tính bằng chữ thay vì bằng chuột. Bạn gõ một dòng, bấm Enter, máy thực hiện rồi in kết quả ra.

Dân automation dùng Terminal vì ba việc: cài thư viện, chạy test, và đọc kết quả test. Không tránh được, nhưng cũng chỉ cần thuộc khoảng 6 lệnh.

## Mở Terminal

| Hệ điều hành | Cách mở |
| --- | --- |
| Windows | Bấm phím Windows, gõ `powershell`, bấm Enter |
| macOS | Bấm `Cmd + Space`, gõ `terminal`, bấm Enter |
| Trong VS Code (tiện nhất) | Bấm `` Ctrl + ` `` — Terminal hiện ngay dưới, và **tự đứng ở thư mục project** |

Từ Bài 11 trở đi bạn nên dùng Terminal trong VS Code, vì nó tự mở đúng thư mục bạn đang làm việc.

Trên Windows có hai loại: **PowerShell** và **Command Prompt (CMD)**. Khoá này dùng PowerShell — nó mạnh hơn và là mặc định của VS Code.

## Dấu nhắc lệnh

Khi mở lên bạn thấy một dòng kiểu này:

```text
PS E:\ProjectAI>
```

Phần `E:\ProjectAI` cho biết bạn đang đứng ở thư mục nào. Đây là thông tin quan trọng nhất trên màn hình — mọi lệnh bạn gõ đều áp dụng cho thư mục đó.

Trên macOS dấu nhắc trông khác một chút, kết thúc bằng `$` hoặc `%`.

## Đường dẫn là gì

Đường dẫn là địa chỉ của một thư mục hay file, viết từ ngoài vào trong:

```text
E:\ProjectAI\saucedemo-automation\tests\test_login.py
│  │          │                      │       └─ tên file
│  │          │                      └─ thư mục con
│  │          └─ thư mục project
│  └─ thư mục
└─ ổ đĩa
```

Windows ngăn cách bằng `\`, macOS và Linux dùng `/`. Đó là lý do trong khoá này một số lệnh có hai phiên bản.

Hai kiểu đường dẫn:

- **Tuyệt đối** — viết đầy đủ từ ổ đĩa: `E:\ProjectAI\tests`. Đúng ở mọi nơi.
- **Tương đối** — tính từ chỗ bạn đang đứng: `tests\test_login.py`. Ngắn hơn, nhưng chỉ đúng khi bạn đứng đúng chỗ.

## 6 lệnh cần thuộc

| Lệnh Windows | Lệnh macOS | Làm gì |
| --- | --- | --- |
| `pwd` | `pwd` | Cho biết đang đứng ở thư mục nào |
| `dir` | `ls` | Liệt kê file và thư mục ở đây |
| `cd tests` | `cd tests` | Đi vào thư mục `tests` |
| `cd ..` | `cd ..` | Lùi ra thư mục cha |
| `cd E:\ProjectAI` | `cd ~/ProjectAI` | Nhảy thẳng đến một thư mục |
| `mkdir tests` | `mkdir tests` | Tạo thư mục mới |

Trên Windows, chuyển sang ổ đĩa khác phải gõ tên ổ trước:

```powershell
E:
cd E:\ProjectAI
```

## Ba mẹo tiết kiệm rất nhiều thời gian

1. **Phím Tab tự hoàn thành.** Gõ `cd te` rồi bấm Tab, nó tự thành `cd tests`. Vừa nhanh vừa không sai chính tả.
2. **Phím mũi tên lên** lấy lại lệnh vừa gõ. Khi chạy `pytest` hàng chục lần, bạn chỉ cần mũi tên lên rồi Enter.
3. **Kéo thả thư mục vào cửa sổ Terminal** — đường dẫn đầy đủ tự được dán vào. Gõ `cd ` (có dấu cách) rồi kéo thư mục vào là xong.

Thư mục có dấu cách trong tên thì phải bọc ngoặc kép: `cd "E:\Project AI"`. Đây là lý do nên đặt tên thư mục không dấu, không khoảng trắng.

## Vì sao "đứng đúng thư mục" lại quan trọng

Khi bạn gõ `python bai0.py`, máy tìm file `bai0.py` **ngay tại thư mục bạn đang đứng**. Đứng sai chỗ thì báo:

```text
python: can't open file 'bai0.py': [Errno 2] No such file or directory
```

Lỗi này không phải do code sai. Gõ `dir` (hoặc `ls`) xem file có ở đó không, không có thì `cd` sang đúng thư mục rồi chạy lại.

Về sau ở Bài 17, lỗi `ModuleNotFoundError: No module named 'pages'` cũng chính là lỗi này — bạn đứng trong `tests/` thay vì đứng ở thư mục gốc project.

## Dừng một chương trình đang chạy

Bấm `Ctrl + C`. Dùng khi chương trình lặp vô tận, hoặc khi test chạy quá lâu muốn dừng giữa chừng.

## Bài tập

1. Mở Terminal, gõ `pwd` xem đang ở đâu.
2. `cd` đến thư mục học tập của bạn, gõ `dir` (hoặc `ls`) để thấy file `bai0.py` đã tạo ở Bài 0.
3. Chạy `python bai0.py` từ Terminal.
4. `cd ..` lùi ra một cấp, chạy lại `python bai0.py` và đọc lỗi. Sau đó `cd` vào lại cho đúng.
5. Tạo thư mục `bai-tap` bằng `mkdir`, vào trong đó, rồi lùi ra.
6. Mở Terminal ngay trong VS Code bằng `` Ctrl + ` `` và gõ `pwd` để thấy nó tự ở đúng thư mục project.
</script>

<script type="text/markdown" data-id="bai-11b" data-nav="Bài 11B · HTML và DevTools (F12)">
# Bài 11B — HTML và DevTools cho tester

**Mục tiêu:** đọc được cấu trúc một trang web và tự tìm ra thông tin để viết locator. Không cần biết làm web, chỉ cần đọc hiểu. Bài này bắt buộc trước khi vào Bài 12.

## Trang web được tạo từ đâu

Mọi trang web đều là một file HTML — văn bản gồm các **thẻ** lồng nhau. Trình duyệt đọc file đó và vẽ ra giao diện bạn nhìn thấy.

```html
<form id="login-form">
  <label for="user-name">Tên đăng nhập</label>
  <input id="user-name" class="form_input" placeholder="Username" type="text">
  <button id="login-button" class="btn btn_primary">Login</button>
</form>
```

Đọc đoạn trên:

| Phần | Tên gọi | Ý nghĩa |
| --- | --- | --- |
| `<input ...>` | Thẻ (tag) | Loại phần tử — ô nhập, nút, link... |
| `id="user-name"` | Thuộc tính id | Tên riêng, **duy nhất** trên cả trang |
| `class="form_input"` | Thuộc tính class | Nhóm để tô kiểu, **nhiều phần tử dùng chung được** |
| `placeholder="Username"` | Thuộc tính | Chữ mờ hiện trong ô khi chưa nhập |
| `<label for="user-name">` | Nhãn | Chữ mô tả ô nhập, gắn với ô qua `for` |
| `Login` | Nội dung | Chữ hiển thị trên nút |

Mỗi thuộc tính này tương ứng với một cách tìm element ở Bài 12:

| Thấy trong HTML | Locator dùng ở Bài 12 |
| --- | --- |
| `<button>Login</button>` | `get_by_role("button", name="Login")` |
| `<label for="user-name">Tên đăng nhập</label>` | `get_by_label("Tên đăng nhập")` |
| `placeholder="Username"` | `get_by_placeholder("Username")` |
| `id="login-button"` | `locator("#login-button")` |
| `class="btn_primary"` | `locator(".btn_primary")` |
| `data-test="error"` | `get_by_test_id("error")` hoặc `locator("[data-test='error']")` |

## Mở DevTools — công cụ bắt buộc phải biết

Bấm **F12** (hoặc chuột phải vào phần tử → **Inspect**). Một khung mở ra bên cạnh trang.

**Cách dùng nhanh nhất:** bấm biểu tượng mũi tên ở góc trái trên của DevTools (hoặc `Ctrl + Shift + C`), rồi bấm vào ô hoặc nút trên trang. DevTools sẽ nhảy thẳng đến đoạn HTML của phần tử đó.

## 3 tab bạn sẽ dùng

| Tab | Xem gì | Dùng khi |
| --- | --- | --- |
| **Elements** | Cấu trúc HTML của trang | Tìm id, class, placeholder để viết locator |
| **Console** | Lỗi JavaScript và nơi gõ lệnh thử | Kiểm tra selector, xem trang có lỗi ngầm không |
| **Network** | Các request gửi đi và phản hồi | Xem API trả về gì, request nào lỗi, trang chậy do đâu |

## Thử selector trong Console trước khi viết code

Đây là mẹo tiết kiệm nhiều thời gian nhất. Thay vì viết code rồi chạy test xem có tìm thấy element không, hãy thử ngay trong Console:

```javascript
document.querySelectorAll("#user-name")        // tim theo id
document.querySelectorAll(".btn_primary")      // tim theo class
document.querySelectorAll("[data-test='error']")
```

Kết quả trả về cho biết tìm được bao nhiêu phần tử:

| Kết quả | Nghĩa là |
| --- | --- |
| `NodeList(1)` | Tìm đúng 1 — selector tốt |
| `NodeList(0)` | Không tìm thấy — selector sai |
| `NodeList(6)` | Tìm được 6 — sẽ gây lỗi `strict mode violation` ở Bài 12 |

## CSS selector cơ bản

| Viết | Tìm gì | Ví dụ |
| --- | --- | --- |
| `#ten` | Phần tử có id đó | `#login-button` |
| `.ten` | Mọi phần tử có class đó | `.inventory_item` |
| `tag` | Mọi thẻ loại đó | `button` |
| `[thuoc_tinh='gia_tri']` | Theo thuộc tính bất kỳ | `[data-test='error']` |
| `cha con` | `con` nằm bên trong `cha` | `#login-form button` |
| `cha > con` | `con` là con trực tiếp | `div.card > button` |

Một phần tử có nhiều class thì viết liền: `class="btn btn_primary"` → `.btn.btn_primary`.

## Dấu hiệu một locator sẽ sớm hỏng

Khi nhìn HTML, hãy đánh giá xem thuộc tính đó có bền không:

| Thấy | Đánh giá |
| --- | --- |
| `data-test`, `data-testid` | Tốt nhất — dev đặt riêng cho test, hầu như không đổi |
| `id` có nghĩa (`login-button`) | Tốt |
| Chữ hiển thị trên nút | Tốt, trừ khi trang đa ngôn ngữ |
| `class` mô tả kiểu dáng (`btn-blue-lg`) | Yếu — đổi màu nút là hỏng |
| `id` sinh tự động (`ext-gen-1047`) | Rất yếu — đổi mỗi lần tải trang |
| Vị trí (`div:nth-child(3)`) | Rất yếu — thêm một khối là lệch hết |

Nếu trang bạn test toàn id sinh tự động, hãy đề nghị dev thêm `data-testid`. Đây là đề nghị hợp lý và phổ biến trong các nhóm có automation.

## Xem request trong tab Network

Bấm tab **Network**, tải lại trang, bạn thấy danh sách request. Bấm vào một dòng để xem:

- **Status** — 200 là thành công, 404 không tìm thấy, 500 lỗi server
- **Payload** — dữ liệu gửi đi
- **Response** — dữ liệu nhận về

Kỹ năng này dùng ở hai chỗ: viết bug report chính xác hơn (kèm status code thay vì chỉ nói "không chạy"), và dựng kịch bản JMeter ở Bài 22 (bạn cần biết API nào được gọi).

## Bài tập

Mở `https://www.saucedemo.com` và bấm F12:

1. Dùng Inspect bấm vào ô Username. Ghi lại `id`, `class`, `placeholder` của nó.
2. Làm tương tự với ô Password và nút Login.
3. Trong Console, chạy `document.querySelectorAll("#user-name")` — phải ra `NodeList(1)`.
4. Đăng nhập sai mật khẩu, dùng Inspect xem thông báo lỗi dùng thuộc tính gì.
5. Đăng nhập đúng, chạy `document.querySelectorAll(".inventory_item")` và đối chiếu con số với số sản phẩm trên trang.
6. Mở tab Network, bấm Login và xem có request nào được gửi đi không.
</script>

<script type="text/markdown" data-id="ms-0" data-nav="Bài 0 · Mobile automation và Maestro">
# Bài 0 — Mobile automation là gì, Maestro là gì

**Mục tiêu:** hiểu mình sắp học cái gì và vì sao khoá này không cần biết lập trình.

## Test app điện thoại khác test web ở đâu

| | Web | Mobile app |
| --- | --- | --- |
| Chạy ở đâu | Trình duyệt | Máy thật hoặc máy ảo (emulator) |
| Phần tử gọi là | Element HTML | View của Android / iOS |
| Cách tìm phần tử | id, class, text | id, text, accessibility label |
| Khó hơn ở chỗ | — | Phải dựng máy ảo, app cài đặt mỗi lần, thao tác vuốt chạm |

Kỹ năng test của bạn không đổi — vẫn là phân tích test case, dữ liệu biên, luồng âm. Chỉ công cụ thực thi là khác.

## Maestro là gì

Maestro là công cụ tự động hoá app mobile, điều khiển app bằng **file YAML** thay vì bằng code. Một kịch bản trông như thế này:

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp
- tapOn: "Login"
- inputText: "bob@example.com"
- tapOn: "Login"
- assertVisible: "Products"
```

Đọc được ngay cả khi chưa từng lập trình. Đó là lý do khoá này xếp trước khoá Appium.

## Maestro khác Appium thế nào

| | Maestro | Appium |
| --- | --- | --- |
| Viết bằng | YAML (file cấu hình) | Code: Python, Java, JavaScript... |
| Học mất | 1–2 tuần | 4–6 tuần |
| Chờ element | Tự động, có sẵn | Phải tự viết wait |
| Một test đăng nhập | ~6 dòng | ~40 dòng |
| Logic phức tạp | Hạn chế, cần JavaScript | Làm được mọi thứ |
| Kết nối database, đọc Excel | Không | Có |
| Số tin tuyển dụng ở VN | Ít, đang tăng | Nhiều |

Cách nhìn đúng: Maestro cho **kiểm thử luồng giao diện nhanh**, Appium cho **framework lớn cần logic phức tạp**. Nhiều nhóm dùng cả hai.

## Khi nào doanh nghiệp chọn Maestro

- Cần có test tự động trong vài ngày, không có thời gian dựng framework.
- Nhóm QA chưa ai biết lập trình.
- App thay đổi giao diện liên tục, viết lại kịch bản phải nhanh.
- Chỉ cần kiểm thử luồng chính (smoke test) sau mỗi bản build.

Doanh nghiệp chọn Appium khi cần ghép test với dữ liệu từ database, chạy trên hàng chục thiết bị thật, hoặc đã có sẵn framework Java/Python.

## Bạn cần chuẩn bị gì

| Thứ | Vì sao cần |
| --- | --- |
| Máy tính RAM từ 8 GB | Máy ảo Android ngốn khoảng 2–4 GB |
| Khoảng 15 GB trống | Android Studio và máy ảo |
| Java (JDK 11 trở lên) | Maestro chạy trên nền Java |
| File `.apk` để luyện | Khoá này dùng app mẫu Sauce Labs My Demo App |

Bài 1 sẽ cài từng thứ một.

## Lộ trình khoá này

| Phần | Bài | Bạn làm được gì |
| --- | --- | --- |
| 1 | 0–3 | Cài đặt xong, chạy flow đầu tiên |
| 2 | 4–8 | Viết được flow cho mọi thao tác thường gặp |
| 3 | 9–11 | Tổ chức bộ test và hoàn thành dự án |

## Bài tập

1. Viết ra 5 luồng chính của một app bạn hay dùng (ví dụ Shopee: mở app, tìm sản phẩm, xem chi tiết, thêm giỏ, đặt hàng).
2. Với mỗi luồng, viết bằng lời các bước thao tác. Đây chính là bản nháp của flow Maestro bạn sẽ viết ở Bài 2.
3. Kiểm tra máy tính: còn bao nhiêu GB trống, RAM bao nhiêu.
</script>

<script type="text/markdown" data-id="ms-1" data-nav="Bài 1 · Cài đặt máy ảo và Maestro">
# Bài 1 — Cài Android Studio, máy ảo và Maestro

**Mục tiêu:** có một máy ảo Android chạy được và lệnh `maestro` hoạt động. Đây là bài dài nhất khoá, làm chậm và đúng thứ tự.

## 1. Cài Java (JDK 17)

Maestro chạy trên nền Java. Tải Temurin JDK tại `adoptium.net`, cài xong kiểm tra:

```bash
java -version
```

Thấy `openjdk version "17..."` là được.

## 2. Cài Android Studio

Tải tại `developer.android.com/studio`. Khi cài, giữ nguyên các lựa chọn mặc định — bộ cài sẽ tự tải Android SDK.

Mở Android Studio lần đầu, nó chạy Setup Wizard tải thêm khoảng 2–3 GB. Để nó chạy xong.

## 3. Tạo máy ảo Android

Trong Android Studio: **More Actions** → **Virtual Device Manager** → **Create Device**.

| Bước | Chọn gì |
| --- | --- |
| Chọn thiết bị | Pixel 6 (hoặc Pixel bất kỳ) |
| Chọn System Image | Bản có API 33 hoặc 34, bấm Download |
| Đặt tên | Để mặc định |

Bấm **Finish**, rồi bấm nút ▶ để khởi động. Lần đầu khởi động mất 2–5 phút. Khi thấy màn hình chính Android là thành công.

Máy ảo không lên: vào BIOS bật ảo hoá (Intel VT-x hoặc AMD-V). Đây là nguyên nhân phổ biến nhất.

## 4. Khai báo ANDROID_HOME

Maestro cần biết Android SDK nằm ở đâu.

Đường dẫn SDK xem trong Android Studio: **Settings** → **Languages & Frameworks** → **Android SDK**, dòng *Android SDK Location*. Thường là:

```text
Windows: C:\Users\<ten-ban>\AppData\Local\Android\Sdk
macOS:   /Users/<ten-ban>/Library/Android/sdk
```

**Windows** — mở PowerShell với quyền Administrator:

```powershell
[Environment]::SetEnvironmentVariable("ANDROID_HOME", "$env:LOCALAPPDATA\Android\Sdk", "User")
```

**macOS** — thêm vào `~/.zshrc`:

```bash
export ANDROID_HOME=$HOME/Library/Android/sdk
export PATH=$PATH:$ANDROID_HOME/platform-tools
```

Đóng Terminal, mở lại, kiểm tra:

```bash
adb devices
```

Máy ảo đang chạy thì hiện ra một dòng kiểu `emulator-5554   device`. Đây là xác nhận quan trọng nhất của bài này.

## 5. Cài Maestro

**macOS / Linux:**

```bash
curl -Ls "https://get.maestro.mobile.dev" | bash
```

**Windows:** Maestro chạy qua WSL (Windows Subsystem for Linux). Mở PowerShell quyền Administrator:

```powershell
wsl --install
```

Khởi động lại máy, mở Ubuntu từ Start menu, tạo user, rồi chạy lệnh `curl` ở trên trong cửa sổ Ubuntu.

Kiểm tra:

```bash
maestro --version
```

Lệnh `maestro` không nhận: đóng Terminal mở lại, hoặc thêm `export PATH=$PATH:$HOME/.maestro/bin` vào `~/.zshrc` / `~/.bashrc`.

## 6. Cài app mẫu để luyện

Khoá này dùng **Sauce Labs My Demo App** — app thương mại điện tử mẫu, miễn phí. Tải file `.apk` từ trang GitHub của Sauce Labs (`saucelabs/my-demo-app-rn`, mục Releases).

Cài lên máy ảo đang chạy:

```bash
adb install duong-dan/den/file.apk
```

Thấy `Success` là xong. Mở app trên máy ảo xem thử.

Lấy `appId` của app (dùng ở Bài 2) — mở app trên máy ảo rồi chạy:

```bash
adb shell dumpsys window | grep -i mCurrentFocus
```

Windows dùng `findstr` thay cho `grep`. Kết quả hiện tên package, ví dụ `com.saucelabs.mydemoapp.rn`. Ghi lại.

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `adb: command not found` | Chưa thêm `platform-tools` vào PATH | Xem lại bước 4 |
| `adb devices` không thấy gì | Máy ảo chưa khởi động xong | Đợi máy ảo lên màn hình chính rồi chạy lại |
| `maestro: command not found` | PATH chưa có `~/.maestro/bin` | Đóng mở lại Terminal, hoặc thêm vào `~/.bashrc` |
| Máy ảo đứng ở logo Android | Ảo hoá chưa bật | Bật VT-x / AMD-V trong BIOS |
| Trên Windows, WSL không thấy `adb devices` | WSL và Windows là hai môi trường | Cài `adb` trong WSL, hoặc dùng `maestro` trỏ sang host — xem tài liệu Maestro cho Windows |

## Bài tập

1. Chạy `java -version`, `adb devices`, `maestro --version` — cả ba phải ra kết quả.
2. Khởi động máy ảo và mở app mẫu bằng tay, bấm thử vài màn hình cho quen.
3. Ghi lại `appId` của app mẫu vào một file ghi chú.
</script>

<script type="text/markdown" data-id="ms-2" data-nav="Bài 2 · Flow đầu tiên">
# Bài 2 — File flow đầu tiên

**Mục tiêu:** viết và chạy được một flow Maestro tự mở app, bấm nút và kiểm tra kết quả.

## Tạo file flow

Tạo thư mục `maestro-demo`, bên trong tạo file `dang-nhap.yaml`:

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp
- assertVisible: "Products"
```

Chạy:

```bash
maestro test dang-nhap.yaml
```

Máy ảo sẽ tự mở app. Terminal in ra từng bước kèm dấu tích xanh.

## Cấu trúc một file flow

```yaml
appId: com.saucelabs.mydemoapp.rn     # app nào
---                                    # ba gạch ngang ngăn phần khai báo với các bước
- launchApp                            # từ đây trở xuống là các bước, mỗi bước một dấu -
- tapOn: "Login"
```

| Phần | Vai trò |
| --- | --- |
| `appId` | Package của app, lấy bằng `adb shell dumpsys window` ở Bài 1 |
| `---` | Bắt buộc. Ngăn phần khai báo với danh sách bước |
| `- lệnh` | Mỗi dòng là một thao tác, chạy từ trên xuống |

## 5 lệnh dùng nhiều nhất

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp                      # mở app
- tapOn: "Login"                 # bấm vào chỗ có chữ Login
- inputText: "bob@example.com"   # gõ chữ vào ô đang được chọn
- assertVisible: "Products"      # kiểm tra màn hình có chữ Products
- takeScreenshot: ket-qua        # chụp màn hình, lưu thành ket-qua.png
```

`assertVisible` chính là **assertion** — thứ biến một kịch bản bấm nút thành một test case thật. Flow không có `assertVisible` thì chỉ chứng minh app không crash, không chứng minh app chạy đúng.

## Flow đăng nhập hoàn chỉnh

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true          # xoá dữ liệu cũ, mỗi lần chạy như cài mới
- tapOn:
    id: "open menu"
- tapOn: "Log In"
- tapOn:
    id: "Username input field"
- inputText: "bob@example.com"
- tapOn:
    id: "Password input field"
- inputText: "10203040"
- hideKeyboard
- tapOn: "Login"
- assertVisible: "Products"
- takeScreenshot: dang-nhap-thanh-cong
```

Tên và id trong app mẫu có thể khác chút tuỳ phiên bản. Bài 4 sẽ chỉ cách tự tìm đúng tên bằng Maestro Studio — đừng gõ mò.

`clearState: true` rất quan trọng: nó đảm bảo mỗi lần chạy app đều ở trạng thái sạch. Thiếu nó, lần chạy thứ hai app vẫn còn đăng nhập sẵn và flow sẽ fail.

## Đọc kết quả chạy

```text
 ║  > Flow: dang-nhap
 ║
 ║    ✅  Launch app "com.saucelabs.mydemoapp.rn"
 ║    ✅  Tap on "Log In"
 ║    ❌  Assert that "Products" is visible
```

Dấu ❌ chỉ đúng dòng lỗi. Maestro cũng tự chụp màn hình lúc fail, lưu trong thư mục `~/.maestro/tests/<ngày-giờ>/`.

## Chạy nhiều flow cùng lúc

Cho các file vào một thư mục rồi trỏ Maestro vào thư mục đó:

```bash
maestro test flows/
```

Maestro chạy lần lượt từng file `.yaml` trong đó.

## Bài tập

1. Viết flow mở app và kiểm tra màn hình đầu tiên hiển thị đúng, chạy cho ra dấu tích xanh.
2. Thêm `takeScreenshot` và tìm file ảnh vừa tạo.
3. Cố tình sửa `assertVisible` thành một chữ không có trong app, chạy lại và đọc thông báo lỗi.
4. Viết flow đăng nhập theo mẫu trên (chưa đúng id cũng không sao, Bài 4 sẽ sửa).
</script>

<script type="text/markdown" data-id="ms-3" data-nav="Bài 3 · Cú pháp YAML">
# Bài 3 — Cú pháp YAML cho người chưa biết code

**Mục tiêu:** hiểu đủ YAML để không bị lỗi cú pháp. YAML không phải ngôn ngữ lập trình — nó chỉ là cách ghi dữ liệu có thụt dòng.

## 4 quy tắc của YAML

**1. Dấu hai chấm tạo cặp khoá — giá trị**

```yaml
appId: com.example.app
```

Bên trái `:` là tên, bên phải là giá trị. **Luôn có dấu cách sau dấu hai chấm.**

**2. Dấu gạch ngang tạo danh sách**

```yaml
- launchApp
- tapOn: "Login"
- assertVisible: "Products"
```

Mỗi dòng bắt đầu bằng `- ` là một mục trong danh sách. Maestro chạy từ trên xuống.

**3. Thụt dòng thể hiện quan hệ cha — con**

```yaml
- tapOn:
    id: "login_button"
    index: 0
```

`id` và `index` thụt vào trong, nghĩa là chúng thuộc về `tapOn`. Thụt **2 hoặc 4 dấu cách đều được, nhưng phải thống nhất trong cả file**.

**Tuyệt đối không dùng phím Tab để thụt dòng.** YAML chỉ chấp nhận dấu cách. Đây là lỗi số một của người mới.

**4. Dấu nháy cho chuỗi**

```yaml
- tapOn: "Đăng nhập"      # nên có nháy
- tapOn: Đăng nhập        # chạy được nhưng dễ lỗi
- tapOn: "12345"          # bắt buộc có nháy, nếu không YAML hiểu là số
```

Quy tắc an toàn: chuỗi thì luôn bọc nháy kép.

## Hai cách viết một lệnh

Maestro cho phép viết ngắn khi chỉ cần một thông tin:

```yaml
- tapOn: "Login"
```

Và viết dài khi cần nhiều thông tin:

```yaml
- tapOn:
    text: "Login"
    index: 1
    optional: true
```

Hai cách tương đương. Viết ngắn cho thao tác đơn giản, viết dài khi cần chỉ rõ.

## Chú thích

```yaml
# Đây là chú thích, Maestro bỏ qua
- tapOn: "Login"    # chú thích cuối dòng cũng được
```

Dùng chú thích ghi lại ý nghĩa nghiệp vụ của từng nhóm bước. File flow đọc lại sau 2 tháng sẽ cảm ơn bạn.

## Lỗi cú pháp hay gặp

| Viết sai | Lỗi | Viết đúng |
| --- | --- | --- |
| `appId:com.example` | Thiếu dấu cách sau `:` | `appId: com.example` |
| Thụt dòng bằng Tab | `could not find expected ':'` | Thụt bằng dấu cách |
| Trộn 2 và 4 dấu cách trong một file | Lỗi thụt dòng | Chọn một kiểu, dùng suốt file |
| Thiếu dòng `---` | Maestro không thấy bước nào | Thêm `---` sau `appId` |
| `- tapOn: "Login` | Thiếu nháy đóng | `- tapOn: "Login"` |

## Mẹo: để VS Code bắt lỗi giúp bạn

Mở thư mục flow bằng VS Code và cài extension **YAML** của Red Hat. Sai cú pháp sẽ có gạch chân đỏ ngay khi gõ, không phải chạy mới biết.

Trong VS Code, bật hiển thị khoảng trắng để thấy rõ thụt dòng: **View** → **Appearance** → **Render Whitespace**.

## Bài tập

1. Viết lại flow Bài 2 bằng dạng viết dài (`tapOn:` rồi xuống dòng `text:`).
2. Cố tình thụt dòng bằng Tab, chạy và đọc lỗi.
3. Cố tình bỏ dòng `---`, chạy và xem Maestro báo gì.
4. Thêm chú thích cho từng nhóm bước trong flow đăng nhập của bạn.
</script>

<script type="text/markdown" data-id="ms-4" data-nav="Bài 4 · Maestro Studio">
# Bài 4 — Maestro Studio

**Mục tiêu:** ngừng đoán tên element. Maestro Studio cho bạn thấy app trên trình duyệt, bấm vào đâu thì nó sinh sẵn câu lệnh cho chỗ đó.

## Mở Studio

Máy ảo đang chạy và app đã mở, gõ:

```bash
maestro studio
```

Trình duyệt tự mở ở `http://localhost:9999`. Bên trái là màn hình app, bên phải là khung lệnh.

## Cách dùng

1. Bấm vào một phần tử trên ảnh app bên trái.
2. Bên phải hiện ra câu lệnh Maestro tương ứng, ví dụ `tapOn: "Login"`.
3. Bấm **Copy** và dán vào file `.yaml` của bạn.

Studio cũng cho biết phần tử đó có những thuộc tính gì: `text`, `id`, `accessibilityText`, `bounds`. Đây là thông tin bạn cần để viết locator bền ở Bài 5.

## Chạy thử lệnh ngay trong Studio

Khung bên phải có ô nhập lệnh. Gõ một lệnh rồi bấm **Run** — nó chạy ngay trên máy ảo mà không cần tạo file. Rất hợp để thử xem `tapOn` có trúng không trước khi đưa vào flow.

Cách làm việc hiệu quả:

| Bước | Làm ở đâu |
| --- | --- |
| Tìm element, thử lệnh | Maestro Studio |
| Ghép các bước thành kịch bản | File `.yaml` trong VS Code |
| Chạy cả flow | Terminal: `maestro test` |

## Xem cây phần tử

Studio hiển thị cấu trúc phần tử của màn hình hiện tại. Phần này tương đương với DevTools F12 khi test web: nó cho bạn biết app được dựng từ những view nào.

Điều cần chú ý khi nhìn cây phần tử:

- Phần tử **có `id`** — tốt nhất, dùng được lâu dài.
- Phần tử chỉ có **`text`** — dùng được, nhưng app đổi ngôn ngữ hoặc đổi chữ là hỏng.
- Phần tử **không có gì** ngoài vị trí — báo dev thêm `testID`, đừng cố viết locator theo toạ độ.

## Khi element không có id

App React Native có thể gắn `testID`, app Android native gắn `resource-id` hoặc `contentDescription`. Cả ba đều hiện lên trong Studio.

Nếu một nút quan trọng không có gì để bám vào, đây là lúc đề nghị dev thêm. Câu đề nghị cụ thể:

> Nút Thanh toán ở màn hình giỏ hàng hiện không có `testID`. Nhờ team thêm `testID="checkout_button"` để automation test bám vào được, tránh phải dùng text (sẽ hỏng khi đổi nội dung).

Đây là đề nghị bình thường trong các nhóm có automation, không phải đòi hỏi quá đáng.

## Bài tập

1. Mở Maestro Studio với app mẫu, bấm vào 5 phần tử khác nhau và ghi lại lệnh Studio sinh ra.
2. Dùng ô Run thử lệnh `tapOn` cho nút đăng nhập, xem máy ảo phản ứng.
3. Tìm một phần tử có `id` và một phần tử chỉ có `text`, ghi lại khác biệt.
4. Viết lại flow đăng nhập ở Bài 2 bằng đúng id lấy từ Studio, chạy cho ra toàn dấu tích xanh.
</script>

<script type="text/markdown" data-id="ms-5" data-nav="Bài 5 · Tìm element">
# Bài 5 — Tìm element trong Maestro

**Mục tiêu:** chỉ đúng phần tử cần thao tác, kể cả khi màn hình có nhiều phần tử giống nhau.

## 4 cách tìm

```yaml
- tapOn: "Login"                    # theo text hiển thị
- tapOn:
    id: "login_button"              # theo id / testID — bền nhất
- tapOn:
    text: "Add to cart"
    index: 2                        # cái thứ 3 trong các phần tử trùng (đếm từ 0)
- tapOn:
    text: "Sản phẩm.*"              # biểu thức chính quy
```

Thứ tự ưu tiên giống khoá web ở Bài 12: **id trước, text sau, vị trí là lựa chọn cuối.**

## Tìm theo quan hệ với phần tử khác

Màn hình danh sách sản phẩm có 6 nút "Add to cart" giống hệt nhau. Chỉ đúng nút của một sản phẩm cụ thể:

```yaml
- tapOn:
    text: "Add to cart"
    below: "Sauce Labs Backpack"
```

Các từ khoá quan hệ: `above`, `below`, `leftOf`, `rightOf`, `containsChild`, `childOf`.

```yaml
- tapOn:
    id: "remove_button"
    rightOf: "Sauce Labs Bike Light"
```

Cách này đọc gần giống tiếng Việt và bền hơn nhiều so với dùng `index`.

## Khi element chưa xuất hiện ngay

Maestro tự chờ phần tử trong vài giây trước khi báo lỗi, nên **không cần lệnh sleep**. Cần chờ lâu hơn thì khai rõ:

```yaml
- extendedWaitUntil:
    visible: "Đơn hàng đã đặt"
    timeout: 20000
```

Đơn vị là mili giây, `20000` là 20 giây. Dùng cho màn hình chờ xử lý như thanh toán.

## Phần tử có thể có hoặc không

Popup khuyến mãi, popup xin quyền — có lúc hiện có lúc không. Nếu để lệnh thường, flow sẽ fail khi popup không xuất hiện:

```yaml
- tapOn:
    text: "Để sau"
    optional: true
```

`optional: true` nghĩa là không thấy thì bỏ qua, chạy tiếp.

## Regex — khi nội dung thay đổi

Giá tiền, mã đơn hàng, ngày giờ thay đổi mỗi lần chạy. Dùng biểu thức chính quy:

```yaml
- assertVisible: "Tổng: [0-9.]+ ?đ"
- assertVisible: "Đơn hàng #[0-9]{6}"
```

| Ký hiệu | Khớp với |
| --- | --- |
| `.*` | Bất kỳ chuỗi nào |
| `[0-9]+` | Một hoặc nhiều chữ số |
| `[0-9]{6}` | Đúng 6 chữ số |
| `^Login$` | Đúng y hệt chữ Login |

## Locator bền và locator sớm hỏng

| Viết | Đánh giá |
| --- | --- |
| `id: "checkout_button"` | Tốt nhất |
| `text: "Thanh toán"` | Được, hỏng khi đổi chữ hoặc đổi ngôn ngữ |
| `text: "Add to cart"` + `below: "Tên sản phẩm"` | Tốt, diễn đạt đúng ý nghiệp vụ |
| `index: 3` | Yếu, thêm một mục là lệch |
| `point: 50%, 80%` (theo toạ độ) | Rất yếu, chỉ dùng khi hết cách |

## Bài tập

1. Trên màn hình danh sách sản phẩm, viết lệnh bấm "Add to cart" của đúng sản phẩm thứ hai bằng `below`.
2. Làm lại bài trên bằng `index`, so sánh hai cách khi bạn đổi thứ tự sắp xếp sản phẩm.
3. Viết `assertVisible` dùng regex để kiểm tra có dòng giá tiền trên màn hình.
4. Thêm một bước `optional: true` xử lý popup xin quyền thông báo của app.
</script>

<script type="text/markdown" data-id="ms-6" data-nav="Bài 6 · Nhập liệu">
# Bài 6 — Nhập liệu và bàn phím

**Mục tiêu:** điền form trong app, xử lý bàn phím che màn hình.

## Các lệnh nhập liệu

```yaml
- tapOn:
    id: "email_input"        # bấm vào ô trước
- inputText: "bob@example.com"   # rồi mới gõ
- eraseText                      # xoá hết chữ trong ô đang chọn
- eraseText: 5                   # xoá 5 ký tự cuối
- hideKeyboard                   # ẩn bàn phím
```

Thứ tự luôn là: **bấm vào ô → gõ chữ**. Gõ mà chưa bấm vào ô thì chữ không vào đâu cả.

## Vì sao phải hideKeyboard

Bàn phím ảo che mất nửa dưới màn hình. Nút "Đăng nhập" nằm dưới bàn phím thì `tapOn` sẽ không bấm được. Luôn `hideKeyboard` sau khi điền xong form:

```yaml
- tapOn:
    id: "password_input"
- inputText: "10203040"
- hideKeyboard
- tapOn: "Login"
```

## Dữ liệu ngẫu nhiên

Test đăng ký cần email mới mỗi lần chạy. Maestro có sẵn:

```yaml
- inputRandomEmail          # tự sinh email ngẫu nhiên
- inputRandomPersonName     # tên người ngẫu nhiên
- inputRandomNumber:
    length: 10              # số 10 chữ số
- inputRandomText:
    length: 8
```

Cần dùng lại giá trị vừa sinh ở bước sau thì dùng biến (Bài 9) thay vì các lệnh này.

## Phím đặc biệt

```yaml
- pressKey: Enter
- pressKey: Back            # nút back của Android
- pressKey: Home
- pressKey: Backspace
```

`pressKey: Back` rất hay dùng để thoát khỏi màn hình chi tiết về danh sách.

## Dropdown và lựa chọn

App mobile ít dùng dropdown kiểu web. Thường là bấm mở rồi bấm chọn:

```yaml
- tapOn:
    id: "sort_button"
- tapOn: "Giá: thấp đến cao"
```

## Form hoàn chỉnh — ví dụ đăng ký

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- tapOn:
    id: "open menu"
- tapOn: "Log In"
- tapOn: "Sign Up"

# Thong tin tai khoan
- tapOn:
    id: "Username input field"
- inputRandomEmail
- tapOn:
    id: "Password input field"
- inputText: "10203040"
- tapOn:
    id: "Confirm password input field"
- inputText: "10203040"
- hideKeyboard

- tapOn: "Sign Up"
- assertVisible: "Products"
- takeScreenshot: dang-ky-thanh-cong
```

## Kiểm tra ô nhập đã đúng chưa

```yaml
- assertVisible:
    id: "email_input"
    text: "bob@example.com"
```

Bước này hữu ích khi nghi ngờ `inputText` gõ thiếu ký tự — chuyện thỉnh thoảng xảy ra với ô có định dạng đặc biệt như số điện thoại hay thẻ ngân hàng.

## Bài tập

1. Viết flow điền form đăng nhập đầy đủ, có `hideKeyboard`, chạy thành công.
2. Viết flow đăng ký dùng `inputRandomEmail`, chạy 2 lần liên tiếp để thấy mỗi lần một email khác.
3. Thử bỏ `hideKeyboard` ở một flow có nút nằm dưới bàn phím, xem lỗi xảy ra thế nào.
4. Viết flow nhập sai định dạng email và kiểm tra app hiển thị thông báo lỗi.
</script>

<script type="text/markdown" data-id="ms-7" data-nav="Bài 7 · Cuộn và vuốt">
# Bài 7 — Cuộn, vuốt và điều hướng

**Mục tiêu:** thao tác với nội dung dài hơn một màn hình — danh sách sản phẩm, điều khoản sử dụng, giỏ hàng nhiều món.

## Cuộn cơ bản

```yaml
- scroll                    # cuộn xuống một đoạn
- scrollUntilVisible:
    element:
      text: "Thanh toán"
    direction: DOWN
```

`scrollUntilVisible` là lệnh bạn dùng nhiều nhất: cuộn cho đến khi thấy phần tử rồi dừng. Khác với `scroll` lặp nhiều lần, lệnh này không phụ thuộc kích thước màn hình, nên chạy đúng trên cả máy ảo lẫn máy thật.

Tuỳ chọn thêm:

```yaml
- scrollUntilVisible:
    element:
      id: "checkout_button"
    direction: DOWN
    timeout: 20000
    speed: 40               # 0-100, chậm lại cho app tải kịp
```

`direction` nhận `DOWN`, `UP`, `LEFT`, `RIGHT`.

## Vuốt

```yaml
- swipe:
    direction: LEFT         # vuốt sang trái, dùng cho banner, onboarding
- swipe:
    start: 50%, 80%
    end: 50%, 20%           # vuốt từ dưới lên trên
```

Dạng `start`/`end` dùng cho thao tác đặc biệt như kéo thanh trượt lọc giá.

## Vuốt trên một phần tử

Xoá món trong giỏ hàng bằng cách vuốt sang trái:

```yaml
- swipe:
    from:
      text: "Sauce Labs Backpack"
    direction: LEFT
- tapOn: "Delete"
```

## Nhấn giữ

```yaml
- longPressOn: "Sauce Labs Backpack"
- longPressOn:
    id: "product_item"
```

## Điều hướng giữa màn hình

```yaml
- back                      # quay lại màn hình trước
- pressKey: Home            # về màn hình chính điện thoại
- launchApp                 # mở lại app
- stopApp                   # tắt hẳn app
```

Lưu ý: `launchApp` khi app đang mở sẽ đưa app về màn hình đầu. Muốn app khởi động sạch hoàn toàn thì dùng `launchApp: clearState: true`.

## Ví dụ: tìm sản phẩm ở cuối danh sách và thêm vào giỏ

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      text: "Sauce Labs Onesie"
    direction: DOWN
- tapOn: "Sauce Labs Onesie"
- assertVisible: "Add To Cart"
- tapOn: "Add To Cart"
- tapOn:
    id: "cart badge"
- assertVisible: "Sauce Labs Onesie"
- takeScreenshot: gio-hang
```

## Lỗi hay gặp

| Hiện tượng | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| Cuộn mãi không thấy phần tử | Sai chữ, hoặc phần tử nằm trong khung cuộn khác | Kiểm tra lại bằng Maestro Studio |
| `scroll` chạy đúng trên máy ảo, sai trên máy thật | Màn hình khác kích thước | Đổi sang `scrollUntilVisible` |
| Vuốt không ăn | Vuốt quá nhanh | Thêm `speed: 30` |
| Bấm trúng phần tử sai sau khi cuộn | App chưa vẽ xong | Thêm `assertVisible` trước khi `tapOn` |

## Bài tập

1. Dùng `scrollUntilVisible` tìm sản phẩm cuối cùng trong danh sách và bấm vào nó.
2. Viết flow thêm 3 sản phẩm ở các vị trí khác nhau vào giỏ hàng.
3. Dùng `swipe` xoá một sản phẩm khỏi giỏ, kiểm tra số lượng giảm đúng.
4. Viết flow vào chi tiết sản phẩm rồi `back` về danh sách, kiểm tra đã về đúng màn hình.
</script>

<script type="text/markdown" data-id="ms-8" data-nav="Bài 8 · Assertion">
# Bài 8 — Assertion và ảnh chụp màn hình

**Mục tiêu:** viết kiểm tra đủ chặt. Đây là phần quyết định flow của bạn có phải là test thật hay chỉ là kịch bản bấm nút.

## Các lệnh kiểm tra

```yaml
- assertVisible: "Products"             # có hiển thị
- assertNotVisible: "Loading"           # không hiển thị
- assertVisible:
    id: "cart_badge"
    text: "3"                           # vừa đúng id vừa đúng nội dung
- assertTrue: ${output.tong > 0}        # kiểm tra biểu thức (Bài 10)
```

## Assertion chặt và assertion lỏng

| Viết | Vấn đề |
| --- | --- |
| `assertVisible: "Sản phẩm"` | Lỏng — màn hình nào cũng có chữ này thì không kiểm được gì |
| `assertVisible: "Đơn hàng đã đặt thành công"` | Chặt — chỉ đúng khi thực sự đặt hàng xong |
| `assertVisible: ".*"` | Vô nghĩa — luôn đúng |
| `assertVisible: id: "cart_badge", text: "3"` | Chặt — kiểm đúng số lượng |

Một assertion luôn đúng còn tệ hơn không có assertion, vì nó tạo cảm giác an toàn giả.

## Kiểm tra trạng thái không đổi

Sau khi xoá sản phẩm khỏi giỏ:

```yaml
- tapOn: "Remove Item"
- assertNotVisible: "Sauce Labs Backpack"
- assertVisible: "No Items"
```

Kiểm tra cả **cái mất đi** lẫn **cái xuất hiện**. Chỉ kiểm một vế thì dễ bỏ sót lỗi.

## Chụp màn hình

```yaml
- takeScreenshot: ten-file          # lưu ten-file.png cạnh file flow
- takeScreenshot: ket-qua/dang-nhap # lưu vào thư mục con
```

Chụp ở các mốc quan trọng: sau khi đăng nhập, sau khi đặt hàng, trước và sau một thao tác thay đổi dữ liệu. Ảnh này đính vào báo cáo test rất thuyết phục.

Khi flow fail, Maestro **tự động chụp** màn hình lúc lỗi và lưu trong `~/.maestro/tests/<ngày-giờ>/`. Bạn không cần tự thêm lệnh.

## Ghi video

```bash
maestro record flow.yaml
```

Sinh file video quá trình chạy. Dùng khi cần gửi dev xem lỗi tái hiện thế nào — nhanh hơn viết mười dòng mô tả.

## Flow test case hoàn chỉnh

```yaml
# TC_CART_003 - Xoa san pham khoi gio hang
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true

# Tien dieu kien: gio co 1 san pham
- tapOn: "Sauce Labs Backpack"
- tapOn: "Add To Cart"
- tapOn:
    id: "cart badge"
- assertVisible: "Sauce Labs Backpack"

# Thuc hien: xoa san pham
- tapOn: "Remove Item"

# Ket qua mong doi
- assertNotVisible: "Sauce Labs Backpack"
- assertVisible: "No Items"
- takeScreenshot: TC_CART_003
```

Cấu trúc này khớp đúng với test case bạn viết tay: tiền điều kiện, bước thực hiện, kết quả mong đợi. Dùng chú thích để đánh dấu ba phần đó.

## Bài tập

1. Viết flow kiểm tra số trên icon giỏ hàng tăng đúng sau khi thêm 2 sản phẩm.
2. Viết flow đăng nhập sai mật khẩu và `assertVisible` đúng thông báo lỗi của app.
3. Thêm `assertNotVisible` kiểm tra màn hình loading đã biến mất trước khi kiểm tra nội dung.
4. Chạy `maestro record` cho một flow và xem file video sinh ra.
</script>

<script type="text/markdown" data-id="ms-9" data-nav="Bài 9 · Subflow và biến">
# Bài 9 — Tái sử dụng: subflow và biến

**Mục tiêu:** không copy đi copy lại các bước đăng nhập ở 10 file flow. Đây là Page Object Model của thế giới Maestro.

## Vấn đề

Mười flow đều bắt đầu bằng 8 bước đăng nhập giống hệt nhau. App đổi id ô mật khẩu là bạn sửa 10 file.

## Subflow — tách phần dùng chung

Tạo file `dang-nhap.yaml`:

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- tapOn:
    id: "open menu"
- tapOn: "Log In"
- tapOn:
    id: "Username input field"
- inputText: "bob@example.com"
- tapOn:
    id: "Password input field"
- inputText: "10203040"
- hideKeyboard
- tapOn: "Login"
- assertVisible: "Products"
```

Gọi nó từ flow khác:

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- runFlow: dang-nhap.yaml      # goi lai 10 buoc o tren
- tapOn: "Sauce Labs Backpack"
- tapOn: "Add To Cart"
- assertVisible: "1"
```

Giờ app đổi id thì chỉ sửa một file.

## Biến — truyền dữ liệu vào subflow

Cùng một luồng đăng nhập nhưng nhiều tài khoản khác nhau:

`dang-nhap.yaml`:

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- tapOn:
    id: "Username input field"
- inputText: ${USERNAME}
- tapOn:
    id: "Password input field"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Login"
```

Gọi và truyền giá trị:

```yaml
- runFlow:
    file: dang-nhap.yaml
    env:
      USERNAME: "bob@example.com"
      PASSWORD: "10203040"
```

Cú pháp `${TEN_BIEN}` là cách Maestro chèn giá trị vào.

## Biến dùng chung cho cả flow

Khai báo ngay đầu file:

```yaml
appId: com.saucelabs.mydemoapp.rn
env:
  USERNAME: "bob@example.com"
  PASSWORD: "10203040"
  SAN_PHAM: "Sauce Labs Backpack"
---
- launchApp
- inputText: ${USERNAME}
- tapOn: ${SAN_PHAM}
```

## Truyền biến từ dòng lệnh

```bash
maestro test -e USERNAME=alice@example.com dang-nhap.yaml
```

Dùng khi cần chạy cùng một bộ test với tài khoản của môi trường staging và production mà không sửa file.

## Cấu trúc thư mục nên theo

```text
maestro/
├── flows/
│   ├── login/
│   │   ├── TC_LOGIN_001_dang-nhap-thanh-cong.yaml
│   │   └── TC_LOGIN_002_sai-mat-khau.yaml
│   ├── cart/
│   │   └── TC_CART_001_them-san-pham.yaml
│   └── checkout/
│       └── TC_CHECKOUT_001_dat-hang.yaml
├── subflows/
│   ├── dang-nhap.yaml
│   ├── them-vao-gio.yaml
│   └── dong-popup.yaml
└── README.md
```

Đặt tên file theo mã test case giúp đối chiếu với tài liệu test case bạn viết tay.

Chạy cả bộ:

```bash
maestro test flows/
```

Chạy một nhóm:

```bash
maestro test flows/login/
```

## Gắn nhãn để chạy theo nhóm

```yaml
appId: com.saucelabs.mydemoapp.rn
tags:
  - smoke
  - login
---
- launchApp
```

Chạy riêng nhóm smoke:

```bash
maestro test flows/ --include-tags smoke
maestro test flows/ --exclude-tags slow
```

Tương đương `@pytest.mark.smoke` ở khoá Playwright, Bài 16.

## Bài tập

1. Tách phần đăng nhập trong các flow của bạn thành `subflows/dang-nhap.yaml`.
2. Thêm biến `${USERNAME}`, `${PASSWORD}` và gọi subflow với 2 tài khoản khác nhau.
3. Sắp xếp lại thư mục theo mẫu trên, đặt tên file theo mã test case.
4. Gắn tag `smoke` cho 3 flow chính và chạy `maestro test flows/ --include-tags smoke`.
</script>

<script type="text/markdown" data-id="ms-10" data-nav="Bài 10 · Điều kiện, lặp, JavaScript">
# Bài 10 — Điều kiện, vòng lặp và JavaScript

**Mục tiêu:** xử lý những tình huống mà flow thẳng không làm được: popup lúc có lúc không, lặp một thao tác, lấy dữ liệu động.

## Chạy có điều kiện

```yaml
- runFlow:
    when:
      visible: "Popup khuyến mãi"
    commands:
      - tapOn: "Đóng"
```

Chỉ khi popup hiện thì mới bấm đóng. Không hiện thì bỏ qua, flow chạy tiếp.

Các điều kiện dùng được:

```yaml
    when:
      visible: "Chữ nào đó"
      notVisible: "Loading"
      true: ${output.soLuong > 0}
```

So với `optional: true` ở Bài 5: `optional` dùng cho **một lệnh**, `runFlow: when` dùng cho **một nhóm lệnh**.

## Lặp

```yaml
- repeat:
    times: 3
    commands:
      - tapOn: "Thêm"
      - assertVisible: "Đã thêm"
```

Lặp đến khi điều kiện thoả:

```yaml
- repeat:
    while:
      visible: "Xem thêm"
    commands:
      - tapOn: "Xem thêm"
```

Cẩn thận lặp vô tận: luôn có điều kiện dừng rõ ràng, hoặc dùng `times` thay cho `while` khi biết trước số lần.

## JavaScript — khi YAML không đủ

Maestro cho chạy vài dòng JavaScript để tính toán hoặc tạo dữ liệu động.

```yaml
- evalScript: ${output.email = 'test' + Date.now() + '@mail.com'}
- tapOn:
    id: "email_input"
- inputText: ${output.email}
- assertVisible: ${output.email}
```

`output` là nơi lưu giá trị để các bước sau dùng lại. Khác với `inputRandomEmail` ở Bài 6 — lệnh đó sinh email nhưng không cho bạn dùng lại giá trị đó.

Lấy chữ từ màn hình rồi kiểm tra:

```yaml
- copyTextFrom:
    id: "order_number"
- evalScript: ${output.maDon = maestro.copiedText}
- assertTrue: ${output.maDon.length == 6}
```

Tạo dữ liệu test:

```yaml
- evalScript: ${output.sdt = '09' + Math.floor(Math.random() * 100000000)}
- inputText: ${output.sdt}
```

Chỉ dùng JavaScript cho việc tạo và kiểm tra dữ liệu. Logic điều khiển luồng nên để ở YAML cho dễ đọc — người sau đọc flow của bạn có thể không biết lập trình.

## Chờ nâng cao

```yaml
- extendedWaitUntil:
    visible: "Đơn hàng đã đặt"
    timeout: 30000

- waitForAnimationToEnd:
    timeout: 5000
```

`waitForAnimationToEnd` hữu ích với app có hiệu ứng chuyển màn hình — chờ animation xong rồi mới thao tác, tránh bấm trượt.

## Ví dụ gộp: đặt hàng với mã đơn động

```yaml
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/dang-nhap.yaml
    env:
      USERNAME: "bob@example.com"
      PASSWORD: "10203040"

# Bo qua popup neu co
- runFlow:
    when:
      visible: "Cho phép thông báo"
    commands:
      - tapOn: "Để sau"

# Them 2 san pham
- repeat:
    times: 2
    commands:
      - tapOn:
          text: "Add To Cart"
          index: 0
      - back

- tapOn:
    id: "cart badge"
- assertVisible: "Proceed To Checkout"
- takeScreenshot: truoc-khi-thanh-toan
```

## Bài tập

1. Thêm xử lý popup xin quyền bằng `runFlow: when` vào flow đăng nhập.
2. Dùng `repeat` thêm 3 sản phẩm vào giỏ, kiểm tra badge hiển thị số 3.
3. Dùng `evalScript` sinh email động, đăng ký tài khoản và kiểm tra email đó hiển thị trong trang hồ sơ.
4. Viết flow dùng `extendedWaitUntil` chờ màn hình xác nhận đơn hàng.
</script>

**Mục tiêu:** có một repo mobile automation đưa được vào CV, chạy được bằng một lệnh.

## Danh sách flow cần viết

| --- | --- | --- | --- |
| 1 | Login | Đăng nhập đúng tài khoản | smoke |
| 2 | Login | Sai mật khẩu | regression |
| 3 | Login | Bỏ trống username | regression |
| 4 | Login | Đăng xuất | smoke |

| 10 | Cart | Thêm nhiều sản phẩm | regression |
| 11 | Cart | Xoá sản phẩm khỏi giỏ | regression |
| 12 | Cart | Giỏ trống khi chưa thêm gì | regression |

## Cấu trúc thư mục

```text
mydemoapp-maestro/
├── flows/
│   ├── login/
│   ├── catalog/
│   ├── cart/
│   └── checkout/
├── subflows/
│   ├── dang-nhap.yaml
│   ├── them-vao-gio.yaml
│   └── dong-popup.yaml
├── .github/workflows/maestro.yml
├── .gitignore
└── README.md
```

`.gitignore` nên có:

```text
*.png
.maestro/
```

## Yêu cầu kỹ thuật

- [ ] Mỗi flow có tên file theo mã test case: `TC_LOGIN_001_dang-nhap-thanh-cong.yaml`
- [ ] Mọi flow bắt đầu bằng `launchApp: clearState: true`
- [ ] Phần đăng nhập tách thành subflow, không copy lặp
- [ ] Mọi flow có ít nhất một `assertVisible` kiểm tra kết quả nghiệp vụ
- [ ] Không có flow nào dùng toạ độ tuyệt đối
- [ ] Gắn tag `smoke` cho 5 flow chính
- [ ] Có `takeScreenshot` ở mốc quan trọng
- [ ] Chạy được cả bộ bằng `maestro test flows/`
- [ ] README ghi rõ cách cài và cách chạy

## Chạy trên GitHub Actions

File `.github/workflows/maestro.yml`:

```yaml
name: Maestro Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Chay test tren may ao
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install app-release.apk
            maestro test flows/

      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: ~/.maestro/tests/
```

File `.apk` phải có trong repo hoặc tải về trong bước trước đó. Máy ảo trên CI chạy chậm hơn máy bạn, nên tăng `timeout` trong các lệnh chờ nếu test fail trên CI mà chạy tốt ở máy.

<script type="text/markdown" data-id="ja-0" data-nav="Bài 0 · Cài Java và IntelliJ">
# Bài 0 — Cài Java, IntelliJ và chương trình đầu tiên

**Mục tiêu:** máy có Java, có IntelliJ IDEA, và bạn chạy được một chương trình in ra dòng chữ. Khoá này không cần biết lập trình trước.

## Vì sao khoá này dùng Java

Phần lớn tin tuyển dụng Automation Tester ở Việt Nam, nhất là ở công ty outsource và product lớn, yêu cầu **Appium + Java + TestNG**. Học Java ở đây giúp CV của bạn khớp thẳng với JD.

Bạn chỉ học đúng phần Java cần cho automation — 6 bài, không học dàn trải.

## 1. Cài JDK 17

JDK là bộ công cụ để viết và chạy chương trình Java. Tải **Temurin JDK 17** tại `adoptium.net`, chọn đúng hệ điều hành, cài với lựa chọn mặc định.

Kiểm tra trong Terminal (Windows dùng PowerShell):

```bash
java -version
javac -version
```

Cả hai phải ra `17.x.x`. Báo `command not found` nghĩa là chưa vào PATH — cài lại và tick **Add to PATH** trong bộ cài.

## 2. Cài IntelliJ IDEA Community

Tải tại `jetbrains.com/idea/download`, chọn bản **Community Edition** (miễn phí, đủ dùng cho cả khoá). Cài mặc định.

IntelliJ là nơi bạn viết code Java, giống VS Code dùng cho Python. Nó tự gợi ý code và báo lỗi ngay khi gõ, rất hợp cho người mới.

## 3. Tạo project đầu tiên

Mở IntelliJ → **New Project**:

| Trường | Chọn |
| --- | --- |
| Name | `hoc-java` |
| Language | Java |
| Build system | **Maven** |
| JDK | 17 |

Bấm **Create**. IntelliJ tạo sẵn cấu trúc thư mục:

```text
hoc-java/
├── src/
│   └── main/
│       └── java/        ← code của bạn nằm ở đây
└── pom.xml              ← khai báo thư viện
```

**Maven** là công cụ quản lý thư viện của Java, tương đương `pip` + `requirements.txt` bên Python. File `pom.xml` chính là nơi khai báo thư viện, Bài 4 sẽ dùng đến.

## 4. Chương trình đầu tiên

Chuột phải vào `src/main/java` → **New** → **Java Class**, đặt tên `BaiTap1`.

```java
public class BaiTap1 {
    public static void main(String[] args) {
        System.out.println("Xin chào, tôi bắt đầu học automation test!");
        System.out.println("1 + 1 = " + (1 + 1));
    }
}
```

Bấm nút ▶ màu xanh bên trái dòng `public class`. Kết quả hiện ở khung Run phía dưới:

```text
Xin chào, tôi bắt đầu học automation test!
1 + 1 = 2
```

## Giải thích từng phần

| Phần | Nghĩa |
| --- | --- |
| `public class BaiTap1` | Mọi code Java đều nằm trong một class. Tên class phải **trùng tên file** |
| `public static void main(String[] args)` | Điểm bắt đầu chạy chương trình. Java luôn chạy từ đây |
| `System.out.println(...)` | In ra màn hình, tương đương `print()` của Python |
| Dấu `;` cuối dòng | **Bắt buộc** sau mỗi câu lệnh |
| Dấu `{ }` | Đánh dấu đầu và cuối một khối code |

So với Python: Java dùng `{ }` và `;` thay cho thụt lề. Thụt lề trong Java chỉ để dễ đọc, không bắt buộc — nhưng vẫn nên giữ cho gọn.

## Ba lỗi của người mới

| Thông báo lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `';' expected` | Quên dấu chấm phẩy | Thêm `;` cuối dòng |
| `class X is public, should be declared in a file named X.java` | Tên class khác tên file | Đổi một trong hai cho khớp |
| `cannot find symbol` | Gõ sai tên biến hoặc hàm | Java phân biệt hoa thường: `System` khác `system` |

IntelliJ gạch chân đỏ ngay khi gõ sai, đưa chuột vào xem gợi ý. Dùng tính năng này thay vì chạy rồi mới biết lỗi.

## Bài tập

1. In ra 3 dòng: tên bạn, vị trí muốn ứng tuyển, câu "Ngày 1/20".
2. Sửa `1 + 1` thành `7 * 6`, chạy lại.
3. Cố tình xoá một dấu `;`, chạy và đọc lỗi.
4. Đổi tên class thành `baitap1` (chữ thường) và xem IntelliJ báo gì.
</script>

<script type="text/markdown" data-id="ja-1" data-nav="Bài 1 · Biến và kiểu dữ liệu">
# Bài 1 — Biến và kiểu dữ liệu trong Java

**Mục tiêu:** lưu được dữ liệu vào biến và biết 5 kiểu dữ liệu dùng nhiều nhất.

## Khai báo biến

Khác Python, Java bắt buộc **khai báo kiểu dữ liệu trước tên biến**:

```java
String maTestCase = "TC_001";
int soBuoc = 5;
double diem = 9.5;
boolean daPass = true;
char xepLoai = 'A';

System.out.println(maTestCase);
System.out.println(soBuoc);
```

Ghi kiểu dữ liệu nghe phiền, nhưng đổi lại IntelliJ bắt lỗi ngay khi bạn gán sai kiểu, trước cả khi chạy.

## 5 kiểu dữ liệu cần nắm

| Kiểu | Lưu gì | Ví dụ | Dùng trong test |
| --- | --- | --- | --- |
| `String` | Chuỗi chữ | `"TC_001"` | Tên, URL, username, text trên app |
| `int` | Số nguyên | `5` | Số lượng sản phẩm, số bước |
| `double` | Số thực | `9.5` | Giá tiền, thời gian chạy |
| `boolean` | Đúng/sai | `true`, `false` | Element có hiển thị không |
| `char` | Một ký tự | `'A'` | Ít dùng |

`String` viết hoa chữ S, còn `int`, `double`, `boolean`, `char` viết thường hết. Đây là qui ước của Java, gõ sai là lỗi.

## Quy tắc đặt tên

```java
String tenDangNhap = "admin";     // camelCase — đúng chuẩn Java
int soLuongSanPham = 6;
boolean daDangNhap = false;
```

Java dùng **camelCase**: từ đầu viết thường, các từ sau viết hoa chữ cái đầu. Khác Python dùng `ten_dang_nhap`. Tên class thì viết hoa chữ đầu: `LoginScreen`.

## Hằng số

Giá trị không đổi trong suốt chương trình:

```java
final String URL_APP = "com.saucelabs.mydemoapp.rn";
final int TIMEOUT = 15;
```

`final` nghĩa là gán một lần, sửa sẽ báo lỗi. Tên hằng viết hoa hết, nối bằng `_`. Về sau locator và timeout đều khai báo kiểu này.

## Ép kiểu và chuyển kiểu

```java
int so = 10;
String chuoi = String.valueOf(so);      // số sang chuỗi: "10"
int lai = Integer.parseInt("25");       // chuỗi sang số: 25
double thuc = Double.parseDouble("9.5");

System.out.println("Tổng: " + so);      // dấu + nối chuỗi với số
```

Dấu `+` vừa là phép cộng vừa là phép nối chuỗi. Khi một bên là `String`, Java tự chuyển bên kia thành chuỗi:

```java
System.out.println(1 + 2 + " sản phẩm");    // 3 sản phẩm
System.out.println("Có " + 1 + 2);          // Có 12  (chú ý!)
```

Dòng thứ hai ra `Có 12` vì Java đọc từ trái sang: `"Có " + 1` thành `"Có 1"`, rồi nối tiếp `2`. Muốn cộng trước thì bọc ngoặc: `"Có " + (1 + 2)`.

## var — để Java tự đoán kiểu

Java 10 trở lên cho phép:

```java
var maTC = "TC_001";       // Java hiểu đây là String
var soBuoc = 5;            // int
```

Dùng được nhưng khoá này vẫn ghi rõ kiểu, vì đọc code rõ ràng hơn và JD thường yêu cầu hiểu kiểu dữ liệu.

## Nhận dữ liệu từ người dùng

```java
import java.util.Scanner;

public class BaiTap2 {
    public static void main(String[] args) {
        Scanner nhap = new Scanner(System.in);

        System.out.print("Tên bạn: ");
        String ten = nhap.nextLine();

        System.out.print("Tuổi: ");
        int tuoi = nhap.nextInt();

        System.out.println("Chào " + ten + ", sang năm bạn " + (tuoi + 1) + " tuổi");
        nhap.close();
    }
}
```

`nextLine()` đọc cả dòng chữ, `nextInt()` đọc số nguyên. Dòng `import` phải nằm trên cùng file.

## Lỗi hay gặp

| Lỗi | Nghĩa | Cách sửa |
| --- | --- | --- |
| `incompatible types: String cannot be converted to int` | Gán chuỗi vào biến số | Dùng `Integer.parseInt()` |
| `cannot find symbol` | Sai tên biến, hoặc dùng biến chưa khai báo | Kiểm tra chính tả và chữ hoa thường |
| `variable X might not have been initialized` | Khai báo mà chưa gán giá trị | Gán giá trị trước khi dùng |
| `NumberFormatException` | `parseInt` nhận chuỗi không phải số | Kiểm tra dữ liệu đầu vào |

## Bài tập

1. Khai báo 4 biến mô tả một test case: mã, tên, số bước, đã pass hay chưa. In tất cả ra.
2. Khai báo hằng `final int TIMEOUT = 15;` rồi thử gán lại giá trị, đọc lỗi.
3. Viết chương trình nhập số test pass và số test fail, in ra tổng.
4. Chạy thử `System.out.println("Có " + 1 + 2);` và giải thích vì sao ra `Có 12`.
</script>

<script type="text/markdown" data-id="ja-2" data-nav="Bài 2 · String và xử lý chuỗi">
# Bài 2 — String và xử lý chuỗi

**Mục tiêu:** xử lý chuỗi thành thạo. Mọi text bạn lấy từ app đều là `String`, nên đây là kiểu dữ liệu bạn dùng nhiều nhất.

## Các phương thức hay dùng

```java
String s = "  Đăng nhập Thành Công  ";

System.out.println(s.trim());              // cắt khoảng trắng 2 đầu
System.out.println(s.toLowerCase());       // chữ thường hết
System.out.println(s.toUpperCase());       // CHỮ IN HẾT
System.out.println(s.trim().length());     // đếm số ký tự
System.out.println(s.replace("Thành Công", "Thất Bại"));
```

`trim()` cực kỳ quan trọng: text lấy từ app rất hay dính khoảng trắng thừa, làm test fail oan. Bên Python là `.strip()`, Java là `.trim()`.

## So sánh chuỗi — điểm khác Python quan trọng nhất

```java
String a = "Login";
String b = "Login";

System.out.println(a == b);          // KHÔNG dùng cách này
System.out.println(a.equals(b));     // ĐÚNG: true
System.out.println(a.equalsIgnoreCase("LOGIN"));   // true, bỏ qua hoa thường
```

Trong Java, `==` so sánh **xem hai biến có trỏ cùng một chỗ trong bộ nhớ không**, không so sánh nội dung. Với chuỗi, luôn dùng `.equals()`.

Đây là lỗi kinh điển: code chạy đúng lúc thử, sai lúc chạy thật, rất khó tìm. Ghi nhớ: **chuỗi thì `.equals()`, số thì `==`**.

## Kiểm tra nội dung

```java
String thongBao = "Đăng nhập thành công";

System.out.println(thongBao.contains("thành công"));     // true
System.out.println(thongBao.startsWith("Đăng nhập"));    // true
System.out.println(thongBao.endsWith("công"));           // true
System.out.println(thongBao.isEmpty());                  // false
System.out.println(thongBao.isBlank());                  // false (chỉ toàn khoảng trắng?)
```

Khi viết assertion ở Bài 8 phần Appium, bạn dùng đúng hai cái: `.equals()` khi so khớp hoàn toàn, `.contains()` khi chỉ cần chứa một đoạn.

## Cắt và tách chuỗi

```java
String ma = "TC_001_Login";

System.out.println(ma.charAt(0));          // T — ký tự đầu, đếm từ 0
System.out.println(ma.substring(0, 2));    // TC — từ 0 đến trước 2
System.out.println(ma.substring(7));       // Login — từ vị trí 7 đến hết
System.out.println(ma.indexOf("_"));       // 2 — vị trí dấu _ đầu tiên

String[] phan = ma.split("_");
System.out.println(phan[0]);               // TC
System.out.println(phan[1]);               // 001
System.out.println(phan[2]);               // Login
```

`split()` trả về mảng, dùng nhiều khi đọc dữ liệu test từ file CSV.

## Ghép chuỗi

```java
String maTC = "TC_001";
String ketQua = "Pass";

// Cách 1: dấu cộng
System.out.println("Test case " + maTC + " kết quả: " + ketQua);

// Cách 2: String.format — gọn khi có nhiều biến
System.out.println(String.format("Test case %s kết quả: %s", maTC, ketQua));

// Cách 3: Java 15+ text block cho chuỗi nhiều dòng
String bao = """
    Mã: TC_001
    Kết quả: Pass
    """;
```

`%s` là chỗ thay chuỗi, `%d` cho số nguyên, `%.1f` cho số thực làm tròn 1 chữ số:

```java
System.out.println(String.format("Tỷ lệ pass: %.1f%%", 18.0 / 20 * 100));
// Tỷ lệ pass: 90.0%
```

## Chuỗi là bất biến

```java
String s = "Login";
s.toUpperCase();                 // KHÔNG đổi s
System.out.println(s);           // vẫn là Login

s = s.toUpperCase();             // phải gán lại
System.out.println(s);           // LOGIN
```

Mọi phương thức của `String` đều **trả về chuỗi mới**, không sửa chuỗi cũ. Quên gán lại là lỗi hay gặp.

## Bài tập

1. Có `String url = "https://demo.playwright.dev/todomvc";`. In ra dạng chữ thường và kiểm tra có chứa `"playwright"` không.
2. So sánh `"Pass".equals(" Pass ".trim())` và `"Pass" == " Pass ".trim()`, giải thích kết quả.
3. Từ `"TC_015_Checkout"`, tách lấy riêng số `015` và chữ `Checkout`.
4. Dùng `String.format` in ra: `Test TC_001 | Mức độ: High | Kết quả: Pass`.
5. Viết đoạn code kiểm tra một chuỗi có phải email hợp lệ không (chứa `@` và `.`).
</script>

<script type="text/markdown" data-id="ja-3" data-nav="Bài 3 · if, for, while">
# Bài 3 — Điều kiện và vòng lặp

**Mục tiêu:** cho chương trình ra quyết định và lặp công việc. Đây là nền của mọi logic trong test.

## if / else if / else

```java
int soFail = 3;

if (soFail == 0) {
    System.out.println("Tất cả test đều pass, có thể release");
} else if (soFail <= 5) {
    System.out.println("Có lỗi nhỏ, báo dev sửa");
} else {
    System.out.println("Quá nhiều lỗi, dừng test");
}
```

Điều kiện đặt trong `( )`, thân lệnh đặt trong `{ }`. Khác Python dùng dấu hai chấm và thụt lề.

## Toán tử so sánh và logic

| Toán tử | Nghĩa | Ví dụ đúng |
| --- | --- | --- |
| `==` | Bằng (dùng cho số, boolean) | `5 == 5` |
| `!=` | Khác | `5 != 3` |
| `>` `<` `>=` `<=` | So sánh số | `7 > 3` |
| `&&` | Và — cả hai đều đúng | `daDangNhap && laAdmin` |
| `\|\|` | Hoặc — chỉ cần một đúng | `laAdmin \|\| laQuanLy` |
| `!` | Đảo ngược | `!daDangNhap` |

Nhắc lại Bài 2: **chuỗi phải dùng `.equals()`, không dùng `==`**.

```java
String thucTe = "Đăng nhập thành công";
String mongDoi = "Đăng nhập thành công";

if (thucTe.equals(mongDoi)) {
    System.out.println("TC_001: PASS");
} else {
    System.out.println("TC_001: FAIL");
    System.out.println("  Mong đợi: " + mongDoi);
    System.out.println("  Thực tế:  " + thucTe);
}
```

Đây chính là ý tưởng của mọi assertion, kể cả `Assert.assertEquals` của TestNG ở Bài 10.

## switch — khi có nhiều nhánh

```java
String mucDo = "High";

switch (mucDo) {
    case "High":
        System.out.println("Sửa ngay");
        break;
    case "Medium":
        System.out.println("Sửa trong sprint này");
        break;
    default:
        System.out.println("Đưa vào backlog");
}
```

Thiếu `break` thì Java chạy tiếp nhánh dưới — lỗi khó phát hiện. Java 14 trở lên có cú pháp gọn hơn, không cần `break`:

```java
switch (mucDo) {
    case "High" -> System.out.println("Sửa ngay");
    case "Medium" -> System.out.println("Sửa trong sprint này");
    default -> System.out.println("Đưa vào backlog");
}
```

## Vòng lặp for

```java
for (int i = 1; i <= 5; i++) {
    System.out.println("Test case số " + i);
}
```

Ba phần trong ngoặc, ngăn bằng dấu `;`:

| Phần | Nghĩa |
| --- | --- |
| `int i = 1` | Giá trị bắt đầu |
| `i <= 5` | Chạy tiếp khi điều kiện còn đúng |
| `i++` | Sau mỗi vòng, tăng i lên 1 |

`i++` là cách viết tắt của `i = i + 1`.

## for-each — duyệt danh sách

```java
String[] testCases = {"TC_001", "TC_002", "TC_003"};

for (String tc : testCases) {
    System.out.println("Đang chạy " + tc);
}
```

Đọc là "với mỗi `tc` trong `testCases`". Đây là dạng bạn dùng nhiều nhất khi duyệt danh sách sản phẩm lấy từ app.

## while

```java
int soLanThu = 0;
boolean thanhCong = false;

while (soLanThu < 3 && !thanhCong) {
    soLanThu++;
    System.out.println("Thử lần " + soLanThu);
    if (soLanThu == 2) {
        thanhCong = true;
    }
}
```

Điều kiện không bao giờ sai thì chương trình chạy mãi. Bấm nút vuông đỏ trong IntelliJ để dừng.

## break và continue

```java
for (String tc : new String[]{"TC_001", "TC_002", "TC_003", "TC_004"}) {
    if (tc.equals("TC_002")) {
        continue;          // bỏ qua vòng này
    }
    if (tc.equals("TC_004")) {
        break;             // thoát hẳn vòng lặp
    }
    System.out.println(tc);
}
```

## Ví dụ: đếm kết quả test

```java
String[] ketQua = {"Pass", "Fail", "Pass", "Pass", "Fail"};
int soPass = 0;

for (String kq : ketQua) {
    if (kq.equals("Pass")) {
        soPass++;
    }
}

double tyLe = (double) soPass / ketQua.length * 100;
System.out.println(String.format("Pass %d/%d (%.1f%%)", soPass, ketQua.length, tyLe));
```

Chú ý `(double)` trước phép chia: `soPass / ketQua.length` với hai số nguyên sẽ cho kết quả nguyên (3/5 = 0). Ép sang `double` mới ra 0.6. Đây là bẫy hay gặp khi tính tỷ lệ phần trăm.

## Bài tập

1. Nhập điểm 0–10, in "Không đạt" dưới 5, "Đạt" từ 5 đến dưới 8, "Tốt" từ 8 trở lên.
2. In ra 10 dòng "Test case số 1" đến "Test case số 10" bằng `for`.
3. Có mảng kết quả 8 phần tử, đếm số Pass, Fail và in tỷ lệ pass đúng kiểu số thực.
4. Viết `switch` phân loại mức độ bug thành 4 nhánh.
5. Viết `while` mô phỏng đăng nhập cho phép sai tối đa 3 lần.
</script>

<script type="text/markdown" data-id="ja-4" data-nav="Bài 4 · Array, List, Map">
# Bài 4 — Mảng, List và Map

**Mục tiêu:** chứa nhiều dữ liệu trong một biến. Bạn dùng chúng để lưu danh sách tài khoản test, danh sách sản phẩm lấy từ app, bộ dữ liệu test.

## Mảng (Array) — số phần tử cố định

```java
String[] testCases = {"TC_001", "TC_002", "TC_003"};

System.out.println(testCases[0]);         // TC_001, đếm từ 0
System.out.println(testCases.length);     // 3 — chú ý: length không có ngoặc
testCases[1] = "TC_002_updated";          // sửa được
```

Mảng không thêm bớt phần tử được. Khai báo 3 phần tử thì mãi là 3. Vì vậy thực tế dùng `List` nhiều hơn.

## List — danh sách co giãn được

```java
import java.util.ArrayList;
import java.util.List;

List<String> testCases = new ArrayList<>();

testCases.add("TC_001");
testCases.add("TC_002");
testCases.add("TC_003");

System.out.println(testCases.get(0));        // TC_001
System.out.println(testCases.size());        // 3 — chú ý: size() có ngoặc
System.out.println(testCases.contains("TC_001"));   // true

testCases.remove("TC_002");
testCases.set(0, "TC_001_updated");

for (String tc : testCases) {
    System.out.println(tc);
}
```

`List<String>` nghĩa là danh sách chứa các `String`. Phần trong `< >` gọi là **generic** — nó cho Java biết kiểu phần tử, nhờ vậy IntelliJ bắt lỗi khi bạn thêm nhầm kiểu.

| Việc | Mảng | List |
| --- | --- | --- |
| Đếm phần tử | `.length` | `.size()` |
| Lấy phần tử | `arr[0]` | `list.get(0)` |
| Thêm | Không được | `.add()` |
| Xoá | Không được | `.remove()` |

Trong Appium, `findElements()` trả về `List<WebElement>` — nên bạn sẽ dùng `.size()` và `.get(0)` rất nhiều.

## Map — cặp khoá và giá trị

```java
import java.util.HashMap;
import java.util.Map;

Map<String, String> testCase = new HashMap<>();

testCase.put("ma", "TC_001");
testCase.put("ten", "Đăng nhập thành công");
testCase.put("ketQua", "Pass");

System.out.println(testCase.get("ten"));              // Đăng nhập thành công
System.out.println(testCase.containsKey("mucDo"));    // false
System.out.println(testCase.getOrDefault("mucDo", "Medium"));   // Medium

for (Map.Entry<String, String> cap : testCase.entrySet()) {
    System.out.println(cap.getKey() + ": " + cap.getValue());
}
```

`Map` tương đương `dict` của Python. `getOrDefault` tránh được lỗi khi khoá không tồn tại.

## List của Map — cấu trúc hay dùng nhất

```java
List<Map<String, String>> baoCao = new ArrayList<>();

Map<String, String> tc1 = new HashMap<>();
tc1.put("ma", "TC_001");
tc1.put("ketQua", "Pass");
baoCao.add(tc1);

Map<String, String> tc2 = new HashMap<>();
tc2.put("ma", "TC_002");
tc2.put("ketQua", "Fail");
baoCao.add(tc2);

for (Map<String, String> tc : baoCao) {
    if (tc.get("ketQua").equals("Fail")) {
        System.out.println("Cần xem lại: " + tc.get("ma"));
    }
}
```

## Mảng hai chiều — dữ liệu cho DataProvider

```java
Object[][] duLieuLogin = {
    {"bob@example.com", "10203040", "thành công"},
    {"bob@example.com", "sai_pass", "thất bại"},
    {"", "10203040", "thất bại"},
};

System.out.println(duLieuLogin[1][0]);     // bob@example.com — dòng 1, cột 0
```

`Object[][]` chính là định dạng mà `@DataProvider` của TestNG yêu cầu, bạn sẽ dùng ở Bài 12 để chạy một test với nhiều bộ dữ liệu.

## Tạo List nhanh

```java
List<String> taiKhoan = List.of("user1", "user2", "user3");    // không sửa được
List<String> coSua = new ArrayList<>(List.of("user1", "user2"));  // sửa được
```

`List.of()` tạo danh sách cố định, gọi `.add()` sẽ báo lỗi. Cần thêm bớt thì bọc trong `new ArrayList<>()`.

## Bài tập

1. Tạo `List<String>` gồm 5 mã test case, in phần tử đầu, cuối và tổng số.
2. Thêm 1 test case, xoá 1 cái, in lại danh sách.
3. Tạo `Map` mô tả một bug: mã, tiêu đề, mức độ, trạng thái. In từng thông tin.
4. Dùng `getOrDefault` lấy khoá `"moTa"` chưa có, hiển thị `"Chưa có mô tả"`.
5. Tạo `List<Map<String, String>>` gồm 3 test case, lặp qua và chỉ in những cái Fail.
6. Tạo `Object[][]` gồm 3 bộ dữ liệu đăng nhập.
</script>

<script type="text/markdown" data-id="ja-5" data-nav="Bài 5 · Method và Class (OOP)">
# Bài 5 — Method, Class và OOP

**Mục tiêu:** hiểu class đủ để viết Page Object Model ở Bài 11. Đây là bài quan trọng nhất phần Java — đừng bỏ qua.

## Method — hàm trong Java

```java
public class TinhToan {

    public static void inThongTin(String ma, String ten) {
        System.out.println("[" + ma + "] " + ten);
    }

    public static double tinhTyLePass(int soPass, int tong) {
        return (double) soPass / tong * 100;
    }

    public static boolean matKhauHopLe(String matKhau) {
        if (matKhau.length() < 8) {
            return false;
        }
        return matKhau.matches(".*\\d.*");    // có chứa ít nhất một chữ số
    }

    public static void main(String[] args) {
        inThongTin("TC_001", "Đăng nhập thành công");
        System.out.println(tinhTyLePass(18, 20));      // 90.0
        System.out.println(matKhauHopLe("abc"));       // false
    }
}
```

Cấu trúc một method:

```text
public static double tinhTyLePass(int soPass, int tong)
  │       │      │        │              │
  │       │      │        │              └─ tham số, phải ghi kiểu
  │       │      │        └─ tên method, viết camelCase
  │       │      └─ kiểu dữ liệu trả về; void = không trả gì
  │       └─ static: gọi được mà không cần tạo đối tượng
  └─ public: chỗ nào cũng gọi được
```

Method có kiểu trả về khác `void` thì **bắt buộc có `return`**. Đây là khác biệt lớn so với Python, nơi hàm không `return` sẽ tự trả về `None`.

## Class và đối tượng

```java
public class TestCase {
    // Thuộc tính
    String ma;
    String ten;
    String ketQua;

    // Constructor — chạy khi tạo đối tượng mới
    public TestCase(String ma, String ten) {
        this.ma = ma;
        this.ten = ten;
        this.ketQua = "Chưa chạy";
    }

    // Phương thức
    public void chay() {
        System.out.println("Đang chạy " + this.ma + ": " + this.ten);
        this.ketQua = "Pass";
    }

    public void inKetQua() {
        System.out.println(this.ma + " → " + this.ketQua);
    }
}
```

Dùng:

```java
public class Main {
    public static void main(String[] args) {
        TestCase tc1 = new TestCase("TC_001", "Đăng nhập thành công");
        tc1.chay();
        tc1.inKetQua();        // TC_001 → Pass

        TestCase tc2 = new TestCase("TC_002", "Sai mật khẩu");
        tc2.inKetQua();        // TC_002 → Chưa chạy
    }
}
```

| Từ khoá | Nghĩa |
| --- | --- |
| `class TestCase` | Khuôn mẫu. Tên class viết hoa chữ đầu mỗi từ |
| Constructor | Method trùng tên class, không có kiểu trả về; chạy khi `new` |
| `this` | Chính đối tượng đang thao tác, tương đương `self` của Python |
| `new TestCase(...)` | Tạo một đối tượng từ khuôn mẫu |

`tc1` và `tc2` độc lập: sửa cái này không ảnh hưởng cái kia.

## Đóng gói — private và getter/setter

```java
public class TestCase {
    private String ma;          // private: bên ngoài không truy cập thẳng được

    public TestCase(String ma) {
        this.ma = ma;
    }

    public String getMa() {     // getter — đọc
        return this.ma;
    }

    public void setMa(String ma) {   // setter — ghi
        this.ma = ma;
    }
}
```

`private` giúp kiểm soát ai được sửa dữ liệu. Trong IntelliJ, chuột phải → **Generate** → **Getter and Setter** để tạo tự động, không cần gõ tay.

## Kế thừa — nền tảng của Page Object Model

```java
public class BaseScreen {
    protected AppiumDriver driver;          // protected: class con dùng được

    public BaseScreen(AppiumDriver driver) {
        this.driver = driver;
    }

    public void bam(By locator) {
        driver.findElement(locator).click();
    }

    public String layChu(By locator) {
        return driver.findElement(locator).getText();
    }
}
```

```java
public class LoginScreen extends BaseScreen {

    public LoginScreen(AppiumDriver driver) {
        super(driver);                       // gọi constructor của class cha
    }

    public void dangNhap(String user, String pass) {
        bam(O_USERNAME);                     // dùng lại method của class cha
    }
}
```

| Từ khoá | Nghĩa |
| --- | --- |
| `extends` | Class này kế thừa class kia |
| `super(...)` | Gọi constructor của class cha |
| `protected` | Class con dùng được, bên ngoài thì không |

Nhờ kế thừa, `LoginScreen` có sẵn `bam()` và `layChu()` mà không phải viết lại. Bài 11 dùng đúng mô hình này cho toàn bộ framework.

## static và không static

```java
public class TienIch {
    public static String taoMaTC(int so) {
        return String.format("TC_%03d", so);     // TC_001
    }
}

// Goi truc tiep, khong can new
String ma = TienIch.taoMaTC(1);
```

`static` dùng cho method tiện ích không phụ thuộc dữ liệu riêng của đối tượng. Method thao tác trên thuộc tính của đối tượng thì không để `static`.

## Bài tập

1. Viết class `Bug` có thuộc tính mã, tiêu đề, mức độ, trạng thái (mặc định `"Open"`) và method `dong()`.
2. Tạo 3 đối tượng `Bug`, đóng 1 cái, in trạng thái cả 3.
3. Viết class `TestSuite` có `List<TestCase>`, method `them()`, `tongSo()`, `demPass()`.
4. Viết class `BasePage` có method `inTieuDe()`, rồi viết `LoginPage extends BasePage` dùng lại method đó.
5. Dùng IntelliJ Generate tạo getter/setter cho class `Bug`.

Làm được bài 4 là bạn đã sẵn sàng cho phần Appium.
</script>

<script type="text/markdown" data-id="ap-0" data-nav="Bài 0 · Appium là gì">
# Bài 0 — Appium là gì và cần những gì

**Mục tiêu:** hiểu Appium hoạt động ra sao trước khi cài, để khi gặp lỗi biết lỗi nằm ở mắt xích nào.

Phần Java đã xong. Từ đây bạn dựng môi trường mobile và viết test thật.

## Appium hoạt động thế nào

Khác Maestro chạy thẳng, Appium có ba mắt xích:

```text
Code Java của bạn
        │  gửi lệnh qua HTTP
        ▼
Appium Server (chạy ở cổng 4723)
        │  dịch lệnh sang ngôn ngữ của Android
        ▼
Driver UiAutomator2 → máy ảo / máy thật
```

Hiểu sơ đồ này giúp đọc lỗi nhanh:

| Lỗi báo | Mắt xích hỏng |
| --- | --- |
| `Connection refused` cổng 4723 | Appium Server chưa chạy |
| `Could not find a connected device` | Máy ảo chưa bật, hoặc `adb` không thấy |
| `NoSuchElementException` | Server và máy ảo ổn, locator sai |
| `An unknown server-side error` | Driver chưa cài hoặc sai phiên bản |

## Bộ công cụ của khoá này

| Thứ | Vai trò | Tương đương bên Python |
| --- | --- | --- |
| Java 17 | Ngôn ngữ viết test | Python |
| Maven | Quản lý thư viện, khai báo trong `pom.xml` | pip + requirements.txt |
| `java-client` | Thư viện Appium cho Java | Appium-Python-Client |
| TestNG | Chạy test, assertion, nhóm test | pytest |
| Allure | Báo cáo | pytest-html / Allure |
| IntelliJ IDEA | Nơi viết code | VS Code |

Đây đúng bộ công cụ mà phần lớn JD Appium ở Việt Nam yêu cầu.

## Appium so với Maestro

| | Appium | Maestro |
| --- | --- | --- |
| Viết bằng | Java | YAML |
| Cần cài | Node.js, Appium, driver, Maven | Một lệnh cài |
| Chờ element | Tự viết wait | Tự động |
| Đọc Excel, gọi API, query database | Được | Không |
| Số JD ở Việt Nam | Nhiều | Đang tăng |

Phụ lục có bài so sánh bằng cùng một test case nếu bạn muốn thấy khác biệt cụ thể.

## Cần chuẩn bị gì

| Thứ | Dùng để | Bài cài |
| --- | --- | --- |
| Android Studio + SDK | Tạo và chạy máy ảo Android | 1 |
| ANDROID_HOME, `adb` | Để Appium tìm thấy SDK và thiết bị | 2 |
| Node.js | Appium viết bằng Node, bắt buộc có | 3 |
| Appium Server 2 + driver UiAutomator2 | Nhận lệnh và điều khiển máy | 3 |
| Appium Inspector | Soi element trên app | 5 |
| `java-client` qua Maven | Thư viện gửi lệnh tới server | 4 |

Máy cần tối thiểu 8 GB RAM và khoảng 20 GB trống.

## Lộ trình phần còn lại

| Phần | Bài | Kết quả |
| --- | --- | --- |
| 1 | 0–3 | Môi trường chạy được, server lên |
| 2 | 4–8 | Viết được test điều khiển app |
| 3 | 9–12 | Framework có POM, TestNG, báo cáo |
| 4 | 13 | Dự án hoàn chỉnh trên GitHub |

## Bài tập

1. Vẽ lại sơ đồ 3 mắt xích ra giấy, ghi rõ mỗi mắt xích chạy ở đâu.
2. Với mỗi lỗi trong bảng, viết ra bạn sẽ kiểm tra gì đầu tiên.
3. Kiểm tra máy: RAM bao nhiêu, còn trống bao nhiêu GB.
</script>

<script type="text/markdown" data-id="ap-1" data-nav="Bài 1 · Android Studio và máy ảo">
# Bài 1 — Android Studio và máy ảo Android

**Mục tiêu:** có một máy ảo Android khởi động được và chạy mượt.

Nếu bạn đã làm Bài 1 của khoá Maestro thì bỏ qua bài này, môi trường dùng chung.

## 1. Cài Java (JDK 17)

Tải Temurin JDK tại `adoptium.net`. Kiểm tra:

```bash
java -version
```

## 2. Cài Android Studio

Tải tại `developer.android.com/studio`, cài với lựa chọn mặc định. Lần mở đầu tiên, Setup Wizard sẽ tải Android SDK khoảng 2–3 GB.

## 3. Kiểm tra SDK đã đủ thành phần

**Settings** → **Languages & Frameworks** → **Android SDK**.

Tab **SDK Platforms**: tick ít nhất một bản, nên chọn **Android 13 (API 33)**.

Tab **SDK Tools**: tick đủ ba thứ sau, thiếu cái nào Appium cũng chạy sai:

- Android SDK Build-Tools
- Android SDK Platform-Tools
- Android Emulator

Ghi lại đường dẫn ở dòng **Android SDK Location** — Bài 2 cần.

## 4. Tạo máy ảo

**More Actions** → **Virtual Device Manager** → **Create Device**.

| Bước | Chọn |
| --- | --- |
| Thiết bị | Pixel 6 |
| System Image | API 33, bấm Download trước nếu chưa có |
| Tên | Để mặc định, ví dụ `Pixel_6_API_33` |

Bấm **Finish** rồi bấm ▶ khởi động. Lần đầu mất 2–5 phút.

## 5. Nếu máy ảo chạy chậm hoặc không lên

| Hiện tượng | Cách xử lý |
| --- | --- |
| Đứng ở logo Android | Bật ảo hoá VT-x (Intel) hoặc AMD-V trong BIOS |
| Rất chậm, giật | Chọn System Image bản **x86_64**, không chọn ARM |
| Máy yếu | Giảm RAM máy ảo xuống 1536 MB trong Advanced Settings |
| Vẫn không được | Dùng điện thoại thật — xem Phụ lục "Chạy trên thiết bị thật" |

Máy ảo x86_64 nhanh hơn ARM nhiều lần trên máy tính Intel/AMD. Chọn sai bản là nguyên nhân phổ biến nhất của chuyện "máy ảo chậm không dùng được".

## 6. Làm quen máy ảo

| Việc | Cách làm |
| --- | --- |
| Xoay màn hình | Nút xoay ở thanh công cụ bên phải |
| Quay lại / Home | Nút mũi tên và hình tròn ở thanh công cụ |
| Cài app bằng kéo thả | Kéo file `.apk` thả vào cửa sổ máy ảo |
| Chụp màn hình | Nút máy ảnh ở thanh công cụ |

Máy ảo giữ trạng thái giữa các lần chạy. Muốn bắt đầu sạch: Virtual Device Manager → menu ba chấm → **Wipe Data**.

## Bài tập

1. Tạo máy ảo Pixel 6 API 33 và khởi động thành công.
2. Mở trình duyệt trên máy ảo, vào một trang web bất kỳ để xác nhận có mạng.
3. Thử **Wipe Data** rồi khởi động lại, xem máy ảo về trạng thái mới.
4. Ghi lại đường dẫn Android SDK Location vào file ghi chú.
</script>

<script type="text/markdown" data-id="ap-2" data-nav="Bài 2 · ANDROID_HOME và adb">
# Bài 2 — Biến môi trường, adb và cài app

**Mục tiêu:** `adb devices` thấy được máy ảo, và cài được file `.apk` lên đó. Đây là nền tảng cho mọi bài sau.

## adb là gì

`adb` (Android Debug Bridge) là cầu nối giữa máy tính và thiết bị Android. Appium dùng chính `adb` ở bên dưới. `adb` không chạy thì Appium không chạy.

## 1. Khai báo ANDROID_HOME

Đường dẫn SDK lấy ở Bài 1. Thường là:

```text
Windows: C:\Users\<ten-ban>\AppData\Local\Android\Sdk
macOS:   /Users/<ten-ban>/Library/Android/sdk
```

**Windows** — PowerShell quyền Administrator:

```powershell
[Environment]::SetEnvironmentVariable("ANDROID_HOME", "$env:LOCALAPPDATA\Android\Sdk", "User")
[Environment]::SetEnvironmentVariable("Path", $env:Path + ";$env:LOCALAPPDATA\Android\Sdk\platform-tools", "User")
```

**macOS** — thêm vào `~/.zshrc`:

```bash
export ANDROID_HOME=$HOME/Library/Android/sdk
export PATH=$PATH:$ANDROID_HOME/platform-tools
export PATH=$PATH:$ANDROID_HOME/emulator
```

Rồi chạy `source ~/.zshrc`.

**Đóng hẳn Terminal và mở lại** — biến môi trường chỉ có hiệu lực ở cửa sổ mới.

## 2. Kiểm tra

```bash
adb version
adb devices
```

Máy ảo đang chạy thì `adb devices` in ra:

```text
List of devices attached
emulator-5554   device
```

Chữ `device` ở cuối là quan trọng. Nếu thấy `offline` hoặc `unauthorized`, chạy `adb kill-server` rồi `adb start-server`.

## 3. Các lệnh adb hay dùng

| Lệnh | Làm gì |
| --- | --- |
| `adb devices` | Liệt kê thiết bị đang kết nối |
| `adb install app.apk` | Cài app |
| `adb uninstall com.example.app` | Gỡ app |
| `adb shell pm list packages` | Liệt kê tất cả package đã cài |
| `adb logcat` | Xem log của thiết bị |
| `adb shell input text "abc"` | Gõ chữ vào thiết bị |
| `adb kill-server` | Khởi động lại adb khi lỗi |

## 4. Cài app mẫu

Khoá này dùng **Sauce Labs My Demo App** — tải file `.apk` từ GitHub `saucelabs/my-demo-app-rn`, mục Releases.

```bash
adb install duong-dan/den/app.apk
```

Thấy `Success` là xong.

## 5. Lấy appPackage và appActivity

Hai thông tin này bắt buộc phải có để viết script ở Bài 4.

Mở app trên máy ảo rồi chạy:

```bash
# macOS / Linux
adb shell dumpsys window | grep -i mCurrentFocus

# Windows PowerShell
adb shell dumpsys window | Select-String mCurrentFocus
```

Kết quả kiểu:

```text
mCurrentFocus=Window{... com.saucelabs.mydemoapp.rn/com.saucelabs.mydemoapp.rn.MainActivity}
```

Tách ra:

- `appPackage` = `com.saucelabs.mydemoapp.rn`
- `appActivity` = `com.saucelabs.mydemoapp.rn.MainActivity`

Ghi lại hai giá trị này, Bài 4 dùng đến.

## Lỗi hay gặp

| Lỗi | Nguyên nhân | Cách sửa |
| --- | --- | --- |
| `adb: command not found` | PATH chưa có platform-tools | Làm lại bước 1, mở Terminal mới |
| `List of devices attached` rỗng | Máy ảo chưa khởi động xong | Đợi máy ảo vào màn hình chính |
| `device offline` | adb treo | `adb kill-server` rồi `adb start-server` |
| `INSTALL_FAILED_ALREADY_EXISTS` | App đã cài rồi | `adb install -r app.apk` để cài đè |
| `INSTALL_FAILED_NO_MATCHING_ABIS` | File apk không hợp kiến trúc máy ảo | Tạo máy ảo x86_64 |

## Bài tập

1. Chạy `adb devices` thấy máy ảo ở trạng thái `device`.
2. Cài app mẫu và mở được trên máy ảo.
3. Lấy `appPackage` và `appActivity`, ghi vào file ghi chú.
4. Chạy `adb shell pm list packages | grep saucelabs` để tìm package của app.
5. Gỡ app rồi cài lại bằng `adb uninstall` và `adb install`.
</script>

<script type="text/markdown" data-id="ap-3" data-nav="Bài 3 · Cài Appium Server">
# Bài 3 — Node.js, Appium Server và driver

**Mục tiêu:** chạy được Appium Server và xác nhận nó sẵn sàng nhận lệnh.

## 1. Cài Node.js

Appium viết bằng Node.js. Tải bản **LTS** tại `nodejs.org`, cài mặc định. Kiểm tra:

```bash
node -v
npm -v
```

## 2. Cài Appium 2

```bash
npm install -g appium
appium -v
```

Phải ra phiên bản `2.x`. Nếu ra `1.x`, gỡ bằng `npm uninstall -g appium` rồi cài lại.

Appium 2 khác Appium 1 ở chỗ driver tách rời — cài Appium xong vẫn chưa điều khiển được Android, phải cài thêm driver.

## 3. Cài driver UiAutomator2

```bash
appium driver install uiautomator2
appium driver list --installed
```

Kết quả phải thấy `uiautomator2` kèm phiên bản.

| Thiết bị | Driver cần cài |
| --- | --- |
| Android | `uiautomator2` |
| iOS | `xcuitest` (chỉ chạy trên macOS) |

## 4. Kiểm tra môi trường

```bash
appium driver doctor uiautomator2
```

Lệnh này kiểm tra Java, ANDROID_HOME, adb và báo thiếu gì. Mọi dòng phải ✔. Dòng nào ✖ thì sửa trước khi đi tiếp — chạy script với môi trường thiếu sẽ ra lỗi khó hiểu.

## 5. Khởi động server

```bash
appium
```

Thấy dòng này là server đã sẵn sàng:

```text
[Appium] Appium REST http interface listener started on http://0.0.0.0:4723
```

**Giữ cửa sổ Terminal này mở trong suốt lúc chạy test.** Chạy test từ IntelliJ, hoặc từ một cửa sổ Terminal khác bằng `mvn test`.

Đổi cổng nếu 4723 đang bị chiếm:

```bash
